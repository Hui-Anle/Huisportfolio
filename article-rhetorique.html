ghter of Saturn, sister and wife of Jupiter, most honoured goddess of Olympus, a queen who commands the gods, a queen with the power to shake heaven and earth, am now insulted by the Trojans: that vile offspring of Venus has escaped before my eyes to seek refuge in Italy. Have they not mocked me aboard their ship bound for Italy? A mortal as feeble as a mouse, as an ant, dares to evade the punishment of the queen of the gods. Only cruel, cold vengeance can quench my burning hatred.\n\nBut can I thwart the decree of fate? If I continue to oppose them while, as fate ordains, they build a mighty empire and destroy my beloved city of Carthage, then my efforts, my anger and my dignity will become a joke to Trojans and gods alike. Their glory feeds on my grief, on my anger. The more I suffer, as though a thousand arrows were piercing my heart, and the more my fury burns like magma bursting from a volcano, the more glorious their escape will become, the more easily their unforgivable crimes will be overlooked as time passes, the more easily my grievances and the insults I have suffered will be forgotten, until even their offences against me become proof of their courage. I must not let them have their way.\n\nBut who still stands behind me as I guard this land of injustice? Jupiter is bound to favour his daughter Venus. Can I utterly destroy the Trojans blessed by the master of the gods, including Aeneas, Venus’s son? Was it not Jupiter’s thunderbolt that Athena wielded when she burned the entire Greek fleet merely to punish the frenzied Ajax? Ajax, who once brought me victory and glory in war, was dashed to death upon the rock by waves and lightning hurled from the clouds before that merciless goddess. Thunder from the heavens struck the wreckage, and my dear Greek followers were overwhelmed by terror and drowned in the open sea. Athena, my dear former ally and my closest friend, no longer stands beside me. Neptune, mighty god of the sea, engulfs only the Greek fleet with waves higher than the heavens; never does he help me sweep away the sinners. On the contrary, everyone sides with Venus, everyone helps that loathsome land of Troy. Why is there no strong and useful god beside me to avenge me, the mistress of the gods? How have I fallen from an honoured and respected queen to a goddess without allies? Am I the only one who dares oppose Jupiter, the only one who can punish these mortals as they deserve?\n\nIt all began at the feast of the gods for the wedding of Peleus and Thetis: a golden apple, a prize for beauty, offered “to the fairest” of the goddesses of Olympus. Venus must have bewitched all the gods with her usual tricks, seducing men with beauty and conquering them with tears. How proud she must be: so lowly a lesser deity defeating the queen of the gods and Athena, and seizing a title that does not belong to her—the fairest goddess on Olympus. “Venus is a more beautiful goddess than Juno”: ignorant mortals and gods will surely heap such praise upon her, but none of them, hearing these compliments, will explain that Venus won by cheating. She promised to use divine power to make Helen fall in love with Paris. What a filthy, infuriating promise. Jupiter’s child indeed: Venus inherited her father’s contempt for sacred marriage. Her father has never been faithful to me; he makes so many adulterous and impious women pregnant, and they give birth to my shame. Helen’s beauty bewitches Paris, who is already married. Venus did not hesitate to use such filth to win the golden apple. She is unworthy of that glory, and I shall never allow praise such as “the fairest of goddesses” to circulate through this world in Venus’s name. No mortal, no god, shall be allowed to utter a single such word.\n\nMore abominable still is Helen, who is herself proof of Jupiter’s infidelity. When Jupiter transformed himself into a swan to seduce Leda, did he ever consider that the swan was a bird faithful in love? Both parents are obsessed with sexual pleasure; unsurprisingly, Helen too betrayed her marriage, abandoned Menelaus, the venerable king of Sparta, and followed Paris into hiding at Troy. How ironic, how shameful. Why are all the women connected with Jupiter so unfaithful in marriage? This world has no respect for the goddess of marriage: how can I permit such mortals to live? No, I shall never let them belittle my strength and my standing. I shall make them pay.\n\nThat judgement has long been unjust. How could I allow my reputation to be disgraced by Paris’s lust? Her promise to Paris was an insult to my divinity as goddess of marriage; giving the golden apple to Venus was an insult to my glory and my beauty; and Paris’s acceptance of a bribe to take Helen away was an insult to me as the sacred protectress of the Greeks.\n\nAfter committing such a crime, Paris and Helen were sheltered by the kingdom of Troy. Their offences against me can be paid for only in blood. Yet Aeneas is as hypocritical as his mother, seeking to resist the fate allotted to him, which the gods have decided in advance. His escape can only expose my impotence, and only by killing every Trojan can I calm even a little of my anger.\n\nNow that Aeneas is about to land in Italy, am I to tolerate his building a mighty empire there, destroying Carthage and ruling the world in years to come? My temples and my followers are spread throughout Greece. If I cannot protect the city I love and fight for justice for those who believe in me, who will henceforth worship Juno, burn incense at her altars and offer her their vows? If I release these vile creatures who affront my glory, there will surely be a second Venus, a second Paris, to insult me still more grievously in the future. I shall never allow it.\n\nI shall protect my faithful until the final moment when fate announces its end. I shall hesitate no longer. I shall prevent the descendants of Troy from setting foot on Italian soil; I shall destroy the Trojan fleet just as Athena destroyed the Greek fleet. God of the wind, god of the sea, obey your queen! I want waves higher than heaven to destroy all those fleets; I want storms to tear their banners to shreds; I want whirlpools to swallow every Trojan; I want thunder to rend this dark and unreasonable world; I want the coast of Italy dyed red with Trojan blood! Behold my monstrous rage. This is the price you and your mother shall pay for offending the queen. This is the punishment you deserve."]}}]}]},{"id":"paresse","title":{"fr":"De la paresse","zh":"论懒惰","en":"On Laziness"},"meta":["论懒惰 / On Laziness","**ZHU Huihui / 朱慧慧**","Exercice de rhétorique réalisé en Master 1 / 硕士一年级修辞课考核习作 / Rhetoric assignment completed during the first year of the master’s programme"],"sections":[{"title":{"fr":"De la paresse","zh":"论懒惰","en":"On Laziness"},"units":[{"title":{"fr":"De la paresse","zh":"论懒惰","en":"On Laziness"},"paragraphs":{"fr":["La paresse est une sorte d'ennui psychologique et une répugnance au travail et à l’effort, qu'il s'agisse d'un travail physique ou d'un travail mental. Rien de ce monde n’intéresse un paresseux, ni l'attrait de la bonne nourriture, ni l'émerveillement d'une vue, ni le plaisir de la lecture d’un chef-d'œuvre, ni la joie de l’interaction avec ses environnements. Il peut toujours trouver des moyens de minimiser les divers besoins dans la vie et d’éviter de perdre de son énergie. Même l’animal paresseux lui-même est plus diligent que cette personne paresseuse. Au moins, il lui est difficile de se pendre la tête en bas à un arbre comme celui de l’animal.  Un paresseux ne se lèvera jamais s'il peut s'asseoir, et ne se lèvera jamais s'il peut se coucher. Il est vivant, mais il semble mort car il s’arrête à s’interroger lui-même sur la valeur de sa vie depuis longtemps. À quel point le travail de penser est épuisant pour lui.\n\nAlors pourquoi est-il encore en vie ? Probablement parce qu'il ne prend même pas la peine de mourir. Son comportement paresseux est la décision prise en comparant les options possibles devant lui pour que la moindre énergie soit consommée. Pourquoi ne pas y penser plus précisément. S'il poignarde sa poitrine avec un couteau, il faut que la pointe du couteau perce la graisse épaisse de la poitrine, traverse l'espace entre les côtes et entre dans l'oreillette du cœur, puis il devra attendre que son sang jaillisse en continu de sorte que la Mort fauche finalement sa vie avec la grande faux. Quel travail épuisant. S'il veut se pendre et s'étrangler, alors il faut déplacer l’échelle et lancer la corde entre les branches et la fixer, puis monter en hauteur pour mettre la corde autour de son cou. C’est plutôt une mort de fatigue pour lui. S'il utilise du poison, il doit se lever et aller au magasin à l'extérieur pour acheter par exemple, la cyanure. Mais il ne prend même pas la peine de faire un pas pour sortir, comment il est possible pour lui d’endurer tous ces ravages de la fatigue. Il vaut mieux le laisser faire par un serviteur qui ose lui offrir le service de mort. Mais qui veut risquer la peine de mort pour avoir tué quelqu'un qui est déjà mort ?\n\nIl existe de nombreuses méthodes de suicide comme celle-ci, mais la seule méthode qui peut lui plaire est de mourir de faim au lit comme moyen le plus économe en énergie. Ou il est chanceux qu'un tueur tombe sur lui par hasard, il ne résistera certainement pas à ce moment-là, après tout, résister est un travail fatigant.\n\nC'est pourquoi il est en vie jusqu'à présent. Éviter la fatigue est la seule motivation qui le maintient en vie.\n\nSa parole diminue comme la paresse s’aggrave de jour en jour comme une maladie. Sa déclaration que «la paresse et la fainéantise font partie des droits inaliénables des êtres humains et des peuples sans à venir!» se diminue comme  «je suis un farouche partisan du moindre effort». Et finalement, il dit simplement «promulgue la fainéantise.» Si vous pouvez l'entendre dire cela, vous ne pourrez peut-être pas le comprendre, car il économise même des mots et avale des syllabes «superflues» pour éviter de gaspiller trop d'énergie. Maintenant, il s'allonge tous les jours et dort sans dire un mot. Personne ne peut communiquer avec un mort, sauf ses pauvres parents aux cheveux gris qui font tout pour lui permettre de survivre.\n\nNaturellement, il est impossible qu’il ait un travail. Lui-même est un cafard qui s’héberge chez ses parents et mange les restes. Il est évidemment trop paresseux pour préparer les dossiers et faire la queue afin de recevoir des allocations chômage, et donc la source de revenus pour la vie vient de parents mourants. Il a beaucoup de principes, puisqu'il peut ouvrir la bouche et demander de l'argent qui peut garantir sa propre survie, pourquoi s'embêter à demander des fonds de secours ? Ils l’aiment de tout leur cœur, mais comment auraient-ils pu imaginer qu'ils pourraient donner naissance à un parasite sous la forme de l’être humain qui ne deviendrait jamais un adulte indépendant.\n\nMais là encore, pouvait-il vraiment rester allongé dans son lit et attendre que la faim mette fin à sa vie ? C'est difficile parce que l’instinct de survie est irrésistible pour tous les êtres vivants. Mais laissez-moi vous expliquer la fin heureuse où il est finalement mort de paresse.\n\nAu début, il mangeait la nourriture que ses parents lui donnaient. Il y a des cafards qui rampent sur le pain ? Ce n'est pas grave, il s’allonge tranquillement et attend que les cafards partent. Et ensuite, comme il a trop de flemme, il décide de rester au lit avec la bouche ouverte pour que ses parents lui servent. Quand tout l'argent est épuisé, ses vieux pauvres parents doivent voyager loin pour amasser de l'argent pour la subsistance de la famille. Avant de partir, ils lui ont mis une tourte autour de son cou, mais vue que cette personne est si paresseuse qu'elle ne peut même pas tourner un peu la tourte. Il ouvre la bouche et attend qu’il y ait les araignées qui tissent des toiles sur lui, ou sa langue humides comment à faire pousser des champignons, il lui suffit de ne faire que le travail de mâcher. Mais finalement, ce paresseux a inauguré sa propre mort heureuse quand il ne prend plus d’effort pour avaler. Voilà la mort de ce paresseux, ainsi que l’histoire de toute sa vie. D’autres détails ne sont plus nécessaires étant donné la mort de fainéantise de ce paresseux, vous pouvez voir sa nature effrontée et oisive. Sa vie n'a aucune valeur si ce n'est d'ajouter plus de corvée aux autres. Il est véritablement un fainéant qui ne fait que néant."],"zh":["懒惰是一种心理上的厌倦，是对工作与付出的排斥，无论那是体力劳动还是脑力劳动。这个世界没有什么能使懒汉感兴趣：美食的诱惑、景色带来的惊叹、阅读杰作的快意，以及与周围世界往来的欢愉，都不能。他总有办法，将生活中的种种需要减到最少，以免耗费自己的气力。就连树懒这种动物，都比这个懒人勤勉。至少，要他像树懒那样倒挂在树上，对他来说也是难事。只要能坐着，懒汉就绝不站起来；只要能躺着，他也绝不站起来。他活着，却仿佛已经死去，因为他早已不再追问自己生命的价值。思考，对他来说是多么费力的工作啊。\n\n那么，他为什么还活着？大概因为他连死都懒得去死。他的懒惰行径，是将眼前可能的选择逐一比较之后，为使耗费的精力降到最低而作出的决定。不妨再想得具体一点。假如他用刀刺向自己的胸膛，刀尖必须穿透胸前厚厚的脂肪，越过肋骨间隙，进入心脏的心房；随后，他还得等鲜血不断涌出，直到死神终于挥动大镰刀，收割他的性命。多么劳累的工作。假如他要上吊勒死自己，就得搬来梯子，把绳子甩过树枝并固定好，再爬到高处，将绳圈套上脖子。对他来说，这倒更像是要累死。假如他用毒药，就得起身到外面的商店，去买比如氰化物之类的东西。可他连迈出门去都嫌费事，又怎么忍受得了这一番劳累的摧残？最好让一个仆人代劳，只要那仆人敢为他提供死亡服务。可谁愿意为了杀死一个已经死了的人，去冒被判死刑的风险？\n\n诸如此类的自杀方式还有许多，但唯一可能讨他欢心的，便是躺在床上饿死——那是最省力的办法。又或者，他有幸被一个杀手偶然撞见，到那时他一定不会反抗，毕竟反抗也是件累人的工作。\n\n所以他才一直活到现在。逃避劳累，是维系他生命的唯一动力。\n\n他的懒惰像疾病一样日渐加重，话语也随之缩短。他曾宣告：“懒惰与游手好闲，是人类与没有未来的人民不可剥夺的权利！”后来便缩成：“我是少费力的坚定拥护者。”到最后，他只说：“颁行懒惰。”即便你能听到他说这几个字，也未必能听懂，因为他连字词也要节省，将那些“多余”的音节吞下，以免耗费太多气力。如今他天天躺着睡觉，一言不发。没有人能与死人交流，除了他那可怜的、满头白发的父母，他们倾尽一切，只为让他活下去。\n\n自然，要他工作是不可能的。他本人就是一只寄居在父母家中、靠残羹剩饭过活的蟑螂。他显然也懒得准备材料、排队领取失业救济，因此生活的收入来源，便是垂垂将死的双亲。他很有原则：既然张口讨钱就能确保自己活下去，何必费事去申请救助？父母全心全意地爱他，可他们怎能料到，自己竟会生出一个披着人形的寄生虫，永远也长不成能够独立生活的成年人？\n\n可是话又说回来，他当真能一直躺在床上，等饥饿终结自己的生命吗？这很难，因为一切生灵都无法抗拒求生的本能。不过，且让我说说那个幸福的结局吧——他终于懒死了。\n\n起初，他吃父母送来的食物。面包上有蟑螂爬来爬去？不要紧，他安安静静地躺着，等蟑螂离开就是。后来，他实在懒得动，索性决定躺在床上张着嘴，等父母来喂。当所有钱财耗尽，可怜的老父母只好远行，为一家人的生计筹钱。临走前，他们在他脖子上套了一圈馅饼，可这个人懒得连把饼稍稍转动一下都不肯。他张着嘴，等蜘蛛在身上结网，或等潮湿的舌头上开始长出蘑菇，这样他只需要做咀嚼的工作。但到最后，当他连吞咽都不肯再费力时，这懒汉终于迎来了自己的幸福之死。这就是他的死，也是他整整一生的故事。别的细节已无必要：从这个懒汉因懒而死的结局，你便能看清他厚颜而怠惰的本性。他的生命没有任何价值，只给别人添了更多劳役。他确实是一个“懒汉”——一个除了“什么也不做”，便一无所为的人。"],"en":["Laziness is a kind of psychological weariness and an aversion to work and effort, whether physical or mental. Nothing in this world interests a lazy man: neither the allure of good food, nor the wonder of a view, nor the pleasure of reading a masterpiece, nor the joy of engaging with his surroundings. He can always find ways to reduce life’s various needs to a minimum and avoid expending his energy. Even the sloth itself is more industrious than this idle fellow. At least, hanging upside down from a tree as that animal does would be difficult for him. A lazy man will never stand if he can sit, and will never stand if he can lie down. He is alive, but seems dead, for he long ago stopped asking himself what his life is worth. What exhausting work thinking is for him.\n\nWhy, then, is he still alive? Probably because he cannot even be bothered to die. His lazy behaviour is a decision reached by comparing the options before him so as to consume the least possible energy. Why not consider it more precisely? If he stabs his chest with a knife, the point must pierce the thick fat of his chest, pass between his ribs and enter the atrium of his heart; then he must wait for his blood to keep gushing out until Death finally reaps his life with the great scythe. What exhausting work. If he wishes to hang and strangle himself, he must move the ladder, throw the rope over the branches and secure it, then climb up to put the rope around his neck. For him, that would be more like dying of fatigue. If he uses poison, he must get up and go to a shop outside to buy, for example, cyanide. But he cannot even be bothered to take a step outdoors: how could he endure all these ravages of exertion? Better to let a servant do it, one who dares offer him the service of death. But who would risk the death penalty for killing someone who is already dead?\n\nThere are many methods of suicide of this kind, but the only one likely to please him is to starve to death in bed, as the most economical use of energy. Or perhaps he will be fortunate enough for a killer to happen upon him. He certainly will not resist then: resistance, after all, is tiring work.\n\nThat is why he is still alive. Avoiding fatigue is the only motive that keeps him living.\n\nHis speech dwindles as his laziness worsens from day to day like a disease. His declaration that “laziness and idleness are among the inalienable rights of human beings and peoples without a future!” dwindles into “I am a staunch advocate of the least effort.” Finally, he says only, “Decree idleness.” Even if you can hear him say it, you may not understand him, for he economises on words and swallows “superfluous” syllables to avoid wasting too much energy. Now he lies down and sleeps every day without a word. No one can communicate with a dead man, except his poor grey-haired parents, who do everything to keep him alive.\n\nNaturally, there is no possibility of his having a job. He is himself a cockroach lodging in his parents’ home and eating their leftovers. He is plainly too lazy to prepare the paperwork and queue for unemployment benefits, so his livelihood comes from his dying parents. He is a man of many principles: since he can open his mouth and ask for enough money to ensure his survival, why trouble himself to apply for relief? They love him with all their hearts, but how could they have imagined giving birth to a parasite in human form, one who would never become an independent adult?\n\nBut then again, could he really lie in bed and wait for hunger to end his life? That is difficult, for the instinct to survive is irresistible in every living creature. Yet let me tell you the happy ending in which he finally died of laziness.\n\nAt first he ate the food his parents gave him. Cockroaches crawling over the bread? No matter: he lay quietly and waited for them to leave. Then, being too idle, he decided to stay in bed with his mouth open for his parents to feed him. When all the money was gone, his poor old parents had to travel far away to gather money for the family’s subsistence. Before leaving, they put a pie around his neck, but this person was so lazy that he would not even turn the pie a little. He opened his mouth and waited for spiders to spin webs on him, or for mushrooms to begin growing on his moist tongue: then all he would have to do was chew. But finally, when he would no longer make even the effort to swallow, this lazy man met his own happy death. Such was the death of this idler, and such was the story of his entire life. No other details are needed: his death from idleness reveals his shameless and indolent nature. His life had no value except to add to the drudgery of others. He truly was a good-for-nothing who did nothing.\n\n---","La dernière phrase rapproche « fainéant » et « fait néant ». Les traductions cherchent à conserver ce jeu entre la désignation du personnage et l’absence d’action ; elles ne substituent pas une autre conclusion à celle du texte français.\n\n末句将“fainéant”（懒汉）与“fait néant”（什么也不做）相互扣合。译文尽量保留人物称谓与“无所作为”之间的呼应，不另换结论。\n\nThe final sentence plays on “fainéant” (idler) and “fait néant” (does nothing). The translations retain, as far as possible, the connection between the name given to the character and his failure to act, without replacing the French text’s conclusion."]}}]}]}]};
const state={mode:window.matchMedia('(max-width:800px)').matches?(localStorage.getItem('rhet-mode')||'fr'):(localStorage.getItem('rhet-mode')||'triad')};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s,work,lang){let x=String(s||'');x=x.replace(/href="#note-(\d+)"/g,`href="#note-${work}-${lang}-$1"`).replace(/id="note-(\d+)"/g,`id="note-${work}-${lang}-$1"`);x=x.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return x;}
function md(raw,work,lang){let t=String(raw||'').trim();if(!t)return '';t=t.replace(/\r/g,'');const lines=t.split('\n');let out='',i=0;while(i<lines.length){if(!lines[i].trim()){i++;continue}if(lines[i].trim().startsWith('|')){let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){let l=lines[i].trim();if(!/^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(l))rows.push(l);i++}if(rows.length){const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>inline(x.trim(),work,lang));out+='<table><thead><tr>'+cells(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue}if(lines[i].trim().startsWith('>')){let q=[];while(i<lines.length&&lines[i].trim().startsWith('>')){q.push(lines[i].replace(/^\s*>\s?/,'').trim());i++}out+='<blockquote>'+q.map(x=>inline(x,work,lang)).join('<br>')+'</blockquote>';continue}let p=[];while(i<lines.length&&lines[i].trim()&&!lines[i].trim().startsWith('|')&&!lines[i].trim().startsWith('>')){p.push(lines[i]);i++}out+='<p>'+inline(p.join('<br>'),work,lang)+'</p>'}return out;}
function titleSpans(t,cls='paper-lang'){return `<span class="${cls} fr" data-lang="fr">${esc(t.fr)}</span><span class="${cls} zh" data-lang="zh">${esc(t.zh)}</span><span class="${cls} en" data-lang="en">${esc(t.en)}</span>`}
function heading(t){return `<div class="heading-lang fr" data-lang="fr">${esc(t.fr)}</div><div class="heading-lang zh" data-lang="zh">${esc(t.zh)}</div><div class="heading-lang en" data-lang="en">${esc(t.en)}</div>`}
function hasTable(unit){return Object.values(unit.paragraphs||{}).some(a=>a.some(x=>x.includes('|---')||x.includes('| ---')))}
function renderUnit(unit,wid,ui,showHeading){let h=showHeading&&unit.title?`<h3 class="unit-heading">${heading(unit.title)}</h3>`:'';if(hasTable(unit)){return h+'<div class="table-stack">'+['fr','zh','en'].map(l=>`<div class="table-language" data-lang="${l}"><span class="table-label">${l==='fr'?'Français':l==='zh'?'中文':'English'}</span>${(unit.paragraphs[l]||[]).map(x=>md(x,wid,l)).join('')}</div>`).join('')+'</div>'}return h+`<div class="triad"><div class="lang-column zh" data-lang="zh">${(unit.paragraphs.zh||[]).map(x=>md(x,wid,'zh')).join('')}</div><div class="lang-column fr" data-lang="fr">${(unit.paragraphs.fr||[]).map(x=>md(x,wid,'fr')).join('')}</div><div class="lang-column en" data-lang="en">${(unit.paragraphs.en||[]).map(x=>md(x,wid,'en')).join('')}</div></div>`}
function render(){const root=$('#reading');root.innerHTML='';const toc=$('#toc-list');toc.innerHTML='';RHET_DATA.works.forEach((w,wi)=>{const wb=document.createElement('article');wb.className='work-block';wb.id='work-'+w.id;wb.innerHTML=`<header class="work-title"><div class="paper-kicker">0${wi+1}</div>${titleSpans(w.title)}<div class="work-meta">${(w.meta||[]).filter(x=>String(x).trim()!=='---').map(x=>md(x,w.id,'fr')).join('')}</div></header>`;const nav=document.createElement('div');nav.className='toc-work';nav.innerHTML=`<a href="#work-${w.id}">${titleSpans(w.title,'toc-lang')}</a>`;const sections=document.createElement('div');sections.className='toc-sections';if(wi===0){const t=document.createElement('button');t.className='toc-toggle';t.type='button';t.textContent='章节 / Sections / Sections';t.addEventListener('click',()=>{sections.classList.toggle('open')});nav.append(t)}w.sections.forEach((sec,si)=>{const se=document.createElement('section');se.className='section';se.id=`${w.id}-section-${si+1}`;se.innerHTML=`<h2 class="section-heading">${heading(sec.title)}</h2>`;sec.units.forEach((u,ui)=>{const a=document.createElement('a');a.className='toc-main';a.href='#'+(sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id);a.innerHTML=titleSpans(u.title,'toc-lang');sections.append(a);const article=document.createElement('article');article.className='unit';article.id=sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id;article.innerHTML=renderUnit(u,w.id,`${si}-${ui}`,sec.units.length>1);se.append(article)});wb.append(se)});root.append(wb);if(wi===0){nav.append(sections)}toc.append(nav)});applyMode()}
function applyMode(){document.body.classList.toggle('single-mode',state.mode!=='triad');$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$$('[data-lang]').forEach(el=>{const inDrawer=el.closest('.toc-drawer');el.classList.toggle('active',state.mode==='triad'||el.dataset.lang===state.mode);if(inDrawer&&!el.classList.contains('toc-lang'))el.classList.add('active')});localStorage.setItem('rhet-mode',state.mode)}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>{const y=scrollY;state.mode=b.dataset.mode;applyMode();requestAnimationFrame(()=>scrollTo({top:y,behavior:'instant'}))}));
const drawer=$('#toc-drawer'),backdrop=$('#toc-backdrop');function closeToc(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}function openToc(){drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false')}$('#toc-open').addEventListener('click',openToc);$('#toc-close').addEventListener('click',closeToc);backdrop.addEventListener('click',closeToc);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeToc()});$('#toc-list').addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();closeToc();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})}});
render();
</script></body></html>
