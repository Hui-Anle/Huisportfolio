in:0 0 130px}.work-title{width:min(1000px,100%);margin:0 auto 58px;text-align:center;display:grid;gap:12px;line-height:1.5}.work-title .fr{font-size:clamp(1.7rem,2.7vw,2.35rem);color:var(--green)}.work-title .zh,.work-title .en{font-size:clamp(1rem,1.4vw,1.25rem);color:var(--muted)}.work-meta{margin:25px auto 0;text-align:center;color:var(--muted);font-size:.78rem;line-height:1.75;max-width:900px}.section{scroll-margin-top:calc(var(--toolbar-h) + 25px);margin:0 0 105px}.section-heading,.unit-heading{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,3vw,52px);align-items:start;margin:0 0 35px}.heading-lang{min-width:0;text-align:center;line-height:1.45}.heading-lang.fr{grid-column:2;color:var(--green);font-size:clamp(1.2rem,1.9vw,1.65rem)}.heading-lang.zh{grid-column:1;font-size:clamp(1rem,1.45vw,1.25rem)}.heading-lang.en{grid-column:3;color:var(--muted);font:clamp(.92rem,1.3vw,1.15rem)/1.45 Georgia,serif}.triad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,3vw,52px);align-items:start}.lang-column{min-width:0;color:var(--muted);font-size:clamp(1rem,1.08vw,1.12rem);line-height:1.92}.lang-column.fr{grid-column:2;color:var(--ink);font-size:clamp(1.28rem,1.42vw,1.42rem)}.lang-column.zh{grid-column:1}.lang-column.en{grid-column:3}.lang-column p{margin:0 0 1.35em;text-align:left;overflow-wrap:anywhere}.lang-column blockquote{margin:1.3em 0;padding-left:1em;border-left:1px solid var(--green);font-style:italic}.lang-column em{font-style:italic}.lang-column a{color:var(--green);text-decoration:underline;text-underline-offset:3px}.lang-column sup{font-size:.68em;line-height:0}.table-stack{width:min(1000px,100%);margin:20px auto;display:grid;gap:30px}.table-language{line-height:1.85}.table-language .table-label{display:block;text-align:center;color:var(--green);font-size:.78rem;letter-spacing:.08em;margin-bottom:10px}.table-language[data-lang=fr]{font-size:1.08rem;color:var(--ink)}.table ons a:hover{color:var(--green);background:rgba(74,93,78,.06)}.toc-toggle{border:0;background:transparent;color:var(--green);font-size:.72rem;cursor:pointer;padding:4px 8px;text-align:left}.toc-work .toc-lang,.toc-main .toc-lang{display:none}.toc-work .toc-lang.active,.toc-main .toc-lang.active{display:block}.single-mode .section-heading,.single-mode .unit-heading{display:block;width:min(780px,100%);margin-left:auto;margin-right:auto;text-align:center}.single-mode .section-heading .heading-lang,.single-mode .unit-heading .heading-lang{display:none;grid-column:auto;width:100%}.single-mode .section-heading .heading-lang.active,.single-mode .unit-heading .heading-lang.active{display:block;width:100%}.single-mode .triad{display:block;width:min(780px,100%);margin:0 auto}.single-mode .triad-heading,.single-mode .section-heading{display:block;width:min(780px,100%);margin-left:auto;margin-right:auto}.single-mode .heading-lang{display:none}.single-mode .heading-lang.active{display:block;text-align:center}.single-mode .lang-column{display:none}.single-mode .lang-column.active{display:block;color:var(--ink);font-size:clamp(1.05rem,1.25vw,1.22rem);line-height:2.02}.single-mode .table-stack{width:min(780px,100%)}.single-mode .table-language{display:none}.single-mode .table-language.active{display:block}.single-mode .work-title .paper-lang{display:none}.single-mode .work-title .paper-lang.active{display:block;font-size:clamp(1.5rem,2.8vw,2.6rem);color:var(--ink)}@media(max-width:800px){:root{--toolbar-h:60px}.masthead{padding:23px 6vw}.category-hero{padding:110px 6vw 48px}.toolbar{padding-left:4vw;padding-right:4vw}.reading{width:calc(100% - 40px);padding:44px 0 110px}.work-block{margin-bottom:85px}.work-title{margin-bottom:40px}.triad{display:flex;flex-direction:column;gap:28px}.lang-column,.lang-column.fr,.lang-column.zh,.lang-column.en{display:block;width:100%;font-size:1rem;line-height:1.9}.lang-column.fr{order:1}.lang-column.zh{order:2}.lang-column.en{order:3}.section-heading const RHET_DATA={"works":[{"id":"rhetorique","title":{"fr":"Montage, discontinuités et voix narratives dans La Dame aux camélias","zh":"《茶花女》中的蒙太奇、叙事断裂与叙述声音","en":"Montage, Discontinuities and Narrative Voices in La Dame aux camélias"},"meta":["**ZHU Huihui / 朱慧慧**","Master 2 — Théorie de la littérature, 2024–2025 / 文学理论硕士二年级，2024—2025学年","Séminaire : « Rhétorique, poétique, genres littéraires à l’époque moderne » — Mme Christine Noille","课程：“现代时期的修辞学、诗学与文学体裁”——Christine Noille 教授","Version révisée : 28 septembre 2026 / 修订日期：2026年9月28日","Le texte français constitue la version de référence ; les traductions chinoise et anglaise lui correspondent section par section. Les citations du roman en chinois et en anglais sont traduites ici à partir du français et ne sont pas empruntées à des traductions publiées. Les appels de notes renvoient à la section « Notes / 注释 » en fin d’article.","法文为本次修订的基准文本，中文与英文按节对应。小说引文的中英文均据法文译出，不采用既有译本。正文注号统一指向文末“Notes / 注释”。","**English reading note.** ZHU Huihui; Master 2 in Literary Theory, academic year 2024–2025. Seminar: “Rhétorique, poétique, genres littéraires à l’époque moderne”, taught by Christine Noille. Revised 28 September 2026. French is the reference text; Chinese and English translations correspond section by section. Novel quotations in both translations are newly translated from the French rather than taken from published translations. Numbered links lead to the shared notes at the end of the article.","---"],"sections":[{"title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"units":[{"title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"paragraphs":{"fr":["Publié en 1848, *La Dame aux camélias* transpose sous forme romanesque des éléments issus de la vie d’Alexandre Dumas fils. Le personnage de Marguerite Gautier s’inspire de la courtisane Marie Duplessis, morte à vingt-trois ans de la tuberculose. Armand Duval condense quant à lui deux figures masculines réelles : le duc Agénor de Gramont et le comte Édouard de Perrégaux, époux secret de Marie. La vente des biens de Marguerite, qui organise l’ouverture du roman, reprend celle à laquelle Dumas fils assista après la mort de Duplessis.[¹](#note-1)\n\nL’intrigue s’organise autour d’un amour impossible entre Marguerite Gautier, courtisane parisienne atteinte de tuberculose, et Armand Duval, jeune homme issu de la bourgeoisie. Après une passion fulgurante, le couple tente de se soustraire aux contraintes sociales en vivant à l’écart. L’intervention du père d’Armand, les malentendus affectifs et le sacrifice volontaire de Marguerite provoquent cependant la rupture. La mort de l’héroïne est connue dès l’ouverture ; les écrits lus à la fin du roman en révèlent les circonstances et reconfigurent rétrospectivement le sens de la séparation.\n\nSi l’histoire se prête à une lecture sentimentale et tragique, la composition du roman se distingue par une organisation fragmentée, alternant scènes dramatiques, ellipses, lettres et enchâssements. La version théâtrale ultérieure relève d’une autre logique de condensation dramatique ; cette différence permet de mieux situer la dispersion des matériaux dans le roman, sans faire de l’adaptation l’objet principal de cette étude.[²](#note-2)\n\nComment une histoire dont l’issue est annoncée d’emblée conserve-t-elle sa tension ? Comment une matière discontinue devient-elle émotionnellement cohérente sans perdre la multiplicité des voix qui la portent ? Le terme de **montage** désigne ici l’agencement de segments narratifs hétérogènes et les effets produits par leur succession : changements de voix, déplacements temporels, retards dans l’accès aux informations. L’étude examinera d’abord l’articulation entre cohérence et discontinuité dans l’architecture du roman, puis le montage des voix et des révélations différées, enfin les contrastes de rythme et leur intensité affective."],"zh":["发表于1848年的《茶花女》，将小仲马生平中的若干材料转化为小说。玛格丽特·戈蒂埃的原型是交际花玛丽·杜普莱西，后者因肺结核去世，年仅二十三岁。阿尔芒·迪瓦尔则凝聚了两位现实男性的形象：阿热诺尔·德·格拉蒙公爵，以及与玛丽秘密成婚的爱德华·德·佩雷戈伯爵。围绕玛格丽特遗物拍卖展开的小说开篇，取材于杜普莱西去世后小仲马曾亲自参加的那场拍卖。[¹](#note-1)\n\n小说围绕一段难以实现的爱情展开：一方是身患肺结核的巴黎交际花玛格丽特·戈蒂埃，另一方是出身资产阶级家庭的青年阿尔芒·迪瓦尔。炽烈的爱情使两人试图远离社会，在相对隔绝的生活中摆脱外界约束。然而，阿尔芒父亲的介入、情感上的误解，以及玛格丽特主动承担的牺牲，最终造成了决裂。女主人公的死亡在开篇便已为读者所知；直到小说接近结尾，得到阅读的书面材料才揭示其具体境况，并从后来重新改变了分离的意义。\n\n这一故事可以被读作感伤的爱情悲剧，但小说的构成却呈现出破碎的叙述组织：戏剧性场景、省略、书信与嵌套叙述交替出现。后来的戏剧改编遵循另一种戏剧凝缩逻辑；这一差异有助于辨认小说材料的分散性，不过改编本并非本文的主要研究对象。[²](#note-2)\n\n一段在开篇便已告知结局的故事，如何仍能保持张力？非连续的材料，如何在不抹平其多重声音的前提下，形成情感上的连贯性？本文以**蒙太奇**指称异质叙述片段的编排，以及片段相继出现所产生的效果：声音的转换、时间的移置与信息获取的迟延。研究首先考察小说结构中连贯与断裂的关系，继而分析声音与延迟揭示的蒙太奇，最后讨论叙述节奏的反差及其情感强度。"],"en":["Published in 1848, *La Dame aux camélias* transforms elements of Alexandre Dumas fils’s life into fiction. The character of Marguerite Gautier is inspired by the courtesan Marie Duplessis, who died of tuberculosis at the age of twenty-three. Armand Duval combines two real male figures: the Duke Agénor de Gramont and Count Édouard de Perrégaux, Marie’s secret husband. The sale of Marguerite’s possessions, around which the novel’s opening is organised, draws on the sale Dumas fils attended after Duplessis’s death.[¹](#note-1)\n\nThe plot centres on an impossible love between Marguerite Gautier, a Parisian courtesan suffering from tuberculosis, and Armand Duval, a young man from a bourgeois family. After the sudden intensity of their passion, the couple attempt to escape social constraints by living apart from society. Yet the intervention of Armand’s father, emotional misunderstandings and Marguerite’s voluntary sacrifice bring about their separation. The heroine’s death is known from the outset; the writings read near the end of the novel reveal its circumstances and retrospectively transform the meaning of the separation.\n\nAlthough the story lends itself to a sentimental and tragic reading, the novel’s composition is distinguished by a fragmented narrative organisation, alternating dramatic scenes, ellipses, letters and embedded narratives. The later stage version follows a different logic of dramatic condensation. This difference helps identify the dispersion of materials in the novel, without making the adaptation the principal object of this study.[²](#note-2)\n\nHow does a story whose outcome is announced at the outset retain its tension? How does discontinuous material become emotionally coherent without losing the multiplicity of the voices that carry it? **Montage** here denotes the arrangement of heterogeneous narrative segments and the effects of their succession: changes of voice, temporal displacements and delays in access to information. The study first examines the relationship between coherence and discontinuity in the novel’s architecture, then the montage of voices and deferred revelations, and finally contrasts of rhythm and their affective intensity."]}}]},{"title":{"fr":"I. Une structure fragmentaire : cohérence et rupture","zh":"碎片化结构：连贯与断裂","en":"A Fragmented Structure: Coherence and Rupture"},"units":[{"title":{"fr":"I.1. Une structure en apparence classique : un récit de passion tragique","zh":"看似经典的结构：一段激情的悲剧","en":"An Apparently Conventional Structure: A Narrative of Tragic Passion"},"paragraphs":{"fr":["Si l’on reconstitue la chronologie de l’histoire, le parcours de Marguerite et d’Armand semble répondre à un schéma sentimental classique : rencontre, développement amoureux, conflit familial et social, séparation tragique. La mort de l’héroïne en constitue l’aboutissement irréversible. Le récit ne suit pourtant pas cet ordre : il part de la disparition de Marguerite et des traces qu’elle laisse, avant de revenir sur la liaison.\n\nLa différence entre ces deux organisations est décisive. La chaîne des événements peut être reconstruite, mais elle n’est pas livrée comme une suite immédiatement continue. L’enquête du narrateur-cadre, les souvenirs d’Armand et les écrits de Marguerite donnent successivement accès à des portions de cette histoire. La continuité résulte donc d’un travail de composition et de lecture : elle se construit à partir d’une matière morcelée.\n\nCe schéma tragique conduit la figure féminine marginalisée vers une réhabilitation morale et symbolique, par la souffrance et le renoncement. Mais la tension ne porte pas sur la découverte de sa mort : elle porte sur la compréhension du sacrifice qui l’a précédée et sur la valeur affective que cette connaissance donne à la mort déjà annoncée. Le désir de comprendre demeure actif alors même que l’issue est connue.\n\nL’enchaînement des chapitres vise ainsi moins à reproduire une chronologie qu’à faire croître une intensité pathétique. Les grandes unités dramatiques — rencontre, idylle à Bougival, sacrifice, agonie — marquent des seuils émotionnels autant que des articulations de l’action. À l’intérieur de cette structure, retours en arrière, lettres et ruptures de ton désorganisent la continuité immédiate et imposent un dévoilement progressif du sens."],"zh":["如果重建故事发生的时间顺序，玛格丽特与阿尔芒的经历似乎符合经典的感伤叙事模式：相遇、爱情的发展、家庭与社会冲突，以及悲剧性的分离。女主人公的死亡构成了这一过程不可逆转的终点。然而，小说并不依照这个顺序讲述：它从玛格丽特的逝去及其留下的痕迹出发，再返回两人的恋情。\n\n这两种组织方式之间的差异至关重要。事件的链条可以被重建，却并未以一条当即连贯的线索交付给读者。框架叙述者的探访、阿尔芒的回忆，以及玛格丽特的文字，依次开放了通往这段故事不同部分的入口。因此，连续性既来自叙述的编排，也来自阅读的重组：它是在破碎的材料之上建立起来的。\n\n这一悲剧模式使身处社会边缘的女性，经由痛苦与自我舍弃，得到道德及象征意义上的重新承认。但叙述张力并不来自对她死亡的发现，而来自对死亡之前那场牺牲的理解，以及这一理解赋予早已宣告的死亡以何种情感分量。即便结局已经知晓，理解的欲望仍在持续。\n\n因此，章节的衔接，与其说是在复现时间顺序，不如说是在推动悲情强度的增长。相遇、布吉瓦尔的田园恋情、牺牲与临终，既是情节的关节，也是情感的临界点。在这一结构内部，回溯、书信与语调的断裂打散了直接的连续性，使意义只能逐步显露。"],"en":["If the chronology of the story is reconstructed, Marguerite and Armand’s trajectory appears to follow a conventional sentimental pattern: encounter, the development of love, familial and social conflict, and tragic separation. The heroine’s death is its irreversible endpoint. The narrative, however, does not follow this order: it begins with Marguerite’s death and the traces she leaves behind, before returning to the love affair.\n\nThe difference between these two arrangements is decisive. The chain of events can be reconstructed, but it is not presented as an immediately continuous sequence. The frame narrator’s enquiries, Armand’s memories and Marguerite’s writings successively provide access to portions of the story. Continuity therefore results from both composition and reading: it is constructed out of fragmented material.\n\nThrough suffering and renunciation, this tragic pattern leads the marginalised female figure towards moral and symbolic rehabilitation. Yet the tension does not concern the discovery of her death. It concerns understanding the sacrifice that preceded it, and the emotional significance that this knowledge gives to a death already announced. The desire to understand remains active even when the outcome is known.\n\nThe sequence of chapters thus works less to reproduce a chronology than to heighten the intensity of pathos. The major dramatic units—encounter, the idyll at Bougival, sacrifice and the death agony—mark emotional thresholds as well as articulations of the action. Within this structure, retrospection, letters and shifts of tone disrupt immediate continuity and require meaning to emerge progressively."]}},{"title":{"fr":"I.2. Séquences, voix et fonctions narratives","zh":"叙述段落、声音与功能","en":"Sequences, Voices and Narrative Functions"},"paragraphs":{"fr":["Le tableau suivant distingue les séquences telles qu’elles sont présentées au lecteur, les voix qui les prennent en charge et leur fonction dans cette analyse. Il ne faut donc pas confondre le moment où un événement se produit avec celui où sa cause devient intelligible.[³](#note-3)\n\n| Chapitres | Séquence et voix dominantes | Fonction dans la composition |\n|---|---|---|\n| I–III | Narrateur-cadre : annonce de la vente, visite de l’appartement, portrait de Marguerite, enchères et acquisition de *Manon Lescaut* | Faire entrer dans l’histoire par les traces d’une morte ; associer objets, mémoire et jugement moral |\n| IV–VI | Narrateur-cadre : arrivée d’Armand, lettre de Marguerite, enquête au cimetière, exhumation et maladie d’Armand | Préparer le récit de l’amant en donnant à la perte une présence matérielle |\n| VII–X | Cadre de la convalescence, puis récit d’Armand : premiers contacts, retrouvailles, aveu | Revenir de la mort connue à la naissance de l’amour |\n| XI–XIII | Brève interruption du cadre en XI, puis reprise d’Armand : désir, contraintes de la liaison et jalousie | Rendre perceptible l’acte de raconter ; installer les déséquilibres amoureux |\n| XIV–XV | Armand : lettre de rupture, attente, visite et explication de Marguerite | Retarder la réponse et transformer la compréhension de l’attachement |\n| XVI–XVIII | Armand, avec des écrits insérés : aménagement de la liaison, éloignement du duc, installation à la campagne, questions d’argent | Articuler l’idylle à ses conditions matérielles |\n| XIX–XXI | Armand : arrangements financiers, arrivée du père, conflit familial, réactions de Marguerite | Faire éprouver les effets d’une intervention dont tous les motifs ne sont pas encore exposés |\n| XXII–XXIV | Armand, avec la lettre de rupture de Marguerite : séparation, vengeance, dernière intimité et éloignement ; remise des papiers à la fin de XXIV | Conduire la souffrance jusqu’au seuil d’un autre témoignage |\n| XXV–XXVI | Narrateur-cadre transcripteur, puis écrits de Marguerite ; Julie prend ensuite la plume | Révéler le sacrifice et raconter la fin de vie depuis d’autres positions |\n| XXVII | Narrateur-cadre : confirmation des faits, visites, tombe et famille d’Armand | Refermer l’enquête et proposer une lecture morale de l’histoire |\n\nCette succession fait apparaître une architecture qui ne se réduit ni à quatre étapes sentimentales ni à une alternance régulière de narrateurs. Certaines transitions traversent l’intérieur d’un même chapitre ; certaines lettres sont enchâssées dans une voix qui continue de les encadrer. Le montage est donc aussi une affaire de seuils, de reprises et de transmission de la parole."],"zh":["下表区分了读者实际接触的叙述段落、承担讲述的声音，以及这些段落在本文分析中的功能。事件发生的时刻，与其原因终于能够被理解的时刻，因而不能混为一谈。[³](#note-3)\n\n| 章节 | 主要段落与叙述声音 | 在整体构成中的功能 |\n|---|---|---|\n| I—III | 框架叙述者：拍卖预告、公寓参观、玛格丽特肖像、竞拍及购得《曼侬·莱斯科》 | 从逝者的遗迹进入故事，将物件、记忆与道德判断联系起来 |\n| IV—VI | 框架叙述者：阿尔芒到来、玛格丽特的信、墓地探访、掘墓与阿尔芒病倒 | 使失去具有可触及的物质形态，为恋人的讲述作准备 |\n| VII—X | 病后恢复的框架情境，随后转入阿尔芒的叙述：初次接触、重逢与表白 | 从已知的死亡，返回爱情的发生 |\n| XI—XIII | XI章短暂回到框架，随后阿尔芒继续：欲望、恋情的限制与嫉妒 | 使讲述行为本身显现，建立爱情内部的失衡 |\n| XIV—XV | 阿尔芒：分手信、等待、玛格丽特的来访与解释 | 延缓回应，改变对情感依恋的理解 |\n| XVI—XVIII | 阿尔芒的叙述及嵌入其中的书信：恋情安排、与公爵疏远、乡居与经济问题 | 将田园爱情与其物质条件联系起来 |\n| XIX—XXI | 阿尔芒：经济安排、父亲到来、家庭冲突与玛格丽特的反应 | 先呈现外界介入所造成的影响，而暂不说明全部动因 |\n| XXII—XXIV | 阿尔芒的叙述及玛格丽特的分手信：分离、报复、最后的亲密与远行；XXIV章末交出文稿 | 将痛苦推至另一份证言即将展开的门槛 |\n| XXV—XXVI | 框架叙述者转录材料，继而呈现玛格丽特的文字，随后朱莉接笔 | 揭示牺牲，并从其他位置讲述生命的终结 |\n| XXVII | 框架叙述者：事实确认、探访、墓地与阿尔芒的家人 | 收束探访，为故事提出一种道德解释 |\n\n这一顺序呈现出的结构，既不能被简化为爱情故事的四个阶段，也并非叙述者之间整齐划一的轮换。有的转换发生在同一章内部；有的书信嵌入某一声音之中，而该声音仍继续围绕它组织叙述。因此，蒙太奇也关乎话语的交界、重启与传递。"],"en":["The following table distinguishes the sequences as they are presented to the reader, the voices that convey them and their functions in this analysis. The moment at which an event occurs must therefore be distinguished from the moment at which its cause becomes intelligible.[³](#note-3)\n\n| Chapters | Sequence and dominant voices | Function in the composition |\n|---|---|---|\n| I–III | Frame narrator: announcement of the sale, visit to the apartment, portrait of Marguerite, bidding and acquisition of *Manon Lescaut* | Introduces the story through the traces of a dead woman; connects objects, memory and moral judgement |\n| IV–VI | Frame narrator: Armand’s arrival, Marguerite’s letter, enquiries at the cemetery, exhumation and Armand’s illness | Prepares the lover’s narrative by giving loss a material presence |\n| VII–X | The frame of convalescence, followed by Armand’s narrative: first contacts, reunion and declaration | Returns from a known death to the beginning of love |\n| XI–XIII | Brief interruption by the frame in XI, followed by Armand’s resumption: desire, the constraints of the affair and jealousy | Makes the act of narration perceptible; establishes the relationship’s imbalances |\n| XIV–XV | Armand: letter of rupture, waiting, Marguerite’s visit and explanation | Delays the response and transforms the understanding of attachment |\n| XVI–XVIII | Armand, with inserted writings: arrangements for the affair, estrangement from the duke, a move to the country and financial questions | Connects the idyll to its material conditions |\n| XIX–XXI | Armand: financial arrangements, the father’s arrival, familial conflict and Marguerite’s reactions | Makes the effects of an intervention felt before all its motives have been disclosed |\n| XXII–XXIV | Armand, including Marguerite’s letter of rupture: separation, revenge, final intimacy and departure; the papers are handed over at the end of XXIV | Brings suffering to the threshold of another testimony |\n| XXV–XXVI | The frame narrator as transcriber, followed by Marguerite’s writings; Julie then takes up the pen | Reveals the sacrifice and recounts the end of life from other positions |\n| XXVII | Frame narrator: confirmation of the facts, visits, the grave and Armand’s family | Closes the enquiry and proposes a moral reading of the story |\n\nThis succession reveals an architecture reducible neither to four sentimental stages nor to a regular alternation of narrators. Some transitions occur within a single chapter; some letters are embedded in a voice that continues to frame them. Montage is therefore also a matter of thresholds, resumptions and the transmission of speech."]}},{"title":{"fr":"I.3. Une narration discontinue : lettres, retours en arrière, commentaires","zh":"非连续的叙述：书信、回溯与评论","en":"Discontinuous Narration: Letters, Retrospection and Commentary"},"paragraphs":{"fr":["La discontinuité s’installe dès l’ouverture. Un narrateur-cadre anonyme raconte à la première personne sa visite de l’appartement, l’achat du livre puis sa rencontre avec Armand. Il se situe à l’extérieur de la liaison, mais participe à l’histoire de sa découverte. La scène des enchères se développe au chapitre III ; l’entrée dans le récit d’Armand n’intervient qu’au chapitre VII, après la rencontre des deux hommes, l’exhumation et la convalescence. Préparée par ces événements, la prise de parole marque néanmoins un changement de niveau narratif : la mémoire de l’amant devient le lieu d’organisation de l’histoire.\n\nÀ cet enchâssement s’ajoutent les insertions moralisantes du narrateur-cadre et les commentaires d’Armand. Devant les objets de Marguerite, le premier estime que Dieu a été clément en la laissant mourir avant la vieillesse. Au chapitre III, il lance cet appel : « soyons bons, soyons jeunes, soyons vrais ! Le mal n’est qu’une vanité, ayons l’orgueil du bien ». Dans ce même développement moral, la comparaison avec le Christ assigne au jugement la tâche de ramener vers le bien ceux qui s’en sont écartés.[⁴](#note-4) Ces interventions suspendent l’avancée événementielle et déplacent le récit vers une méditation morale. Elles rompent l’unité du ton et instaurent un dialogue entre l’histoire racontée et le jugement qui prétend l’éclairer.\n\nLa correspondance introduit un autre type de discontinuité. Les billets échangés au cours de la liaison sont déjà présents dans la narration d’Armand. Il faut les distinguer des papiers de Marguerite confiés à Julie, annoncés au chapitre VI mais dont la lecture développée est différée jusqu’aux chapitres XXV–XXVI. Armand en révèle d’abord l’existence, puis les remet sous son oreiller : « Vous les lirez aussi, mais plus tard ».[⁵](#note-5) Le document est matériellement là ; son contenu reste tenu en réserve.\n\nCe délai donne aux écrits finaux une force particulière. Ils ne viennent pas seulement ajouter des faits : ils font entendre les raisons d’une conduite déjà racontée, jugée et douloureusement subie par Armand. La parole de Marguerite oblige à reconsidérer ce qui avait été lu depuis le point de vue de l’amant. Lorsque Julie prend la plume au chapitre XXVI, un nouveau relais s’établit : le récit de soi cède à la présence d’un témoin auprès de la mourante.\n\nL’irrégularité de ces segments — dramatisés, résumés, commentés ou épistolaires — compose un assemblage par blocs. Loin d’être arbitraire, ce montage transforme la perception du temps, la hiérarchie des informations et l’intelligibilité des causes. Le roman se lit comme un réseau de fragments articulés, dont les raccords restent sensibles."],"zh":["断裂从开篇便已建立。一位匿名的框架叙述者，以第一人称讲述自己参观公寓、买下书籍，继而结识阿尔芒的过程。他处在恋情之外，却参与了这段恋情被发现的故事。竞拍场景在第三章展开；直到第七章，在两人会面、掘墓与病后恢复之后，叙述才进入阿尔芒的回忆。此前的事件已经为这一交接作了准备，但发言者的转换仍然标志着叙述层次的变化：恋人的记忆成为组织故事的所在。\n\n在这种嵌套之外，还有框架叙述者的道德议论与阿尔芒的评论。面对玛格丽特的遗物，前者认为，上帝让她在年老之前死去，已是对她的仁慈。到了第三章，他发出这样的呼吁：“让我们善良，让我们年轻，让我们真诚！恶不过是一种虚荣，让我们以善为荣。”在同一段道德论述中，基督的类比又赋予判断以引人从歧路返回善途的任务。[⁴](#note-4) 这些介入暂停了事件的推进，将叙述引向道德沉思。它们打破语调的统一，使被讲述的故事与试图解释它的判断彼此交涉。\n\n通信引入了另一种断裂。恋情中往来的便笺，早已出现在阿尔芒的叙述里；它们必须与玛格丽特托付给朱莉的文稿区别开来。后者在第六章便被提及，却要等到第二十五至二十六章才得到展开阅读。阿尔芒先让人看见文稿，又将它们收回枕下：“您也会读到这些，不过得晚些时候。”[⁵](#note-5) 文件已经作为实物在场，其内容却仍被扣留。\n\n这种迟延赋予最后的文字以特殊力量。它们不只是补充事实，而是让一种行为的理由终于被听见——在此之前，这种行为已经被阿尔芒讲述、评判，并痛苦地承受。玛格丽特的声音迫使读者重新思考此前从恋人视角读到的一切。第二十六章中，当朱莉接笔，又一次传递发生了：自我的叙述让位于临终者身旁的见证。\n\n这些段落或被场景化，或被概述，或转为评论与书信，其不规则的接续构成了一种块状拼接。这样的蒙太奇并非任意组合；它改变了时间的感知、信息的重要次序，以及原因如何变得可理解。小说因而可以被读作彼此关联的片段网络，而片段接合的痕迹始终能够被察觉。"],"en":["Discontinuity is established from the opening. An anonymous frame narrator gives a first-person account of his visit to the apartment, his purchase of the book and his subsequent meeting with Armand. He stands outside the love affair but participates in the story of its discovery. The auction scene unfolds in chapter III; Armand’s narrative begins only in chapter VII, after the two men’s meeting, the exhumation and convalescence. Prepared by these events, the transfer of speech nevertheless marks a change of narrative level: the lover’s memory becomes the site in which the story is organised.\n\nThis embedding is accompanied by the frame narrator’s moralising interpolations and Armand’s comments. Looking at Marguerite’s possessions, the former considers God merciful for having allowed her to die before old age. In chapter III he issues this appeal: “let us be good, let us be young, let us be true! Evil is only a vanity; let us take pride in goodness.” In the same moral discussion, the comparison with Christ assigns judgement the task of leading back towards goodness those who have strayed from it.[⁴](#note-4) These interventions suspend the progress of events and shift the narrative towards moral reflection. They break the unity of tone and establish a dialogue between the story being told and the judgement that claims to illuminate it.\n\nCorrespondence introduces another kind of discontinuity. The notes exchanged during the affair already appear in Armand’s narrative. They must be distinguished from Marguerite’s papers entrusted to Julie: announced in chapter VI, these are not read at length until chapters XXV–XXVI. Armand first reveals their existence, then puts them back beneath his pillow: “You will read them too, but later.”[⁵](#note-5) The document is materially present; its contents are held in reserve.\n\nThis delay gives the final writings a particular force. They do more than add facts: they make audible the reasons for conduct that Armand has already recounted, judged and painfully endured. Marguerite’s voice compels a reconsideration of what has been read from the lover’s perspective. When Julie takes up the pen in chapter XXVI, another relay is established: self-narration gives way to the presence of a witness beside the dying woman.\n\nThe irregularity of these segments—dramatised, summarised, commented upon or epistolary—creates an assemblage of blocks. Far from being arbitrary, this montage transforms the perception of time, the hierarchy of information and the intelligibility of causes. The novel reads as a network of connected fragments whose joins remain perceptible."]}}]},{"title":{"fr":"II. Montage et révélation différée : un récit à relecture rétroactive","zh":"蒙太奇与延迟揭示：在回读中改变的叙述","en":"Montage and Deferred Revelation: A Narrative Transformed by Rereading"},"units":[{"title":{"fr":"II.1. Les seuils du récit : continuité, coupure et reprise","zh":"叙述的交界：连续、切断与重启","en":"Narrative Thresholds: Continuity, Interruption and Resumption"},"paragraphs":{"fr":["Le montage de *La Dame aux camélias* ne se limite pas à juxtaposer des blocs narratifs. Il distribue l’information — affective, causale ou biographique — selon une temporalité qui sépare le vécu de sa compréhension. Les chapitres modulent à la fois la vitesse du récit, les voix qui s’y font entendre et les registres émotionnels.\n\nLa transition des chapitres VI à VII en fournit un premier exemple. La fièvre d’Armand, diagnostiquée à la fin du chapitre VI, est reprise dès l’ouverture du chapitre VII par une réflexion sur ce type de maladie. La continuité thématique est nette ; elle accompagne pourtant un saut de quinze jours, explicitement indiqué au début de VII. Le raccord paraît fluide alors même que la durée est comprimée.[⁶](#note-6)\n\nÀ l’inverse, le début du chapitre IV revient au résultat matériel des enchères après le développement moral qui clôt le chapitre III : « Deux jours après, la vente était complètement terminée. Elle avait produit cent cinquante mille francs. »[⁶](#note-6) La vente elle-même a été mise en scène au chapitre précédent ; c’est son achèvement et son bilan financier qui sont ici condensés. Le passage du jugement moral au compte des sommes produit une coupure de registre autant qu’une accélération temporelle.\n\nAu début du chapitre XI, une autre fracture réintroduit le présent du récit-cadre :\n\n> « En cet endroit de son récit, Armand s’arrêta.\n>\n> — Voulez-vous fermer la fenêtre ? me dit-il, je commence à avoir froid. »[⁷](#note-7)\n\nAprès la déclaration amoureuse et le départ des convives à la fin du chapitre X, ce retour au lieu de la narration interrompt l’immersion. Le corps affaibli d’Armand redevient visible ; il se couche, puis choisit de poursuivre. Le lecteur doit passer de l’événement remémoré à la situation de celui qui le raconte, avant d’entrer de nouveau dans le souvenir. La continuité de l’amour raconté est ainsi traversée par les nécessités du présent de la parole."],"zh":["《茶花女》的蒙太奇并不限于将叙述块并置。它按照一种将经历与理解分离的时间组织，分配情感、因果或人物生平方面的信息。章节同时调节着叙述的速度、能够被听见的声音，以及情绪的调性。\n\n第六至第七章的转换提供了第一个例子。第六章末尾，医生诊断阿尔芒发热；第七章开篇随即以一段对这类疾病的议论承接这一话题。主题的连续十分鲜明，却伴随着十五天的时间跳跃——这一时距在第七章开头已有明确交代。衔接看似流畅，时间却已经被压缩。[⁶](#note-6)\n\n相反，在第三章末尾的道德论述之后，第四章开头重新回到竞拍的物质结果：“两天之后，拍卖已全部结束。共卖得十五万法郎。”[⁶](#note-6) 拍卖本身已在前一章得到场景化呈现；这里被压缩的是拍卖的结束及其财务结果。从道德判断转向金额核算，既形成了语调的切换，也加快了叙述的时间进程。\n\n第十一章开头，另一道断裂将框架叙述的当下重新带回：\n\n> “讲到这里，阿尔芒停了下来。\n>\n> ‘您能把窗户关上吗？’他对我说，‘我开始觉得冷了。’”[⁷](#note-7)\n\n第十章末尾刚刚讲过爱情表白与宾客离去，叙述随即返回讲述发生的场所，打断了读者的沉浸。阿尔芒虚弱的身体重新变得可见：他躺下，随后选择继续。读者必须从被回忆的事件，转向讲述者身处的情境，然后才能再次进入记忆。被讲述的爱情看似连续，却始终受到讲述当下的身体需要所穿透。"],"en":["The montage of *La Dame aux camélias* does more than juxtapose narrative blocks. It distributes information—affective, causal or biographical—according to a temporality that separates experience from understanding. Chapters modulate the speed of the narrative, the voices heard within it and its emotional registers.\n\nThe transition from chapter VI to chapter VII provides a first example. Armand’s fever, diagnosed at the end of VI, is taken up at the opening of VII in a reflection on this kind of illness. The thematic continuity is clear, yet it accompanies a jump of fifteen days, explicitly stated at the beginning of VII. The transition appears smooth even as duration is compressed.[⁶](#note-6)\n\nBy contrast, the beginning of chapter IV returns to the material outcome of the auction after the moral discussion that closes chapter III: “Two days later, the sale was completely over. It had brought in a hundred and fifty thousand francs.”[⁶](#note-6) The auction itself has been dramatised in the previous chapter; what is condensed here is its completion and financial outcome. The move from moral judgement to the reckoning of sums creates a shift of register as well as a temporal acceleration.\n\nAt the opening of chapter XI, another fracture reintroduces the present of the frame narrative:\n\n> “At this point in his story, Armand stopped.\n>\n> ‘Would you close the window?’ he said to me. ‘I am beginning to feel cold.’”[⁷](#note-7)\n\nAfter the declaration of love and the guests’ departure at the end of chapter X, this return to the place of narration interrupts immersion. Armand’s weakened body becomes visible again: he lies down, then chooses to continue. The reader must pass from the remembered event to the situation of the person telling it, before entering the memory once more. The continuity of narrated love is thus traversed by the demands of the present in which it is spoken."]}},{"title":{"fr":"II.2. L’amour expliqué après coup","zh":"在事后得到解释的爱情","en":"Love Explained After the Event"},"paragraphs":{"fr":["Le montage se manifeste aussi dans la révélation différée des motifs intimes. Lorsque Marguerite accepte la déclaration d’Armand au chapitre X, elle explique sa hâte par une vie qu’elle sait menacée : « devant vivre moins longtemps que les autres, je me suis promis de vivre plus vite ». Au chapitre XV, elle donne la véritable raison de son attachement particulier à Armand : devant son crachement de sang, il a éprouvé de la compassion. Elle lui rappelle : « tu m’as pris la main, parce que tu as pleuré, parce que tu es la seule créature humaine qui ait bien voulu me plaindre ».[⁸](#note-8)\n\nLa première parole porte sur l’urgence de vivre ; la seconde explique pourquoi cette urgence se tourne vers cet homme. Cette révélation rétroactive transforme la scène initiale : ce qui pouvait apparaître comme un caprice ou une recherche accélérée du plaisir devient une réponse à la compassion reçue. Le lecteur recompose le sens émotionnel du passé à la lumière d’une parole plus tardive. La densité du personnage féminin tient aussi à ce retard : son geste précède l’accès complet à ses raisons.\n\nLe même principe organise la première crise épistolaire. Le soupçon se développe au chapitre XIII ; Armand rédige et envoie sa lettre de rupture au chapitre XIV, puis revient sur son geste et attend une réponse. La visite de Marguerite au chapitre XV apporte enfin l’explication.[⁹](#note-9) Le délai dramatise l’attente, suscite la frustration et donne à la parole différée un poids particulier. Ce n’est pas l’émotion du personnage qui attend pour exister : c’est l’explication de l’action qui tarde à rejoindre celui qui souffre et celui qui lit.\n\nCes deux séquences montrent que l’information affective ne se distribue pas au moment même où elle serait nécessaire à une compréhension immédiate. Un aveu tardif modifie ce qu’une acceptation, une absence ou une lettre avaient d’abord laissé entendre. Le récit avance en obligeant le lecteur à revenir sur ses propres lectures."],"zh":["蒙太奇也体现于私密动机的延迟揭示。第十章中，玛格丽特接受阿尔芒的表白时，以自己受到死亡威胁的生命解释那份急切：“既然注定比别人活得短，我便答应自己，要活得更快。”到了第十五章，她才给出自己为何特别依恋阿尔芒的真正理由：面对她的咯血，他曾流露出怜惜。她提醒他：“你握住了我的手，因为你哭了，因为你是唯一肯怜惜我的人。”[⁸](#note-8)\n\n第一次表述关乎活着的急迫，第二次则解释了这份急迫为何转向这个男人。后来的揭示改变了最初场景的意义：原本可能被理解为一时任性，或加速追逐欢愉的举动，成为对所获怜惜的回应。读者借助较晚出现的话语，重新组织过去的情感意义。女性人物的厚度也形成于这一迟延：行动已经发生，人们却尚未充分进入其理由。\n\n第一次围绕书信展开的危机，也遵循同样的原则。怀疑在第十三章发展；第十四章中，阿尔芒写下并寄出分手信，随后又为自己的举动反悔，等待答复。直到第十五章玛格丽特来访，解释才终于到来。[⁹](#note-9) 这一时差将等待戏剧化，制造焦虑，并赋予迟来的话语以特殊分量。并非人物的情感要等待之后才存在，而是对行动的解释，迟迟不能抵达那个受苦的人，也不能抵达阅读的人。\n\n这两组段落表明，情感信息并不恰好在足以让人立即理解的时刻被分配。一句迟来的坦白，改变了一次接受、一次缺席或一封信最初暗示的意义。叙述通过迫使读者返回自己的既有理解而向前推进。"],"en":["Montage also appears in the deferred revelation of intimate motives. When Marguerite accepts Armand’s declaration in chapter X, she explains her haste through a life she knows to be threatened: “since I am to live less long than others, I have promised myself to live faster.” In chapter XV she gives the true reason for her particular attachment to Armand: faced with her coughing up blood, he showed compassion. She reminds him: “you took my hand, because you wept, because you are the only human creature who was willing to pity me.”[⁸](#note-8)\n\nThe first statement concerns the urgency of living; the second explains why that urgency turns towards this man. This retrospective revelation transforms the initial scene: what might have appeared a whim or an accelerated pursuit of pleasure becomes a response to compassion received. The reader reconstructs the emotional meaning of the past in the light of a later utterance. The female character’s complexity also depends on this delay: her gesture precedes full access to its reasons.\n\nThe same principle organises the first epistolary crisis. Suspicion develops in chapter XIII; Armand writes and sends his letter of rupture in XIV, then regrets his action and waits for a reply. Marguerite’s visit in chapter XV finally brings an explanation.[⁹](#note-9) The delay dramatises waiting, produces frustration and gives the deferred speech a particular weight. It is not the character’s emotion that has to wait before it exists: it is the explanation of the action that is slow to reach both the sufferer and the reader.\n\nThese two sequences show that emotional information is not distributed at the very moment when it would be needed for immediate understanding. A belated confession modifies what an acceptance, an absence or a letter first seemed to imply. The narrative advances by compelling readers to return to their own earlier readings."]}},{"title":{"fr":"II.3. Un montage de voix et de perceptions différées","zh":"声音与延迟感知的蒙太奇","en":"A Montage of Voices and Deferred Perceptions"},"paragraphs":{"fr":["La multiplicité des voix prolonge cet effet de montage. Le narrateur-cadre introduit des figures périphériques à l’histoire d’amour : d’autres femmes évoquées dans ses réflexions, le gardien du cimetière, les proches qui conservent ou marchandent les traces de Marguerite. Ces détours construisent des échos moraux, sociaux et existentiels. L’héroïne n’est pas seulement regardée dans sa relation avec Armand ; son destin est replacé parmi d’autres vies et d’autres façons de juger.\n\nDe son côté, Armand mêle à la reconstruction des événements la jalousie, le désir, le remords et l’exaltation. Les écrits finaux de Marguerite font ensuite accéder à une parole longtemps différée, qui contredit ou réoriente ses interprétations. Cet accès n’abolit pas tout intermédiaire : les papiers ont été conservés, transmis, puis transcrits par le narrateur-cadre. Le montage fait entendre une autre conscience tout en montrant les conditions dans lesquelles cette voix nous parvient.\n\nChaque bloc affectif — souvenir, aveu, lettre ou silence — recontextualise donc les précédents. Le lecteur ne reçoit pas une chaîne de causes entièrement expliquée à mesure qu’elle se déroule ; il compose une mosaïque de perceptions différées. Ce travail produit une unité intelligible des faits, mais il n’efface pas les différences entre les positions d’où ils ont été vécus et racontés. Connaître la raison du sacrifice ne revient ni à retrouver le temps perdu ni à annuler les jugements qui l’ont rendu nécessaire.\n\n*La Dame aux camélias* impose ainsi une lecture à rebours. L’émotion de la lecture se renouvelle lorsque le souvenir et les documents changent la signification de l’instant vécu. L’amour, déjà déclaré et éprouvé, reçoit d’autres raisons dans l’aveu tardif ; la souffrance, déjà sensible, devient autrement compréhensible. Le roman prend la forme d’un palimpseste affectif : les explications nouvelles se déposent sur les premières impressions sans supprimer la douleur qu’elles avaient produite."],"zh":["多重声音进一步延伸了这种蒙太奇效果。框架叙述者引入了爱情故事周边的人物：议论中提及的其他女性、墓地看守，以及保存或交易玛格丽特遗迹的相关人物。这些迂回构成了道德、社会与生存经验之间的回响。女主人公不只在与阿尔芒的关系中受到注视；她的命运也被放回其他生命与其他评判方式之间。\n\n阿尔芒则在事件的重建之中交织着嫉妒、欲望、悔恨与激动。玛格丽特最后的文字，随后开放了通往一个长期被延后的声音的入口，反驳或改变了他的解释。然而，这种进入并未消除一切中介：文稿经过保存、转交，再由框架叙述者转录。蒙太奇使另一种意识被听见，同时也让我们看见，这声音是在何种条件下抵达读者的。\n\n因此，每一个情感块——记忆、坦白、书信或沉默——都重新安置了此前的片段。读者得到的不是一条在发生过程中便已解释完毕的因果链，而是在拼合一幅延迟感知的镶嵌图。这样的工作，使事实获得了可以理解的统一性，却并未消除经历与讲述它们的不同位置。知道牺牲的原因，并不等于寻回失去的时间，也不能取消那些使牺牲成为必要的判断。\n\n《茶花女》因而要求一种向后返回的阅读。当回忆与文稿改变了曾经那一刻的意义，阅读的情感也随之重新生成。爱情早已被表白、被体验，却在迟来的坦白中获得了其他理由；痛苦早已可感，却又以另一种方式变得可以理解。小说由此呈现为一张情感的重写羊皮纸：新的解释覆写在最初印象之上，却无法抹去那些印象已经造成的疼痛。"],"en":["The multiplicity of voices extends this montage effect. The frame narrator introduces figures peripheral to the love story: other women evoked in his reflections, the cemetery keeper, and those connected with Marguerite who preserve or trade in the traces she leaves. These detours create moral, social and existential echoes. The heroine is not viewed solely through her relationship with Armand; her destiny is situated among other lives and other ways of judging.\n\nArmand, for his part, intertwines the reconstruction of events with jealousy, desire, remorse and exaltation. Marguerite’s final writings then give access to a long-deferred voice that contradicts or redirects his interpretations. Such access does not eliminate every intermediary: the papers have been kept, handed over and then transcribed by the frame narrator. The montage makes another consciousness audible while showing the conditions in which this voice reaches us.\n\nEach affective block—memory, confession, letter or silence—thus recontextualises those preceding it. The reader does not receive a chain of causes fully explained as it unfolds, but composes a mosaic of deferred perceptions. This work produces an intelligible unity of facts without erasing the differences between the positions from which they were experienced and recounted. Knowing the reason for the sacrifice neither restores lost time nor annuls the judgements that made it necessary.\n\n*La Dame aux camélias* thus demands a reading that turns backwards. The emotion of reading is renewed when memory and documents alter the significance of the lived moment. Love, already declared and felt, acquires further reasons in the belated confession; suffering, already perceptible, becomes intelligible in another way. The novel takes the form of an affective palimpsest: new explanations are laid over first impressions without abolishing the pain those impressions produced."]}}]},{"title":{"fr":"III. Rythme et intensité : vers une dramaturgie affective","zh":"节奏与强度：走向情感的戏剧构成","en":"Rhythm and Intensity: Towards an Affective Dramaturgy"},"units":[{"title":{"fr":"III.1. La durée narrative et la valeur affective","zh":"叙述时长与情感价值","en":"Narrative Duration and Affective Value"},"paragraphs":{"fr":["Le rythme de *La Dame aux camélias* repose sur une alternance de développements scéniques, de sommaires et d’ellipses. Dans la distinction proposée par Gérard Genette, la scène suppose une équivalence conventionnelle entre le temps de l’histoire et celui du récit, particulièrement perceptible dans le dialogue. Le sommaire condense une durée ; l’ellipse en omet la narration. La densité descriptive ne suffit donc pas, à elle seule, à définir une scène : il faut examiner son insertion dans le mouvement du récit.[¹⁰](#note-10)\n\nCes différences de vitesse prennent ici une valeur affective. La longueur accordée à un passage ne se mesure pas seulement à son importance dans l’enchaînement des actions. Le texte s’attarde là où un geste, un regard ou une attente engagent l’intensité du souvenir. Il accélère lorsqu’une durée peut être résumée pour rejoindre un nouveau seuil émotionnel.\n\nAu début du chapitre XVI, Armand formule lui-même ce rapport entre détail et attachement. Il aurait pu raconter les commencements de la liaison en quelques lignes ; il choisit de développer la progression par laquelle chacun en est venu à dépendre de l’autre.[¹¹](#note-11) L’étendue du récit répond ainsi à une nécessité affective : faire comprendre comment un lien s’est constitué, plutôt que se borner à constater qu’il existe."],"zh":["《茶花女》的节奏建立在场景展开、概述与省略的交替之上。在热奈特的区分中，场景意味着故事时间与叙述时间之间一种约定性的等值，尤其体现于对话；概述压缩一段时长，而省略则不予叙述。因此，仅凭描写的浓密，还不足以将一个段落界定为场景；还必须考察描写如何嵌入叙述的运动。[¹⁰](#note-10)\n\n速度的差异在此具有情感价值。一个段落占据多长篇幅，并非只由它在行动链中的重要性决定。当一个动作、一瞥或一次等待牵动了记忆的强度，文本便驻足不前；当某段时长可以被概述，以抵达新的情感临界点，叙述便加快速度。\n\n在第十六章开头，阿尔芒亲自说明了细节与依恋的这种联系。他原本可以用几行文字讲完恋情的开端，却选择展开两人如何逐步变得相互依赖的过程。[¹¹](#note-11) 叙述的长度因而回应着一种情感上的需要：让人理解关系如何建立，而不只是确认它已经存在。"],"en":["The rhythm of *La Dame aux camélias* rests on an alternation of scenic developments, summaries and ellipses. In Gérard Genette’s distinction, scene assumes a conventional equivalence between story time and narrative time, particularly perceptible in dialogue. Summary condenses a duration; ellipsis omits its narration. Descriptive density alone is therefore insufficient to define a scene: its place within the movement of the narrative must be examined.[¹⁰](#note-10)\n\nThese differences of speed acquire an affective value here. The space allotted to a passage is not measured solely by its importance in the sequence of actions. The text lingers where a gesture, a glance or a period of waiting engages the intensity of memory. It accelerates when a duration can be summarised in order to reach a new emotional threshold.\n\nAt the opening of chapter XVI, Armand himself articulates this relationship between detail and attachment. He could have recounted the beginning of the affair in a few lines; instead, he chooses to develop the progression by which each came to depend on the other.[¹¹](#note-11) Narrative extent thus answers an affective need: to make comprehensible how a bond was formed, rather than merely to establish its existence."]}},{"title":{"fr":"III.2. De la première prise de contact aux retrouvailles","zh":"从初次接触到重逢","en":"From First Contact to Reunion"},"paragraphs":{"fr":["Un contraste éclairant apparaît entre la première présentation d’Armand à Marguerite et les retrouvailles qui conduisent à la liaison. Au chapitre VII, le premier échange est dominé par l’embarras. La scène fait se succéder un geste de politesse, un regard, la rougeur d’Armand et le rire des deux femmes :\n\n> « Marguerite me fit une légère inclination de tête […] En les prenant, elle me regarda. Je baissai les yeux, je rougis. Elle se pencha à l’oreille de sa voisine, lui dit quelques mots tout bas, et toutes deux éclatèrent de rire. »[¹²](#note-12)\n\nLa période d’éloignement n’est pas entièrement réduite à une phrase : Armand évoque les nouvelles prises pendant la maladie, le départ de Marguerite, ses voyages et d’autres relations. Elle est néanmoins racontée sous une forme beaucoup plus condensée que les retrouvailles. Au terme du chapitre VII, le contact de la robe suffit à abolir les effets apparents de cette durée :\n\n> « et les deux années passées sans la voir et les résultats que cette séparation avait paru amener s’évanouirent dans la même fumée au seul toucher de sa robe. »[¹²](#note-12)\n\nÀ partir des retrouvailles, la narration se déploie au contraire en démarches, regards, dialogues, musique, dîner et déclaration d’amour. Le chapitre VIII s’attarde sur l’apparition de Marguerite dans sa loge et sur la reconnaissance incertaine qui circule entre les deux personnages :\n\n> « Elle était dans l’avant-scène du rez-de-chaussée, et toute seule. […] Elle avait souffert, elle souffrait encore. […] Je la regardais si obstinément que mon regard attira le sien. Elle me considéra quelques instants, prit sa lorgnette pour mieux me voir, et crut sans doute me reconnaître, sans pouvoir positivement dire qui j’étais […] »[¹³](#note-13)\n\nCette dissymétrie manifeste l’investissement affectif du narrateur. Une longue séparation peut être condensée ; quelques gestes réclament un développement soutenu dès lors qu’ils portent l’espoir de la liaison. Le pathos se déplace de l’événement considéré extérieurement vers l’expérience intérieure de celui qui le revit.\n\nLe contraste comporte aussi une dimension ironique liée à la situation de lecture : nous connaissons déjà la mort de Marguerite, tandis que l’Armand du souvenir espère encore une vie à venir. Le déploiement de l’espoir se lit donc sous le signe de sa perte. L’ironie ne tient pas à la seule différence de longueur entre deux passages ; elle naît de l’écart entre le savoir du lecteur et l’horizon du personnage."],"zh":["阿尔芒第一次被介绍给玛格丽特，与后来导向恋情的重逢之间，形成了一组鲜明的对照。第七章中，最初的交谈由窘迫主导：场景依次呈现礼貌性的动作、目光、阿尔芒的脸红，以及两个女人的笑声：\n\n> “玛格丽特向我微微点了点头……接过糖果时，她看了我一眼。我垂下眼睛，脸红了。她俯身到身旁女人的耳边，低声说了几句话，两人便一同大笑起来。”[¹²](#note-12)\n\n此后相隔的岁月，并非完全被压缩为一句话：阿尔芒提到在玛格丽特患病期间打听消息、她的离去、自己的旅行，以及其他交往。但相较于重逢，这段时日仍以明显凝缩的方式得到讲述。第七章末尾，衣裙的一次触碰，便足以消除时间似乎已经产生的作用：\n\n> “而整整两年不曾见她的岁月，以及这场分离似乎已经带来的一切结果，仅仅在触到她衣裙的一刻，就一同如烟消散了。”[¹²](#note-12)\n\n重逢之后，叙述却展开为寻求再见的行动、目光、对话、音乐、晚餐与爱情表白。第八章停留在玛格丽特现身包厢的瞬间，以及两人之间尚不确定的辨认：\n\n> “她独自坐在池座层临近舞台的包厢里。……她受过苦，此刻仍在受苦。……我望着她，目光固执得终于引来了她的视线。她打量了我片刻，拿起望远镜，想把我看得更清楚些；她大概以为认出了我，却又不能确切地说出我是谁……”[¹³](#note-13)\n\n这种不对称显现出叙述者的情感投入。长久的分离可以被压缩，而一旦几个动作承载起恋情的希望，便要求得到充分展开。悲情的重心由外部可见的事件，转向重新经历它的人内在的体验。\n\n这一反差还因阅读情境而具有反讽意味：我们已经知道玛格丽特的死亡，记忆中的阿尔芒却仍在期待未来的生活。因此，希望的展开始终是在失去的阴影下被阅读的。反讽并不只来自两段文字的长度差异，而产生于读者所知与人物所能展望的未来之间的距离。"],"en":["A revealing contrast emerges between Armand’s first introduction to Marguerite and the reunion that leads to the affair. In chapter VII, their first exchange is dominated by embarrassment. The scene presents a succession of polite gesture, glance, Armand’s blush and the two women’s laughter:\n\n> “Marguerite gave me a slight nod […] As she took them, she looked at me. I lowered my eyes; I blushed. She leaned towards her neighbour’s ear, whispered a few words, and they both burst out laughing.”[¹²](#note-12)\n\nThe period apart is not wholly reduced to a single sentence: Armand mentions his enquiries during her illness, Marguerite’s departure, his travels and other relationships. Nevertheless, it is narrated in a much more condensed form than the reunion. At the end of chapter VII, the touch of her dress is enough to abolish the apparent effects of that elapsed time:\n\n> “and the two years spent without seeing her, and the effects that this separation had seemed to produce, vanished together like smoke at the mere touch of her dress.”[¹²](#note-12)\n\nFrom the reunion onwards, by contrast, the narrative unfolds through attempts to meet, glances, dialogues, music, dinner and the declaration of love. Chapter VIII lingers over Marguerite’s appearance in her box and the uncertain recognition passing between the two characters:\n\n> “She was in the stage-side box on the ground floor, quite alone. […] She had suffered; she was suffering still. […] I watched her so persistently that my gaze drew hers. She studied me for a few moments, took up her opera glasses to see me better, and must have thought she recognised me, without being able to say positively who I was […]”[¹³](#note-13)\n\nThis asymmetry reveals the narrator’s emotional investment. A long separation can be condensed; a handful of gestures demands sustained development once they carry the hope of a relationship. Pathos shifts from the event viewed externally towards the inner experience of the person reliving it.\n\nThe contrast also has an ironic dimension arising from the situation of reading: we already know of Marguerite’s death, while the Armand of memory still hopes for a life to come. The unfolding of hope is therefore read under the sign of its loss. The irony does not lie merely in the difference in length between two passages; it arises from the distance between the reader’s knowledge and the character’s horizon."]}},{"title":{"fr":"III.3. L’exhumation : une lenteur insoutenable","zh":"掘墓：难以承受的缓慢","en":"The Exhumation: An Unbearable Slowness"},"paragraphs":{"fr":["Au chapitre VI, l’exhumation de Marguerite au cimetière de Montmartre déploie une lenteur éprouvante. Le récit détaille les gestes des fossoyeurs, les réactions d’Armand et l’apparition du corps décomposé. L’action avance, mais chaque étape devient le lieu d’une attente presque insoutenable :\n\n> « Armand s’appuya contre un arbre et regarda. Toute sa vie semblait être passée dans ses yeux. »[¹⁴](#note-14)\n\nLe narrateur surveille à son tour cet homme qui regarde. La scène superpose ainsi la découverte du cadavre et l’observation d’un vivant menacé de s’effondrer. La description ne constitue pas un simple arrêt décoratif : elle fait éprouver la durée de l’épreuve, geste après geste, réaction après réaction.\n\nCe ralentissement macabre confronte le lecteur à la matérialité du corps et oppose une mort crue aux formes d’idéalisation romantique. Il donne une consistance insoutenable à ce que l’ouverture avait d’abord annoncé comme un fait. Le corps ne se laisse plus réduire à l’absence, au souvenir ni aux objets dispersés de la vente.\n\nLe rapprochement avec l’ouverture du chapitre IV fait apparaître une dissymétrie précise : l’achèvement et le bilan financier de la vente sont rapidement expédiés, tandis que l’exhumation est développée. Il ne s’agit donc pas d’opposer une vente entièrement résumée à un cimetière seul mis en scène. L’opposition porte sur la clôture d’une opération matérielle et sur l’expérience affective d’une confrontation au corps. L’importance factuelle des événements ne suffit pas à expliquer leur durée narrative ; leur valeur émotionnelle et symbolique en commande aussi le traitement.\n\nLe roman ne suit ainsi ni un rythme régulier ni un désordre absolu. Les discontinuités sont ordonnées par une intensité affective qui permet de passer de l’objet au souvenir, du souvenir à la parole, puis de la parole au corps perdu. À ce titre, l’analogie avec le montage cinématographique éclaire un effet de succession et de contraste ; elle ne suppose aucune filiation historique entre le roman et une technique apparue après lui."],"zh":["第六章中，蒙马特墓地对玛格丽特的掘墓，以一种令人难熬的缓慢展开。叙述逐一描写掘墓人的动作、阿尔芒的反应，以及腐败身体的显露。行动仍在推进，但每一步都变成了几乎无法承受的等待：\n\n> “阿尔芒倚着一棵树，望着。他的全部生命，仿佛都已经移入了双眼。”[¹⁴](#note-14)\n\n叙述者又注视着这个正在凝望的人。场景因而将尸体的显露，与对一个濒临崩溃的活人的观察叠合起来。描写并非装饰性的停顿：它使考验的时长逐个动作、逐次反应地被感受到。\n\n这种阴森的放缓，使读者直面身体的物质性，以赤裸的死亡抵抗浪漫化的理想形象。开篇只是作为事实宣告的死讯，在此获得了难以承受的实在。身体再也不能被简化为缺席、记忆，或拍卖中四散的遗物。\n\n将这一场景与第四章开头对照，便可辨认一种准确的篇幅失衡：拍卖的结束与财务结果被迅速带过，掘墓却得到充分展开。因此，这里并不是将“完全被概述的拍卖”与“唯一得到场景化的墓地”对立起来。真正的对照发生在一项物质事务的收尾，与面对身体的情感经验之间。事件在事实层面的重要性，不足以解释其叙述时长；情感与象征价值，同样支配着处理方式。\n\n小说因此既不遵循均匀的节奏，也并非处于绝对的无序。情感强度组织着这些断裂，使叙述得以从物件进入记忆，从记忆进入言说，再从言说抵达失去的身体。就此而言，与电影蒙太奇的类比，揭示的是接续与反差的效果，而不意味着小说与晚于它出现的技术之间存在历史上的承继关系。"],"en":["In chapter VI, Marguerite’s exhumation in Montmartre cemetery unfolds with a distressing slowness. The narrative details the gravediggers’ movements, Armand’s reactions and the appearance of the decomposed body. The action advances, but each stage becomes the site of almost unbearable waiting:\n\n> “Armand leaned against a tree and watched. His whole life seemed to have passed into his eyes.”[¹⁴](#note-14)\n\nThe narrator in turn watches the man who is watching. The scene thus superimposes the discovery of the corpse and the observation of a living man threatened with collapse. Description is no merely decorative halt: it makes the duration of the ordeal felt, gesture by gesture, reaction by reaction.\n\nThis macabre slowing confronts the reader with the body’s materiality and opposes the rawness of death to forms of romantic idealisation. It gives an unbearable substance to what the opening first announced as a fact. The body can no longer be reduced to absence, memory or the objects dispersed through the sale.\n\nA comparison with the opening of chapter IV reveals a precise asymmetry: the completion and financial outcome of the sale are swiftly dispatched, while the exhumation is developed at length. The contrast is therefore not between an entirely summarised auction and a cemetery that alone receives scenic treatment. It is between the conclusion of a material transaction and the emotional experience of confronting the body. The factual importance of events is insufficient to explain their narrative duration; their emotional and symbolic value also governs their treatment.\n\nThe novel consequently follows neither a regular rhythm nor absolute disorder. Its discontinuities are ordered by an affective intensity that allows movement from object to memory, from memory to speech, and then from speech to the lost body. In this respect, the analogy with cinematic montage illuminates an effect of succession and contrast; it implies no historical line of descent between the novel and a technique that emerged after it."]}}]},{"title":{"fr":"Conclusion","zh":"结论","en":"Conclusion"},"units":[{"title":{"fr":"Conclusion","zh":"结论","en":"Conclusion"},"paragraphs":{"fr":["La lecture structurelle de *La Dame aux camélias* révèle un agencement plus complexe qu’un simple déroulement sentimental et tragique. Une histoire chronologiquement reconstituable est donnée à lire au moyen d’enchâssements, de ruptures rythmiques et d’informations différées. Le roman compose une mosaïque d’unités affectives : l’émotion peut précéder la compréhension, puis être transformée par elle.\n\nL’alternance des scènes, des sommaires et des ellipses, l’usage des lettres et la transmission des voix sollicitent continuellement le lecteur. Celui-ci relie ce qui a été séparé, reprend ce qu’il croyait avoir compris et mesure la distance entre l’événement et son interprétation. Les coupures ne sont donc pas de simples obstacles à la cohérence ; elles participent à sa production.\n\nL’ouverture du texte ne signifie pas que l’intrigue reste sans explication. Au chapitre XXVII, Armand affirme que son père a confirmé les faits par lettre, et le narrateur-cadre propose une clôture morale.[¹⁵](#note-15) Mais cette convergence ne rend pas interchangeables la douleur d’Armand, la parole de Marguerite, le témoignage de Julie et le jugement du narrateur. La recomposition des faits n’efface pas les différences entre les voix qui les rapportent, ni le temps durant lequel leurs vérités sont restées séparées.\n\nLe roman demeure ainsi une structure ouverte à la reprise interprétative, fragmentaire mais signifiante. La fragmentation ne constitue pas un défaut à corriger : elle transforme l’histoire d’amour en une méditation sur la mémoire, la lecture et la perte. À travers ce que le récit tait, interrompt et révèle trop tard, *La Dame aux camélias* interroge la manière dont une vie devient racontable — et ce que sa compréhension ne peut plus réparer."],"zh":["对《茶花女》的结构阅读，揭示了一种远比感伤悲剧的单线展开更复杂的组织方式。一个可以按时间顺序重建的故事，却通过嵌套、节奏断裂与延迟的信息，才进入读者的视野。小说编排出一幅由情感单元组成的镶嵌图：情绪可以先于理解发生，随后又被理解改变。\n\n场景、概述与省略的交替，书信的使用，以及声音的传递，持续要求读者参与。读者连接被分开的片段，重新检视自己以为已经理解的内容，并衡量事件与解释之间的距离。因此，断裂不只是连贯性的障碍；它本身参与了连贯性的生成。\n\n文本的开放，并不意味着情节始终没有解释。第二十七章中，阿尔芒表示，父亲已在信中确认相关事实；框架叙述者也给出了道德性的收束。[¹⁵](#note-15) 然而，这种趋同并不能让阿尔芒的痛苦、玛格丽特的话语、朱莉的见证与叙述者的判断彼此替代。事实的重新拼合，既没有抹去讲述这些事实的不同声音，也没有抹去它们各自的真实曾经相互隔绝的那段时间。\n\n小说因此仍是一种向重新阐释开放的结构，破碎，却并非无意义。碎片化不构成有待修补的缺陷：它将爱情故事转化为对记忆、阅读与失去的思考。通过叙述所隐去、中断，以及太晚才揭示的一切，《茶花女》追问的是，一段生命如何成为可以讲述的故事——以及理解到来之后，究竟还有什么永远无法挽回。"],"en":["A structural reading of *La Dame aux camélias* reveals an arrangement more complex than a straightforward sentimental and tragic progression. A story whose chronology can be reconstructed is presented through embeddings, rhythmic ruptures and deferred information. The novel composes a mosaic of affective units: emotion may precede understanding and then be transformed by it.\n\nThe alternation of scenes, summaries and ellipses, the use of letters and the transmission of voices continually call upon the reader. Readers connect what has been separated, reconsider what they believed they had understood, and gauge the distance between an event and its interpretation. Interruptions are therefore not merely obstacles to coherence; they participate in producing it.\n\nThe text’s openness does not mean that the plot remains unexplained. In chapter XXVII, Armand states that his father has confirmed the facts by letter, and the frame narrator offers a moral closure.[¹⁵](#note-15) Yet this convergence does not make Armand’s pain, Marguerite’s words, Julie’s testimony and the narrator’s judgement interchangeable. Reconstructing the facts does not erase the differences between the voices that report them, or the time during which their truths remained separate.\n\nThe novel thus remains a structure open to renewed interpretation, fragmented yet meaningful. Fragmentation is not a defect to be corrected: it transforms the love story into a meditation on memory, reading and loss. Through what the narrative withholds, interrupts and reveals too late, *La Dame aux camélias* questions how a life becomes tellable—and what understanding can no longer repair."]}}]},{"title":{"fr":"Annexe. Les voix narratives, chapitre par chapitre","zh":"附录：逐章叙述声音表","en":"Appendix: Narrative Voices, Chapter by Chapter"},"units":[{"title":{"fr":"Annexe. Les voix narratives, chapitre par chapitre","zh":"附录：逐章叙述声音表","en":"Appendix: Narrative Voices, Chapter by Chapter"},"paragraphs":{"fr":["Ce relevé complète le tableau de la section I.2. Il distingue la voix qui encadre un chapitre des paroles ou des écrits qui y sont insérés. La présence d’une lettre ne signifie donc pas nécessairement que le narrateur principal du chapitre s’efface. Les intitulés de la dernière colonne décrivent le contenu ; ils ne constituent pas des titres de chapitres du roman.\n\n| Chapitre | Voix et relais | Contenu et articulation |\n|---|---|---|\n| I | Narrateur-cadre à la première personne | Annonce de la vente ; visite de l’appartement ; découverte de la mort ; commentaires moraux |\n| II | Narrateur-cadre | Portrait de Marguerite, souvenirs et renseignements réunis après coup |\n| III | Narrateur-cadre | Enchères ; achat de *Manon Lescaut* ; développement moral |\n| IV | Narrateur-cadre ; propos d’Armand et lettre de Marguerite insérés | Bilan de la vente ; première rencontre avec Armand ; premières explications sur le livre et la liaison |\n| V | Narrateur-cadre ; témoignage du gardien | Recherche de renseignements ; visite au cimetière |\n| VI | Narrateur-cadre ; paroles d’Armand | Présentation puis mise en réserve des papiers ; exhumation ; crise et maladie d’Armand |\n| VII | Narrateur-cadre, puis Armand à la première personne | Convalescence et amitié ; entrée dans le souvenir ; premiers contacts et retour vers les retrouvailles |\n| VIII | Armand | Retrouvailles au théâtre ; regards et démarches pour revoir Marguerite |\n| IX | Armand ; dialogues | Visite chez Marguerite, musique et souper ; crise de toux et crachement de sang |\n| X | Armand ; paroles de Marguerite | Compassion, déclaration et acceptation ; explication de la hâte de vivre |\n| XI | Retour bref au narrateur-cadre, puis reprise d’Armand | Demande de fermer la fenêtre ; repos du narrateur second ; poursuite du souvenir et rapprochement amoureux |\n| XII | Armand | Contraintes de la liaison ; place du duc et du comte ; jalousie |\n| XIII | Armand ; propos de Prudence et billet de Marguerite | Soupçons ; attente ; observation de l’arrivée du comte |\n| XIV | Armand ; ses propres lettres | Lettre de rupture ; regret ; nouvelle lettre et attente de la réponse |\n| XV | Armand ; explication de Marguerite | Visite nocturne ; réconciliation ; révélation du rôle de la compassion |\n| XVI | Armand ; commentaire sur sa propre manière de raconter | Justification du développement narratif ; transformation de sa vie ; projets de campagne |\n| XVII | Armand ; billet de Marguerite et échanges avec le duc | Installation à Bougival ; éloignement du duc |\n| XVIII | Armand ; explications de Prudence | Bonheur quotidien, renoncements matériels de Marguerite et dettes |\n| XIX | Armand ; lettres paternelles rapportées | Dispositions financières ; inquiétudes du père et annonce de son arrivée |\n| XX | Armand ; dialogue avec son père | Confrontation familiale ; refus de renoncer à Marguerite |\n| XXI | Armand ; paroles de Marguerite et du père | Inquiétude et réactions mal comprises ; apparente détente avec le père ; causes encore partiellement cachées |\n| XXII | Armand ; lettre de rupture de Marguerite | Retour à Bougival ; absence de Marguerite ; lettre et effondrement d’Armand |\n| XXIII | Armand | Retour à Paris ; jalousie et mise en place de la vengeance avec Olympe |\n| XXIV | Armand ; échanges et écrits insérés | Vengeance, dernière intimité, humiliation et départs ; annonce de la lecture des papiers de Julie |\n| XXV | Narrateur-cadre transcripteur, puis Marguerite | Réception du manuscrit ; récit de la rencontre avec le père et explication du sacrifice |\n| XXVI | Marguerite, puis Julie Duprat | Souffrance après la séparation ; écrits datés ; Julie prend le relais et rapporte la mort et les funérailles |\n| XXVII | Narrateur-cadre ; propos d’Armand et des personnes visitées | Confirmation paternelle ; visites à Prudence et Julie, à la tombe et à la famille d’Armand ; clôture morale |"],"zh":["此表补充第一部分第二节的概览，区分了围绕章节组织叙述的声音，与嵌入其中的话语或书面材料。因此，一封信的出现，并不必然意味着该章主要叙述者的退出。末栏是对内容的描述，并非小说本身的章名。\n\n| 章节 | 声音及其交接 | 内容与衔接 |\n|---|---|---|\n| I | 第一人称框架叙述者 | 拍卖预告、公寓参观、得知死讯与道德评论 |\n| II | 框架叙述者 | 玛格丽特肖像、回忆及事后汇集的信息 |\n| III | 框架叙述者 | 竞拍、购得《曼侬·莱斯科》与道德论述 |\n| IV | 框架叙述者；嵌入阿尔芒的话与玛格丽特的信 | 拍卖结果、阿尔芒首次登场、关于书籍与恋情的初步解释 |\n| V | 框架叙述者；看守的证言 | 寻求信息、探访墓地 |\n| VI | 框架叙述者；阿尔芒的话语 | 文稿出现后暂被收起、掘墓、阿尔芒精神受创并病倒 |\n| VII | 框架叙述者，随后转入阿尔芒的第一人称讲述 | 病后恢复与友谊、进入回忆、初次接触及返回重逢的叙述 |\n| VIII | 阿尔芒 | 剧院重逢、目光往来与寻求再次会面的行动 |\n| IX | 阿尔芒；人物对话 | 到访玛格丽特家、音乐与晚餐、咳嗽发作及咯血 |\n| X | 阿尔芒；玛格丽特的话语 | 怜惜、表白与接受，解释为何急于生活 |\n| XI | 短暂返回框架叙述者，随后阿尔芒继续 | 请求关窗、第二层叙述者休息、回忆继续与恋人亲近 |\n| XII | 阿尔芒 | 恋情的限制、公爵与伯爵的位置、嫉妒 |\n| XIII | 阿尔芒；普律当丝的话与玛格丽特的便笺 | 怀疑、等待、看见伯爵到来 |\n| XIV | 阿尔芒；他自己写下的信 | 分手信、后悔、再次写信与等待答复 |\n| XV | 阿尔芒；玛格丽特的解释 | 深夜来访、和解、揭示怜惜在爱情中的作用 |\n| XVI | 阿尔芒；对自身讲述方式的评论 | 解释为何详述、生活方式的变化、乡居计划 |\n| XVII | 阿尔芒；玛格丽特的便笺及与公爵的往来 | 定居布吉瓦尔、与公爵疏远 |\n| XVIII | 阿尔芒；普律当丝的说明 | 日常幸福、玛格丽特在物质上的舍弃与债务 |\n| XIX | 阿尔芒；转述父亲来信 | 财务安排、父亲的不安与到来预告 |\n| XX | 阿尔芒；与父亲的对话 | 家庭冲突、拒绝放弃玛格丽特 |\n| XXI | 阿尔芒；玛格丽特与父亲的话语 | 不安与被误解的反应、与父亲表面上的缓和、尚未充分揭示的原因 |\n| XXII | 阿尔芒；玛格丽特的分手信 | 返回布吉瓦尔、玛格丽特不在、收到信与阿尔芒崩溃 |\n| XXIII | 阿尔芒 | 返回巴黎、嫉妒、借奥兰普展开报复 |\n| XXIV | 阿尔芒；嵌入对话与书面材料 | 报复、最后的亲密、羞辱与离去；预告阅读朱莉交来的文稿 |\n| XXV | 负责转录的框架叙述者，随后为玛格丽特 | 接收文稿、讲述与父亲的会面、解释牺牲 |\n| XXVI | 玛格丽特，随后为朱莉·迪普拉 | 分离后的痛苦、带日期的文字、朱莉接笔讲述死亡与葬礼 |\n| XXVII | 框架叙述者；阿尔芒及受访者的话语 | 父亲对事实的确认，探访普律当丝、朱莉、墓地及阿尔芒家人，道德收束 |"],"en":["This survey complements the table in section I.2. It distinguishes the voice framing a chapter from speech or writings inserted within it. The presence of a letter does not necessarily mean that the chapter’s principal narrator withdraws. The final column describes the contents; its entries are not chapter titles from the novel.\n\n| Chapter | Voices and relays | Contents and transitions |\n|---|---|---|\n| I | First-person frame narrator | Announcement of the sale; apartment visit; discovery of the death; moral comments |\n| II | Frame narrator | Portrait of Marguerite, memories and information assembled retrospectively |\n| III | Frame narrator | Auction; purchase of *Manon Lescaut*; moral discussion |\n| IV | Frame narrator; inserted speech by Armand and letter by Marguerite | Outcome of the sale; first meeting with Armand; initial explanations of the book and affair |\n| V | Frame narrator; the keeper’s testimony | Enquiries; visit to the cemetery |\n| VI | Frame narrator; Armand’s words | Papers presented and then held back; exhumation; Armand’s crisis and illness |\n| VII | Frame narrator, then Armand in the first person | Convalescence and friendship; entry into memory; first contacts and return towards the reunion |\n| VIII | Armand | Reunion at the theatre; glances and attempts to see Marguerite again |\n| IX | Armand; dialogue | Visit to Marguerite’s home, music and supper; coughing fit and blood |\n| X | Armand; Marguerite’s words | Compassion, declaration and acceptance; explanation of the haste to live |\n| XI | Brief return to the frame narrator, then Armand resumes | Request to close the window; the embedded narrator rests; memory continues and the lovers draw closer |\n| XII | Armand | Constraints of the affair; the duke’s and count’s positions; jealousy |\n| XIII | Armand; Prudence’s words and Marguerite’s note | Suspicions; waiting; observation of the count’s arrival |\n| XIV | Armand; his own letters | Letter of rupture; regret; a further letter and waiting for the reply |\n| XV | Armand; Marguerite’s explanation | Nocturnal visit; reconciliation; revelation of compassion’s role |\n| XVI | Armand; comment on his own way of telling | Justification for narrative elaboration; changes in his life; plans for the country |\n| XVII | Armand; Marguerite’s note and exchanges with the duke | Move to Bougival; estrangement from the duke |\n| XVIII | Armand; Prudence’s explanations | Daily happiness, Marguerite’s material sacrifices and debts |\n| XIX | Armand; reported letters from his father | Financial arrangements; the father’s concerns and announcement of his arrival |\n| XX | Armand; dialogue with his father | Familial confrontation; refusal to give up Marguerite |\n| XXI | Armand; words of Marguerite and his father | Anxiety and misunderstood reactions; apparent easing of relations with the father; causes still partly concealed |\n| XXII | Armand; Marguerite’s letter of rupture | Return to Bougival; Marguerite’s absence; the letter and Armand’s collapse |\n| XXIII | Armand | Return to Paris; jealousy and preparations for revenge through Olympe |\n| XXIV | Armand; inserted exchanges and writings | Revenge, final intimacy, humiliation and departures; announcement of the reading of Julie’s papers |\n| XXV | Frame narrator as transcriber, then Marguerite | Receipt of the manuscript; account of the meeting with the father and explanation of the sacrifice |\n| XXVI | Marguerite, then Julie Duprat | Suffering after the separation; dated writings; Julie takes over and reports the death and funeral |\n| XXVII | Frame narrator; words of Armand and those visited | Paternal confirmation; visits to Prudence and Julie, the grave and Armand’s family; moral closure |"]}}]},{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"units":[{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"paragraphs":{"fr":[],"zh":[],"en":[]}}]},{"title":{"fr":"Bibliographie","zh":"参考文献","en":"Bibliography"},"units":[{"title":{"fr":"Œuvre et éditions","zh":"研究作品及版本","en":"Work and Editions"},"paragraphs":{"fr":[],"zh":[],"en":[]}},{"title":{"fr":"Analyse narrative","zh":"叙事分析","en":"Narrative Analysis"},"paragraphs":{"fr":[],"zh":[],"en":[]}},{"title":{"fr":"Autres références du travail initial","zh":"原作业其余参考文献","en":"Other References from the Original Assignment"},"paragraphs":{"fr":[],"zh":[],"en":[]}}]}]},{"id":"junon","title":{"fr":"Junon en colère","zh":"愤怒的朱诺","en":"Juno in Anger"},"meta":["愤怒的朱诺 / Juno in Anger","**ZHU Huihui / 朱慧慧**","Exercice de rhétorique réalisé en Master 1 / 硕士一年级修辞课考核习作 / Rhetoric assignment completed during the first year of the master’s programme"],"sections":[{"title":{"fr":"Junon en colère","zh":"愤怒的朱诺","en":"Juno in Anger"},"units":[{"title":{"fr":"Junon en colère","zh":"愤怒的朱诺","en":"Juno in Anger"},"paragraphs":{"fr":["Moi, fille de Saturne, sœur et épouse de Jupiter, déesse la plus honorable des Olympiens, une reine qui donne ordres aux dieux, une reine qui a la puissance d'ébranler les cieux et la terre, maintenant je suis insultée par les Troyens, car l'ignoble descendant de Vénus s'est enfui de mes yeux pour chercher asile en Italie. Ne se sont-ils pas moqués de moi sur le bateau en partance pour l'Italie ? Un mortel aussi faible qu'une souris et une fourmi ose échapper au châtiment de la reine des dieux. Seule une vengeance cruelle et froide peut calmer ma haine brûlante.\n\nMais puis-je arrêter l'arrangement du destin? Si je continue à les contrecarrer alors qu'ils, comme le destin le dicte, construisent un puissant empire et détruisent ma ville bien-aimée de Carthage, alors mes efforts, ma colère et ma dignité seront une plaisanterie pour les Troyens et les dieux. Leur gloire se nourrit de mon chagrin, de ma colère. Plus je me sens douloureuse comme des milliers de flèches transpercent mon cœur et plus mon courroux brûle comme le magma jaillissant d'un volcan, plus leur évasion sera glorieuse et plus leurs péchés impardonnable seront facilement ignorés au fils du temps, plus il était facile pour mes griefs et mes insultes d'être ignorés, jusqu'à ce qu'à la fin même leurs offenses contre moi deviennent un témoignage de leur bravoure. Je ne dois pas les laisser faire leur chemin.\n\nMais qui se tient encore derrière moi pour que je garde ce pays de l’injustice ? Jupiter doit être partial envers sa fille Vénus, puis-je complètement détruire les Troyens qui ont été bénis par le maître des dieux, y compris Énée, fils de Vénus? Puisque c’est le la foudre de Jupiter qu’Athéna a armée quand elle a brûlé toute la flotte des Grecs pour unir le seul Ajax en délire. Ajax, qui m'a autrefois apporté la victoire et la gloire pendant la guerre, a été écrasé à mort sur le rocher par les vagues et la foudre lancé du haut des nues devant la déesse impitoyable. Le tonnerre qui est tombé du ciel a frappé l'épave du navire, et mes chers disciples grecs ont été submergés de peur et noyés en pleine mer. Athéna, ma chère ancienne alliance et ma meilleure amie, ne se tient plus à mon côté. Neptune, le puissant dieu de la mer, n’engloutit que la flotte des Grecs avec les vagues plus haut que le ciel, jamais a-t-il m’aider à balayer les pécheurs. Au contraire, tout le monde est du côté de Vénus, et ils aident tous le pays affreux de Troie. Pourquoi est-ce qu’il n'y a pas de dieu fort et utile autour de moi pour me venger, moi, la maîtresse des dieux? Comment je suis passé d'une reine honorable et respectable à une déesse sans alliance ? Suis-je la seule qui ose aller contre Jupiter et qui peut punir ces mortels qui le méritent ?\n\nTout a commencé lors du festin des dieux lors des noces de Pelée et Thétis, une pomme d’or comme un prix de beauté « à la plus belle » des déesses de l’Olympe. C’est forcément à cause de Vénus qui a dû ensorceler tous les dieux comme ses tours habituels, séduire les hommes par la beauté et les conquérir par les larmes. Elle doit être très fière, un dieu mineur aussi humble peut vaincre la reine des dieux et Athéna, et occuper un titre qui lui n’appartient pas, la plus belle déesse du mont Olympe. “Vénus est une déesse plus belle que Junon”, les mortels et dieux ignorants placeront certainement un tel compliment sur Vénus, mais aucun d'entre eux précisera que Vénus a effectivement gagné en trichant après avoir entendu de tels éloges. Elle a promis d'utiliser le pouvoir divin pour faire tomber Hélène amoureuse de Pâris. Quelle promesse sale et irritante. Effectivement, c'était l'enfant de Jupiter, Vénus a hérité du mépris de son père pour le mariage sacré, son père ne m'a jamais été fidèle qui féconde tant de femmes adultères et impies et qui ont enfanté de ma honte. La beauté d'Hélène envoûte Pâris, qui est déjà marié. Vénus n’hésitait pas à se servir de cette saleté pour gagner la pomme d'or. Elle n'est pas digne d'une telle gloire, et je ne permettrai jamais que des éloges comme la plus belle des déesses circulent dans ce monde au nom de Vénus, aucun de ces mots ne puisse être prononcé par qui que ce soit ou par n'importe quel dieu.\n\nCe qui est encore plus abominable, c'est Hélène, qui est aussi la preuve de l'infidélité de Jupiter. Quand Jupiter s'est transformé en cygne pour séduire Léda, a-t-il jamais pensé que le cygne était un oiseau d'amour loyal ? Les deux parents sont obsédés par la sensation sexuelle, sans doute Hélène a également trahi son mariage et a quitté Ménélas, le roi vénérable de Sparte, et a suivi Pâris pour se cacher à Troie. Comme c'est ironique et honteux. Pourquoi toutes les femmes liées à Jupiter sont-elles si infidèles au mariage ? Ce monde ne respecte pas la déesse de mariage, comment puis-je permettre à de tels mortels de vivre? Non, je ne leur permettrai jamais de sous-estimer ma force et mon statut, et je leur ferai payer le prix.\n\nCe jugement a longtemps été injuste, comment pourrais-je faire honte à ma réputation à cause de la convoitise de Pâris. Sa promesse à Pâris était une insulte à mon dieu du mariage, remettre la pomme d'or à Vénus était une insulte à ma gloire et à ma beauté, et le fait que Pâris ait accepté un pot-de-vin pour emmener Hélène était une insulte à ma sainte protectrice grecque.\n\nPâris et Hélène ont été protégés par le royaume de Troie après avoir commis de tel crime. Leurs offenses envers moi ne peuvent être payées que du sang. Mais Enée est tout aussi hypocrite que sa mère, qui souhaitait résister au sort qu'était le sien et que les dieux ont décidé d'avance. Son évasion ne peut que montrer mon incompétence, et ce n'est qu'en tuant tous les Troyens que je pourrai calmer un peu de colère.\n\nMaintenant que l'Énée est sur le point d'atterrir en Italie, est-ce que je veux tolérer qu’il construise un puissant empire en Italie et détruiraient Carthage et régneraient sur le monde dans l’avenir? Mes temples et mes disciples sont à toute la Grèce, si je ne peux pas protéger la cité que j'aime et me battre pour la justice pour ceux qui croient en moi, qui voudra désormais adorer Junon, encenser ses autels, et lui offrir les vœux ? Si je lâche ces gens ignobles qui offensent ma gloire, il y aura forcément une seconde Vénus, un second Pâris pour m'offenser encore plus à l'avenir. Je ne permettrai jamais que cela se produise.\n\nJe protégerai mes croyants jusqu'au dernier moment où le destin annoncera sa fin, je n'hésiterai plus, j'empêcherai les descendants de Troie de débarquer sur la terre d'Italie, je détruirai la flotte Troyenne tout comme Athéna a détruit la flotte grecque. Dieu du vent et dieu de la mer, prends les ordres de votre reine, je veux des vagues plus hautes que le ciel détruisant toutes ces flottes, je veux des tempêtes déchirant leurs drapeaux en pièces, je veux des tourbillons engloutissant tous les Troyennes, Je veux du tonnerre déchiquetant le monde sombre et déraisonnable, je veux que la côte de l'Italie soit teinte en rouge du sang des Troyens! Voilà ma rage monstrueuse, c'est à ce prix que ta mère et toi offensez la reine, c'est la punition que vous méritez."],"zh":["我，萨图尔努斯之女、朱庇特的姊妹与妻子，奥林匹斯诸神之中最受尊崇的女神，一位号令群神的女王，一位足以撼动天地的女王，如今却遭到了特洛伊人的侮辱，因为维纳斯那个卑劣的后裔竟从我眼前逃走，要到意大利寻求庇护。在那艘驶向意大利的船上，他们难道没有嘲笑我吗？一个如鼠蚁般孱弱的凡人，竟敢逃避众神女王的惩罚。唯有残酷而冷峻的报复，才能平息我燃烧的仇恨。\n\n可是，我能阻挡命运的安排吗？倘若我继续阻挠他们，而他们却依照命运的旨意建立起强大的帝国，摧毁我深爱的迦太基，那么我的努力、愤怒与尊严，都将成为特洛伊人与诸神眼中的笑话。他们的荣耀，以我的悲痛和愤怒为食。我越是痛苦，如同万箭穿心；我的怒火越是炽烈，如同火山喷涌的熔岩，他们的逃脱就越显光荣，他们不可饶恕的罪行就越容易随着时间被遗忘，我的冤屈与所受的侮辱也越容易被忽略，直到最后，连他们对我的冒犯，都成了他们勇敢的证明。我绝不能让他们如愿。\n\n可还有谁站在我身后，让我守护这片不公的国度？朱庇特必定偏袒他的女儿维纳斯；那些得到众神之主庇佑的特洛伊人，包括维纳斯之子埃涅阿斯，我还能将他们彻底摧毁吗？雅典娜焚毁整支希腊舰队、只为惩罚那一个发狂的埃阿斯时，动用的不正是朱庇特的雷电吗？埃阿斯曾在战争中为我带来胜利与荣耀，却在那无情的女神面前，被海浪与从云端掷下的雷电击向礁石，粉身碎骨。天降的雷霆劈中船的残骸，我亲爱的希腊信众被恐惧吞没，溺死在茫茫大海。雅典娜，我亲爱的昔日盟友，我最好的朋友，也不再站在我这一边。强大的海神尼普顿，只会用高过苍天的巨浪吞没希腊人的舰队，却从不帮我扫荡那些罪人。恰恰相反，所有神都站在维纳斯那边，都去帮助那个可恶的特洛伊。为什么我的身边，竟没有一个强大而有用的神，来为我——众神的女主人——复仇？我怎么会从一位尊贵、受人敬仰的女王，变成一个孤立无援的女神？难道只有我敢违抗朱庇特，也只有我能惩罚这些罪有应得的凡人？\n\n这一切都始于珀琉斯与忒提斯婚礼上的诸神宴席：一枚金苹果，作为美貌的奖赏，要献给奥林匹斯“最美”的女神。这一定又是维纳斯的把戏；她必定照着惯常的伎俩蛊惑了诸神，以美色引诱男人，再以眼泪征服他们。她一定得意极了：这样一个卑微的次等神明，竟能击败众神女王和雅典娜，夺去根本不属于她的称号——奥林匹斯最美的女神。“维纳斯是比朱诺更美的女神”，无知的凡人与神一定会将这样的赞辞加在维纳斯身上，可在听到这些颂扬之后，又有谁会说清楚，她其实是靠作弊赢来的？她答应动用神力，让海伦爱上帕里斯。多么肮脏、多么令人愤怒的承诺！果然不愧是朱庇特的孩子，维纳斯继承了父亲对神圣婚姻的蔑视。她的父亲从未忠于我，使那么多淫乱而不敬神的女人受孕，让她们把我的耻辱生下来。海伦的美色蛊惑了早已成婚的帕里斯。为了赢得金苹果，维纳斯竟毫不犹豫地利用这种污秽。她不配拥有这样的荣耀，我绝不容许这世间再有“最美女神”这样的赞辞冠在维纳斯名下；无论凡人还是神，谁也不许说出一个这样的字眼。\n\n更加可憎的，是海伦——她同样是朱庇特不忠的证据。朱庇特化作天鹅引诱勒达时，可曾想过，天鹅原本是忠于爱情的鸟？父母都沉迷于情欲，海伦也果然背叛了婚姻，抛下值得尊敬的斯巴达国王墨涅拉俄斯，跟着帕里斯躲进特洛伊。多么讽刺，多么可耻！为什么所有与朱庇特有关的女人，都如此不忠于婚姻？这个世界既然不尊重婚姻女神，我又怎能容许这样的凡人活下去？不，我绝不会允许他们小看我的力量与地位，我要让他们付出代价。\n\n这场裁决早已失去公正，我怎能因为帕里斯的贪欲而让自己的声名蒙羞？她给帕里斯的承诺，是对我婚姻女神身份的侮辱；把金苹果交给维纳斯，是对我的荣耀与美貌的侮辱；而帕里斯收下贿赂、带走海伦，则是对我这位希腊神圣庇护者的侮辱。\n\n帕里斯与海伦犯下这样的罪行之后，竟还受到特洛伊王国的保护。他们对我的冒犯，唯有鲜血能够偿还。可埃涅阿斯与他母亲同样虚伪，妄图抗拒属于自己、早已由诸神定下的命运。他的逃脱只能证明我的无能，唯有杀尽特洛伊人，我才能稍稍平息怒火。\n\n如今埃涅阿斯即将抵达意大利，难道我要容忍他在那里建立强大的帝国，在未来摧毁迦太基、统治世界吗？我的神庙与信众遍布希腊；倘若我不能保护自己钟爱的城邦，不能为信奉我的人争取公正，今后还有谁愿意崇拜朱诺，在她的祭坛上焚香，向她献上誓愿？如果我放过这些冒犯我荣耀的卑鄙之徒，将来必定还会有第二个维纳斯、第二个帕里斯，更加肆无忌惮地侮辱我。我绝不允许这样的事发生。\n\n我将保护我的信众，直到命运宣告终结的最后一刻。我不会再犹豫，我要阻止特洛伊的后裔踏上意大利的土地；我要摧毁特洛伊的舰队，就像雅典娜摧毁希腊舰队那样。风神，海神，听从你们女王的命令！我要高过苍天的巨浪，将这些舰队尽数摧毁；我要狂风暴雨，把他们的旗帜撕成碎片；我要旋涡，吞没所有特洛伊人；我要雷霆，劈碎这个黑暗而无理的世界；我要意大利的海岸，被特洛伊人的鲜血染红！这就是我滔天的愤怒，这就是你和你母亲冒犯女王所要付出的代价，这就是你们应得的惩罚。"],"en":["I, dau
