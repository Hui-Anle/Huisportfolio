<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FDFBF7">
<title>作品 · Huihui ZHU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>

:root { color-scheme:light; --paper:#FDFBF7; --ink:#1A1A1A; --green:#4A5D4E; --muted:#7B8277; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Songti SC",SimSun,Georgia,serif; }
a { color:inherit; text-decoration:none; }
a:focus-visible { outline:1px solid var(--green); outline-offset:8px; }
.background { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.background video { display:block; width:100vw; height:100vh; height:100svh; object-fit:cover; opacity:0; transition:opacity 220ms ease; }
.background video.is-visible { opacity:1; }
.background::after { content:""; position:absolute; inset:0; background:rgb(253 251 247 / .24); }
main { position:relative; z-index:1; display:grid; min-height:100svh; }
.entrance { min-height:100svh; position:relative; display:grid; place-items:center; padding:110px 24px; }
.masthead { position:absolute; top:35px; left:4.5vw; z-index:2; }
.signature { display:flex; align-items:center; gap:15px; }
.seal { width:31px; height:35px; border:1px solid #986152; color:#986152; display:grid; place-items:center; font:20px "Songti SC",SimSun,serif; transform:rotate(-4deg); }
.eyebrow { font:10px/1.7 Arial,sans-serif; letter-spacing:.2em; text-transform:uppercase; }
.categories { display:flex; flex-direction:column; align-items:center; gap:clamp(24px,4svh,48px); }
.category { display:flex; flex-direction:column; align-items:center; text-align:center; }
.category-word { display:block; font-family:"Ma Shan Zheng","KaiTi","STKaiti","Kaiti SC",serif; font-size:clamp(56px,min(7vw,12svh),116px); line-height:1.12; font-weight:400; letter-spacing:.12em; text-indent:.12em; transition:transform 800ms cubic-bezier(.2,.7,.2,1); }
.category:hover .category-word,.category:focus-visible .category-word { transform:scale(1.05); }
.category-translation { margin-top:12px; font:10px/1.5 Georgia,"Times New Roman",serif; letter-spacing:.1em; color:var(--muted); }

.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
@media(max-width:700px) { .masthead { top:24px; left:7vw; } .category-word { font-size:clamp(56px,12vw,85px); } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
#soft-transition { position:fixed; inset:0; z-index:99999; pointer-events:none; opacity:0; background:rgba(255,255,255,.18); filter:blur(20px); transition:opacity .6s ease-in-out,filter .6s ease-in-out; }
</style>
</head>
<body>
<div class="background" aria-hidden="true"><video id="bg-video" muted loop playsinline preload="none" tabindex="-1" disablepictureinpicture></video></div>
  <header class="masthead"><a class="signature" href="index.html" aria-label="Huihui ZHU 首页"><span class="seal" aria-hidden="true">朱</span><span class="eyebrow">Huihui ZHU<br>Words & Worlds</span></a></header>
<main>
<section class="entrance view" id="entrance" aria-label="作品分类入口">
  <h1 class="sr-only">作品分类</h1>
  <nav class="categories" aria-label="作品分类">
    <a class="category" data-category="creation" href="work-detail.html?category=creation"><span class="category-word">创作</span><span class="category-translation"><span lang="en">Creation</span> / <span lang="fr">Création</span></span></a>
    <a class="category" data-category="reflection" href="work-detail.html?category=reflection"><span class="category-word">观照</span><span class="category-translation"><span lang="en">Reflection</span> / <span lang="fr">Réflexion</span></span></a>
    <a class="category" data-category="theory" href="work-detail.html?category=theory"><span class="category-word">文论</span><span class="category-translation"><span lang="en">Literary Theory</span> / <span lang="fr">Théorie littéraire</span></span></a>
  </nav>
</section>
</main>
<div id="soft-transition" aria-hidden="true"></div>
<script>
(() => {
  const paths = { creation:'videos/shorttravel.mp4', reflection:'videos/guanzhao.mp4', theory:'videos/thesis.mp4' };
  const video = document.getElementById('bg-video');
  let active = null, request = 0;
  function stop() {
    active = null;
    request++;
    video.pause();
    video.classList.remove('is-visible');
  }
  function play(link) {
    if (active === link || document.hidden) return;
    active = link;
    const ticket = ++request;
    const path = paths[link.dataset.category];
    video.pause();
    video.classList.remove('is-visible');
    video.muted = true;
    // Set src and call play synchronously in mouseenter; never wait for timers.
    if (video.getAttribute('src') !== path) video.src = path;
    video.playbackRate = link.dataset.category === 'theory' ? 0.5 : 1;
    const playback = video.play();
    if (playback) playback.then(() => {
      if (request === ticket && active === link) video.classList.add('is-visible');
    }).catch(() => { if (request === ticket) stop(); });
  }
  video.addEventListener('playing', () => {
    if (!active || document.hidden) { video.pause(); return; }
    video.classList.add('is-visible');
  });
  video.addEventListener('error', stop);
  document.querySelectorAll('.category').forEach(link => {
    link.addEventListener('mouseenter', () => play(link));
    link.addEventListener('mouseleave', () => { if (active === link) stop(); });
    link.addEventListener('focus', () => { if (link.matches(':focus-visible')) play(link); });
    link.addEventListener('blur', () => { if (active === link) stop(); });
    link.addEventListener('click', stop);
  });
  window.addEventListener('blur', stop);
  window.addEventListener('pagehide', stop);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
})();
</script>
<script>
  (() => {
    const overlay=document.getElementById('soft-transition');
    if(sessionStorage.getItem('softTransition')!=='active'){overlay.style.display='none';return;}
    sessionStorage.removeItem('softTransition');
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){overlay.style.display='none';return;}
    overlay.style.opacity='1';
    requestAnimationFrame(()=>{overlay.style.opacity='0';overlay.style.filter='blur(0)';});
    setTimeout(()=>{overlay.style.display='none';},620);
  })();
</script>
</body>
</html>
