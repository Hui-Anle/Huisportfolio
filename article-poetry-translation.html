}</style></head><body><header class="masthead"><a class="signature" href="index.html" aria-label="回到首页"><span class="seal">朱</span><span class="eyebrow">Huihui ZHU<br>Words &amp; Worlds</span></a><nav class="nav"><a href="index.html">首页</a><a href="work-detail.html?category=theory">作品</a></nav></header><main><section class="category-hero poetry-translation-hero" aria-labelledby="poetry-category-title"><video class="poetry-translation-hero-video" src="videos/fireflower.mp4" autoplay muted loop playsinline preload="auto" aria-label="诗歌翻译封面视频"></video><div class="poetry-translation-hero-overlay"></div><div class="poetry-translation-hero-copy"><h1 id="poetry-category-title">诗歌翻译</h1><div class="translations"><span class="fr">Traduction poétique</span><span>Poetry Translation</span></div></div></section><div class="toolbar" id="toolbar"><button class="toc-open" id="toc-open" type="button">目录 / Contents / Sommaire</button><button data-mode="triad" class="active" type="button">三语对照</button><button data-mode="fr" type="button">FR</button><button data-mode="zh" type="button">中文</button><button data-mode="en" type="button">EN</button></div><div class="reading" id="reading"></div></main><div class="toc-backdrop" id="toc-backdrop"></div><aside class="toc-drawer" id="toc-drawer" aria-hidden="true"><button class="toc-close" id="toc-close" type="button" aria-label="关闭目录">×</button><h2>目录 / Contents / Sommaire</h2><nav class="toc-list" id="toc-list"></nav></aside><a class="return" href="work-detail.html?category=theory" style="position:fixed;right:24px;bottom:22px;z-index:30;color:var(--green);font-size:11px;text-decoration:none">← 返回作品集 Back</a><script>const POETRY_DATA={"works":[{"id":"poetry-xiang","title":{"fr":"Les mots n’épuisent pas le sens : le xiang 象 et la pensée chinoise de la traduction","zh":"言不尽意：“象”与中国翻译思想","en":"Words Do Not Exhaust Meaning: Xiang 象 and Chinese Thought on Translation"},"meta":["Huihui ZHU","Extrait révisé et développé d’un mémoire de master · 2023–2024 · Jean-Yves Masson"],"sections":[{"id":"xiang-introduction","title":{"fr":"Introduction — Les formes de la pensée traductive","zh":"引言：翻译思想如何表达自身","en":"Introduction — How Translation Thought Takes Form"},"units":[{"title":{"fr":"Introduction — Les formes de la pensée traductive","zh":"引言：翻译思想如何表达自身","en":"Introduction — How Translation Thought Takes Form"},"paragraphs":{"fr":["La lecture d’*An Anthology of Chinese Discourse on Translation* de Martha P. Y. Cheung a profondément éclairé mes recherches. Bien que ce volume soit principalement consacré aux discours qui précèdent et accompagnent la traduction des textes bouddhiques, il s’ouvre sur des conceptions du langage, du style et du sens qui ne constituent pas, à l’origine, des théories de la traduction. Ce déplacement est décisif : pour comprendre comment les lettrés chinois ont pensé la traduction, il faut aussi examiner ce qu’ils attendaient des mots, ce qu’ils reconnaissaient aux images et les qualités morales qu’ils associaient à l’écriture.\n\nCheung formule précisément ce rapport : les auteurs anciens traitaient rarement directement de traduction, mais leurs réflexions sur la relation entre langage et idées ont servi de point de départ aux réflexions ultérieures ; les vertus qu’ils exaltaient sont également devenues des valeurs cultivées par les traducteurs. Elle souligne aussi l’usage des citations des sages pour justifier des méthodes de traduction.<sup><a id=\"xiang-fr-ref-1-1\" href=\"#xiang-fr-note-1\" role=\"doc-noteref\">1</a></sup> L’héritage ne se réduit donc pas à la persistance de quelques mots : il concerne les manières de poser un problème et de donner autorité à une réponse.\n\nJe défends ici l’idée que l’attention portée à *yì* 意 et à *xiàng* 象 permet de comprendre une partie des formes prises par la pensée chinoise de la traduction. Une pensée qui procède par images, rapprochements et reprises de paroles anciennes ne manque pas nécessairement de rigueur : elle peut condenser dans un terme tout un réseau d’expériences et de jugements. Encore faut-il déplier ce réseau, plutôt que traiter ses expressions comme des intuitions vagues ou comme les équivalents imparfaits de catégories déjà établies ailleurs.\n\nL’examen suivra le mouvement de cette question : de la limite des mots à la puissance de l’image ; de l’idéal moral et esthétique de l’écriture aux décisions des traducteurs de sūtras ; puis de ces usages aux critères de Yan Fu. Les rapprochements philosophiques et les reprises textuellement attestées ne seront pas confondus. C’est leur articulation qui peut donner à l’hypothèse sa force."],"zh":["Martha P. Y. Cheung 的 *An Anthology of Chinese Discourse on Translation*（《中国翻译话语选集》）深深启发了我的研究。这一卷主要讨论佛经翻译之前及伴随这一实践而出现的话语，却以语言、文体和意义的观念作为起点；这些观念原本并不是翻译理论。这样的起点十分关键：要理解中国文人如何思考翻译，也应当考察他们期待言辞承担什么，承认“象”具有什么作用，以及他们赋予书写怎样的道德品质。\n\nCheung 明确说明了这种关系：古代作者很少直接讨论翻译，但他们对语言与思想关系的思考，为后来的翻译论述提供了出发点；他们推崇的德性，也成为译者所珍视的价值。她还指出，译者会引用圣贤言论，为自己的翻译方法赋予依据。<sup><a id=\"xiang-zh-ref-1-1\" href=\"#xiang-zh-note-1\" role=\"doc-noteref\">1</a></sup> 因而，这种思想遗产并不只是几个词语的延续，还涉及提出问题、确立回答之权威的方式。\n\n本文主张，对“意”与“象”的重视，有助于理解中国翻译思想的部分表达形式。借助意象、类比和古语的反复征引展开的思考，并不必然缺少严谨性：一个词语之中，可以凝聚一整套经验与判断。我们需要展开这一网络，而不应把这些表达看作模糊的直觉，或视为其他文化中既定范畴的不完善对应物。\n\n下文将沿着这一问题展开：从言辞的限度到“象”的力量，从书写的道德与审美理想到佛经译者的具体选择，再到严复的翻译准则。我会区分哲学上的相互参照与文本能够直接证明的征引关系。正是二者的衔接，能够使这一论点获得力量。"],"en":["Reading Martha P. Y. Cheung’s *An Anthology of Chinese Discourse on Translation* has profoundly informed my research. Although this volume chiefly addresses discourses preceding and accompanying the translation of Buddhist texts, it opens with conceptions of language, style and meaning that were not originally theories of translation. This shift is decisive: to understand how Chinese scholars thought about translation, we must also examine what they expected words to accomplish, what powers they attributed to images, and what moral qualities they associated with writing.\n\nCheung states this relationship explicitly: ancient writers rarely discussed translation directly, but their reflections on the relationship between language and ideas provided a starting point for later thinking about translation; the virtues they praised also became values cultivated by translators. She further emphasises the use of quotations from the sages to justify translation methods.<sup><a id=\"xiang-en-ref-1-1\" href=\"#xiang-en-note-1\" role=\"doc-noteref\">1</a></sup> The inheritance therefore involves more than the survival of certain words: it concerns ways of framing a problem and lending authority to an answer.\n\nI argue that the attention given to *yi* 意 and *xiang* 象 helps explain some of the forms assumed by Chinese thinking about translation. Thought that proceeds through images, comparisons and repeated appeals to earlier sayings does not necessarily lack rigour: a single term may condense a whole network of experiences and judgements. That network needs to be unfolded, rather than its expressions dismissed as vague intuitions or imperfect equivalents of categories already established elsewhere.\n\nThe discussion follows the movement of this question: from the limits of words to the power of images; from the moral and aesthetic ideals of writing to the decisions of sūtra translators; and from these practices to Yan Fu’s criteria. Philosophical comparisons will be distinguished from borrowings directly attested in texts. Their articulation is what can give the argument its force."]}}]},{"id":"xiang-i","title":{"fr":"I. Les mots, les images et ce qui leur échappe","zh":"一、言辞、象与表达之外","en":"I. Words, Images and What Exceeds Them"},"units":[{"title":{"fr":"I. Les mots, les images et ce qui leur échappe","zh":"一、言辞、象与表达之外","en":"I. Words, Images and What Exceeds Them"},"paragraphs":{"fr":["Laozi, les textes de la tradition confucéenne et le *Zhuangzi* n’énoncent pas une doctrine unique du langage. Leur mise en regard fait pourtant apparaître une question commune : quel rapport entretenir avec les formes qui nous permettent de comprendre, lorsque ces formes ne se confondent pas avec ce qu’elles donnent à saisir ?"],"zh":["老子、儒家传统中的文本与《庄子》，并未提出同一套语言学说。但将它们相互参照，可以看到一个共同的问题：当帮助我们理解的形式，并不等于它所使我们把握的对象时，我们应当如何对待这些形式？"],"en":["Laozi, texts belonging to the Confucian tradition, and the *Zhuangzi* do not articulate a single doctrine of language. Read alongside one another, however, they raise a shared question: how should we relate to the forms that enable understanding when those forms are not identical with what they allow us to grasp?"]}},{"title":{"fr":"1. Le Dao énoncé et la limite du nom","zh":"1. 可道之道与命名的限度","en":"1. The Dao That Can Be Spoken and the Limits of Naming"},"paragraphs":{"fr":["L’ouverture du *Daodejing* donne à cette difficulté une formulation particulièrement dense :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"dao\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">道可道，非常道；名可名，非常名。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>La Voie qui peut être énoncée n’est pas la Voie constante ; le nom qui peut être nommé n’est pas le nom constant.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-2-1\" href=\"#xiang-fr-note-2\" role=\"doc-noteref\">2</a></sup> Le même caractère 道 intervient comme nom — la Voie — et comme verbe — énoncer ou dire. La phrase met ainsi en jeu, dans sa propre construction, l’écart entre ce dont on parle et l’acte de le formuler. Le nom rend possible la désignation ; il ne garantit pas que ce qui est désigné soit épuisé par lui. Ce n’est donc pas parce qu’une chose reçoit un nom qu’elle perdrait sa réalité : c’est la prétention de l’appellation à coïncider intégralement avec son objet qui est mise en question.\n\nDans mon mémoire, j’insistais sur le caractère inclusif du Dao : la nature, l’humanité, la société, le matériel comme l’immatériel, le visible comme l’invisible. Ce qui m’intéresse dans cette amplitude, c’est l’écart entre l’ouverture d’un tel concept et la délimitation opérée par chaque formulation. Dire n’est pas inutile ; mais dire n’est pas posséder intégralement ce dont on parle.\n\nJ’y vois un point de départ pour penser la traduction. Si l’expression originale ne doit pas être confondue avec une présence totale et immobile du sens, le problème ne consiste plus seulement à transporter une substance intacte d’une série de mots à une autre. Il concerne aussi la manière dont chaque expression fait accéder à quelque chose qu’elle ne clôt pas. Ce passage de Laozi à la traduction est ici mon rapprochement interprétatif ; les préfaces de traduction examinées plus loin permettront de voir comment les traducteurs eux-mêmes mobilisent les paroles anciennes."],"zh":["《道德经》的开篇，以极为凝练的语言表达了这一困难：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"dao\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">道可道，非常道；名可名，非常名。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-2-1\" href=\"#xiang-zh-note-2\" role=\"doc-noteref\">2</a></sup> 同一个“道”字，既作为名词——“道”，也作为动词——言说、表述。句子在自身的构造之中，呈现了被言说之物与言说行为之间的距离。名称使指称成为可能，却不保证被指称的对象已被它穷尽。因此，并不是事物一经命名就失去其真实性；受到质疑的，是名称能够与对象完全重合的要求。\n\n在硕士论文中，我强调了“道”的包容性：自然、人类、社会，物质与非物质，可见与不可见。我所关注的，是这一概念的开放幅度与每次表述所作的限定之间的距离。言说并非无用，但言说不等于完整地占有所言说之物。\n\n我由此看到了思考翻译的一个起点。如果原来的表达本身就不等于意义完整而静止的在场，那么问题就不只是把一个完好的实体，从一组词语搬运到另一组词语之中。我们还需要考察，每一种表达怎样使人接近某种未被它封闭的意义。从老子转向翻译，是我在此提出的解释性关联；下文的译序，则将呈现译者本人如何运用古人的言辞。"],"en":["The opening of the *Daodejing* formulates this difficulty with particular density:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"dao\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">道可道，非常道；名可名，非常名。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>The Way that can be spoken is not the constant Way; the name that can be named is not the constant name.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-2-1\" href=\"#xiang-en-note-2\" role=\"doc-noteref\">2</a></sup> The character 道 functions both as a noun—the Way—and as a verb—to articulate or speak. In its very construction, the sentence thus stages the distance between what is spoken of and the act of formulating it. A name makes designation possible; it does not guarantee that what it designates is exhausted by it. Naming a thing does not make that thing lose its reality. What is questioned is the claim that a designation can coincide completely with its object.\n\nIn my thesis, I stressed the inclusive scope of Dao: nature, humanity, society, the material and the immaterial, the visible and the invisible. What interests me in this breadth is the distance between such conceptual openness and the delimitation performed by each formulation. Speaking is not useless; but speaking is not complete possession of what one speaks about.\n\nI see here a starting point for thinking about translation. If the original expression is not itself the total and unchanging presence of meaning, the problem is no longer simply to carry an intact substance from one set of words into another. It also concerns how each expression gives access to something it does not bring to a close. The movement from Laozi to translation is my interpretive comparison here; the translation prefaces discussed below will show how translators themselves invoke earlier sayings."]}},{"title":{"fr":"2. « Les paroles n’épuisent pas le sens » : la réponse par le xiang","zh":"2. “言不尽意”：以“象”回应表达的限度","en":"2. “Words Do Not Exhaust Meaning”: The Response of Xiang"},"paragraphs":{"fr":["Le *Xici*, commentaire transmis avec le *Zhouyi*, place sous l’autorité du Maître une interrogation que l’on ne saurait réduire à une simple condamnation des mots :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"xici\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">子曰：“书不尽言，言不尽意。”然则圣人之意，其不可见乎？子曰：“圣人立象以尽意，设卦以尽情伪，系辞以尽其言……”</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Le Maître dit : « Les écrits n’épuisent pas les paroles ; les paroles n’épuisent pas le sens. » Le sens des sages serait-il donc inaccessible ? Le Maître dit : « Les sages établissent des images pour exprimer pleinement leur sens ; ils disposent les hexagrammes pour rendre compte des situations véritables et trompeuses ; ils y attachent des paroles pour déployer pleinement ce qu’ils ont à dire… »</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-3-1\" href=\"#xiang-fr-note-3\" role=\"doc-noteref\">3</a></sup> Le texte constate une insuffisance, puis demande comment la pensée des sages peut malgré tout devenir accessible. La réponse ne consiste pas à renoncer à la transmission : les sages établissent des *xiang*. L’« image » intervient précisément là où la seule continuité des mots paraît insuffisante.\n\nIl faut entendre ici davantage qu’une illustration. Comme le rappelle Cheung, *xiang* désigne notamment les figures de traits — trigrammes et hexagrammes — ainsi que les images évoquées par les énoncés explicatifs. Une figure rend saisissables des rapports et des transformations ; elle ne se contente pas de reproduire l’apparence isolée d’une chose. L’image peut donc constituer un mode d’intelligibilité.\n\nLa tension entre « 言不尽意 » et « 立象以尽意 » m’intéresse tout particulièrement. Le même verbe 尽 articule la limite reconnue aux paroles et l’ambition confiée aux images. Cette tension ne prouve pas que toute image restituerait miraculeusement la totalité du sens. Elle fait apparaître une recherche de médiations : ce qui échappe à une forme d’expression appelle le déploiement d’une autre. Le passage poursuit d’ailleurs son mouvement par l’établissement des hexagrammes et l’adjonction des paroles explicatives. L’image n’abolit pas la parole ; elle reconfigure son travail.\n\nDans la perspective qui est la mienne, le *xiang* devient ainsi un pont : une forme sensible ou symbolique permettant d’approcher un ensemble de significations sans en fournir l’inventaire exhaustif. C’est cette possibilité d’une saisie du tout à travers une forme limitée que je voudrais retenir pour la lecture et la traduction littéraires."],"zh":["随《周易》传世的《系辞》，借“子曰”提出了一个不能简单归结为否定言辞的问题：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"xici\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">子曰：“书不尽言，言不尽意。”然则圣人之意，其不可见乎？子曰：“圣人立象以尽意，设卦以尽情伪，系辞以尽其言……”</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-3-1\" href=\"#xiang-zh-note-3\" role=\"doc-noteref\">3</a></sup> 文本先指出表达的不足，继而追问：圣人之意如何仍能为人所见？回答并不是放弃传达，而是圣人“立象”。正是在仅凭言辞似乎不能充分表达之处，“象”介入了。\n\n这里的“象”，不能只理解为一幅插图。正如 Cheung 所说明的，它既包括卦爻的线条结构，也包括解释性言辞所唤起的形象。一个象，可以使关系与变化获得可把握的形式，而不只是再现某一事物孤立的外观。因此，象本身可以构成一种理解方式。\n\n“言不尽意”与“立象以尽意”之间的张力尤其吸引我。同一个“尽”字，连接了言辞受到承认的限度与“象”被赋予的表达抱负。这并不证明任何形象都能奇迹般地还原全部意义；它呈现的是对中介形式的探索：一种表达未能抵达的地方，需要另一种形式参与。原文随后还谈到设卦与系辞。象并未废除言，而是重新组织了言的作用。\n\n在我的理解中，“象”由此成为一座桥：通过可感或象征性的形式，使人接近一组意义，而不必将其逐项穷尽。由有限形式把握整体的这一可能性，正是我希望带入文学阅读与翻译讨论的部分。"],"en":["The *Xici*, a commentary transmitted with the *Zhouyi*, presents under the Master’s authority a question that cannot be reduced to a simple rejection of words:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"xici\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">子曰：“书不尽言，言不尽意。”然则圣人之意，其不可见乎？子曰：“圣人立象以尽意，设卦以尽情伪，系辞以尽其言……”</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>The Master said: “Writing does not exhaust words; words do not exhaust meaning.” Can the sages’ meaning, then, not be apprehended? The Master said: “The sages establish images to give full expression to meaning, arrange hexagrams to encompass what is genuine and deceptive, and attach statements to give full expression to what they have to say…”</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-3-1\" href=\"#xiang-en-note-3\" role=\"doc-noteref\">3</a></sup> The text first acknowledges an inadequacy, then asks how the sages’ thought can nevertheless become accessible. Its answer is not to abandon transmission: the sages establish *xiang*. The image intervenes precisely where words alone appear insufficient.\n\nMore than an illustration is at stake. As Cheung explains, *xiang* includes figures composed of lines—trigrams and hexagrams—as well as images evoked by explanatory statements. A figure makes relationships and transformations apprehensible; it does not merely reproduce the isolated appearance of a thing. The image can therefore constitute a mode of intelligibility.\n\nI am particularly interested in the tension between “言不尽意” and “立象以尽意”. The same verb, 尽, links the limit acknowledged in words to the ambition entrusted to images. This tension does not establish that every image miraculously restores the totality of meaning. It reveals a search for mediating forms: what one mode of expression cannot reach calls for another. The passage continues, moreover, with the establishment of hexagrams and the addition of explanatory words. The image does not abolish language; it reconfigures its work.\n\nIn the perspective I propose, *xiang* thus becomes a bridge: a perceptible or symbolic form that allows us to approach a configuration of meanings without producing an exhaustive inventory. It is this possibility of apprehending a whole through a limited form that I wish to bring to literary reading and translation."]}},{"title":{"fr":"3. Zhuangzi : obtenir le sens, oublier les paroles","zh":"3. 庄子：得意而忘言","en":"3. Zhuangzi: Grasping Meaning, Forgetting Words"},"paragraphs":{"fr":["Le chapitre « Waiwu » du *Zhuangzi* déplace encore le problème en le formulant par une double comparaison :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"zhuangzi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">荃者所以在鱼，得鱼而忘荃；蹄者所以在兔，得兔而忘蹄；言者所以在意，得意而忘言。吾安得夫忘言之人而与之言哉！</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>La nasse sert à prendre le poisson ; une fois le poisson obtenu, on oublie la nasse. Le piège sert à prendre le lièvre ; une fois le lièvre obtenu, on oublie le piège. Les paroles servent à saisir le sens ; une fois le sens obtenu, on oublie les paroles. Où trouverai-je donc quelqu’un qui ait oublié les paroles, pour parler avec lui ?</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-4-1\" href=\"#xiang-fr-note-4\" role=\"doc-noteref\">4</a></sup> Le poisson, le lièvre et le sens ne sont pas substituables ; les trois relations sont pourtant disposées selon une même structure. Le dispositif qui permet d’atteindre quelque chose ne constitue pas lui-même la fin de l’opération. L’efficacité du langage se mesure alors à ce qu’il permet de saisir, et non à l’attachement perpétuel à ses formulations.\n\nMais « oublier les paroles » ne signifie pas que l’on puisse se dispenser d’elles avant d’avoir compris. La formule place l’obtention avant l’oubli. Surtout, le passage se termine par le désir de parler avec celui qui a oublié les paroles : la sortie de l’attachement au langage se dit encore comme une possibilité de dialogue. La pensée travaille donc sa propre tension, plutôt qu’elle ne proclame un silence définitif.\n\nCe détour permet de préciser ma lecture du *xiang*. La nasse et le piège sont eux-mêmes des images grâce auxquelles le texte rend intelligible un rapport abstrait entre expression et compréhension. La comparaison ne vient pas décorer une idée déjà entièrement formulée ailleurs : elle accomplit une part de l’argumentation.\n\nPour la traduction, l’enjeu est considérable. Le refus de confondre mots et sens rend pensable un changement de formulation ; il ne donne pas pour autant licence à une réécriture arbitraire. Dans un poème, le rythme, les sons et l’agencement verbal peuvent participer de ce que le lecteur doit précisément saisir. La question reste donc ouverte : de quelles formes peut-on se détacher, et lesquelles font partie de ce que l’on cherche à transmettre ?"],"zh":["《庄子·外物》通过两层比喻，又将问题推进了一步：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"zhuangzi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">荃者所以在鱼，得鱼而忘荃；蹄者所以在兔，得兔而忘蹄；言者所以在意，得意而忘言。吾安得夫忘言之人而与之言哉！</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-4-1\" href=\"#xiang-zh-note-4\" role=\"doc-noteref\">4</a></sup> 鱼、兔与意并不相同，但三组关系被放进了同一种结构：帮助人抵达某物的工具，并不就是这一行动的目的。语言的效力，由它使人把握到什么来衡量，而不在于人是否始终固守它的字句。\n\n然而，“忘言”并不意味着尚未理解，便可以先行弃置言辞。这句话将“得”放在“忘”之前。更值得注意的是，段落最后仍希望找到一个忘言之人，与之交谈：摆脱对言辞的执着，仍被表达为对话的可能。思考由此展开了自身的张力，而不是宣布一种永久的沉默。\n\n这一转折，也使我对“象”的理解更为清楚。筌与蹄，本身就是文本用来说明表达与理解之抽象关系的形象。比喻并非装饰一个已经在别处完整说出的观点；它本身承担了部分论证。\n\n这一点对于翻译尤为重要。拒绝将言与意混同，使改变表达成为可以思考的事，却不等于任意改写的许可。对于诗歌，节奏、声音和语言的组织，本身可能就参与了读者需要把握的意义。因此，问题仍然存在：哪些形式可以摆脱，哪些形式恰恰就是我们试图传达之物的一部分？"],"en":["The “Waiwu” chapter of the *Zhuangzi* shifts the problem again through a double comparison:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"zhuangzi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">荃者所以在鱼，得鱼而忘荃；蹄者所以在兔，得兔而忘蹄；言者所以在意，得意而忘言。吾安得夫忘言之人而与之言哉！</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>The fish trap is for catching fish; once the fish is caught, the trap is forgotten. The snare is for catching a hare; once the hare is caught, the snare is forgotten. Words are for grasping meaning; once meaning is grasped, words are forgotten. Where can I find someone who has forgotten words, so that I may speak with them?</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-4-1\" href=\"#xiang-en-note-4\" role=\"doc-noteref\">4</a></sup> Fish, rabbits and meaning are not interchangeable, yet the three relationships share a structure: the device that enables something to be reached is not itself the operation’s end. The efficacy of language is measured by what it allows us to grasp, rather than by perpetual attachment to its formulations.\n\nYet “forgetting words” does not mean that we can dispense with them before understanding. The formulation places attainment before forgetting. More strikingly, the passage ends with the wish to speak with someone who has forgotten words: release from attachment to language is still expressed as the possibility of dialogue. Thought works through its own tension rather than proclaiming definitive silence.\n\nThis detour also clarifies my reading of *xiang*. The fish trap and the snare are themselves images through which the text makes an abstract relationship between expression and understanding intelligible. The comparison does not decorate an idea already fully formulated elsewhere: it performs part of the argument.\n\nThe implications for translation are considerable. Refusing to identify words with meaning makes a change of formulation conceivable; it does not license arbitrary rewriting. In poetry, rhythm, sound and verbal arrangement may themselves participate in what the reader needs to grasp. The question therefore remains: which forms can be left behind, and which belong to what we are trying to transmit?"]}}]},{"id":"xiang-ii","title":{"fr":"II. Le xiang : une intuition du tout sans prétendre à la totalité","zh":"二、“象”：把握整体，而不自称穷尽整体","en":"II. Xiang: An Intuition of the Whole Without Claiming Totality"},"units":[{"title":{"fr":"II. Le xiang : une intuition du tout sans prétendre à la totalité","zh":"二、“象”：把握整体，而不自称穷尽整体","en":"II. Xiang: An Intuition of the Whole Without Claiming Totality"},"paragraphs":{"fr":["C’est précisément dans ce contexte — où les mots glissent, les contextes se déplacent, les significations se multiplient — que le *xiang* dévoile, à mes yeux, sa sagesse spécifique : il ne renonce pas à comprendre, mais reconnaît l’impossibilité d’épuiser le sens ; il incarne une forme d’appréhension relative mais respectueuse, capable d’atteindre une intuition du tout sans prétendre à la totalité."],"zh":["恰恰在这样的情境中——词语游移，语境变动，意义不断增殖——“象”在我看来显露出它独有的智慧：它并不放弃理解，而是承认意义无法被穷尽；它体现了一种有限却尊重对象的把握方式，能够接近对整体的领会，却不宣称自己已经占有全部。"],"en":["It is precisely in this context—where words shift, contexts move and meanings multiply—that *xiang*, to my mind, reveals its distinctive wisdom: it does not abandon understanding, but recognises the impossibility of exhausting meaning. It embodies an apprehension that is relative yet respectful, capable of an intuition of the whole without laying claim to totality."]}},{"title":{"fr":"1. Une densité sémantique, non un équivalent unique","zh":"1. 语义的密度，而非唯一的对应词","en":"1. Semantic Density Rather Than a Single Equivalent"},"paragraphs":{"fr":["Traduire systématiquement 象 par « image » rendrait le texte plus uniforme, mais pourrait masquer la diversité de ses emplois. Le mot français peut évoquer une représentation visuelle, une image mentale ou une figure de style ; il ne restitue pas à lui seul les relations construites par chaque occurrence chinoise.\n\nJe proposais dans mon mémoire de mettre en regard plusieurs expressions : « 大象无形 », que je rendais par « Le grand symbole est sans forme » ; 现象, « phénomène » ; 意象, « image mentale » ou « imagerie » ; 异象, « phénomène inhabituel » ou, selon le contexte, « présage » ; 表象, « représentation » ou « apparence ».<sup><a id=\"xiang-fr-ref-5-1\" href=\"#xiang-fr-note-5\" role=\"doc-noteref\">5</a></sup> Ce rapprochement fait entendre une amplitude sémantique : ce qui se manifeste, ce qui est représenté, ce qui est imaginé et ce qui fait signe.\n\nCes expressions n’appartiennent toutefois ni toutes à la même époque ni au même domaine. Je les considère comme un parcours d’usages qui fait ressortir un problème de traduction, non comme la preuve étymologique d’un sens ancien unique. On ne peut pas reconstituer le *xiang* du *Zhouyi* par la simple addition des significations de mots modernes. Mais leur comparaison montre pourquoi choisir un équivalent demande chaque fois de préciser le rapport entre perception, figuration et pensée.\n\nÀ mon avis, *xiang* possède une richesse qui englobe des phénomènes sensibles, cognitifs et symboliques. Il condense des idées, des impressions, des structures d’expérience qui ne peuvent être réduites à un sens unique, et laisse place à une multiplicité d’interprétations selon les lecteurs et les contextes. Cette richesse rejoint l’observation de Cheung : certains termes acquièrent, par la répétition de leurs usages, une texture particulière et une densité conceptuelle, même lorsqu’ils ne sont pas accompagnés d’une définition formelle.<sup><a id=\"xiang-fr-ref-6-1\" href=\"#xiang-fr-note-6\" role=\"doc-noteref\">6</a></sup>\n\nIl faut enfin distinguer 象, étudié ici, de 相, qui intervient notamment dans le vocabulaire bouddhique. Leur proximité phonétique en mandarin ne permet ni de les confondre ni de déduire une filiation conceptuelle de cette seule proximité."],"zh":["始终把“象”翻译为 *image*，固然可以使法文用词统一，却可能遮蔽它在不同位置的含义。法语中的 *image* 可以指视觉形象、心象或修辞形象，但单凭这个词，并不能还原每一次中文使用所建立的关系。\n\n在论文中，我曾将几种表达放在一起考察：“大象无形”，我将其译为“伟大的象征没有形状”；“现象”，对应 *phénomène*；“意象”，对应“心象”或“意象组织”；“异象”，对应“异常现象”，也可以依语境理解为“征兆”；“表象”，对应“表征”或“外观”。<sup><a id=\"xiang-zh-ref-5-1\" href=\"#xiang-zh-note-5\" role=\"doc-noteref\">5</a></sup> 这样的并置，使一个语义范围显现出来：显现之物、被表现之物、被想象之物，以及作为征示的形象。\n\n不过，这些表达并不全都属于同一时代或同一领域。我将它们视为一条揭示翻译问题的用词线索，而不是某个统一古义的词源证明。不能简单相加现代词语的含义，来重建《周易》中的“象”。但这些用法的比较，能够说明为什么每次选择译词，都需要重新厘清感知、形象化与思想之间的关系。\n\n在我看来，“象”的丰富性，涵盖可感、认知与象征等不同层面。它凝聚了思想、印象与经验结构，无法被缩减为一个单一释义，也会依读者与语境而开启不同的理解。这种丰富性呼应了 Cheung 的观察：一些术语即使没有附带形式化的定义，也能在反复使用中积累出独特的质地与概念密度。<sup><a id=\"xiang-zh-ref-6-1\" href=\"#xiang-zh-note-6\" role=\"doc-noteref\">6</a></sup>\n\n最后，还应当区分这里讨论的“象”与佛教词汇中的“相”。二者在现代汉语中的语音接近，既不能成为混用的依据，也不能单凭这一点推导出概念的传承关系。"],"en":["Consistently translating 象 as “image” might make the wording more uniform while concealing the diversity of its uses. “Image” can evoke a visual representation, a mental picture or a figure of speech; on its own, it does not reproduce the relationships constructed by each Chinese occurrence.\n\nIn my thesis, I proposed considering several expressions together: 大象无形, which I rendered as “The great symbol has no form”; 现象, “phenomenon”; 意象, “mental image” or “imagery”; 异象, “unusual phenomenon” or, in certain contexts, “omen”; and 表象, “representation” or “appearance”.<sup><a id=\"xiang-en-ref-5-1\" href=\"#xiang-en-note-5\" role=\"doc-noteref\">5</a></sup> This comparison brings a semantic range into view: what manifests itself, what is represented, what is imagined, and what functions as a sign.\n\nThese expressions do not, however, all belong to the same period or field. I treat them as a sequence of uses that reveals a problem of translation, not as etymological proof of one ancient meaning. The *xiang* of the *Zhouyi* cannot be reconstructed simply by adding together the meanings of modern compounds. Comparing their uses does show, however, why selecting an equivalent requires us to specify the relationship between perception, figuration and thought each time.\n\nIn my view, *xiang* possesses a richness encompassing sensory, cognitive and symbolic phenomena. It condenses ideas, impressions and structures of experience that cannot be reduced to a single meaning, leaving room for multiple interpretations according to readers and contexts. This richness resonates with Cheung’s observation that repeated use can give terms a distinctive texture and conceptual density, even without a formal definition.<sup><a id=\"xiang-en-ref-6-1\" href=\"#xiang-en-note-6\" role=\"doc-noteref\">6</a></sup>\n\nA further distinction is necessary between 象, discussed here, and 相, which occurs notably in Buddhist terminology. Their phonetic proximity in Mandarin neither makes them interchangeable nor establishes conceptual descent by itself."]}},{"title":{"fr":"2. Le roman, son récit et ses réécritures","zh":"2. 小说、转述与改写","en":"2. The Novel, Its Retellings and Its Rewritings"},"paragraphs":{"fr":["Prenons l’exemple du roman. Le schéma d’Abrams distingue l’œuvre, l’artiste, l’univers et le public ; il permet de rappeler qu’une œuvre entre dans plusieurs relations.<sup><a id=\"xiang-fr-ref-7-1\" href=\"#xiang-fr-note-7\" role=\"doc-noteref\">7</a></sup> À partir de là, je propose une analogie qui m’est propre : nous pouvons partager une compréhension d’un roman à travers un résumé, un récit oral, une réécriture ou une critique, sans que ces formes se confondent avec le roman lui-même.\n\nUne personne peut avoir retenu une scène, une autre une atmosphère, une troisième une structure de conflit. Leurs récits ne reproduisent pas le texte intégral ; ils en rendent pourtant quelque chose transmissible. Dire qu’ils sont partiels ne revient pas à dire qu’ils sont nécessairement faux. En revanche, prendre l’un de ces récits pour la totalité de l’œuvre effacerait la distance qui rend précisément la médiation visible.\n\nJe rapproche cette situation de la formule « 道可道，非常道 » : le roman tel que je l’énonce ne se confond pas avec le roman que je prétends faire connaître. Par analogie, ses récits, ses images mémorables ou ses réécritures peuvent fonctionner comme des *xiang* : des formes limitées qui orientent une compréhension plus ample. Cette comparaison n’attribue pas au roman une essence intemporelle que le lecteur pourrait posséder ; elle interroge les voies par lesquelles une œuvre demeure reconnaissable à travers des représentations changeantes.\n\nLe *xiang* permet ainsi, même sans accès intégral à un objet, de saisir quelque chose de son souffle, de son organisation et de ses tensions. Une plasticité semblable me paraît à l’œuvre lorsqu’un poème est transposé en peinture : l’image mentale suscitée par le texte devient une forme visuelle, laquelle sélectionne et recompose. Le choix de ce qui passe d’une forme à l’autre devient alors l’objet de l’analyse.\n\nCette comparaison importe pour la traduction littéraire sans abolir ses exigences propres. Une traduction n’est pas un simple résumé. Elle engage la matérialité du texte, ses relations internes et ses effets. Mais la question qu’elle pose rejoint celle du récit d’une œuvre : comment donner accès sans prétendre que l’accès produit épuise son objet ?"],"zh":["以小说为例。Abrams 的图式区分作品、艺术家、世界与读者，提醒我们，一部作品存在于多重关系之中。<sup><a id=\"xiang-zh-ref-7-1\" href=\"#xiang-zh-note-7\" role=\"doc-noteref\">7</a></sup> 在此基础上，我提出一个自己的类比：我们可以通过梗概、口头转述、改写或评论，分享对小说的理解，但这些形式并不等于小说本身。\n\n一个人可能记住某个场景，另一个人记住氛围，还有一个人记住冲突的结构。他们的讲述并不再现完整文本，却仍使其中的某些东西得以传递。说这些讲述是局部的，不等于说它们必然是错误的。但如果将其中一种转述当作作品的全部，就会抹去使这一中介过程本来能够被看见的距离。\n\n我将这种情形与“道可道，非常道”相参照：由我说出的小说，并不等于我试图使别人认识的小说。依此类比，关于小说的转述、令人难忘的形象及其改写，都可以起到“象”的作用：以有限的形式，引向更广阔的理解。这一比较并不是为小说设定一种读者能够占有的永恒本质，而是追问：一部作品，如何在不断变化的呈现之中仍然能够被辨认？\n\n“象”由此使我们在无法完整抵达对象时，仍能把握它的部分气息、组织方式与张力。我认为，诗歌转化为绘画时，也存在相似的解释弹性：文本唤起的心象成为可见的形式，而这一形式又作出了选择与重组。哪些东西能够从一种形式进入另一种形式，就成为分析的对象。\n\n这一类比对文学翻译有意义，但不会取消翻译自身的要求。译文并不是一篇梗概；它涉及文本的语言质地、内部关系与作用。不过，它提出的问题与作品的转述相通：如何使人接近作品，又不宣称这一接近已经穷尽了它？"],"en":["Consider the novel. Abrams’s scheme distinguishes the work, the artist, the universe and the audience, reminding us that a work enters into several relationships.<sup><a id=\"xiang-en-ref-7-1\" href=\"#xiang-en-note-7\" role=\"doc-noteref\">7</a></sup> From this starting point, I propose an analogy of my own: we can share an understanding of a novel through a summary, an oral retelling, a rewriting or a critical reading, without any of these forms becoming identical with the novel itself.\n\nOne person may remember a scene, another an atmosphere, a third a structure of conflict. Their accounts do not reproduce the complete text, yet they make something of it transmissible. Calling these accounts partial does not mean that they are necessarily false. Taking one of them for the entirety of the work, however, would erase the distance that makes the mediation visible.\n\nI relate this situation to “道可道，非常道”: the novel as I articulate it is not identical with the novel I seek to make known. By analogy, its retellings, memorable images and rewritings can function as *xiang*: limited forms that direct a more expansive understanding. This comparison does not assign the novel a timeless essence that a reader might possess. It asks how a work remains recognisable through changing representations.\n\nEven without complete access to an object, *xiang* thus allows something of its breath, organisation and tensions to be grasped. A similar interpretive plasticity seems to me at work when a poem is transposed into painting: the mental image elicited by the text becomes a visual form, which in turn selects and recomposes. What passes from one form into another becomes the object of analysis.\n\nThis comparison matters for literary translation without abolishing its particular demands. A translation is not simply a summary: it engages the text’s material qualities, internal relationships and effects. Yet its question connects with that raised by retelling a work: how can we provide access without claiming that the access produced exhausts its object?"]}}]},{"id":"xiang-iii","title":{"fr":"III. Du jugement sur la parole aux choix de traduction","zh":"三、从言辞的评价到翻译的选择","en":"III. From Judgements About Speech to Choices in Translation"},"units":[{"title":{"fr":"III. Du jugement sur la parole aux choix de traduction","zh":"三、从言辞的评价到翻译的选择","en":"III. From Judgements About Speech to Choices in Translation"},"paragraphs":{"fr":["Les citations de Laozi et de Confucius permettent aussi de comprendre les critères moraux et esthétiques que les lettrés projetaient sur les pratiques d’écriture et de traduction. La vérité, la simplicité, la sincérité ou l’équilibre entre substance et raffinement ne sont pas des valeurs extérieures au style : elles interviennent dans son appréciation. Une parole ornée peut-elle encore être vraie ? Une parole sans ornement peut-elle être insuffisamment intelligible ? À travers ces questions se dessine une pensée où la transmission du sens dépasse largement la seule fidélité verbale."],"zh":["老子与孔子的言辞，还能帮助我们理解文人赋予书写与翻译的道德、审美标准。真实、质朴、诚恳，或内在质地与文饰之间的协调，并不是文体之外的价值，而是参与了对文体的评价。经过修饰的言辞能否依然真实？未经修饰的言辞是否又可能不够明晰？通过这些问题，可以看到一种思想：意义的传达，远远超出了字面忠实本身。"],"en":["The sayings of Laozi and Confucius also illuminate the moral and aesthetic criteria scholars brought to writing and translation. Truth, simplicity, sincerity and a balance between substance and refinement are not values external to style: they enter into its evaluation. Can embellished speech remain truthful? Can unadorned speech fail to be sufficiently intelligible? These questions reveal a way of thinking in which the transmission of meaning extends well beyond verbal fidelity alone."]}},{"title":{"fr":"1. Xin et mei : la sincérité à l’épreuve de la beauté","zh":"1. 信与美：美辞面前的真实","en":"1. Xin and Mei: Truthfulness Confronts Beauty"},"paragraphs":{"fr":["Le dernier chapitre du *Daodejing* énonce :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"xinmei\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">信言不美，美言不信。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Les paroles sincères ne sont pas belles ; les paroles belles ne sont pas sincères.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-8-1\" href=\"#xiang-fr-note-8\" role=\"doc-noteref\">8</a></sup> Pour éclairer cette formule, je reprends la méthode de Cheung en déployant les significations des termes. 信, *xin*, peut renvoyer à ce qui est sincère, fidèle, véridique, fiable ou digne de confiance. 美, *mei*, évoque ce qui est beau, élégant, bien tourné, agréable, séduisant ou raffiné. Il ne s’agit pas d’accumuler des synonymes interchangeables : chaque choix français fait ressortir un aspect différent du jugement.\n\nTraduire 信 par « fidélité » rapproche immédiatement l’énoncé de notre vocabulaire traductologique ; le rendre par « sincérité » fait entendre sa dimension morale. De même, « beauté » et « séduction » n’orientent pas de la même manière l’évaluation de 美. La seconde insiste sur le pouvoir d’attirer, y compris lorsque cette attraction détourne du vrai. Ce que la formule met en tension n’est donc pas simplement un contenu et son habillage : c’est la confiance que l’on peut accorder à la parole.\n\nLa suite du chapitre prolonge ce soupçon :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"bian\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">善者不辩，辩者不善；知者不博，博者不知。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Celui qui est bon ne dispute pas ; celui qui dispute n’est pas bon. Celui qui sait n’étale pas un vaste savoir ; celui qui étale un vaste savoir ne sait pas.</em></p>\n</blockquote>\n\nIl serait réducteur d’en conclure à l’inutilité de tout savoir ou de toute argumentation. Ce sont aussi l’étalage de l’érudition et la virtuosité de la dispute qui sont mis en cause. Appliquée à la traduction, cette interrogation peut devenir très concrète : l’élégance manifeste-t-elle la compréhension du texte, ou masque-t-elle ce que le traducteur n’a pas compris ?"],"zh":["《道德经》最后一章写道：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"xinmei\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">信言不美，美言不信。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-8-1\" href=\"#xiang-zh-note-8\" role=\"doc-noteref\">8</a></sup> 为了展开这句话，我沿用 Cheung 的方法，考察词语的语义范围。“信”可以指诚恳、忠实、真实、可靠、值得信赖；“美”可以涉及美丽、优雅、措辞精巧、悦人、诱人或精致。这里不是罗列可以随意替换的同义词：每一个法语译词，都使判断中的不同侧面显现出来。\n\n把“信”译为“忠实”，会立即使这句话靠近翻译研究的词汇；把它译为“诚恳”，则更能听见其中的道德意味。同样，“美丽”与“诱惑力”也不将“美”的评价引向同一方向。后者突出了吸引人的力量，包括这种吸引偏离真实的可能。因此，这句话中的张力，不只是内容与外在修饰的冲突，还关系到我们能否信任某种言辞。\n\n同章后文继续表达了这一警惕：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"bian\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">善者不辩，辩者不善；知者不博，博者不知。</p>\n\n</blockquote>\n\n如果由此断言一切知识或论证都没有价值，就会缩减文本的意义。受到质疑的，还包括博闻的炫示与争辩的技巧。进入翻译语境后，这一追问可以非常具体：优美的表达，是理解原文的显现，还是遮蔽译者尚未理解之处的手段？"],"en":["The final chapter of the *Daodejing* states:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"xinmei\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">信言不美，美言不信。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>Truthful words are not beautiful; beautiful words are not truthful.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-8-1\" href=\"#xiang-en-note-8\" role=\"doc-noteref\">8</a></sup> To illuminate this formulation, I follow Cheung’s method by unfolding the terms’ semantic ranges. 信, *xin*, can refer to sincerity, fidelity, truthfulness, reliability or trustworthiness. 美, *mei*, evokes beauty, elegance, well-turned expression, pleasantness, attractiveness or refinement. This is not an accumulation of interchangeable synonyms: each choice foregrounds a different aspect of the judgement.\n\nTranslating 信 as “fidelity” immediately brings the saying close to the vocabulary of translation studies; “sincerity” makes its moral dimension audible. Likewise, “beauty” and “seductiveness” do not orient the evaluation of 美 in the same way. The latter emphasises the power to attract, including when that attraction diverts us from truth. The tension is therefore not merely between content and its ornament: it concerns the trust we can place in speech.\n\nThe chapter continues this suspicion:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"bian\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">善者不辩，辩者不善；知者不博，博者不知。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>The good do not dispute; those who dispute are not good. Those who know do not display wide learning; those who display wide learning do not know.</em></p>\n</blockquote>\n\nIt would be reductive to conclude that all knowledge or argument is useless. The display of learning and virtuosity in disputation are also at issue. Applied to translation, the question can become very concrete: does elegance manifest an understanding of the text, or conceal what the translator has failed to understand?"]}},{"title":{"fr":"2. Wen et zhi : une esthétique qui engage une éthique","zh":"2. 文与质：审美中的伦理要求","en":"2. Wen and Zhi: An Aesthetics With Ethical Stakes"},"paragraphs":{"fr":["Les *Entretiens* mettent eux aussi en garde contre le pouvoir des apparences :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"qiaoyan\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">巧言令色，鲜矣仁。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Les paroles flatteuses et les mines complaisantes s’accompagnent rarement de ren, de cette qualité d’humanité.</em></p>\n</blockquote>\n\nUne autre formule semble ramener la parole à sa fonction de transmission :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"cidayi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">辞达而已矣。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Que les paroles fassent parvenir le sens : cela suffit.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-9-1\" href=\"#xiang-fr-note-9\" role=\"doc-noteref\">9</a></sup> « 达 », *da*, désigne ici la réussite du passage : que les mots fassent parvenir le sens à autrui. Mais cette exigence n’entraîne pas l’élimination de toute élaboration formelle. Le passage consacré au *junzi* articule au contraire deux dimensions :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"wenzhi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">质胜文则野，文胜质则史。文质彬彬，然后君子。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Lorsque la substance l’emporte sur le raffinement, il y a de la rudesse ; lorsque le raffinement l’emporte sur la substance, il y a le pédantisme du scribe. C’est lorsque raffinement et substance s’accordent que l’on a un junzi, un homme de valeur.</em></p>\n</blockquote>\n\nLes qualités décrites sont d’abord celles d’une personne. Le mot 质, *zhi*, peut désigner la substance, la nature propre, la qualité intérieure ou la simplicité. 文, *wen*, implique la forme travaillée, le raffinement, les motifs, la culture et la structuration littéraire. Leur association ne se laisse donc pas enfermer dans l’opposition moderne « contenu contre forme » : elle touche aussi à la formation de l’être, à sa manière d’apparaître et de se conduire.\n\nLa symétrie de l’énoncé importe. L’excès de *zhi* expose à 野, à la rudesse ; l’excès de *wen* expose à 史, que Cheung rend par le pédantisme du scribe. Ni le dépouillement absolu ni le raffinement autosuffisant ne constitue l’idéal. C’est leur rapport qui est évalué. Les mots ensuite employés pour juger les traductions transportent donc une mémoire morale autant qu’une préférence littéraire.\n\nJe retiens ici une difficulté essentielle pour le traducteur des concepts eux-mêmes : si l’on traduit *wen* seulement par « ornement » et *zhi* seulement par « littéralité », on anticipe leur emploi traductologique en effaçant ce qui lui donne sa profondeur. Les conserver, puis expliciter leurs valeurs dans chaque contexte, permet au lecteur de suivre leur déplacement de la personne vertueuse vers l’écriture et la traduction."],"zh":["《论语》同样警惕外在表现的诱惑：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"qiaoyan\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">巧言令色，鲜矣仁。</p>\n\n</blockquote>\n\n另一句话，似乎将言辞引回传达的功能：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"cidayi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">辞达而已矣。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-9-1\" href=\"#xiang-zh-note-9\" role=\"doc-noteref\">9</a></sup> 这里的“达”，关乎传递的实现：使言辞将意义送达他人。但这一要求并不意味着排除所有形式上的经营。论及“君子”的段落，反而将两个方面联系起来：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"wenzhi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">质胜文则野，文胜质则史。文质彬彬，然后君子。</p>\n\n</blockquote>\n\n这里所描述的，首先是人的品质。“质”可以涉及本质、天性、内在品质或朴实；“文”则包含经过经营的形式、文饰、纹理、文化修养和文学组织。因此，二者的结合不能被封闭在现代的“内容对形式”之中：它同时关系到一个人的养成、表现与行事方式。\n\n这句话的对称结构很重要。“质”过胜，就有“野”的粗率；“文”过胜，则趋于“史”，Cheung 将其解释为文吏式的拘文。绝对的质朴，或自足的修饰，都不是这里的理想；受到衡量的是两者之间的关系。因此，这些词语后来被用于评价译文时，所携带的不只是文学趣味，还有一份道德记忆。\n\n在此，我尤其关注翻译概念本身的困难：如果只把“文”译为“修饰”，把“质”译为“字面忠实”，就会提前用它们在翻译讨论中的某种用法，抹去赋予这种用法厚度的内容。保留这些术语，再逐处说明其含义，读者才可以跟随它们从人的德性进入书写与翻译的过程。"],"en":["The *Analects* likewise warn against the power of appearances:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"qiaoyan\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">巧言令色，鲜矣仁。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>Cleverly flattering words and ingratiating appearances are seldom accompanied by ren, the quality of humaneness.</em></p>\n</blockquote>\n\nAnother saying appears to return speech to its communicative function:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"cidayi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">辞达而已矣。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>Let the words convey their meaning: that is enough.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-9-1\" href=\"#xiang-en-note-9\" role=\"doc-noteref\">9</a></sup> 达, *da*, concerns successful passage: words should carry meaning to another person. Yet this requirement does not eliminate all formal elaboration. The passage on the *junzi* instead brings two dimensions together:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"wenzhi\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">质胜文则野，文胜质则史。文质彬彬，然后君子。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>When substance outweighs refinement, there is coarseness; when refinement outweighs substance, there is the pedantry of the scribe. Only when refinement and substance are harmoniously combined do we have a junzi, a person of moral worth.</em></p>\n</blockquote>\n\nThe qualities described are first those of a person. 质, *zhi*, can designate substance, intrinsic nature, inward quality or simplicity. 文, *wen*, involves cultivated form, refinement, patterning, culture and literary organisation. Their relationship therefore cannot be confined to the modern opposition between content and form: it also concerns a person’s cultivation, manner of appearing and conduct.\n\nThe sentence’s symmetry matters. An excess of *zhi* risks 野, coarseness; an excess of *wen* risks 史, which Cheung renders as the pedantry of a scribe. Neither absolute plainness nor self-sufficient refinement constitutes the ideal. Their relationship is what is judged. When these terms are subsequently used to evaluate translations, they carry moral memory as well as literary preferences.\n\nThis presents a central difficulty for translating the concepts themselves. Rendering *wen* solely as “ornament” and *zhi* solely as “literalness” anticipates their use in translation discourse while erasing what gives that use its depth. Retaining the terms and explaining their values in context lets the reader follow their movement from the virtuous person into writing and translation."]}},{"title":{"fr":"3. Le Faju jing : les paroles des sages dans l’atelier de traduction","zh":"3. 《法句经》：译场中的圣贤言辞","en":"3. The Faju jing: The Sages’ Words in the Translation Workshop"},"paragraphs":{"fr":["La préface du *Faju jing*, généralement attribuée à Zhi Qian, fournit un exemple direct de cette circulation. Elle ne se borne pas à partager un vocabulaire avec les classiques : elle les cite au cours d’une discussion sur la traduction.<sup><a id=\"xiang-fr-ref-10-1\" href=\"#xiang-fr-note-10\" role=\"doc-noteref\">10</a></sup> Le narrateur explique d’abord son insatisfaction devant une expression trop peu élégante : « 仆初嫌其辞不雅 ». Vighna répond :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"faju-vighna\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">维祇难曰：“佛言‘依其义不用饰，取其法不以严’。其传经者，当令易晓，勿失厥义，是则为善。”</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Vighna dit : « Le Bouddha dit : “Suivez le sens sans l’orner ; recevez l’enseignement sans rechercher la parure.” Ceux qui transmettent les textes doivent les rendre aisés à comprendre, sans en perdre le sens : c’est cela qui est bon. »</em></p>\n</blockquote>\n\nLa discussion fait ensuite intervenir deux des formules que nous venons d’examiner :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"faju-sages\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">座中咸曰：“老氏称‘美言不信，信言不美’；仲尼亦云‘书不尽言，言不尽意’。明圣人意深邃无极。今传胡义，实宜径达。”</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Tous ceux qui étaient présents dirent : « Laozi affirme : “Les paroles belles ne sont pas sincères ; les paroles sincères ne sont pas belles.” Zhongni dit aussi : “Les écrits n’épuisent pas les paroles ; les paroles n’épuisent pas le sens.” Cela montre la profondeur sans limite du sens des sages. Maintenant que nous transmettons un sens venu d’ailleurs, il convient de le faire parvenir directement. »</em></p>\n</blockquote>\n\nLa reprise est remarquable. « 美言不信 » met en doute la valeur d’un embellissement ; « 言不尽意 » rappelle la profondeur du sens des sages ; la conclusion « 实宜径达 » transforme cette double autorité en orientation pratique : faire parvenir directement le sens. Les paroles de Laozi et celles attribuées à Confucius ne sont plus seulement commentées. Elles prennent place dans une décision sur la manière de traduire un texte étranger.\n\nLa préface poursuit : « 因循本旨，不加文饰，译所不解，则阙不传 » — suivre la visée du texte, ne pas ajouter d’ornements, laisser en suspens ce qui n’a pas été compris. L’absence de raffinement devient ici une manière de ne pas dissimuler les limites de la transmission. Mais la conclusion esthétique reste positive : « 辞朴而旨深，文约而义博 » — une expression simple peut avoir une visée profonde ; un texte concis peut porter un sens ample.\n\nCet exemple donne un contenu historique à mon hypothèse. La relation entre pensée classique et traduction ne dépend pas seulement d’une ressemblance reconstruite après coup : elle apparaît dans l’argumentation du texte. En même temps, les formules anciennes sont sélectionnées pour répondre à une difficulté située. Leur autorité n’interdit pas leur réemploi ; c’est précisément ce réemploi qui les fait agir."],"zh":["通常归于支谦的《法句经序》，为这种流转提供了直接的例子。它不仅与经典共享词汇，还在讨论翻译的过程中征引经典。<sup><a id=\"xiang-zh-ref-10-1\" href=\"#xiang-zh-note-10\" role=\"doc-noteref\">10</a></sup> 叙述者首先表达了对措辞不够文雅的不满：“仆初嫌其辞不雅。”维祇难回答：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"faju-vighna\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">维祇难曰：“佛言‘依其义不用饰，取其法不以严’。其传经者，当令易晓，勿失厥义，是则为善。”</p>\n\n</blockquote>\n\n接下来的讨论，直接引入了我们前面考察的两组言辞：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"faju-sages\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">座中咸曰：“老氏称‘美言不信，信言不美’；仲尼亦云‘书不尽言，言不尽意’。明圣人意深邃无极。今传胡义，实宜径达。”</p>\n\n</blockquote>\n\n这样的征引值得注意。“美言不信”质疑文饰的价值；“言不尽意”提醒人注意圣人之意的深邃；“实宜径达”的结论，则将这两种权威转换为实际的译法取向：直接传达意义。老子的言辞与归于孔子的言辞，在这里不再只是被解释的对象，而是进入了如何翻译外国文本的决定之中。\n\n序文继而写道：“因循本旨，不加文饰，译所不解，则阙不传。”顺循本旨，不额外修饰，不理解之处则暂缺不译。质朴在这里成为不掩饰传达限度的一种方式。但文章并未因此失去积极的审美评价：“辞朴而旨深，文约而义博。”质朴的言辞可以拥有深厚的旨意，简约的文字也可以承载丰富的意义。\n\n这一例子使我的论点获得了历史内容。经典思想与翻译的关系，并不只依赖后人重建的相似性，而是出现在文本自身的论证中。同时，古语又是为回应一个具体困难而被选择的。它们的权威并未阻止重新使用；恰恰是这样的重新使用，使它们产生作用。"],"en":["The preface to the *Faju jing*, generally attributed to Zhi Qian, offers direct evidence of this circulation. It does not merely share vocabulary with the classics: it quotes them during a discussion of translation.<sup><a id=\"xiang-en-ref-10-1\" href=\"#xiang-en-note-10\" role=\"doc-noteref\">10</a></sup> The narrator first expresses dissatisfaction with insufficiently elegant wording: “仆初嫌其辞不雅”. Vighna responds:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"faju-vighna\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">维祇难曰：“佛言‘依其义不用饰，取其法不以严’。其传经者，当令易晓，勿失厥义，是则为善。”</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>Vighna said: “The Buddha says: ‘Follow the meaning without embellishment; receive the teaching without seeking ornament.’ Those transmitting the scriptures should make them easy to understand without losing their meaning: that is what is good.”</em></p>\n</blockquote>\n\nThe discussion then invokes two formulations examined above:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"faju-sages\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">座中咸曰：“老氏称‘美言不信，信言不美’；仲尼亦云‘书不尽言，言不尽意’。明圣人意深邃无极。今传胡义，实宜径达。”</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>All those present said: “Laozi states: ‘Beautiful words are not truthful; truthful words are not beautiful.’ Zhongni also says: ‘Writing does not exhaust words; words do not exhaust meaning.’ This shows the boundless depth of the sages’ meaning. Now that we are transmitting meaning from abroad, we should convey it directly.”</em></p>\n</blockquote>\n\nThis reuse is striking. “美言不信” questions the value of embellishment; “言不尽意” recalls the depth of the sages’ meaning; the conclusion, “实宜径达”, turns this double authority into a practical orientation: convey the meaning directly. Laozi’s words and those attributed to Confucius are no longer simply objects of commentary. They enter into a decision about how to translate a foreign text.\n\nThe preface continues: “因循本旨，不加文饰，译所不解，则阙不传”—follow the text’s purport, add no embellishment, and leave untranslated what has not been understood. Plainness here becomes a way of not concealing the limits of transmission. Yet the aesthetic judgement remains positive: “辞朴而旨深，文约而义博”—simple expression can carry a profound purport; concise wording can contain an expansive meaning.\n\nThis example gives historical substance to my hypothesis. The connection between classical thought and translation does not rest solely on a resemblance reconstructed retrospectively: it appears within the text’s own argument. At the same time, earlier sayings are selected to address a particular difficulty. Their authority does not prevent their reuse; it is precisely through reuse that they become active."]}},{"title":{"fr":"4. Dao An : comparer les versions, penser leurs pertes","zh":"4. 道安：比较译本，辨识其失","en":"4. Dao An: Comparing Versions, Identifying Their Losses"},"paragraphs":{"fr":["La confrontation de deux versions d’un même texte permet de voir ces critères à l’œuvre. Dans la préface réunissant l’examen du *Fangguang jing* et du *Guangzan jing*, Dao An décrit la première version comme concise et claire, obtenue par la suppression des répétitions ; il reconnaît cependant que la recherche de la concision entraîne des pertes. De la seconde, plus complète et plus proche de la disposition du texte transmis, il écrit :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"guangzan\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">悉则悉矣，而辞质胜文也。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Complet, il l’est assurément ; mais, dans son expression, la simplicité l’emporte sur le raffinement.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-11-1\" href=\"#xiang-fr-note-11\" role=\"doc-noteref\">11</a></sup> L’expression « 质胜文 » reprend les termes des *Entretiens* dans une évaluation de traduction. Mais Dao An ne choisit pas simplement un camp : il constate aussi que les versions « 互相补益，所悟实多 » — se complètent l’une l’autre et permettent de comprendre davantage. C’est la comparaison qui devient féconde. Une traduction révèle ce que l’autre obscurcit ou omet.\n\nDans une autre préface, il distingue les « cinq pertes de l’original » et les « trois difficultés » — 五失本、三不易.<sup><a id=\"xiang-fr-ref-12-1\" href=\"#xiang-fr-note-12\" role=\"doc-noteref\">12</a></sup> Les cinq pertes concernent : la réorganisation de l’ordre des mots pour suivre l’usage chinois ; la transformation d’une expression simple pour répondre au goût du public pour le *wen* ; la réduction des répétitions insistantes ; la suppression de reprises explicatives ; enfin, la suppression des rappels qui précèdent le développement suivant. Ce dernier point concerne des reprises de ce qui a déjà été exposé, non une catégorie générale de « digressions ».\n\nLa deuxième perte formule directement une tension entre texte transmis et attentes du lectorat :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"daoan-wen\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">胡经尚质，秦人好文，传可众心，非文不合，斯二失本也。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Les textes étrangers privilégient la simplicité, tandis que les lecteurs de Qin aiment le raffinement. Pour que la transmission rencontre leur faveur, il faut recourir au raffinement : telle est la deuxième perte de l’original.</em></p>\n</blockquote>\n\nLes trois difficultés déplacent ensuite l’attention vers la distance historique et religieuse : adapter des paroles anciennes à des usages nouveaux ; transmettre la parole du sage à des lecteurs éloignés de lui par le temps et par leur capacité de compréhension ; enfin, intervenir sur un texte sacré alors que ceux qui l’avaient recueilli, beaucoup plus proches de sa source, procédaient déjà avec une extrême prudence. Dao An condense la conséquence en une question : « 译胡为秦，讵可不慎乎！ » — comment traduire en chinois sans la plus grande circonspection ?\n\nCe classement me paraît important à deux titres. Il montre que la réflexion ancienne ne se réduit nullement à une intuition générale du « sens ». Elle distingue des opérations textuelles et les pertes qu’elles produisent. Mais il révèle aussi pourquoi leur évaluation dépasse la seule technique : transformer une répétition, un ordre ou une manière de dire engage le rapport à l’autorité du texte, à son histoire et à la communauté qui le reçoit."],"zh":["对照同一文本的两个译本，可以看到这些标准怎样实际运作。道安在《合放光光赞略解序》中指出，《放光经》删削反复，文字简约，意义明晰，却也承认求简会带来遗漏。对于更为详尽、更贴近所传文本组织的《光赞经》，他写道：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"guangzan\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">悉则悉矣，而辞质胜文也。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-11-1\" href=\"#xiang-zh-note-11\" role=\"doc-noteref\">11</a></sup> “质胜文”将《论语》的措辞带入了译文评价。但道安并未简单地选择某一个阵营：他还指出，两种译本“互相补益，所悟实多”。产生认识的是比较本身；一个译本，可以揭示另一个译本所遮蔽或省略之处。\n\n在另一篇序文中，道安区分了“五失本”与“三不易”。<sup><a id=\"xiang-zh-ref-12-1\" href=\"#xiang-zh-note-12\" role=\"doc-noteref\">12</a></sup> “五失本”涉及：为顺应汉语而调整语序；为满足读者好文的趣味而改变原来的质朴；删减反复叮咛的表达；删去复述前文的解释；以及删去转入下一层叙述之前对前文的重申。最后一项针对的是已经说过的内容的再度提起，并不能笼统地改写为“删去离题之处”。\n\n第二失直接表达了所传文本与读者期待之间的张力：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"daoan-wen\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">胡经尚质，秦人好文，传可众心，非文不合，斯二失本也。</p>\n\n</blockquote>\n\n“三不易”随后将问题转向历史与宗教的距离：以当下的习俗调整古老的言辞；将圣人的话语传给在时代与理解能力上都与之相隔的读者；以及在更接近原初传授的结集者尚且极为审慎时，后人又凭什么轻率裁量经文。道安将这一要求凝聚成一个问句：“译胡为秦，讵可不慎乎！”\n\n这一分类，在我看来有两重意义。它首先表明，古代译论绝不只有对“意义”的笼统直觉，而能够辨别文本操作及其产生的损失。与此同时，它也说明为什么评价超出了技术层面：改变一次重复、一种顺序或一种说法，都牵涉经文的权威、历史以及接受它的群体。"],"en":["Comparing two versions of the same text shows these criteria at work. In his preface comparing the *Fangguang jing* and the *Guangzan jing*, Dao An describes the former as concise and clear, with repetitions removed; he nevertheless recognises that concision entails omissions. Of the latter, more complete version, which follows the organisation of the transmitted text more closely, he writes:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"guangzan\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">悉则悉矣，而辞质胜文也。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>It is certainly complete; yet in its expression, plainness outweighs refinement.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-11-1\" href=\"#xiang-en-note-11\" role=\"doc-noteref\">11</a></sup> “质胜文” reuses the *Analects*’ wording to evaluate a translation. Yet Dao An does not simply choose a side: he also observes that the versions “互相补益，所悟实多”—supplement one another and substantially increase understanding. Comparison itself becomes productive. One translation reveals what the other obscures or omits.\n\nIn another preface, he distinguishes the “five losses of the original” and the “three difficulties”—五失本、三不易.<sup><a id=\"xiang-en-ref-12-1\" href=\"#xiang-en-note-12\" role=\"doc-noteref\">12</a></sup> The five losses concern rearranging word order to follow Chinese usage; altering plain expression to accommodate readers’ preference for *wen*; reducing insistent repetitions; removing explanatory restatements; and omitting recapitulations preceding a subsequent development. The final point concerns renewed statements of what has already been presented, rather than a general category of “digressions”.\n\nThe second loss directly articulates the tension between the transmitted text and the expectations of its readers:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"daoan-wen\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">胡经尚质，秦人好文，传可众心，非文不合，斯二失本也。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>The foreign scriptures favour plainness, whereas the people of Qin prefer refinement. To win their acceptance, transmission must employ refinement: this is the second loss of the original.</em></p>\n</blockquote>\n\nThe three difficulties then turn towards historical and religious distance: adapting ancient speech to new practices; conveying the sage’s words to readers separated from him by time and understanding; and intervening in a sacred text when those who collected it, much closer to its source, had already exercised extreme caution. Dao An condenses the consequence into a question: “译胡为秦，讵可不慎乎！”—how could one translate into Chinese without the greatest care?\n\nThis classification matters to me in two respects. It shows that ancient thinking cannot be reduced to a general intuition of “meaning”: it distinguishes textual operations and the losses they produce. Yet it also reveals why their evaluation exceeds technique alone. Changing a repetition, an order or a manner of expression involves the text’s authority, its history and the community receiving it."]}},{"title":{"fr":"5. L’image de Hundun : lorsque l’amélioration détruit","zh":"5. 浑沌之喻：当完善成为损伤","en":"5. The Image of Hundun: When Improvement Destroys"},"paragraphs":{"fr":["La même préface comporte un rapprochement particulièrement éclairant pour le rapport entre Zhuangzi et la réflexion traductive. Évoquant l’habileté de certains traducteurs, Dao An écrit :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"hundun\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">巧则巧矣，惧窍成而混沌终矣。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Habiles, ils le sont assurément ; mais je crains qu’une fois les ouvertures percées, Hundun ne soit mort.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-13-1\" href=\"#xiang-fr-note-13\" role=\"doc-noteref\">13</a></sup> Le passage fait écho à la fin du chapitre « Yingdiwang » du *Zhuangzi*. Pour récompenser Hundun, ses visiteurs décident de lui percer les ouvertures dont les hommes disposent pour voir, entendre, manger et respirer : « 日凿一窍，七日而浑沌死 » — ils percent une ouverture chaque jour ; au septième jour, Hundun meurt.\n\nL’image permet de penser une intervention qui détruit en prétendant compléter. Les traducteurs peuvent faire preuve d’habileté ; pourtant, leurs améliorations risquent de défaire l’organisation de ce qu’ils reçoivent. Dans la préface, la comparaison est suivie d’un argument portant sur les classiques chinois : si l’on supprimait les répétitions du *Shijing* ou la simplicité du *Shangshu* pour les conformer au goût présent, les commentateurs ne le déploreraient-ils pas ?\n\nLoin d’être un ornement extérieur à l’analyse, l’allusion donne une forme saisissante à un risque de traduction. Le lecteur comprend une relation — perfectionnement apparent, destruction effective — à travers un récit condensé. Nous retrouvons ainsi le fonctionnement que j’attribue au *xiang* : une image porte une pensée qui ne se laisse pas réduire à la description de l’objet représenté. Nous disposons aussi d’un cas précis où une ressource du *Zhuangzi* entre effectivement dans une argumentation sur la transmission des textes."],"zh":["同一篇序文中，还有一个特别能说明《庄子》与翻译思考之关系的比喻。道安在谈到某些译者的技巧时写道：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"hundun\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">巧则巧矣，惧窍成而混沌终矣。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-13-1\" href=\"#xiang-zh-note-13\" role=\"doc-noteref\">13</a></sup> 这句话呼应了《庄子·应帝王》的结尾。为了报答浑沌，来客决定为它凿出人类用来视、听、食、息的孔窍：“日凿一窍，七日而浑沌死。”\n\n这个形象使一种“自以为完善、实际上毁坏”的介入得以被理解。译者当然可能技巧高超，但其改善也可能破坏原有的组织。序文随后转向中国经典：如果为了迎合当下，嫌《诗》反复、嫌《尚书》质朴而加以删改，难道不会为注经者所痛惜吗？\n\n这一典故远非分析之外的装饰。它以鲜明的形象，呈现了翻译中的一种风险。读者通过被压缩的故事，把握到“看似完善、实则毁坏”的关系。这里再次出现了我赋予“象”的作用：一个形象承载着某种思想，而思想并不等于对所画之物的描述。同时，我们也获得了一个具体案例，表明《庄子》中的思想资源确实进入了文本传译的论证。"],"en":["The same preface contains a comparison that is especially illuminating for the relationship between Zhuangzi and thinking about translation. Discussing certain translators’ skill, Dao An writes:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"hundun\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">巧则巧矣，惧窍成而混沌终矣。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>Skilful they certainly are; yet I fear that once the openings have been made, Hundun will have died.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-13-1\" href=\"#xiang-en-note-13\" role=\"doc-noteref\">13</a></sup> The passage echoes the ending of the *Zhuangzi*’s “Yingdiwang” chapter. To repay Hundun, his visitors decide to bore into him the openings humans possess for seeing, hearing, eating and breathing: “日凿一窍，七日而浑沌死”—they bore one opening each day; on the seventh day Hundun dies.\n\nThe image makes it possible to think about an intervention that destroys while claiming to complete. Translators may be skilful, yet their improvements can undo the organisation of what they receive. In the preface, the comparison is followed by an argument about the Chinese classics: if someone removed the *Shijing*’s repetitions or the *Shangshu*’s plainness to accommodate present taste, would their commentators not deplore it?\n\nFar from an ornament external to the analysis, the allusion gives a striking form to a risk of translation. Through a condensed narrative, the reader understands a relationship—apparent improvement, actual destruction. We encounter again the operation I attribute to *xiang*: an image carries a thought irreducible to a description of the thing represented. We also have a specific instance in which a resource from the *Zhuangzi* enters an argument about the transmission of texts."]}}]},{"id":"xiang-iv","title":{"fr":"IV. Les notions anciennes dans la traduction moderne","zh":"四、现代翻译中的古典概念","en":"IV. Classical Concepts in Modern Translation"},"units":[{"title":{"fr":"IV. Les notions anciennes dans la traduction moderne","zh":"四、现代翻译中的古典概念","en":"IV. Classical Concepts in Modern Translation"},"paragraphs":{"fr":["La circulation de ces critères ne s’arrête pas aux traductions bouddhiques. Les discussions modernes peuvent réactiver les paroles classiques, mais aussi transférer vers la traduction une manière de juger issue des arts. Yan Fu et Fu Lei permettent d’observer ces deux opérations sans les confondre."],"zh":["这些标准的流转，并未止于佛经翻译。现代讨论既可以重新启用经典言辞，也可以将艺术中的评价方式转用于翻译。严复与傅雷，使我们能够分别考察这两种运作。"],"en":["The circulation of these criteria does not end with Buddhist translation. Modern discussions can reactivate classical sayings or transfer a mode of judgement from the arts into translation. Yan Fu and Fu Lei allow these two operations to be examined without conflating them."]}},{"title":{"fr":"1. Yan Fu : les règles de l’écriture deviennent des modèles de traduction","zh":"1. 严复：文章正轨与译事楷模","en":"1. Yan Fu: Standards of Writing Become Models for Translation"},"paragraphs":{"fr":["À la fin des Qing, la triade de Yan Fu — 信, 达, 雅, *xin*, *da*, *ya* — recompose des exigences de fidélité, d’intelligibilité et d’élégance pour répondre à de nouvelles entreprises de traduction. Dans les « Remarques sur la traduction » du *Tianyan lun*, il écrit :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"yanfu-classics\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">《易》曰：“修辞立诚。”子曰：“辞达而已。”又曰：“言之无文，行之不远。”三曰乃文章正轨，亦即为译事楷模。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>Le Yi dit : « Travailler l’expression pour établir la sincérité. » Le Maître dit : « Que les paroles fassent parvenir le sens : cela suffit. » Il dit encore : « Sans élaboration, les paroles ne portent pas loin. » Ces trois sentences sont la voie juste de l’écriture ; elles sont aussi des modèles pour le travail de traduction.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-14-1\" href=\"#xiang-fr-note-14\" role=\"doc-noteref\">14</a></sup> La dernière proposition est décisive : les trois paroles constituent le « cours juste » de l’écriture et deviennent des « modèles » pour la traduction. Le texte nomme donc lui-même le transfert que j’étudie. Des critères déjà investis d’autorité littéraire et morale sont employés pour penser la transmission d’un savoir étranger.\n\nIl serait toutefois insuffisant de distribuer les trois termes entre trois idées indépendantes. Yan Fu formule aussi : « 求其信已大难矣，顾信矣不达，虽译犹不译也 » — obtenir la fidélité est déjà très difficile ; mais une version fidèle qui ne fait pas parvenir le sens équivaut encore à ne pas traduire. Plus loin, « 为达即所以为信也 » lie les deux exigences : travailler à l’intelligibilité, c’est aussi travailler à la fidélité.\n\nLe traducteur ne reçoit donc pas trois cases à remplir séparément. Il doit penser leurs relations. Yan Fu en donne une formulation qui rejoint particulièrement ma question : « 此在译者将全文神理，融会于心 » — cela dépend de la capacité du traducteur à assimiler intérieurement l’esprit et l’organisation du texte entier. Cette saisie d’ensemble intervient au moment même où il discute l’ordre des mots, les incises et les risques d’omission. La compréhension globale n’est pas posée à la place du travail syntaxique ; elle est ce qui doit l’orienter.\n\nIl faut enfin conserver le caractère situé de 雅. Chez Yan Fu, l’élégance ne désigne pas seulement une beauté universelle du style : elle engage notamment le choix d’une langue classique et les attentes de lecteurs lettrés. Sa théorie exprime ainsi une relation entre le texte étranger, les ressources historiques du chinois et une communauté de réception. C’est en ce sens que les termes hérités continuent d’agir : leur reprise les transforme autant qu’elle les prolonge."],"zh":["清末，严复以“信、达、雅”重新组织忠实、通达与文雅的要求，以回应新的翻译实践。在《天演论·译例言》中，他写道：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"yanfu-classics\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">《易》曰：“修辞立诚。”子曰：“辞达而已。”又曰：“言之无文，行之不远。”三曰乃文章正轨，亦即为译事楷模。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-14-1\" href=\"#xiang-zh-note-14\" role=\"doc-noteref\">14</a></sup> 最后一句尤其关键：这三句话是“文章正轨”，也成为“译事楷模”。文本由此亲自说出了我所考察的转换。已经具有文学与道德权威的标准，被用于思考外国知识的传达。\n\n但如果仅仅把三个字分派给三个相互独立的观念，仍然不足以理解它们。严复还写道：“求其信已大难矣，顾信矣不达，虽译犹不译也。”求信已难，而信却不达，仍与未译相近。稍后，“为达即所以为信也”又将二者联系起来：经营通达，也就是实现忠实的一种方式。\n\n因此，译者面对的不是三个需要分别填满的格子，而是它们之间的关系。严复还有一句尤其贴近本文的问题：“此在译者将全文神理，融会于心。”这里要求译者从内在把握全文的精神与组织。而他恰恰是在讨论语序、插入成分和删削可能造成的遗漏时，提出这种整体理解。整体把握并非取代句法工作，而应当为其提供方向。\n\n最后，还应保留“雅”在严复论述中的具体历史含义。它并不只意味着某种普遍的文体美，也涉及古典语言的选择，以及文人读者的期待。因此，他的理论表达了外国文本、汉语的历史资源与接受群体之间的关系。继承而来的词语正是在这个意义上继续发挥作用：它们的复用，既是延续，也是改造。"],"en":["In the late Qing, Yan Fu’s triad—信, 达, 雅, *xin*, *da*, *ya*—reconfigured demands for fidelity, intelligibility and elegance in response to new translation projects. In the “Remarks on Translation” accompanying his *Tianyan lun*, he writes:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"yanfu-classics\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">《易》曰：“修辞立诚。”子曰：“辞达而已。”又曰：“言之无文，行之不远。”三曰乃文章正轨，亦即为译事楷模。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>The Yi says: “Work on expression to establish sincerity.” The Master says: “Let the words convey their meaning: that is enough.” He also says: “Without cultivation of expression, words do not travel far.” These three sayings establish the proper course of writing; they are also models for translation.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-14-1\" href=\"#xiang-en-note-14\" role=\"doc-noteref\">14</a></sup> The final proposition is decisive: the three sayings constitute the proper course of writing and become models for translation. The text thus explicitly names the transfer under examination. Criteria already invested with literary and moral authority are used to think about the transmission of foreign knowledge.\n\nIt would be inadequate, however, to distribute the three terms among three independent ideas. Yan Fu also writes: “求其信已大难矣，顾信矣不达，虽译犹不译也”—fidelity is already difficult to achieve; but a faithful version that fails to convey its meaning still amounts to not translating. Later, “为达即所以为信也” links the two requirements: working towards intelligibility is also a means of achieving fidelity.\n\nThe translator is therefore not given three boxes to fill separately, but must consider their relationships. Yan Fu offers a formulation particularly close to my question: “此在译者将全文神理，融会于心”—this depends on the translator’s inward assimilation of the whole text’s spirit and organisation. This grasp of the whole arises precisely while he discusses word order, parenthetical clauses and the risks of omission. Overall understanding does not replace syntactic work: it is meant to guide it.\n\nThe historically situated character of 雅 must also be retained. For Yan Fu, elegance does not mean only a universal beauty of style: it involves the choice of classical language and the expectations of learned readers. His theory thus expresses a relationship between the foreign text, Chinese’s historical resources and a receiving community. Inherited terms remain active in this sense: their reuse transforms as well as continues them."]}},{"title":{"fr":"2. Fu Lei : la traduction comme copie d’un tableau","zh":"2. 傅雷：翻译如临画","en":"2. Fu Lei: Translation as Copying a Painting"},"paragraphs":{"fr":["Dans la partie de mon mémoire consacrée à Fu Lei, je retrouvais cette relation entre compréhension d’ensemble et travail de la forme à travers le couple 神似 / 形似, *shensi* et *xingsi*. Sa préface à la retraduction du *Père Goriot*, en 1951, donne à cette relation une image :\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"fulei\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">以效果而论，翻译应当像临画一样，所求的不在形似而在神似。</p>\n<p class=\"quoted-translation\" lang=\"fr\"><em>À considérer l’effet produit, la traduction doit être semblable à la copie d’un tableau : ce que l’on recherche n’est pas la ressemblance formelle, mais la ressemblance spirituelle.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-fr-ref-15-1\" href=\"#xiang-fr-note-15\" role=\"doc-noteref\">15</a></sup> Le début de la phrase mérite d’être retenu : « 以效果而论 », « à considérer l’effet produit ». La comparaison ne vise pas seulement un sens abstrait détachable de l’œuvre. Elle engage ce que la traduction parvient à faire éprouver. Par « ressemblance spirituelle », j’entends ici l’exigence que le texte traduit s’approche de l’original quant à son esprit, son atmosphère, son émotion et son effet esthétique global, plutôt que de s’attacher exclusivement à une correspondance terme à terme.\n\nLes champs sémantiques de 神 et de 形 aident à préciser cette lecture. Le premier peut évoquer l’esprit, l’animation, la présence et le souffle esthétique ; le second, la forme, la configuration, le corps et l’apparence. Les traduire par « âme » et « corps » imposerait trop vite une dualité qui n’épuise pas leur fonctionnement dans le jugement artistique. La question est celle du rapport entre la présence que fait surgir une œuvre et les formes par lesquelles elle la produit.\n\nLe détour par la peinture n’est donc pas un simple agrément. Il fournit un modèle de jugement : la reproduction d’éléments reconnaissables peut manquer ce qui anime l’ensemble. Pour la traduction, cette comparaison déplace l’attention vers les rapports entre les détails, leur rythme et leur effet. Elle n’autorise pas à baptiser « esprit » tout ce que le traducteur préfère ; elle exige de montrer ce qui, dans les choix concrets, rend l’œuvre plus ou moins présente.\n\nJe vois dans ce rapprochement un prolongement de la question du *xiang*. Une proposition théorique peut se formuler par une image artistique sans cesser d’être une proposition sur le travail du traducteur. L’image établit une relation et suscite un critère. Son efficacité ne dispense pas de l’analyse : elle l’appelle. C’est pourquoi la réflexion sur l’esprit du texte doit revenir à la comparaison précise des traductions, telle que je la mène à propos de *Chun wang* de Du Fu."],"zh":["在硕士论文讨论傅雷的部分，我通过“神似”与“形似”这一对概念，再次遇到了整体理解与形式经营之间的关系。傅雷在1951年的《〈高老头〉重译本序》中，以一个形象呈现了这一关系：\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"fulei\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">以效果而论，翻译应当像临画一样，所求的不在形似而在神似。</p>\n\n</blockquote>\n\n<sup><a id=\"xiang-zh-ref-15-1\" href=\"#xiang-zh-note-15\" role=\"doc-noteref\">15</a></sup> 句首的“以效果而论”值得保留。这个比较，并不只指向可以脱离作品而存在的抽象意义，还涉及译文使读者感受到什么。我在这里所说的“神似”，是要求译文在精神、氛围、情感和整体审美效果上接近原作，而不是只执着于逐词对应。\n\n“神”与“形”的语义范围，有助于说明这种理解。前者可以涉及精神、生气、神采与审美气息；后者可以涉及形式、组织、身体和外观。若直接将二者译为“灵魂”与“肉体”，便过早地强加了一种二元关系，不能穷尽它们在艺术评价中的作用。问题在于：作品所唤起的神采，与使这种神采得以呈现的形式，究竟是什么关系？\n\n因此，借绘画谈翻译，并不只是增添趣味。它提供了一种判断方式：即使复制了可辨认的局部，也可能失去贯通整体的生气。对于翻译，这一比较把注意力引向细节之间的关系、节奏及其作用。它并未授权译者将自己的偏好命名为“精神”；它要求我们说明，具体选择如何使作品的神采得到或失去呈现。\n\n我在这一比较中看到了“象
