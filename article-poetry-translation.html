he relations from which that meaning emerges.\n\n“Translation-as-exposition” extends this finding. One interpretation can become explicit in the French poem while other possibilities remain accessible elsewhere on the page. Translation must then be assessed at the level of its presentation as well as its lines. Fidelity cannot be measured only by the words retained; it also involves what the reader is enabled to understand, feel and reconsider.\n\nThis case study thus preserves the central hypothesis of my thesis: poetic translation is a situated act of rewriting. Examining its choices moves beyond the search for a single, definitive version towards the reading experiences each translator makes possible."]}}]},{"id":"poetry-chunwang-notes","title":{"fr":"Notes","zh":"注释","en":"Notes"},"units":[{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"paragraphs":{"fr":["<p id=\"pcw-fr-note-1\" role=\"doc-endnote\"><strong>1.</strong> Du Fu, « 春望 ». Texte chinois reproduit en caractères simplifiés ; voir François Cheng, <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>, Paris, Seuil, édition de 1982 citée dans le mémoire, p. 182. La note de Cheng situe le poème au printemps 757 et expose deux lectures des vers 3 et 4. Voir aussi les questions de lecture dans Michael A. Fuller, <em>An Introduction to Chinese Poetry</em>, Cambridge (Massachusetts), Harvard University Asia Center, 2017, p. 235. <a href=\"#pcw-fr-ref-1-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-fr-note-2\" role=\"doc-endnote\"><strong>2.</strong> Stephen Owen, « The View in Spring », dans <em>An Anthology of Chinese Literature: Beginnings to 1911</em>, New York et Londres, W. W. Norton, 1996, p. 420. Le distique est également reproduit sous le nom d’Owen dans Fuller, <em>An Introduction to Chinese Poetry</em>, 2017, p. 235 ; les mots et la ponctuation cités ici suivent cette reproduction. <a href=\"#pcw-fr-ref-2-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-fr-note-3\" role=\"doc-endnote\"><strong>3.</strong> Wai-lim Yip, « Spring Scene », dans <em>Chinese Poetry: An Anthology of Major Modes and Genres</em>, 2e édition révisée, Durham et Londres, Duke University Press, 1997, p. 191. Les numéros de vers de l’édition ne sont pas repris dans la citation. <a href=\"#pcw-fr-ref-3-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-fr-note-4\" role=\"doc-endnote\"><strong>4.</strong> Xu Yuanchong, « Spring View », dans <em>许渊冲译古今诗歌一百首 / 100 Selected Poems</em>, édité par Yao Renxiang, Pékin, 中译出版社, 2021, édition électronique, p. 130–133, selon la référence et la transcription conservées dans les annexes du mémoire. La présente citation conserve notamment « o’er » ; elle n’est pas remplacée par une variante provenant d’une autre édition. <a href=\"#pcw-fr-ref-4-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-fr-note-5\" role=\"doc-endnote\"><strong>5.</strong> François Cheng, « Printemps captif », dans <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>, Paris, Seuil, édition de 1982 citée dans le mémoire, p. 182–183. La transcription, la glose et la note sont situées p. 182. Les extraits de la version poétique suivent la transcription donnée dans les annexes du mémoire. Les barres de la glose et les retours à la ligne du poème français sont conservés. <a href=\"#pcw-fr-ref-5-1\" role=\"doc-backlink\">↩</a></p>","Extrait remanié d’un mémoire de master. Les versions chinoise et anglaise traduisent la présente étude française. Les textes poétiques cités restent dans leur langue de citation : ils constituent les pièces de la comparaison et ne sont pas retraduits selon la langue de lecture."],"zh":["<p id=\"pcw-zh-note-1\" role=\"doc-endnote\"><strong>1.</strong> 杜甫《春望》。此处中文统一为简体字；参见 François Cheng，<em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>，巴黎：Seuil，原论文所引1982年版，第182页。程抱一的注释将本诗系于757年春，并说明第三、四句的两种解释。另参见 Michael A. Fuller，<em>An Introduction to Chinese Poetry</em>，Cambridge（Massachusetts）：Harvard University Asia Center，2017，第235页的阅读问题。 <a href=\"#pcw-zh-ref-1-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-zh-note-2\" role=\"doc-endnote\"><strong>2.</strong> Stephen Owen，« The View in Spring »，载 <em>An Anthology of Chinese Literature: Beginnings to 1911</em>，纽约、伦敦：W. W. Norton，1996，第420页。该联亦以欧文署名转载于 Fuller，<em>An Introduction to Chinese Poetry</em>，2017，第235页；此处引文的词语与标点依照该转载页。 <a href=\"#pcw-zh-ref-2-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-zh-note-3\" role=\"doc-endnote\"><strong>3.</strong> Wai-lim Yip，« Spring Scene »，载 <em>Chinese Poetry: An Anthology of Major Modes and Genres</em>，修订第二版，Durham、伦敦：Duke University Press，1997，第191页。引文未保留该版印出的诗行编号。 <a href=\"#pcw-zh-ref-3-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-zh-note-4\" role=\"doc-endnote\"><strong>4.</strong> 许渊冲，« Spring View »，载《许渊冲译古今诗歌一百首 / 100 Selected Poems》，姚任祥编，北京：中译出版社，2021，电子版，第130—133页，依据硕士论文附录所录文本及其出处。此处保留“o’er”等写法，不以其他版本的异文替换。 <a href=\"#pcw-zh-ref-4-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-zh-note-5\" role=\"doc-endnote\"><strong>5.</strong> François Cheng，« Printemps captif »，载 <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>，巴黎：Seuil，原论文所引1982年版，第182—183页。音译、逐词释义与注释位于第182页。法语诗歌译文节录依据原论文附录中的转录；保留释义中的分隔线与法语诗篇的分行。 <a href=\"#pcw-zh-ref-5-1\" role=\"doc-backlink\">↩</a></p>","硕士论文修订节选。中英文分析正文均译自本篇法文稿。所比较的诗歌引文保留引用语言，不随页面阅读语言重新翻译，以便读者直接核对分析依据。"],"en":["<p id=\"pcw-en-note-1\" role=\"doc-endnote\"><strong>1.</strong> Du Fu, “春望”. The Chinese text is reproduced in simplified characters; see François Cheng, <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>, Paris: Seuil, 1982 edition cited in the thesis, p. 182. Cheng’s note dates the poem to spring 757 and sets out two readings of lines 3 and 4. See also the reading questions in Michael A. Fuller, <em>An Introduction to Chinese Poetry</em>, Cambridge, Massachusetts: Harvard University Asia Center, 2017, p. 235. <a href=\"#pcw-en-ref-1-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-en-note-2\" role=\"doc-endnote\"><strong>2.</strong> Stephen Owen, “The View in Spring”, in <em>An Anthology of Chinese Literature: Beginnings to 1911</em>, New York and London: W. W. Norton, 1996, p. 420. The couplet is also reproduced under Owen’s name in Fuller, <em>An Introduction to Chinese Poetry</em>, 2017, p. 235; the wording and punctuation quoted here follow that reproduction. <a href=\"#pcw-en-ref-2-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-en-note-3\" role=\"doc-endnote\"><strong>3.</strong> Wai-lim Yip, “Spring Scene”, in <em>Chinese Poetry: An Anthology of Major Modes and Genres</em>, 2nd revised edition, Durham and London: Duke University Press, 1997, p. 191. The edition’s line numbers are omitted from the quotation. <a href=\"#pcw-en-ref-3-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-en-note-4\" role=\"doc-endnote\"><strong>4.</strong> Xu Yuanchong, “Spring View”, in <em>许渊冲译古今诗歌一百首 / 100 Selected Poems</em>, edited by Yao Renxiang, Beijing: 中译出版社, 2021, electronic edition, pp. 130–133, following the reference and transcription preserved in the thesis appendices. The quotation retains “o’er” rather than substituting a variant from another edition. <a href=\"#pcw-en-ref-4-1\" role=\"doc-backlink\">↩</a></p>\n\n<p id=\"pcw-en-note-5\" role=\"doc-endnote\"><strong>5.</strong> François Cheng, “Printemps captif”, in <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>, Paris: Seuil, 1982 edition cited in the thesis, pp. 182–183. The transcription, gloss and note appear on p. 182. Extracts from the poetic version follow the transcription in the thesis appendices. The gloss’s dividing strokes and the French poem’s line breaks are retained. <a href=\"#pcw-en-ref-5-1\" role=\"doc-backlink\">↩</a></p>","Revised excerpt from a master’s thesis. The Chinese and English analyses are translated from the present French study. Quoted poetic texts remain in the language in which they are cited: they are the evidence being compared and are not retranslated when the reading language changes."]}}]},{"id":"poetry-chunwang-bibliography","title":{"fr":"Bibliographie","zh":"参考文献","en":"Bibliography"},"units":[{"title":{"fr":"Bibliographie","zh":"参考文献","en":"Bibliography"},"paragraphs":{"fr":["Références des textes et des reproductions effectivement mobilisés dans cet extrait.\n\n- CHENG, François. <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>. Paris : Seuil, 1982 [première édition : 1977]. « Printemps captif », p. 182–183.\n- FULLER, Michael A. <em>An Introduction to Chinese Poetry: From the Canon of Poetry to the Lyrics of the Song Dynasty</em>. Cambridge, Massachusetts : Harvard University Asia Center, 2017. P. 234–235.\n- OWEN, Stephen, éd. et trad. <em>An Anthology of Chinese Literature: Beginnings to 1911</em>. New York et Londres : W. W. Norton, 1996. « The View in Spring », p. 420.\n- XU, Yuanchong 许渊冲. <em>许渊冲译古今诗歌一百首 / 100 Selected Poems</em>. YAO, Renxiang 姚任祥, éd. Pékin : 中译出版社, 2021. Édition électronique, p. 130–133.\n- YIP, Wai-lim, éd. et trad. <em>Chinese Poetry: An Anthology of Major Modes and Genres</em>. 2e édition révisée. Durham et Londres : Duke University Press, 1997. « Spring Scene », p. 191."],"zh":["以下仅列本节选实际使用的文本与转载来源。\n\n- CHENG, François. <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>. 巴黎 : Seuil, 1982 [初版 : 1977]. « Printemps captif », p. 182–183.\n- FULLER, Michael A. <em>An Introduction to Chinese Poetry: From the Canon of Poetry to the Lyrics of the Song Dynasty</em>. Cambridge, Massachusetts : Harvard University Asia Center, 2017. P. 234–235.\n- OWEN, Stephen, 编、译 <em>An Anthology of Chinese Literature: Beginnings to 1911</em>. 纽约、伦敦 : W. W. Norton, 1996. « The View in Spring », p. 420.\n- XU, Yuanchong 许渊冲. <em>许渊冲译古今诗歌一百首 / 100 Selected Poems</em>. YAO, Renxiang 姚任祥, 编 北京 : 中译出版社, 2021. 电子版, p. 130–133.\n- YIP, Wai-lim, 编、译 <em>Chinese Poetry: An Anthology of Major Modes and Genres</em>. 修订第二版. Durham、伦敦 : Duke University Press, 1997. « Spring Scene », p. 191."],"en":["References for the texts and reprints used in this excerpt.\n\n- CHENG, François. <em>L’Écriture poétique chinoise, suivi d’une anthologie des poèmes des T’ang</em>. Paris : Seuil, 1982 [first edition : 1977]. « Printemps captif », p. 182–183.\n- FULLER, Michael A. <em>An Introduction to Chinese Poetry: From the Canon of Poetry to the Lyrics of the Song Dynasty</em>. Cambridge, Massachusetts : Harvard University Asia Center, 2017. P. 234–235.\n- OWEN, Stephen, ed. and trans. <em>An Anthology of Chinese Literature: Beginnings to 1911</em>. New York and London : W. W. Norton, 1996. « The View in Spring », p. 420.\n- XU, Yuanchong 许渊冲. <em>许渊冲译古今诗歌一百首 / 100 Selected Poems</em>. YAO, Renxiang 姚任祥, ed. Beijing : 中译出版社, 2021. Electronic edition, p. 130–133.\n- YIP, Wai-lim, ed. and trans. <em>Chinese Poetry: An Anthology of Major Modes and Genres</em>. 2nd revised edition. Durham and London : Duke University Press, 1997. « Spring Scene », p. 191."]}}]}]}]};const state={mode:(()=>{const q=window.SiteLanguage?.requested?.();if(q)return q;const rm=window.SiteLanguage?.savedMode?.();if(rm==='triad'||rm==='parallel')return 'triad';return window.SiteLanguage?.saved?.()||'en';})()};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s,work,lang){let x=String(s||'');x=x.replace(/href="#note-(\d+)"/g,`href="#note-${work}-${lang}-$1"`).replace(/id="note-(\d+)"/g,`id="note-${work}-${lang}-$1"`);x=x.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return x;}
function md(raw,work,lang){let t=String(raw||'').trim();if(!t)return '';t=t.replace(/\r/g,'');const lines=t.split('\n');let out='',i=0;while(i<lines.length){if(!lines[i].trim()){i++;continue}if(/^---+$/.test(lines[i].trim())){i++;continue}if(lines[i].trim().startsWith('|')){let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){let l=lines[i].trim();if(!/^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(l))rows.push(l);i++}if(rows.length){const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>inline(x.trim(),work,lang));out+='<table><thead><tr>'+cells(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue}if(lines[i].trim().startsWith('>')){let q=[];while(i<lines.length&&lines[i].trim().startsWith('>')){q.push(lines[i].replace(/^\s*>\s?/,'').trim());i++}out+='<blockquote>'+q.map(x=>inline(x,work,lang)).join('<br>')+'</blockquote>';continue}let p=[];while(i<lines.length&&lines[i].trim()&&!lines[i].trim().startsWith('|')&&!lines[i].trim().startsWith('>')&&!/^---+$/.test(lines[i].trim())){p.push(lines[i]);i++}out+='<p>'+inline(p.join('<br>'),work,lang)+'</p>'}return out;}
function titleSpans(t,cls='paper-lang'){return `<span class="${cls} fr" data-lang="fr">${esc(t.fr)}</span><span class="${cls} zh" data-lang="zh">${esc(t.zh)}</span><span class="${cls} en" data-lang="en">${esc(t.en)}</span>`}
function heading(t){return `<div class="heading-lang fr" data-lang="fr">${esc(t.fr)}</div><div class="heading-lang zh" data-lang="zh">${esc(t.zh)}</div><div class="heading-lang en" data-lang="en">${esc(t.en)}</div>`}
function hasTable(unit){return Object.values(unit.paragraphs||{}).some(a=>a.some(x=>x.includes('|---')||x.includes('| ---')))}
function renderUnit(unit,wid,ui,showHeading){let h=showHeading&&unit.title?`<h3 class="unit-heading">${heading(unit.title)}</h3>`:'';if(hasTable(unit)){return h+'<div class="table-stack">'+['fr','zh','en'].map(l=>`<div class="table-language" data-lang="${l}"><span class="table-label">${l==='fr'?'Français':l==='zh'?'中文':'English'}</span>${(unit.paragraphs[l]||[]).map(x=>md(x,wid,l)).join('')}</div>`).join('')+'</div>'}return h+`<div class="triad"><div class="lang-column zh" data-lang="zh">${(unit.paragraphs.zh||[]).map(x=>md(x,wid,'zh')).join('')}</div><div class="lang-column fr" data-lang="fr">${(unit.paragraphs.fr||[]).map(x=>md(x,wid,'fr')).join('')}</div><div class="lang-column en" data-lang="en">${(unit.paragraphs.en||[]).map(x=>md(x,wid,'en')).join('')}</div></div>`}
function render(){const root=$('#reading');root.innerHTML='';const toc=$('#toc-list');toc.innerHTML='';POETRY_DATA.works.forEach((w,wi)=>{const wb=document.createElement('article');wb.className='work-block';wb.id='work-'+w.id;wb.innerHTML=`<header class="work-title"><div class="paper-kicker">0${wi+1}</div>${titleSpans(w.title)}<div class="work-meta">${(w.meta||[]).filter(x=>String(x).trim()!=='---').map(x=>md(x,w.id,'fr')).join('')}</div></header>`;const nav=document.createElement('div');nav.className='toc-work';nav.innerHTML=`<a href="#work-${w.id}">${titleSpans(w.title,'toc-lang')}</a>`;const sections=document.createElement('div');sections.className='toc-sections';if(w.sections.length){const t=document.createElement('button');t.className='toc-toggle';t.type='button';t.textContent='章节 / Sections / Sections';t.addEventListener('click',()=>{sections.classList.toggle('open')});nav.append(t)}w.sections.forEach((sec,si)=>{const se=document.createElement('section');se.className='section';se.id=`${w.id}-section-${si+1}`;se.innerHTML=`<h2 class="section-heading">${heading(sec.title)}</h2>`;sec.units.forEach((u,ui)=>{const a=document.createElement('a');a.className='toc-main';a.href='#'+(sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id);a.innerHTML=titleSpans(u.title,'toc-lang');sections.append(a);const article=document.createElement('article');article.className='unit';article.id=sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id;article.innerHTML=renderUnit(u,w.id,`${si}-${ui}`,sec.units.length>1&&ui>0);se.append(article)});wb.append(se)});root.append(wb);nav.append(sections);toc.append(nav)});applyMode()}
function applyMode(){document.body.classList.toggle('single-mode',state.mode!=='triad');$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$$('[data-lang]').forEach(el=>{const isTocTitle=el.classList.contains('toc-lang');el.classList.toggle('active',isTocTitle||state.mode==='triad'||el.dataset.lang===state.mode)});localStorage.setItem('poetry-translation-mode',state.mode)}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>{const y=scrollY;state.mode=b.dataset.mode; if(window.SiteLanguage){if(state.mode==='triad')SiteLanguage.setMode('triad');else SiteLanguage.set(state.mode);} applyMode();requestAnimationFrame(()=>scrollTo({top:y,behavior:'instant'}))}));
const drawer=$('#toc-drawer'),backdrop=$('#toc-backdrop');function closeToc(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}function openToc(){drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false')}$('#toc-open').addEventListener('click',openToc);$('#toc-close').addEventListener('click',closeToc);backdrop.addEventListener('click',closeToc);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeToc()});$('#toc-list').addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();closeToc();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})}});
render();
</script><script src="js/article-end-nav.js"></script>
