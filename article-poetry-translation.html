”的问题的延伸。理论命题可以借艺术形象表达自身，而依然是关于译者工作的命题。形象建立关系，并引出判断标准；它的效力并不免除分析，而是召唤分析。因此，对文本精神的讨论必须回到译本的具体比较，正如我在杜甫《春望》的研究中所做的那样。"],"en":["In the part of my thesis devoted to Fu Lei, I encountered this relationship between overall understanding and formal work again through the pair 神似 / 形似, *shensi* and *xingsi*. His 1951 preface to his retranslation of *Le Père Goriot* gives this relationship an image:\n\n<blockquote data-role=\"quoted-evidence\" data-quote-key=\"fulei\">\n<p class=\"quoted-source\" lang=\"zh-Hans\">以效果而论，翻译应当像临画一样，所求的不在形似而在神似。</p>\n<p class=\"quoted-translation\" lang=\"en\"><em>In terms of the effect produced, translation should be like copying a painting: what is sought is not likeness in form, but likeness in spirit.</em></p>\n</blockquote>\n\n<sup><a id=\"xiang-en-ref-15-1\" href=\"#xiang-en-note-15\" role=\"doc-noteref\">15</a></sup> The opening phrase matters: “以效果而论”, “in terms of the effect produced”. The comparison does not concern only an abstract meaning detachable from the work. It involves what the translation enables its readers to experience. By “likeness in spirit”, I mean the requirement that the translation approach the original’s spirit, atmosphere, emotion and overall aesthetic effect, rather than focus exclusively on correspondence term by term.\n\nThe semantic fields of 神 and 形 help clarify this reading. The former can evoke spirit, animation, presence and aesthetic vitality; the latter, form, configuration, body and appearance. Translating them as “soul” and “body” would too quickly impose a duality that does not exhaust their operation in artistic judgement. The question concerns the relationship between the presence a work brings forth and the forms through which it produces it.\n\nThe detour through painting is therefore more than a pleasing embellishment. It supplies a model of judgement: reproducing recognisable elements can miss what animates the whole. In translation, the comparison directs attention to relationships between details, their rhythm and their effect. It does not entitle translators to call whatever they prefer the work’s “spirit”; it requires them to show how concrete choices make the work’s presence more or less perceptible.\n\nI see this comparison as an extension of the question of *xiang*. A theoretical proposition may take the form of an artistic image while remaining a proposition about the translator’s work. The image establishes a relationship and generates a criterion. Its efficacy does not dispense with analysis: it calls for it. Thinking about a text’s spirit must therefore return to the detailed comparison of translations, as I do in my study of Du Fu’s *Chun wang*."]}}]},{"id":"xiang-v","title":{"fr":"V. Reconnaître une pensée sans l’enfermer dans un modèle","zh":"五、如何承认一种思想，而不将其锁入单一模型","en":"V. Recognising a Tradition of Thought Without Confining It to a Model"},"units":[{"title":{"fr":"V. Reconnaître une pensée sans l’enfermer dans un modèle","zh":"五、如何承认一种思想，而不将其锁入单一模型","en":"V. Recognising a Tradition of Thought Without Confining It to a Model"},"paragraphs":{"fr":["Les notions que j’ai examinées ne forment pas un lexique aux valeurs définitivement fixées. Un mot tel que 文 peut soutenir l’éloge d’un raffinement et la critique de son excès ; 质 peut nommer une qualité recherchée ou une rudesse qui entrave la compréhension. Les termes qui gravitent autour d’eux — 直, 信, 朴, 美, 雅, 饰, 华, 史, 野, 烦 — prennent leur force dans leurs rapprochements et leurs oppositions. On ne saurait en faire deux listes, l’une toujours positive, l’autre toujours négative, ni deux écoles immuables.\n\nCheung parle à ce propos d’un « network of semantic resonance », un réseau de résonance sémantique.<sup><a id=\"xiang-fr-ref-16-1\" href=\"#xiang-fr-note-16\" role=\"doc-noteref\">16</a></sup> Dans mon mémoire, je retenais ce mouvement : par leur répétition, certains termes acquièrent une connotation et une texture particulières, résonnent avec des termes apparentés et contribuent à former un champ conceptuel. Cette manière de produire de la pensée possède, à mes yeux, une beauté poétique intrinsèque. Un concept ne vaut pas seulement par la définition qui l’isole, mais aussi par la constellation d’usages qui lui donne de l’épaisseur.\n\nCela ne dispense pas d’examiner les arguments. Dans les textes étudiés, les opérations sont repérables : le *Xici* articule une difficulté et une réponse ; le *Zhuangzi* raisonne par comparaisons ; la préface du *Faju jing* rapporte une objection, une réponse et une décision ; Dao An distingue des types de pertes ; Yan Fu expose des relations entre les critères. Leur concision, leur usage de l’image ou leur appui sur les classiques ne les placent pas hors de la pensée analytique.\n\nJe conserve donc ma comparaison entre des modes d’expression théorique, tout en précisant ce qu’elle permet d’affirmer. Dans le corpus chinois examiné ici, une part importante du raisonnement passe par la formule, l’exemple, l’analogie artistique et le déplacement de notions héritées. Les modèles contemporains d’équivalence ou de fonction étudiés ailleurs dans mon mémoire présentent souvent leurs objets sous la forme de distinctions et de catégories plus explicitement organisées. Comparer ces dispositifs est fécond ; les transformer en deux essences — une Chine intuitive et un Occident exclusivement logique — empêcherait au contraire de lire leurs différences internes. Les classifications de Dao An suffisent à montrer ce que cette opposition laisserait de côté.\n\nÀ mon sens, les productions intellectuelles issues de contextes culturels différents ne devraient pas être évaluées uniquement à l’aune des normes d’une culture dominante. Une absence de terminologie uniformisée ne prouve pas une absence de réflexion ; inversement, l’ancienneté ou la densité poétique d’une formule ne la met pas à l’abri de la critique. La tâche consiste à restituer la manière dont elle produit une distinction, soutient une décision ou se transforme lorsqu’elle est citée.\n\nCette exigence concerne aussi la traduction de la théorie. La démarche de « traduction épaisse » adoptée par Cheung, qui accompagne les textes de commentaires et d’explications, permet de rendre visibles les écarts que ferait disparaître une équivalence trop rapide.<sup><a id=\"xiang-fr-ref-17-1\" href=\"#xiang-fr-note-17\" role=\"doc-noteref\">17</a></sup> Garder *xiang*, *wen* ou *zhi* avec leurs caractères n’est pas cultiver leur obscurité : c’est laisser au lecteur la possibilité d’observer leurs déplacements. Une traduction qui convertirait partout 文 en « forme » et 质 en « contenu » simplifierait peut-être la lecture, mais risquerait d’écrire à la place du texte une autre histoire de ses concepts."],"zh":["本文考察的概念，并不组成一套价值已经永久固定的词汇。“文”可以支持对精致表达的赞许，也可以进入对过度修饰的批评；“质”可以命名一种值得追求的品质，也可能指向妨碍理解的粗朴。围绕它们出现的“直、信、朴、美、雅、饰、华、史、野、烦”等词，其作用产生于相互关联与对立之中。不能将它们分成永远正面与永远负面的两张清单，也不能据此设定两个不变的流派。\n\nCheung 将这种关联称为“network of semantic resonance”，即“语义共振的网络”。<sup><a id=\"xiang-zh-ref-16-1\" href=\"#xiang-zh-note-16\" role=\"doc-noteref\">16</a></sup> 在论文中，我所重视的正是这一过程：词语在反复使用中形成特定的意味与质地，与相近词语产生回响，进而参与构成概念场。在我看来，这种思想形成的方式，具有内在的诗性之美。概念的价值不仅在于将它单独界定的定义，也在于赋予它厚度的一组相互关联的用法。\n\n这并不意味着免于检验论证。在所分析的文本中，思考的步骤仍然可以辨识：《系辞》提出困难并予以回应；《庄子》借类比展开推理；《法句经序》记录异议、回答与决定；道安区分损失的类型；严复说明不同标准之间的关系。言辞凝练、使用形象或依凭经典，都不使它们处于分析性思考之外。\n\n因此，我保留对理论表达方式的比较，同时说明这一比较能够支持什么结论。在本文考察的中国材料中，相当一部分论证通过格言、例证、艺术比喻和旧有概念的转用来展开；我在论文其他部分考察的现代等值、功能等模型，则往往以更明确组织的区分与范畴呈现研究对象。比较这些表达机制是有意义的；但若把它们变成“中国只重直觉、西方只重逻辑”的两种本质，就会妨碍我们辨认各自内部的差异。道安的分类本身，已足以显示这种对立会漏掉什么。\n\n在我看来，不同文化背景中形成的思想成果，不应仅仅按照某一种占据主导地位的文化的标准加以衡量。缺少统一术语，不等于缺少思考；反过来，一句话的古老或诗意，也不能使它免受批评。我们需要还原的是，它如何作出区分、支持决定，又如何在被引用时发生变化。\n\n这一要求同样适用于理论的翻译。Cheung 采用的“厚翻译”方式，以解释和注释伴随文本，使过快建立对应关系可能抹去的差异重新可见。<sup><a id=\"xiang-zh-ref-17-1\" href=\"#xiang-zh-note-17\" role=\"doc-noteref\">17</a></sup> 保留 *xiang*、*wen*、*zhi* 及其汉字，并不是刻意维护晦涩，而是让读者有机会观察它们的变化。如果将“文”一律转换为“形式”，将“质”一律转换为“内容”，阅读也许会更轻松，却可能以另一种概念史替代了原有文本。"],"en":["The concepts examined here do not form a lexicon of permanently fixed values. A word such as 文 can support praise of refinement or criticism of its excess; 质 can name a desirable quality or a roughness that obstructs understanding. Terms surrounding them—直, 信, 朴, 美, 雅, 饰, 华, 史, 野, 烦—derive their force from connections and oppositions. They cannot be divided into two lists, one invariably positive and the other negative, or into two unchanging schools.\n\nCheung describes a “network of semantic resonance”.<sup><a id=\"xiang-en-ref-16-1\" href=\"#xiang-en-note-16\" role=\"doc-noteref\">16</a></sup> My thesis emphasised this movement: through repetition, terms acquire particular connotations and textures, resonate with related terms and help form a conceptual field. This way of producing thought possesses, in my view, an intrinsic poetic beauty. A concept matters not only for the definition isolating it, but also for the constellation of uses that gives it depth.\n\nThis does not remove the need to examine arguments. In these texts, operations of thought remain identifiable: the *Xici* articulates a difficulty and a response; the *Zhuangzi* reasons through comparisons; the *Faju jing* preface records an objection, a reply and a decision; Dao An distinguishes types of loss; Yan Fu describes relationships between criteria. Concision, images and appeals to the classics do not place them outside analytical thought.\n\nI therefore retain my comparison of modes of theoretical expression while specifying what it establishes. In the Chinese corpus examined here, much reasoning proceeds through maxims, examples, artistic analogies and the redeployment of inherited concepts. The contemporary models of equivalence or function considered elsewhere in my thesis often present their objects through more explicitly organised distinctions and categories. Comparing these arrangements is productive; turning them into two essences—an intuitive China and an exclusively logical West—would prevent us from reading their internal differences. Dao An’s classifications already show what that opposition would leave out.\n\nIn my view, intellectual productions arising from different cultural contexts should not be evaluated solely by the standards of a dominant culture. An absence of uniform terminology does not establish an absence of thought. Conversely, neither a formulation’s antiquity nor its poetic density protects it from criticism. The task is to reconstruct how it produces a distinction, supports a decision or changes through being quoted.\n\nThis requirement also concerns the translation of theory. Cheung’s practice of “thick translation”, accompanying texts with commentary and explanation, makes visible differences that a hasty equivalence would erase.<sup><a id=\"xiang-en-ref-17-1\" href=\"#xiang-en-note-17\" role=\"doc-noteref\">17</a></sup> Retaining *xiang*, *wen* or *zhi* alongside their characters does not cultivate obscurity: it allows readers to observe their shifts. A translation that consistently converted 文 into “form” and 质 into “content” might simplify reading, but could end up replacing the text with a different history of its concepts."]}}]},{"id":"xiang-conclusion","title":{"fr":"Conclusion — Traduire sans épuiser","zh":"结语：翻译，而不以穷尽为前提","en":"Conclusion — Translating Without Exhausting"},"units":[{"title":{"fr":"Conclusion — Traduire sans épuiser","zh":"结语：翻译，而不以穷尽为前提","en":"Conclusion — Translating Without Exhausting"},"paragraphs":{"fr":["Ce parcours confirme, à mes yeux, la fécondité de la question posée par le *xiang*. La limite de l’expression n’impose pas de renoncer à comprendre. Elle conduit à chercher des formes capables de faire saisir un rapport, une organisation, un souffle, sans prétendre reconstituer une totalité immédiatement disponible.\n\nLes textes étudiés montrent aussi comment cette question rencontre l’histoire. Des traducteurs citent les sages pour justifier leurs choix ; Dao An reprend les termes de 文 et de 质, et mobilise l’image de Hundun ; Yan Fu fait des règles de l’écriture des modèles de traduction ; Fu Lei formule son exigence à travers la pratique picturale. La continuité ne réside pas dans une doctrine restée identique, mais dans des ressources reprises, discutées et réorientées.\n\nJe maintiens ainsi le cœur de mon interprétation : la pensée chinoise de la traduction ne se comprend pas pleinement si l’on sépare ses décisions techniques de ses langages philosophiques, moraux et esthétiques. Ce qui paraît parfois une métaphore trop ouverte peut être le lieu où ces dimensions se rencontrent. L’analyser exige de conserver sa richesse, puis de montrer précisément comment elle travaille.\n\nComprendre cela transforme aussi mon idée de la traduction poétique. Il ne s’agit pas seulement de transmettre un énoncé, mais de dialoguer avec une œuvre à travers les langues, les époques et les cultures. Cette ambition n’allège pas l’exigence du détail : elle lui donne sa direction. Approcher le tout sans prétendre le posséder, et rendre compte des formes choisies pour cette approche — c’est là que je situe le travail du traducteur."],"zh":["在我看来，上述考察确认了“象”这一问题的丰饶。表达的限度，并不要求我们放弃理解；它促使我们寻找能够把握关系、组织与气息的形式，而不宣称可以重建一个随时完整可得的整体。\n\n这些文本也说明，这一问题如何进入历史。译者引用圣贤，为选择提供依据；道安使用“文”“质”的概念，并借助浑沌的形象；严复将文章准则转为翻译范式；傅雷借绘画实践表达自己的要求。延续并不意味着一套始终不变的学说，而体现为思想资源的重新使用、讨论与转向。\n\n我由此保留自己的核心判断：如果将技术选择与其哲学、道德及审美语言割裂开来，就无法充分理解中国的翻译思想。某些看起来过于开放的比喻，恰恰可能是这些维度相遇的地方。分析它们，既需要保留其丰富性，也需要具体说明它们如何发挥作用。\n\n这样的理解，也改变了我对诗歌翻译的看法。翻译不只是传递一句话，而是跨越语言、时代与文化，同一部作品展开对话。这种抱负并未减轻对细节的要求，反而给予细节工作以方向：接近整体，而不宣称占有整体，并说明为了接近它而作出的形式选择——我将译者的工作放在这里。"],"en":["This inquiry confirms, to my mind, the fruitfulness of the question posed by *xiang*. The limits of expression do not require us to abandon understanding. They prompt a search for forms capable of making a relationship, an organisation or a living movement apprehensible, without claiming to reconstruct an immediately available totality.\n\nThe texts also show how this question enters history. Translators quote the sages to justify their decisions; Dao An reuses *wen* and *zhi* and invokes the image of Hundun; Yan Fu turns standards of writing into models for translation; Fu Lei articulates his demand through pictorial practice. Continuity does not lie in an unchanged doctrine, but in resources taken up, debated and redirected.\n\nI therefore retain the core of my interpretation: Chinese thinking about translation cannot be fully understood if its technical decisions are separated from its philosophical, moral and aesthetic languages. What sometimes appears to be an excessively open metaphor may be the place where these dimensions meet. Analysing it requires preserving its richness and then showing precisely how it works.\n\nThis understanding also changes my conception of poetry translation. The task is not simply to transmit an utterance, but to enter into dialogue with a work across languages, periods and cultures. This ambition does not lessen the demand for attention to detail: it gives that attention its direction. Approaching the whole without claiming to possess it, and accounting for the forms chosen for that approach—this is where I locate the translator’s work."]}}]},{"id":"xiang-notes","title":{"fr":"Notes","zh":"注释","en":"Notes"},"units":[{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"paragraphs":{"fr":["<p id=\"xiang-fr-note-1\" role=\"doc-endnote\"><strong>1.</strong> Martha P. Y. Cheung, dir., <em>An Anthology of Chinese Discourse on Translation</em>, vol. 1, <em>From Earliest Times to the Buddhist Project</em>, Manchester et Kinderhook, St. Jerome Publishing, 2006, p. 21 et 26. Les remarques ici reformulées sont citées et référencées dans les notes 8, 11 et 23 du mémoire. Elles portent sur les ressources des discours ultérieurs, et non sur l’existence d’une théorie explicite de la traduction chez chacun des sages. <a href=\"#xiang-fr-ref-1-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-2\" role=\"doc-endnote\"><strong>2.</strong> <em>Daodejing</em>, chap. 1, texte transmis avec le commentaire de Wang Bi. <a href=\"https://zh.wikisource.org/zh-hans/道德經_(王弼本)\">Texte chinois</a>. La traduction française reprend, avec une ponctuation révisée, celle proposée dans le mémoire. Le Dao est étudié comme un problème de nomination et d’expression, non comme le synonyme d’un destin prédéterminé. <a href=\"#xiang-fr-ref-2-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-3\" role=\"doc-endnote\"><strong>3.</strong> <em>Zhouyi</em>, « Xici shang » 繫辞上, chap. 12. <a href=\"https://zh.wikisource.org/zh-hans/易傳/繫辭上\">Texte chinois</a>. Le texte présente ces paroles sous la forme « Le Maître dit » ; on distingue ici cette attribution traditionnelle d’une attribution historique certaine à Confucius. Pour les figures et les images évoquées par les paroles explicatives, voir Cheung, 2006, p. 33, passage transcrit dans la note 20 du mémoire. Les points de suspension signalent l’arrêt de l’extrait. <a href=\"#xiang-fr-ref-3-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-4\" role=\"doc-endnote\"><strong>4.</strong> <em>Zhuangzi</em>, « Waiwu » 外物, chap. 26. <a href=\"https://zh.wikisource.org/zh-hans/莊子/外物\">Texte chinois</a>. Le texte consulté porte 荃, employé pour la nasse, ailleurs écrit 筌. La citation et son développement sont ajoutés dans cette version pour expliciter la place du <em>Zhuangzi</em> dans le rapprochement proposé par le mémoire. Les traductions française et anglaise sont des traductions de travail de la présente version. <a href=\"#xiang-fr-ref-4-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-5\" role=\"doc-endnote\"><strong>5.</strong> « 大象无形 » figure au chapitre 41 du <em>Daodejing</em>. Les expressions 现象, 意象, 异象 et 表象 sont reprises de l’exploration lexicale du mémoire ; leur rapprochement est synchronique et interprétatif, non une démonstration de filiation étymologique. « Le grand symbole est sans forme » conserve le choix de traduction du mémoire ; il n’est pas présenté comme l’unique traduction possible. <a href=\"#xiang-fr-ref-5-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-6\" role=\"doc-endnote\"><strong>6.</strong> Cheung, 2006, remarque sur les « concept words », citée dans la note 22 du mémoire, avec le repère p. 23. On conserve ici l’attribution de cette observation à Cheung. Son application à la constellation d’emplois de 象 relève du développement de l’autrice. <a href=\"#xiang-fr-ref-6-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-7\" role=\"doc-endnote\"><strong>7.</strong> M. H. Abrams, <em>The Mirror and the Lamp: Romantic Theory and the Critical Tradition</em>, New York, Oxford University Press, 1953, chapitre liminaire « Orientation of Critical Theories ». La distinction entre œuvre, artiste, univers et public vient de ce schéma. L’analogie entre roman, résumé, récit oral et réécriture est celle de l’autrice du mémoire ; elle n’est pas attribuée à Abrams. <a href=\"#xiang-fr-ref-7-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-8\" role=\"doc-endnote\"><strong>8.</strong> <em>Daodejing</em>, chap. 81 ; pour les champs de 信 et 美, Cheung, 2006, p. 24, repère conservé dans la note 24 du mémoire. La traduction de 博 par l’étalage d’un vaste savoir explicite la lecture adoptée ici ; elle ne prétend pas être la seule traduction du caractère. <a href=\"#xiang-fr-ref-8-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-9\" role=\"doc-endnote\"><strong>9.</strong> <em>Lunyu</em> 論语 : « Xue er » 學而, 1.3 ; « Wei Ling Gong » 衛靈公, passage « 辞达而已矣 », couramment numéroté 15.41 ; « Yong ye » 雍也, 6.18. Voir aussi Cheung, 2006, p. 28–29, pour 文 et 质 et leur emploi ultérieur en traduction. Le numéro 15.18 donné pour « 辞达 » dans la note 27 du mémoire n’est pas repris. <a href=\"#xiang-fr-ref-9-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-10\" role=\"doc-endnote\"><strong>10.</strong> « Faju jing xu » 法句经序, dans Sengyou 僧祐, <em>Chu sanzang jiji</em> 出三藏记集, juan 7. <a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷七\">Texte chinois</a>. Le recueil indique « auteur non identifié » ; l’attribution à Zhi Qian est traditionnelle, d’où la formulation retenue dans le corps du texte. La citation du Bouddha est rapportée comme parole de Vighna dans cette préface, sans lui assigner une source indépendante. La graphie du nom 维祇难 est normalisée pour éviter le caractère défectueux de la transcription numérique. <a href=\"#xiang-fr-ref-10-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-11\" role=\"doc-endnote\"><strong>11.</strong> Dao An, « He Fangguang Guangzan lüejie xu » 合放光光赞略解序, dans <em>Chu sanzang jiji</em>, juan 7. <a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷七\">Texte chinois</a>. Les commentaires sur la concision du <em>Fangguang</em>, la complétude du <em>Guangzan</em> et leur complémentarité viennent de cette préface. L’application de 文 et 质 doit être lue dans ce contexte comparatif. <a href=\"#xiang-fr-ref-11-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-12\" role=\"doc-endnote\"><strong>12.</strong> Dao An, « Mohe boluore boluomi jing chao xu » 摩诃钵罗若波罗蜜经抄序, dans <em>Chu sanzang jiji</em>, juan 8. <a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷八\">Texte chinois</a>. Le classement porte sur 五失本 et 三不易. Le présent résumé conserve leur ordre et distingue notamment les trois sortes de répétitions ou de reprises. Le terme 胡 n’est pas remplacé automatiquement par « sanskrit » : il désigne ici la provenance étrangère des textes dans la terminologie du passage. <a href=\"#xiang-fr-ref-12-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-13\" role=\"doc-endnote\"><strong>13.</strong> Dao An, même préface, juan 8 ; rapprochement avec le <em>Zhuangzi</em>, « Yingdiwang » 應帝王, chap. 7. <a href=\"https://zh.wikisource.org/zh-hans/莊子/應帝王\">Récit de Hundun</a>. Les graphies 混沌 chez Dao An et 浑沌 dans le texte du <em>Zhuangzi</em> sont conservées. Ce développement est ajouté dans la présente version à partir du texte de Dao An, pour donner un exemple précis à la relation avec Zhuangzi proposée dans le mémoire. <a href=\"#xiang-fr-ref-13-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-14\" role=\"doc-endnote\"><strong>14.</strong> Yan Fu, « Yi li yan » 譯例言, dans sa traduction <em>Tianyan lun</em> 天演论, 1898. <a href=\"https://zh.wikisource.org/zh-hans/天演論/譯例言\">Texte chinois</a>. Les citations proviennent des trois premières remarques. « 修辞立诚 » reprend sous une forme abrégée le <em>Wenyan</em> 文言 du <em>Zhouyi</em> (« 修辞立其诚 ») ; « 辞达而已 » reprend les <em>Entretiens</em> ; « 言之无文，行之不远 » est une parole attribuée à Confucius dans le <em>Zuozhuan</em>, duc Xiang, année 25. On cite ici la formulation de Yan Fu, sans compléter silencieusement ses citations. <a href=\"#xiang-fr-ref-14-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-15\" role=\"doc-endnote\"><strong>15.</strong> Fu Lei, « Préface à la retraduction du Père Goriot » 《〈高老头〉重译本序》, 1951, cité dans Wu Hsi-deh 吳錫德, « 翻譯空間：論傅雷的「神似」理論 », <em>Compilation and Translation Review</em>, vol. 2, no 1, 2009, p. 1–25, notamment p. 3. <a href=\"https://teric.naer.edu.tw/wSite/DoDownload?fileName=1413342632462&amp;format=pdf&amp;xmlId=1814126\">Article intégral</a>. La discussion reprend les paragraphes du mémoire consacrés à Fu Lei ; le texte chinois de la citation est rétabli. La traduction anglaise est préparée pour cet extrait et ne reproduit pas celle du résumé anglais de Wu. <a href=\"#xiang-fr-ref-15-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-16\" role=\"doc-endnote\"><strong>16.</strong> « Network of semantic resonance » : Cheung, 2006, p. 10 selon la note 36 du mémoire. Cette formulation est citée de la transcription conservée dans le mémoire ; les autres remarques sur la constitution des mots-concepts sont référencées séparément à la note 6. <a href=\"#xiang-fr-ref-16-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>\n\n<p id=\"xiang-fr-note-17\" role=\"doc-endnote\"><strong>17.</strong> Cheung, 2006, p. 2, et exemple de l’explication de 道, p. 23, repères conservés dans les notes 17–18 du mémoire. « Traduction épaisse » traduit ici <em>thick translation</em> ; cette stratégie fournit contexte et commentaire, et ne consiste pas à remplacer un terme culturel par un équivalent supposé transparent. <a href=\"#xiang-fr-ref-17-1\" role=\"doc-backlink\" aria-label=\"Revenir au texte\">↩</a></p>"],"zh":["<p id=\"xiang-zh-note-1\" role=\"doc-endnote\"><strong>1.</strong> Martha P. Y. Cheung 编，<em>An Anthology of Chinese Discourse on Translation</em>，第一卷：<em>From Earliest Times to the Buddhist Project</em>，Manchester、Kinderhook：St. Jerome Publishing，2006，第21、26页。此处转述的论述，已引录于硕士论文注8、11、23。所说的是古典思想为后来的翻译话语提供资源，并非每位圣贤本人都已提出明确的翻译理论。 <a href=\"#xiang-zh-ref-1-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-2\" role=\"doc-endnote\"><strong>2.</strong> 《道德经》第一章，参照王弼注本所传正文。<a href=\"https://zh.wikisource.org/zh-hans/道德經_(王弼本)\">中文文本</a>。法译沿用原论文的译法并调整标点。本文从命名与表达的角度讨论“道”，不将它等同于预定的命运。 <a href=\"#xiang-zh-ref-2-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-3\" role=\"doc-endnote\"><strong>3.</strong> 《周易·系辞上》第十二章。<a href=\"https://zh.wikisource.org/zh-hans/易傳/繫辭上\">中文文本</a>。文本以“子曰”的方式呈现这些话；本文区分这种传统归属与能够在历史上确证的孔子本人言说。关于卦爻及解释性言辞唤起的形象，参见 Cheung，2006，第33页，原论文注20已转录。引文结尾的省略号标示节录在此终止。 <a href=\"#xiang-zh-ref-3-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-4\" role=\"doc-endnote\"><strong>4.</strong> 《庄子·外物》第二十六篇。<a href=\"https://zh.wikisource.org/zh-hans/莊子/外物\">中文文本</a>。所据文本作“荃”，指捕鱼之筌，其他文本可作“筌”。本段引文及分析为此次修订补入，用于具体展开原论文已经提出的庄子关联；法、英译文为本稿的工作译文。 <a href=\"#xiang-zh-ref-4-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-5\" role=\"doc-endnote\"><strong>5.</strong> “大象无形”见《道德经》第四十一章。现象、意象、异象、表象的并置，保留了原论文的词义探索；这里的比较是对用法的解释性考察，不是词源传承的证明。“Le grand symbole est sans forme”保留了原论文的法译选择，并不被当作唯一可能的译法。 <a href=\"#xiang-zh-ref-5-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-6\" role=\"doc-endnote\"><strong>6.</strong> Cheung，2006，关于“concept words”的论述，原论文注22引录并标注第23页。这里保留对 Cheung 的归属说明；将这一观察用于“象”的关联用法，是论文作者的展开。 <a href=\"#xiang-zh-ref-6-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-7\" role=\"doc-endnote\"><strong>7.</strong> M. H. Abrams，<em>The Mirror and the Lamp: Romantic Theory and the Critical Tradition</em>，纽约：Oxford University Press，1953，开篇“Orientation of Critical Theories”。作品、艺术家、世界与读者的区分来自该图式。小说、梗概、口头转述与改写之间的类比，则是论文作者自己的论述，不归于 Abrams。 <a href=\"#xiang-zh-ref-7-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-8\" role=\"doc-endnote\"><strong>8.</strong> 《道德经》第八十一章；“信”“美”的语义范围参见 Cheung，2006，第24页，原论文注24保留该定位。将“博”译为“展示广博知识”，体现本文的解释方向，不声称这是这个字唯一可能的译法。 <a href=\"#xiang-zh-ref-8-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-9\" role=\"doc-endnote\"><strong>9.</strong> 《论语·学而》1.3；《卫灵公》“辞达而已矣”章，常用分章为15.41；《雍也》6.18。另参见 Cheung，2006，第28—29页，关于文、质及其后来在翻译中的运用。原论文注27将“辞达”定位为15.18，本稿予以更正。 <a href=\"#xiang-zh-ref-9-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-10\" role=\"doc-endnote\"><strong>10.</strong> 《法句经序》，载僧祐《出三藏记集》卷七。<a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷七\">中文文本</a>。此书标“未详作者”，传统上多归于支谦，故正文使用“通常归于支谦”。维祇难所引“佛言”依序文记录呈现，未另行虚构佛经出处。维祇难的人名按通行字形书写，未保留网页转录中的缺字。 <a href=\"#xiang-zh-ref-10-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-11\" role=\"doc-endnote\"><strong>11.</strong> 道安《合放光光赞略解序》，载《出三藏记集》卷七。<a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷七\">中文文本</a>。关于《放光》的简约、《光赞》的详尽，以及二者互补的说法，均见此序；文、质的运用应结合这一比较语境理解。 <a href=\"#xiang-zh-ref-11-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-12\" role=\"doc-endnote\"><strong>12.</strong> 道安《摩诃钵罗若波罗蜜经抄序》，载《出三藏记集》卷八。<a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷八\">中文文本</a>。原文为“五失本”“三不易”。本稿依原序概括，尤其区分三种反复或重述。“胡”依此处的外来文本称谓理解，并不在所有场合自动替换为“梵语”。 <a href=\"#xiang-zh-ref-12-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-13\" role=\"doc-endnote\"><strong>13.</strong> 道安，同上序，卷八；参照《庄子·应帝王》第七篇。<a href=\"https://zh.wikisource.org/zh-hans/莊子/應帝王\">浑沌故事</a>。道安引文作“混沌”，所据《庄子》文本作“浑沌”，分别保留。本小节为此次据道安原文补入的展开，以具体例证支持原论文提出的庄子关联。 <a href=\"#xiang-zh-ref-13-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-14\" role=\"doc-endnote\"><strong>14.</strong> 严复《译例言》，见其译《天演论》，1898。<a href=\"https://zh.wikisource.org/zh-hans/天演論/譯例言\">中文文本</a>。引文来自前三条。“修辞立诚”节取《周易·文言》“修辞立其诚”；“辞达而已”节引《论语》；“言之无文，行之不远”为《左传·襄公二十五年》归于孔子的言辞。本稿引用严复的措辞，不暗中将其节引补成另一版本。 <a href=\"#xiang-zh-ref-14-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-15\" role=\"doc-endnote\"><strong>15.</strong> 傅雷《〈高老头〉重译本序》，1951，转引自吳錫德《翻譯空間：論傅雷的「神似」理論》，《編譯論叢》2卷1期，2009，第1—25页，尤其第3页。<a href=\"https://teric.naer.edu.tw/wSite/DoDownload?fileName=1413342632462&amp;format=pdf&amp;xmlId=1814126\">论文全文</a>。本节取自原硕士论文讨论傅雷的段落，并补回引文的中文。英译为本节选所译，并非吴文英文摘要中的译句。 <a href=\"#xiang-zh-ref-15-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-16\" role=\"doc-endnote\"><strong>16.</strong> “Network of semantic resonance”：Cheung，2006，依据原论文注36所标第10页。该措辞引自论文所保存的转录；关于“概念词”形成的另一处论述，另见本稿注6。 <a href=\"#xiang-zh-ref-16-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>\n\n<p id=\"xiang-zh-note-17\" role=\"doc-endnote\"><strong>17.</strong> Cheung，2006，第2页；关于解释“道”的例子，参见第23页，定位保留于原论文注17—18。“厚翻译”对应 <em>thick translation</em>，以语境和说明帮助理解，并非用一个看似透明的译词直接替换文化概念。 <a href=\"#xiang-zh-ref-17-1\" role=\"doc-backlink\" aria-label=\"返回正文\">↩</a></p>"],"en":["<p id=\"xiang-en-note-1\" role=\"doc-endnote\"><strong>1.</strong> Martha P. Y. Cheung, ed., <em>An Anthology of Chinese Discourse on Translation</em>, vol. 1, <em>From Earliest Times to the Buddhist Project</em>, Manchester and Kinderhook: St. Jerome Publishing, 2006, pp. 21 and 26. The remarks paraphrased here are quoted and referenced in thesis notes 8, 11 and 23. They concern resources for later discourse, rather than an explicit theory of translation in each of the sages. <a href=\"#xiang-en-ref-1-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-2\" role=\"doc-endnote\"><strong>2.</strong> <em>Daodejing</em>, chapter 1, in the text transmitted with Wang Bi’s commentary. <a href=\"https://zh.wikisource.org/zh-hans/道德經_(王弼本)\">Chinese text</a>. The French translation follows the thesis with revised punctuation. Dao is examined as a problem of naming and expression, not as a synonym for predetermined destiny. <a href=\"#xiang-en-ref-2-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-3\" role=\"doc-endnote\"><strong>3.</strong> <em>Zhouyi</em>, “Xici shang” 繫辞上, chapter 12. <a href=\"https://zh.wikisource.org/zh-hans/易傳/繫辭上\">Chinese text</a>. The passage uses “The Master said”; this traditional attribution is distinguished here from certain historical attribution to Confucius himself. On the line figures and images evoked by explanatory statements, see Cheung, 2006, p. 33, transcribed in thesis note 20. The ellipsis marks the end of the excerpt. <a href=\"#xiang-en-ref-3-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-4\" role=\"doc-endnote\"><strong>4.</strong> <em>Zhuangzi</em>, “Waiwu” 外物, chapter 26. <a href=\"https://zh.wikisource.org/zh-hans/莊子/外物\">Chinese text</a>. The consulted text uses 荃 for the fish trap, elsewhere written 筌. The quotation and discussion are added in this version to develop the connection with the <em>Zhuangzi</em> already proposed in the thesis. The French and English renderings are working translations prepared for this version. <a href=\"#xiang-en-ref-4-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-5\" role=\"doc-endnote\"><strong>5.</strong> “大象无形” occurs in chapter 41 of the <em>Daodejing</em>. The expressions 现象, 意象, 异象 and 表象 are retained from the thesis’s lexical exploration; their juxtaposition is an interpretive comparison of uses, not proof of etymological descent. “The great symbol has no form” preserves the thesis’s French translation choice rather than asserting a uniquely correct equivalent. <a href=\"#xiang-en-ref-5-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-6\" role=\"doc-endnote\"><strong>6.</strong> Cheung, 2006, discussion of “concept words”, quoted in thesis note 22 with the locator p. 23. The observation remains attributed to Cheung; its application to the constellation of uses of 象 belongs to the thesis’s author. <a href=\"#xiang-en-ref-6-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-7\" role=\"doc-endnote\"><strong>7.</strong> M. H. Abrams, <em>The Mirror and the Lamp: Romantic Theory and the Critical Tradition</em>, New York: Oxford University Press, 1953, opening chapter, “Orientation of Critical Theories”. The fourfold distinction comes from that scheme. The analogy between novel, summary, oral retelling and rewriting belongs to the thesis’s author, not to Abrams. <a href=\"#xiang-en-ref-7-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-8\" role=\"doc-endnote\"><strong>8.</strong> <em>Daodejing</em>, chapter 81; on the semantic fields of 信 and 美, see Cheung, 2006, p. 24, as located in thesis note 24. Rendering 博 through the display of wide learning makes the interpretation adopted here explicit; it is not offered as the character’s only possible translation. <a href=\"#xiang-en-ref-8-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-9\" role=\"doc-endnote\"><strong>9.</strong> <em>Lunyu</em> 論语: “Xue er” 學而, 1.3; “Wei Ling Gong” 衛靈公, the saying “辞达而已矣”, commonly numbered 15.41; and “Yong ye” 雍也, 6.18. See also Cheung, 2006, pp. 28–29, on 文 and 质 and their later application to translation. The thesis’s note 27 locator, 15.18, for “辞达” has been corrected. <a href=\"#xiang-en-ref-9-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-10\" role=\"doc-endnote\"><strong>10.</strong> “Faju jing xu” 法句经序, in Sengyou 僧祐, <em>Chu sanzang jiji</em> 出三藏记集, juan 7. <a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷七\">Chinese text</a>. The collection labels the author unidentified; the attribution to Zhi Qian is traditional, hence the wording used here. The Buddha’s saying is reported as Vighna quotes it in this preface, without assigning an independent source. Vighna’s Chinese name is normalised to 维祇难 to avoid a defective character in the digital transcription. <a href=\"#xiang-en-ref-10-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-11\" role=\"doc-endnote\"><strong>11.</strong> Dao An, “He Fangguang Guangzan lüejie xu” 合放光光赞略解序, in <em>Chu sanzang jiji</em>, juan 7. <a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷七\">Chinese text</a>. The comments on the <em>Fangguang</em>’s concision, the <em>Guangzan</em>’s completeness and their complementarity come from this preface. The use of 文 and 质 should be read within that comparison. <a href=\"#xiang-en-ref-11-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-12\" role=\"doc-endnote\"><strong>12.</strong> Dao An, “Mohe boluore boluomi jing chao xu” 摩诃钵罗若波罗蜜经抄序, in <em>Chu sanzang jiji</em>, juan 8. <a href=\"https://zh.wikisource.org/zh-hans/出三藏記集/卷八\">Chinese text</a>. The classification is 五失本 and 三不易. The summary follows their order and distinguishes the three kinds of repetition or recapitulation. 胡 is not automatically replaced by “Sanskrit”; it marks the texts’ foreign provenance in the passage’s terminology. <a href=\"#xiang-en-ref-12-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-13\" role=\"doc-endnote\"><strong>13.</strong> Dao An, the same preface, juan 8; compare the <em>Zhuangzi</em>, “Yingdiwang” 應帝王, chapter 7. <a href=\"https://zh.wikisource.org/zh-hans/莊子/應帝王\">The story of Hundun</a>. The spellings 混沌 in Dao An and 浑沌 in the consulted <em>Zhuangzi</em> text are retained. This discussion is added from Dao An’s text to provide a precise instance of the connection with Zhuangzi proposed in the thesis. <a href=\"#xiang-en-ref-13-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-14\" role=\"doc-endnote\"><strong>14.</strong> Yan Fu, “Yi li yan” 譯例言, in his translation <em>Tianyan lun</em> 天演论, 1898. <a href=\"https://zh.wikisource.org/zh-hans/天演論/譯例言\">Chinese text</a>. Quotations come from the first three remarks. “修辞立诚” abbreviates “修辞立其诚” from the <em>Zhouyi</em>’s <em>Wenyan</em>; “辞达而已” draws on the <em>Analects</em>; “言之无文，行之不远” is attributed to Confucius in the <em>Zuozhuan</em>, Duke Xiang, year 25. Yan Fu’s wording is quoted without silently expanding his citations. <a href=\"#xiang-en-ref-14-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-15\" role=\"doc-endnote\"><strong>15.</strong> Fu Lei, “Preface to the Retranslation of Le Père Goriot” 《〈高老头〉重译本序》, 1951, quoted in Hsi-deh Wu 吳錫德, “翻譯空間：論傅雷的「神似」理論”, <em>Compilation and Translation Review</em>, vol. 2, no. 1, 2009, pp. 1–25, especially p. 3. <a href=\"https://teric.naer.edu.tw/wSite/DoDownload?fileName=1413342632462&amp;format=pdf&amp;xmlId=1814126\">Full article</a>. This section draws on the thesis’s discussion of Fu Lei and restores the Chinese wording of the quotation. Its English rendering is prepared for this excerpt rather than taken from Wu’s English abstract. <a href=\"#xiang-en-ref-15-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-16\" role=\"doc-endnote\"><strong>16.</strong> “Network of semantic resonance”: Cheung, 2006, p. 10 according to thesis note 36. The phrase follows the transcription preserved in the thesis; the other discussion of the formation of concept words is referenced separately in note 6. <a href=\"#xiang-en-ref-16-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>\n\n<p id=\"xiang-en-note-17\" role=\"doc-endnote\"><strong>17.</strong> Cheung, 2006, p. 2, and the example explaining 道, p. 23, as located in thesis notes 17–18. “Thick translation” supplies context and commentary rather than replacing a cultural term with an allegedly transparent equivalent. <a href=\"#xiang-en-ref-17-1\" role=\"doc-backlink\" aria-label=\"Return to text\">↩</a></p>"]}}]},{"id":"xiang-bibliography","title":{"fr":"Bibliographie","zh":"参考文献","en":"Bibliography"},"units":[{"title":{"fr":"Bibliographie","zh":"参考文献","en":"Bibliography"},"paragraphs":{"fr":["Les références ci-dessous correspondent aux textes et aux travaux mobilisés dans cet extrait. Les liens vers les transcriptions numériques et l’article de Wu figurent dans les notes. Pour les textes anciens, les repères par œuvre, juan et chapitre évitent de leur attribuer une pagination non consultée.\n\n- ABRAMS, M. H. *The Mirror and the Lamp: Romantic Theory and the Critical Tradition*. New York: Oxford University Press, 1953.\n- CHEUNG, Martha P. Y., éd. *An Anthology of Chinese Discourse on Translation*. Vol. 1: *From Earliest Times to the Buddhist Project*. Lin Wusun, rédacteur-conseil. Manchester / Kinderhook: St. Jerome Publishing, 2006.\n- FU Lei 傅雷. 《〈高老头〉重译本序》, 1951. Citation reprise dans WU Hsi-deh, 2009.\n- LAOZI 老子. 《道德经》. Texte transmis avec le commentaire de Wang Bi 王弼 ; chapitres 1, 41 et 81.\n- 《论语》 *Lunyu*. « 学而 », « 雍也 », « 卫灵公 ».\n- SENGYOU 僧祐, compilateur. 《出三藏记集》 *Chu sanzang jiji*. Juan 7 : 《法句经序》 ; DAO AN 道安, 《合放光光赞略解序》. Juan 8 : DAO AN, 《摩诃钵罗若波罗蜜经抄序》.\n- WU, Hsi-deh 吳錫德. « 翻譯空間：論傅雷的「神似」理論 / Space of Translation: On Fu Lei’s Theory of “Spiritual Similarity” ». *編譯論叢 / Compilation and Translation Review*, vol. 2, no 1, 2009, p. 1–25.\n- YAN Fu 严复. 《天演论·译例言》 *Tianyan lun, Yi li yan*. 1898.\n- 《周易·系辞上》 *Zhouyi, Xici shang*. Chapitre 12.\n- 《庄子》 *Zhuangzi*. « 应帝王 », chapitre 7 ; « 外物 », chapitre 26."],"zh":["以下列出本节选实际使用的文本与研究。数字转录及吴锡德论文的链接见注释。古籍按书名、卷次和篇章定位，不补造未查阅版本的页码。\n\n- ABRAMS, M. H. *The Mirror and the Lamp: Romantic Theory and the Critical Tradition*. New York: Oxford University Press, 1953.\n- CHEUNG, Martha P. Y., 编 *An Anthology of Chinese Discourse on Translation*. Vol. 1: *From Earliest Times to the Buddhist Project*. Lin Wusun, 顾问编辑. Manchester / Kinderhook: St. Jerome Publishing, 2006.\n- FU Lei 傅雷. 《〈高老头〉重译本序》, 1951. 引文转见 WU Hsi-deh, 2009.\n- LAOZI 老子. 《道德经》. 参照王弼注本所传正文，第一、四十一、八十一章。\n- 《论语》 *Lunyu*. « 学而 », « 雍也 », « 卫灵公 ».\n- SENGYOU 僧祐, 编. 《出三藏记集》 *Chu sanzang jiji*. 卷七 : 《法句经序》 ; DAO AN 道安, 《合放光光赞略解序》. 卷八 : DAO AN, 《摩诃钵罗若波罗蜜经抄序》.\n- WU, Hsi-deh 吳錫德. « 翻譯空間：論傅雷的「神似」理論 / Space of Translation: On Fu Lei’s Theory of “Spiritual Similarity” ». *編譯論叢 / Compilation and Translation Review*, 第2卷第1期，2009，第1—25页。\n- YAN Fu 严复. 《天演论·译例言》 *Tianyan lun, Yi li yan*. 1898.\n- 《周易·系辞上》 *Zhouyi, Xici shang*. 第十二章。\n- 《庄子》 *Zhuangzi*. 《应帝王》第七篇；《外物》第二十六篇。"],"en":["These references identify texts and studies used in this excerpt. Links to digital transcriptions and Wu’s article appear in the notes. Ancient works are located by title, juan and chapter rather than assigned page numbers from unconsulted editions.\n\n- ABRAMS, M. H. *The Mirror and the Lamp: Romantic Theory and the Critical Tradition*. New York: Oxford University Press, 1953.\n- CHEUNG, Martha P. Y., ed. *An Anthology of Chinese Discourse on Translation*. Vol. 1: *From Earliest Times to the Buddhist Project*. Lin Wusun, advisory editor. Manchester / Kinderhook: St. Jerome Publishing, 2006.\n- FU Lei 傅雷. 《〈高老头〉重译本序》, 1951. Quoted in WU Hsi-deh, 2009.\n- LAOZI 老子. 《道德经》. Text transmitted with Wang Bi’s commentary; chapters 1, 41 and 81.\n- 《论语》 *Lunyu*. « 学而 », « 雍也 », « 卫灵公 ».\n- SENGYOU 僧祐, compiler. 《出三藏记集》 *Chu sanzang jiji*. Juan 7 : 《法句经序》 ; DAO AN 道安, 《合放光光赞略解序》. Juan 8 : DAO AN, 《摩诃钵罗若波罗蜜经抄序》.\n- WU, Hsi-deh 吳錫德. « 翻譯空間：論傅雷的「神似」理論 / Space of Translation: On Fu Lei’s Theory of “Spiritual Similarity” ». *編譯論叢 / Compilation and Translation Review*, vol. 2, no. 1, 2009, pp. 1–25.\n- YAN Fu 严复. 《天演论·译例言》 *Tianyan lun, Yi li yan*. 1898.\n- 《周易·系辞上》 *Zhouyi, Xici shang*. Chapter 12.\n- 《庄子》 *Zhuangzi*. “Yingdiwang” 应帝王, chapter 7; “Waiwu” 外物, chapter 26."]}}]}]},{"id":"poetry-chunwang","title":{"fr":"Qui pleure dans le poème ? Traduire l’ambiguïté et exposer la traduction dans 春望 de Du Fu","zh":"诗中是谁在流泪？——杜甫《春望》的歧义翻译与翻译过程的展示","en":"Who Weeps in the Poem? Translating Ambiguity and Making Translation Visible in Du Fu’s Chun wang"},"meta":["Huihui ZHU","Étude comparative · Extrait remanié d’un mémoire de master · Master 2 · Théorie de la littérature · 2023–2024 · Jean-Yves Masson"],"sections":[{"id":"poetry-chunwang-project","title":{"fr":"Présentation de la recherche","zh":"研究介绍","en":"Research Overview"},"units":[{"title":{"fr":"Présentation de la recherche","zh":"研究介绍","en":"Research Overview"},"paragraphs":{"fr":["Cette étude est issue de mon mémoire de master, <em>La traduction comme réécriture. Les traducteurs face aux défis linguistiques, culturels et esthétiques de la traduction en français et en anglais de quelques poètes classiques chinois</em>, réalisé sous la direction de Jean-Yves Masson. Le mémoire confronte des traductions de Du Fu, Li Bai, Tao Qian et Li Shangyin. J’en retiens ici un cas, <em>春望</em> (<em>Chun wang</em>) de Du Fu, afin de suivre précisément ce qui se transforme entre le poème chinois, les versions traduites et les dispositifs qui les accompagnent.\n\nMon point de départ est une difficulté concrète : traduire ne consiste pas seulement à trouver des mots équivalents. Lorsque les relations entre les mots restent ouvertes, la traduction doit aussi décider qui éprouve une émotion, qui accomplit une action et comment les images s’enchaînent. Un pronom, une construction causative ou une coupure de phrase peuvent redistribuer les places du poète, des fleurs et des oiseaux. La réécriture commence à cette échelle, parfois presque imperceptible.\n\nDeux questions organisent cette lecture. Dans le deuxième distique de <em>春望</em>, les fleurs pleurent-elles, ou font-elles pleurer celui qui les regarde ? Puis, comment un traducteur peut-il rendre perceptible le travail qui conduit à son interprétation ? La première question porte sur la syntaxe et l’émotion ; la seconde, sur la matérialité du livre. Leur rapprochement conduit à ce que je désigne ici comme une « traduction-exposition » : une présentation qui donne accès à plusieurs états du texte au lieu de ne montrer que le poème français achevé.\n\nL’extrait articule ainsi la comparaison de quatre traducteurs et l’étude du dispositif de François Cheng. Il conserve une question directrice du mémoire : quelle expérience du poème chaque traduction construit-elle pour son lecteur ?"],"zh":["本研究节选自我在 Jean-Yves Masson 指导下完成的硕士论文《翻译作为改写：译者面对中国古典诗歌法译与英译中的语言、文化及美学挑战》。原论文比较了杜甫、李白、陶潜与李商隐诗作的不同译本。这里选取杜甫《春望》作为一个独立个案，具体考察中文原诗、译文及其辅助呈现之间发生了怎样的变化。\n\n我的研究从一个具体的困难出发：翻译并不只是寻找意义相等的词语。当词语之间的关系保持开放时，翻译还必须决定由谁感受情绪、由谁实施动作，以及意象如何衔接。一个代词、一种使役结构，或一次句子的切分，都可能重新分配诗人、花与鸟的位置。改写正是从这些有时几乎不易察觉的细部开始的。\n\n本文围绕两个问题展开。《春望》的颔联中，是花在流泪，还是花使看花之人落泪？而译者又如何让读者看见通向其解释的工作过程？第一个问题涉及句法与情感，第二个问题涉及书籍的物质呈现。二者的结合引向我在这里所称的“翻译—展示”（traduction-exposition）：一种使读者接触文本不同状态的呈现方式，而不只展示最终完成的法语诗篇。\n\n因此，这篇节选将四位译者的比较与程抱一的呈现方式结合起来，保留了原论文的一个核心问题：每一种翻译为读者构建了怎样的诗歌阅读经验？"],"en":["This study is drawn from my master’s thesis, <em>La traduction comme réécriture. Les traducteurs face aux défis linguistiques, culturels et esthétiques de la traduction en français et en anglais de quelques poètes classiques chinois</em> [Translation as Rewriting: Linguistic, Cultural and Aesthetic Challenges in French and English Translations of Selected Classical Chinese Poets], supervised by Jean-Yves Masson. The thesis compares translations of poems by Du Fu, Li Bai, Tao Qian and Li Shangyin. Here I focus on a single case, Du Fu’s <em>春望</em> (<em>Chun wang</em>), to trace precisely what changes between the Chinese poem, its translations and the devices that accompany them.\n\nMy starting point is a concrete difficulty: translation involves more than finding equivalent words. Where relations between words remain open, translation must also decide who experiences an emotion, who performs an action and how images follow one another. A pronoun, a causative construction or a sentence break can redistribute the positions of poet, flowers and birds. Rewriting begins at this sometimes almost imperceptible level.\n\nTwo questions organise this reading. In the second couplet of <em>春望</em>, do the flowers weep, or do they make the person looking at them weep? And how can a translator make visible the work that leads to a particular interpretation? The first question concerns syntax and emotion; the second concerns the material form of the book. Bringing them together leads to what I call here “translation-as-exposition” (<em>traduction-exposition</em>): a presentation that gives access to several states of a text rather than showing only the completed French poem.\n\nThe excerpt therefore combines a comparison of four translators with a study of François Cheng’s presentation. It retains a guiding question from the thesis: what experience of the poem does each translation construct for its reader?"]}}]},{"id":"poetry-chunwang-corpus","title":{"fr":"Corpus et méthode","zh":"研究语料与方法","en":"Corpus and Method"},"units":[{"title":{"fr":"Corpus et méthode","zh":"研究语料与方法","en":"Corpus and Method"},"paragraphs":{"fr":["Le corpus resserré réunit une version française et trois versions anglaises du même poème. Ces textes sont confrontés sur deux plans : la distribution grammaticale de l’émotion dans les vers 3 et 4, puis les relations entre le texte chinois, la transcription, la glose et la traduction littéraire. Les éditions retenues sont indiquées ci-dessous ; les pages renvoient à ces éditions, et non à une pagination uniforme entre les rééditions.\n\n| Traducteur | Version | Repère bibliographique | Objet de la comparaison |\n| --- | --- | --- | --- |\n| François Cheng | « Printemps captif » · français | Cheng, 1982, p. 182–183 | Transcription, glose, poème français et note interprétative. |\n| Stephen Owen | « The View in Spring » · anglais | Owen, 1996, p. 420 ; repris dans Fuller, 2017, p. 235 | Groupes participiaux et attribution de l’émotion. |\n| Wai-lim Yip | « Spring Scene » · anglais | Yip, 1997, p. 191 | Ponctuation, action des circonstances et possessif « our ». |\n| Xu Yuanchong | « Spring View » · anglais | Xu, 2021, p. 130–133 | Construction causative, pronoms et échos sonores. |\n\nJe pars des formes observables : pronoms, groupes participiaux, sujets grammaticaux, constructions verbales et ponctuation. Je distingue ensuite leurs effets de lecture. Cette distinction est nécessaire : être le sujet grammatical d’un verbe ne signifie pas automatiquement être le siège de l’émotion. Une fleur peut provoquer les larmes sans être celle qui pleure.\n\nLa comparaison ne cherche donc pas à départager les versions au moyen d’une fidélité abstraite. Elle examine ce que chacune explicite, déplace ou laisse indéterminé. L’étude du livre prolonge cette méthode : une décision prise dans le poème traduit peut être expliquée, voire remise en perspective, par une glose ou une note. Le texte d’arrivée et son accompagnement doivent être lus ensemble."],"zh":["本文将语料收束为同一首诗的一种法译与三种英译，从两个层面进行比较：首先考察第三、四句中情感的语法归属，再考察中文原诗、音译、逐词释义与文学译文之间的关系。所选版本如下；页码分别对应这些版本，不应视为不同再版之间通用的页码。\n\n| 译者 | 译本 | 文献定位 | 比较重点 |\n| --- | --- | --- | --- |\n| 程抱一（François Cheng） | « Printemps captif » · 法译 | Cheng，1982，第182—183页 | 音译、逐词释义、法语诗篇与解释性注释。 |\n| 欧文（Stephen Owen） | « The View in Spring » · 英译 | Owen，1996，第420页；转载于 Fuller，2017，第235页 | 分词短语与情感归属。 |\n| 叶维廉（Wai-lim Yip） | « Spring Scene » · 英译 | Yip，1997，第191页 | 标点、时局与离别的作用，以及物主代词“our”。 |\n| 许渊冲（Xu Yuanchong） | « Spring View » · 英译 | Xu，2021，第130—133页 | 使役结构、代词与语音呼应。 |\n\n我首先观察可以直接辨认的语言形式：代词、分词短语、语法主语、动词结构与标点，然后区分这些形式所产生的阅读效果。这一区分十分必要：充当某个动词的语法主语，并不自动意味着成为情感的承受者。花可以引发眼泪，却未必就是流泪者。\n\n因此，这一比较不以抽象的“忠实”裁定译本高下，而是考察每个译本明确了什么、移动了什么，又保留了哪些未定关系。对书籍呈现的研究延续了这一方法：译诗中作出的选择，可以通过逐词释义或注释得到说明，甚至被置于另一种视野之中。译文与它的辅助文本需要结合阅读。"],"en":["The focused corpus brings together one French and three English versions of the same poem. They are compared on two levels: the grammatical distribution of emotion in lines 3 and 4, and the relations between the Chinese text, transcription, lexical gloss and literary translation. The selected editions are listed below; page numbers refer to these editions and should not be treated as interchangeable across reprints.\n\n| Translator | Version | Bibliographical Reference | Focus of Comparison |\n| --- | --- | --- | --- |\n| François Cheng | “Printemps captif” · French | Cheng, 1982, pp. 182–183 | Transcription, gloss, French poem and interpretive note. |\n| Stephen Owen | “The View in Spring” · English | Owen, 1996, p. 420; reprinted in Fuller, 2017, p. 235 | Participial phrases and the attribution of emotion. |\n| Wai-lim Yip | “Spring Scene” · English | Yip, 1997, p. 191 | Punctuation, the action of circumstances and the possessive “our”. |\n| Xu Yuanchong | “Spring View” · English | Xu, 2021, pp. 130–133 | Causative construction, pronouns and sound echoes. |\n\nI begin with observable forms: pronouns, participial phrases, grammatical subjects, verbal constructions and punctuation. I then distinguish their effects on reading. This distinction matters: being the grammatical subject of a verb does not automatically mean being the one who experiences the emotion. A flower may cause tears without itself being the one that weeps.\n\nThe comparison therefore does not rank versions against an abstract standard of fidelity. It examines what each makes explicit, displaces or leaves undetermined. The study of the book extends this method: a choice made in the translated poem can be explained, or placed in a different perspective, by a gloss or a note. The target text and its accompanying material need to be read together."]}}]},{"id":"poetry-chunwang-poem","title":{"fr":"Le poème de départ : 春望","zh":"原诗：《春望》","en":"The Source Poem: 春望"},"units":[{"title":{"fr":"Le poème de départ : 春望","zh":"原诗：《春望》","en":"The Source Poem: 春望"},"paragraphs":{"fr":["<em>春望</em> est un poème de huit vers de cinq caractères. Composé dans le contexte de la révolte d’An Lushan, il associe le désastre collectif, l’expérience de la séparation et les marques corporelles du souci.<sup><a id=\"pcw-fr-ref-1-1\" href=\"#pcw-fr-note-1\" role=\"doc-noteref\">1</a></sup> Le printemps n’y efface pas la guerre : sa présence rend plus douloureux le rapport entre la vie qui continue et le monde humain dévasté.\n\n<blockquote lang=\"zh-Hans\" data-role=\"quoted-evidence\"><strong>杜甫《春望》</strong><br>国破山河在，<br>城春草木深。<br>感时花溅泪，<br>恨别鸟惊心。<br>烽火连三月，<br>家书抵万金。<br>白头搔更短，<br>浑欲不胜簪。</blockquote>\n\nLe titre chinois est conservé ici comme point de référence commun. Les titres français et anglais employés par les traducteurs restent attachés à leurs versions respectives."],"zh":["《春望》是一首八句、每句五字的律诗。作品写于安史之乱的背景下，将公共灾难、离别经验与忧愁在身体上留下的痕迹联系起来。<sup><a id=\"pcw-zh-ref-1-1\" href=\"#pcw-zh-note-1\" role=\"doc-noteref\">1</a></sup> 春天并未抹去战争：它的存在反而使持续生长的生命与遭到毁坏的人间之间的关系更加痛切。\n\n<blockquote lang=\"zh-Hans\" data-role=\"quoted-evidence\"><strong>杜甫《春望》</strong><br>国破山河在，<br>城春草木深。<br>感时花溅泪，<br>恨别鸟惊心。<br>烽火连三月，<br>家书抵万金。<br>白头搔更短，<br>浑欲不胜簪。</blockquote>\n\n本文保留中文题名，作为各译本共同的参照。译者采用的法文、英文题名则分别归属于各自的版本。"],"en":["<em>春望</em> is an eight-line regulated poem with five characters per line. Written in the context of the An Lushan rebellion, it brings collective disaster, the experience of separation and the bodily traces of anxiety together.<sup><a id=\"pcw-en-ref-1-1\" href=\"#pcw-en-note-1\" role=\"doc-noteref\">1</a></sup> Spring does not erase the war: its presence makes the relation between continuing life and a devastated human world more painful.\n\n<blockquote lang=\"zh-Hans\" data-role=\"quoted-evidence\"><strong>杜甫《春望》</strong><br>国破山河在，<br>城春草木深。<br>感时花溅泪，<br>恨别鸟惊心。<br>烽火连三月，<br>家书抵万金。<br>白头搔更短，<br>浑欲不胜簪。</blockquote>\n\nThe Chinese title is retained here as a common reference point. The French and English titles used by the translators remain attached to their respective versions."]}}]},{"id":"poetry-chunwang-emotion","title":{"fr":"I. Qui éprouve l’émotion ?","zh":"一、谁在承受情感？","en":"I. Who Experiences the Emotion?"},"units":[{"title":{"fr":"I. Qui éprouve l’émotion ?","zh":"一、谁在承受情感？","en":"I. Who Experiences the Emotion?"},"paragraphs":{"fr":["Le deuxième distique concentre la difficulté : « 感时花溅泪，恨别鸟惊心 ». Les fleurs et les oiseaux sont nommés ; en revanche, aucun pronom personnel ne désigne explicitement celui qui s’afflige du temps ou souffre de la séparation. Il ne s’agit donc pas d’une absence générale de sujets, mais d’une mobilité dans l’attribution des affects et des rapports entre les actions.\n\nDeux lectures se dessinent. Le poète, bouleversé par les circonstances, pleure à la vue des fleurs et tressaille en entendant les oiseaux. Ou bien la nature participe elle-même au drame : les fleurs versent des larmes, les oiseaux paraissent atteints par la séparation. Cheng expose déjà cette pluralité dans sa note au poème. Mon analyse porte sur la manière dont les traductions redistribuent concrètement ces possibilités, parfois à l’intérieur d’un même distique.\n\nLa différence est décisive. Dans un cas, la nature agit sur un sujet humain ; dans l’autre, elle devient elle-même sensible. Entre les deux, certaines formulations maintiennent une circulation de l’émotion sans en fixer entièrement l’origine. Traduire ce passage engage ainsi une conception du rapport entre le monde et celui qui le regarde."],"zh":["颔联将这一困难集中起来：“感时花溅泪，恨别鸟惊心”。花与鸟都已被点明；然而，没有人称代词明确指出，是谁在感伤时事、痛恨离别。因此，这里并非所有主语都缺席，而是情感的归属以及动作之间的关系具有流动性。\n\n由此形成两种读法。诗人为时局所动，见花落泪，闻鸟惊心；或者，自然本身也参与了这场悲剧：花流下眼泪，鸟仿佛同样遭受离别之痛。程抱一在诗作注释中已经说明了这种多义性。我的分析关注的是，译文如何具体地重新分配这些可能性，有时甚至在同一联内部作出不同选择。\n\n这一区别至关重要。一种读法中，自然作用于人的主体；另一种读法中，自然本身获得了感受能力。在二者之间，某些措辞让情绪流动，却不完全固定其源头。因此，对这一联的翻译，也包含了对世界与观看世界之人之间关系的理解。"],"en":["The second couplet concentrates the difficulty: “感时花溅泪，恨别鸟惊心”. Flowers and birds are named, but no personal pronoun explicitly identifies the one who grieves over the times or suffers separation. The issue is therefore not a general absence of subjects, but mobility in the attribution of feeling and in the relations between actions.\n\nTwo readings emerge. Troubled by the circumstances, the poet weeps at the sight of flowers and starts at the sound of birds. Alternatively, nature itself participates in the drama: flowers shed tears, while birds seem afflicted by separation. Cheng already sets out this plurality in his note to the poem. My analysis concerns how translations redistribute these possibilities in specific linguistic forms, sometimes within a single couplet.\n\nThe difference is decisive. In one reading, nature acts upon a human subject; in the other, nature itself becomes sentient. Between them, some formulations allow emotion to circulate without fixing its source entirely. Translating this passage thus involves a conception of the relation between the world and the person looking at it."]}},{"title":{"fr":"1. Stephen Owen : une émotion au plus près des fleurs","zh":"1. 欧文：紧贴花与鸟的情感","en":"1. Stephen Owen: Emotion Close to Flowers and Birds"},"paragraphs":{"fr":["Dans la version de Stephen Owen, le distique se lit ainsi :<sup><a id=\"pcw-fr-ref-2-1\" href=\"#pcw-fr-note-2\" role=\"doc-noteref\">2</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">Moved by the moment, flowers splash with tears,<br>alarmed at parting, birds startle the heart.</blockquote>\n\nLes groupes participiaux « Moved by the moment » et « alarmed at parting » précèdent immédiatement « flowers » et « birds ». Dans la syntaxe anglaise, cette proximité favorise leur rattachement aux sujets qui suivent : les fleurs sont émues, les oiseaux alarmés. L’absence de « I » ne produit donc pas une indétermination identique à celle du chinois ; elle laisse aussi la phrase orienter la lecture vers la personnification.\n\nPour autant, « splash with tears » ne nomme pas explicitement la provenance des larmes, et « the heart » ne reçoit aucun possessif. La traduction ne ferme pas toutes les relations. Elle place l’émotion au plus près des éléments naturels, tout en conservant, autour des larmes et du cœur, une part de leur disponibilité poétique."],"zh":["欧文的译文如下：<sup><a id=\"pcw-zh-ref-2-1\" href=\"#pcw-zh-note-2\" role=\"doc-noteref\">2</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">Moved by the moment, flowers splash with tears,<br>alarmed at parting, birds startle the heart.</blockquote>\n\n分词短语“Moved by the moment”与“alarmed at parting”分别紧邻其后的“flowers”与“birds”。在英语句法中，这种邻接关系倾向于将分词短语归属于后面的主语：花有所感，鸟有所惊。因此，没有“I”并不意味着保留了与中文完全相同的未定性；英语句子本身也在把阅读引向拟人。\n\n不过，“splash with tears”并未明确指出泪水的来源，“the heart”也没有搭配物主代词。译文并没有封闭所有关系。它将情感放到自然事物近旁，同时在眼泪与心的周围保留了一部分诗性的开放空间。"],"en":["Stephen Owen renders the couplet as follows:<sup><a id=\"pcw-en-ref-2-1\" href=\"#pcw-en-note-2\" role=\"doc-noteref\">2</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">Moved by the moment, flowers splash with tears,<br>alarmed at parting, birds startle the heart.</blockquote>\n\nThe participial phrases “Moved by the moment” and “alarmed at parting” immediately precede “flowers” and “birds”. In English syntax, this proximity encourages their attachment to the subjects that follow: the flowers are moved, the birds alarmed. The absence of “I” therefore does not create exactly the same indeterminacy as the Chinese; it also allows the sentence to direct the reading towards personification.\n\nYet “splash with tears” does not explicitly identify the source of the tears, and “the heart” has no possessive. The translation does not close down every relation. It places emotion close to the natural elements while retaining some poetic openness around the tears and the heart."]}},{"title":{"fr":"2. Wai-lim Yip : la rupture et l’apparition de « our »","zh":"2. 叶维廉：断裂与“our”的出现","en":"2. Wai-lim Yip: Rupture and the Appearance of “Our”"},"paragraphs":{"fr":["Wai-lim Yip adopte une autre construction :<sup><a id=\"pcw-fr-ref-3-1\" href=\"#pcw-fr-note-3\" role=\"doc-noteref\">3</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">The times strike. Before flowers, tears break loose.<br>Separation cuts. Birds startle our heart.</blockquote>\n\n« The times strike » et « Separation cuts » donnent aux circonstances historiques et à la séparation la force d’une action. Les points détachent ces coups de ce qui leur succède. Devant les fleurs, les larmes se libèrent : grammaticalement, « tears » est le sujet de « break loose », tandis que « Before flowers » situe la scène. Cette formulation ne fait donc pas des fleurs les actrices explicites du pleur.\n\nLe vers suivant introduit « our heart ». Là où le chinois ne marque pas de possesseur, l’anglais inscrit une communauté d’affect. La singularité du cœur se conjugue avec un possessif pluriel. L’effet de cette version tient ainsi à une tension : la ponctuation fragmente l’expérience, mais « our » lui donne une portée humaine partagée."],"zh":["叶维廉采用了另一种结构：<sup><a id=\"pcw-zh-ref-3-1\" href=\"#pcw-zh-note-3\" role=\"doc-noteref\">3</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">The times strike. Before flowers, tears break loose.<br>Separation cuts. Birds startle our heart.</blockquote>\n\n“The times strike”与“Separation cuts”赋予时局和离别以动作的力量。句号将这些打击与随后的情景分离开来。花前，泪水涌出：从语法上说，“tears”是“break loose”的主语，“Before flowers”则交代场景。因此，这一措辞并没有明确让花成为流泪的行动者。\n\n下一句引入了“our heart”。中文没有标明归属的地方，英语写入了一个共同感受情绪的群体。单数的“心”与复数的物主代词结合起来。这一版本的效果由此体现为一种张力：标点切分了经验，而“our”又使它成为人所共同承受的经验。"],"en":["Wai-lim Yip adopts a different construction:<sup><a id=\"pcw-en-ref-3-1\" href=\"#pcw-en-note-3\" role=\"doc-noteref\">3</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">The times strike. Before flowers, tears break loose.<br>Separation cuts. Birds startle our heart.</blockquote>\n\n“The times strike” and “Separation cuts” give historical circumstances and separation the force of actions. Full stops detach these blows from what follows. Before the flowers, tears break loose: grammatically, “tears” is the subject of “break loose”, while “Before flowers” locates the scene. This formulation therefore does not explicitly make the flowers the agents of weeping.\n\nThe following line introduces “our heart”. Where the Chinese marks no possessor, English inscribes a community of feeling. The singular heart combines with a plural possessive. This version works through a tension: punctuation fragments the experience, while “our” gives it a shared human reach."]}},{"title":{"fr":"3. Xu Yuanchong : nommer ceux qui pleurent","zh":"3. 许渊冲：明确流泪者","en":"3. Xu Yuanchong: Naming Those Who Weep"},"paragraphs":{"fr":["Chez Xu Yuanchong, la distribution devient plus explicite :<sup><a id=\"pcw-fr-ref-4-1\" href=\"#pcw-fr-note-4\" role=\"doc-noteref\">4</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">Grieved o’er the years, flowers make us shed tears ;<br>Hating to part, hearing birds breaks our heart.</blockquote>\n\nLa construction « make us shed tears » sépare les deux rôles : les fleurs déclenchent les larmes, « us » les verse. Les fleurs demeurent actives, mais cette activité causative ne suffit pas à les personnifier comme êtres affligés. Au vers suivant, c’est « hearing birds », l’expérience de l’écoute, qui brise « our heart ». Un sujet humain se trouve donc inscrit au centre du distique par les deux pronoms.\n\nLa réécriture est aussi sonore. Les échos « years / tears » et « part / heart » resserrent les relations entre le malheur, la séparation et leurs effets. L’explicitation des rôles s’accompagne d’une organisation poétique propre à l’anglais. La version gagne une articulation affective immédiatement lisible, tout en réduisant l’hésitation sur l’identité de celui qui pleure."],"zh":["在许渊冲的译文中，角色的分配更加明确：<sup><a id=\"pcw-zh-ref-4-1\" href=\"#pcw-zh-note-4\" role=\"doc-noteref\">4</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">Grieved o’er the years, flowers make us shed tears ;<br>Hating to part, hearing birds breaks our heart.</blockquote>\n\n“make us shed tears”将两种角色分开：花引发眼泪，“us”流下眼泪。花仍然具有作用，但这种使役性的作用并不足以使它成为自身悲伤的拟人化存在。下一句则是“hearing birds”这一聆听经验使“our heart”破碎。两个人称指示由此将人的主体置于颔联中心。\n\n改写也发生在声音层面。“years / tears”与“part / heart”的呼应，将苦难、离别及其后果紧密连接起来。角色关系的明确化，与英语内部的诗性组织同时发生。译文获得了更容易直接辨认的情感脉络，也缩小了围绕流泪者身份的游移空间。"],"en":["In Xu Yuanchong’s translation, the distribution becomes more explicit:<sup><a id=\"pcw-en-ref-4-1\" href=\"#pcw-en-note-4\" role=\"doc-noteref\">4</a></sup>\n\n<blockquote lang=\"en\" data-role=\"quoted-evidence\">Grieved o’er the years, flowers make us shed tears ;<br>Hating to part, hearing birds breaks our heart.</blockquote>\n\nThe construction “make us shed tears” separates the two roles: flowers cause the tears, while “us” sheds them. The flowers remain active, but this causative activity does not by itself personify them as grieving beings. In the next line, “hearing birds”, the experience of listening, breaks “our heart”. The two pronouns thus place a human subject at the centre of the couplet.\n\nRewriting also takes place through sound. The echoes “years / tears” and “part / heart” tighten the relations between distress, separation and their effects. The clarification of roles accompanies a poetic organisation specific to the English wording. The version gains an immediately legible emotional articulation while reducing uncertainty about the identity of the one who weeps."]}}]},{"id":"poetry-chunwang-cheng","title":{"fr":"II. François Cheng : la « traduction-exposition »","zh":"二、程抱一：“翻译—展示”","en":"II. François Cheng: “Translation-as-Exposition”"},"units":[{"title":{"fr":"II. François Cheng : la « traduction-exposition »","zh":"二、程抱一：“翻译—展示”","en":"II. François Cheng: “Translation-as-Exposition”"},"paragraphs":{"fr":["L’étude de Cheng déplace la comparaison du seul énoncé vers la page. Dans <em>L’Écriture poétique chinoise</em>, le lecteur rencontre le texte chinois, sa transcription, une décomposition lexicale, puis une version poétique française.<sup><a id=\"pcw-fr-ref-5-1\" href=\"#pcw-fr-note-5\" role=\"doc-noteref\">5</a></sup> Cette coexistence rend sensible le passage entre plusieurs manières d’approcher le même poème. J’appelle « traduction-exposition » ce dispositif qui montre les opérations de la traduction en même temps que leur résultat.\n\nLe premier vers permet d’en observer le fonctionnement :\n\n| État du texte | Premier vers |\n| --- | --- |\n| Texte chinois | <span lang=\"zh-Hans\">国破山河在</span> |\n| Transcription chez Cheng | <span lang=\"zh-Latn\">Kuo p’o shan-ho tsai</span> |\n| Glose chez Cheng | <span lang=\"fr\">Pays briser / mont-fleuve demeurer</span> |\n| Version poétique chez Cheng | <span lang=\"fr\">Pays brisé,<br>fleuve et mont demeurent;</span> |\n\nLa transcription donne une représentation phonétique distincte de la traduction du sens. La glose, elle, suspend une partie de la grammaire française : absence d’articles, verbes à l’infinitif, juxtaposition et barre de séparation. « Pays briser / mont-fleuve demeurer » fait apparaître deux unités rythmiques, correspondant ici au découpage 2/3 du vers chinois. Le lecteur voit des éléments à mettre en relation avant de rencontrer une phrase poétique recomposée.\n\nLe passage à « Pays brisé » transforme l’infinitif de la glose en participe ; « fleuve et mont » inverse l’ordre du groupe « mont-fleuve » et introduit une coordination. Le retour à la ligne répartit la rupture du pays et la permanence du paysage sur deux segments. La traduction littéraire ne vient donc pas simplement remplir un moule déjà donné : sa forme rend visibles des décisions que la glose permet de mesurer."],"zh":["对程抱一的研究，将比较从译句本身推进到书页。在《L’Écriture poétique chinoise》中，读者依次接触中文原诗、音译、词义分解与法语诗歌译文。<sup><a id=\"pcw-zh-ref-5-1\" href=\"#pcw-zh-note-5\" role=\"doc-noteref\">5</a></sup> 这些形式的共存，使同一首诗在不同接近方式之间的转化变得可感。我把这种在展示翻译结果的同时也展示翻译操作的安排，称为“翻译—展示”。\n\n首句可以具体说明这一方式：\n\n| 文本状态 | 首句 |\n| --- | --- |\n| 中文原诗 | <span lang=\"zh-Hans\">国破山河在</span> |\n| 程抱一的音译 | <span lang=\"zh-Latn\">Kuo p’o shan-ho tsai</span> |\n| 程抱一的逐词释义 | <span lang=\"fr\">Pays briser / mont-fleuve demeurer</span> |\n| 程抱一的诗歌译文 | <span lang=\"fr\">Pays brisé,<br>fleuve et mont demeurent;</span> |\n\n音译提供了一种与意义翻译相区分的语音表征。逐词释义则暂时悬置了部分法语语法：冠词的省略、动词的不定式、词语的并置，以及分隔线的使用。“Pays briser / mont-fleuve demeurer”显示出两个节奏单位，对应此处中文诗句的二／三切分。在接触重新组织的法语诗句之前，读者先看见了有待建立关系的语言成分。\n\n从“Pays briser”到“Pays brisé”，释义中的不定式变成了分词；“fleuve et mont”调换了“mont-fleuve”的次序，并引入并列连词。分行又将国家的破碎与山河的留存分布在两个片段之中。因此，文学翻译并不只是填入一个既定的模具：它的形式体现了具体选择，而逐词释义使这些选择得以被观察。"],"en":["The study of Cheng shifts comparison from the translated utterance alone to the page. In <em>L’Écriture poétique chinoise</em>, the reader encounters the Chinese text, its transcription, a lexical breakdown and then a French poetic version.<sup><a id=\"pcw-en-ref-5-1\" href=\"#pcw-en-note-5\" role=\"doc-noteref\">5</a></sup> Their coexistence makes the movement between different approaches to the same poem perceptible. I call this arrangement “translation-as-exposition”: it displays the operations of translation alongside their result.\n\nThe opening line shows how it works:\n\n| State of the Text | Opening Line |\n| --- | --- |\n| Chinese text | <span lang=\"zh-Hans\">国破山河在</span> |\n| Cheng’s transcription | <span lang=\"zh-Latn\">Kuo p’o shan-ho tsai</span> |\n| Cheng’s gloss | <span lang=\"fr\">Pays briser / mont-fleuve demeurer</span> |\n| Cheng’s poetic version | <span lang=\"fr\">Pays brisé,<br>fleuve et mont demeurent;</span> |\n\nThe transcription offers a phonetic representation distinct from the translation of meaning. The gloss suspends part of French grammar: articles are absent, verbs appear in the infinitive, and juxtaposition is marked by a dividing stroke. “Pays briser / mont-fleuve demeurer” makes two rhythmic units visible, corresponding here to the Chinese line’s 2/3 division. The reader sees elements whose relations are still to be established before encountering a recomposed poetic sentence.\n\nThe move to “Pays brisé” turns the gloss’s infinitive into a participle; “fleuve et mont” reverses the order of “mont-fleuve” and introduces a conjunction. The line break distributes the country’s rupture and the landscape’s persistence across two segments. Literary translation therefore does not simply fill an existing mould: its form makes decisions visible, and the gloss provides a basis for examining them."]}},{"title":{"fr":"1. Un choix poétique rendu lisible","zh":"1. 让诗性选择变得可见","en":"1. Making a Poetic Choice Legible"},"paragraphs":{"fr":["Le même parcours éclaire le deuxième distique. La glose de Cheng propose :\n\n<blockquote lang=\"fr\" data-role=\"quoted-evidence\">Regretter époque / fleurs verser larmes<br>Maudire séparation / oiseaux sursauter cœur</blockquote>\n\nLa version poétique devient :\n\n<blockquote lang=\"fr\" data-role=\"quoted-evidence\">Le mal présent<br>arrache aux fleurs des larmes;<br>Aux séparés,<br>l’oiseau libre blesse le cœur!</blockquote>\n\nLe déplacement se laisse suivre. « Regretter époque » devient « Le mal présent », groupe nominal qui prend la fonction de sujet ; les larmes sont arrachées « aux fleurs ». Le second mouvement distingue « les séparés », destinataires de la blessure, et « l’oiseau libre », qui la provoque. Le mot « libre », absent comme terme autonome du vers chinois, accentue le contraste entre la mobilité de l’oiseau et la situation de ceux qui souffrent de l’éloignement.\n\nCheng ne se contente donc pas de conserver partout une ambiguïté originelle. Sa version prend position, mais son dispositif permet de lire ce choix en regard d’autres possibilités. La note placée sous la glose expose précisément l’alternative entre la douleur humaine et la participation des fleurs et des oiseaux au drame. L’ouverture interprétative ne réside plus uniquement dans le vers traduit : elle se répartit entre le poème, la glose et la note."],"zh":["同样的阅读路径也照亮了颔联。程抱一的逐词释义写道：\n\n<blockquote lang=\"fr\" data-role=\"quoted-evidence\">Regretter époque / fleurs verser larmes<br>Maudire séparation / oiseaux sursauter cœur</blockquote>\n\n诗歌译文则成为：\n\n<blockquote lang=\"fr\" data-role=\"quoted-evidence\">Le mal présent<br>arrache aux fleurs des larmes;<br>Aux séparés,<br>l’oiseau libre blesse le cœur!</blockquote>\n\n其中的移动可以被逐步辨认。“Regretter époque”变成了承担主语功能的名词短语“Le mal présent”；眼泪被从“花”那里夺出。后一个动作区分了作为伤痛承受者的“les séparés”与引发伤痛的“l’oiseau libre”。中文诗句中并没有一个独立对应于“libre”的词；这一增添强化了鸟的自由行动与离人处境之间的反差。\n\n因此，程抱一并非在每一处都原样保留原诗的歧义。他的诗歌译文作出了选择，但整个呈现方式使这一选择能够与其他可能性相互参照。逐词释义下方的注释，恰好说明了人的悲痛与花鸟参与悲剧这两种解释。解释的开放性不再只由译诗自身承担，而是分布于诗歌、释义与注释之间。"],"en":["The same progression illuminates the second couplet. Cheng’s gloss reads:\n\n<blockquote lang=\"fr\" data-role=\"quoted-evidence\">Regretter époque / fleurs verser larmes<br>Maudire séparation / oiseaux sursauter cœur</blockquote>\n\nThe poetic version becomes:\n\n<blockquote lang=\"fr\" data-role=\"quoted-evidence\">Le mal présent<br>arrache aux fleurs des larmes;<br>Aux séparés,<br>l’oiseau libre blesse le cœur!</blockquote>\n\nThe shift can be traced. “Regretter époque” becomes “Le mal présent”, a noun phrase functioning as the subject; tears are drawn “aux fleurs”, from the flowers. The second movement distinguishes “les séparés”, who receive the wound, from “l’oiseau libre”, which causes it. The word “libre”, absent as a separate term from the Chinese line, intensifies the contrast between the bird’s mobility and the situation of those suffering separation.\n\nCheng therefore does not simply preserve an original ambiguity everywhere. His version takes a position, but his presentation allows that choice to be read alongside other possibilities. The note beneath the gloss explicitly sets out the alternative between human sorrow and the participation of flowers and birds in the drama. Interpretive openness no longer resides solely in the translated line: it is distributed across poem, gloss and note."]}},{"title":{"fr":"2. La page comme espace d’interprétation","zh":"2. 书页作为解释空间","en":"2. The Page as a Space of Interpretation"},"paragraphs":{"fr":["Cette observation précise mon idée de « traduction-exposition ». Le lecteur n’assiste pas à la genèse effective du travail de Cheng : il rencontre une présentation organisée de ses composantes. La glose elle-même comporte déjà des choix. L’intérêt du dispositif tient justement à la possibilité de les comparer, et de percevoir la distance entre l’agencement chinois, les unités lexicales proposées et la forme du poème français.\n\nLa page devient ainsi un espace de lecture active. Le lecteur peut revenir de la version achevée vers la décomposition, observer une inversion ou une addition, puis relire la note. La matérialité du livre participe à la stratégie traductive : elle distribue l’explication et l’expérience poétique entre plusieurs lieux, au lieu de les faire entrer de force dans un seul énoncé.\n\nCette démarche ne se laisse donc pas réduire à une opposition simple entre une traduction qui expliquerait et une traduction qui ferait œuvre. Chez Cheng, l’explication accompagne la recréation et en rend les opérations perceptibles. Le traducteur apparaît comme savant-poète, responsable à la fois d’une lecture du texte et de la forme par laquelle il la transmet."],"zh":["这一观察进一步明确了我所说的“翻译—展示”。读者并未亲眼见证程抱一实际写作与修改译稿的全过程；读者接触的是对翻译各组成部分的有序呈现。逐词释义本身也已经包含选择。这一安排的价值，恰在于使这些选择能够相互比较，并使读者感知中文的组织、所提供的词义单位与法语诗形之间的距离。\n\n书页因而成为主动阅读的空间。读者可以从完成的译文返回词义分解，观察一处倒置或增添，再重新阅读注释。书籍的物质呈现参与了翻译策略：它将解释与诗歌经验分布在不同位置，而不必把二者强行压入同一个句子。\n\n因此，这一方式不能被简单归结为“解释性的翻译”与“作为文学创作的翻译”之间的对立。在程抱一这里，解释伴随再创作，并使再创作的操作能够被感知。译者以学者—诗人的身份出现，同时对文本的解读及传递这一解读的形式负责。"],"en":["This observation clarifies what I mean by “translation-as-exposition”. The reader does not witness the actual genesis of Cheng’s work, but encounters an organised presentation of its components. The gloss itself already contains choices. The value of the arrangement lies precisely in making those choices comparable and allowing the reader to perceive the distance between the Chinese configuration, the proposed lexical units and the form of the French poem.\n\nThe page thus becomes a space for active reading. The reader can move back from the finished version to its lexical breakdown, observe an inversion or an addition, and then reread the note. The material form of the book participates in the translation strategy: it distributes explanation and poetic experience across several locations rather than forcing them into a single utterance.\n\nThis approach cannot therefore be reduced to a simple opposition between translation as explanation and translation as literary creation. In Cheng, explanation accompanies re-creation and makes its operations perceptible. The translator emerges as a scholar-poet, responsible both for a reading of the text and for the form through which that reading is transmitted."]}}]},{"id":"poetry-chunwang-conclusion","title":{"fr":"Conclusion : lire les choix du traducteur","zh":"结论：阅读译者的选择","en":"Conclusion: Reading the Translator’s Choices"},"units":[{"title":{"fr":"Conclusion : lire les choix du traducteur","zh":"结论：阅读译者的选择","en":"Conclusion: Reading the Translator’s Choices"},"paragraphs":{"fr":["La comparaison de <em>春望</em> montre que les transformations décisives ne prennent pas toujours la forme d’un écart spectaculaire. Elles se logent dans un possessif, un groupe participial, une causalité ou un point. Ces détails déterminent qui pleure, qui agit et comment la douleur passe entre l’humain et le paysage. Les traductions ne donnent pas seulement plusieurs formulations d’un même sens : elles organisent différemment les relations dont ce sens naît.\n\nLa « traduction-exposition » élargit ce constat. Une interprétation peut se préciser dans le poème français tandis que les autres possibilités demeurent accessibles ailleurs sur la page. Il faut alors évaluer la traduction à l’échelle de son dispositif autant qu’à celle de ses vers. La fidélité ne se mesure pas seulement aux mots retenus ; elle engage aussi ce que le lecteur est mis en position de comprendre, de ressentir et de réexaminer.\n\nCette étude de cas conserve ainsi l’hypothèse centrale de mon mémoire : la traduction poétique est une réécriture située. Étudier ses choix permet de dépasser la recherche d’une version unique et définitive pour examiner les expériences de lecture que chaque traducteur rend possibles."],"zh":["对《春望》的比较表明，决定性的变化并不总以显眼的偏离出现。它们可能藏在一个物主代词、一个分词短语、一种因果关系或一个句号之中。这些细节决定了谁在流泪、谁在行动，以及痛苦如何在人与景物之间流转。不同译本并非只是以不同措辞传达同一个意义；它们以不同方式组织了意义赖以产生的关系。\n\n“翻译—展示”进一步拓展了这一发现。某一种解释可以在法语诗篇中被明确，同时其他可能性仍在书页的别处保持可及。因此，评价翻译既需要落实到诗句，也需要考察整个呈现方式。忠实并不只取决于保留下来的词语，还涉及读者被置于怎样的位置，能够理解什么、感受什么，以及重新审视什么。\n\n这个个案由此保留了我的硕士论文的核心假设：诗歌翻译是一种处于具体情境中的改写。研究译者的选择，使我们能够超越对唯一、终极译本的寻找，转而考察每位译者所开启的阅读经验。"],"en":["The comparison of <em>春望</em> shows that decisive transformations do not always take the form of striking departures. They occur in a possessive, a participial phrase, a causal relation or a full stop. Such details determine who weeps, who acts and how sorrow passes between the human and the landscape. Translations do more than offer different wordings of a single meaning: they organise differently t
