}</style></head><body><header class="masthead"><a class="signature" href="index.html" aria-label="回到首页"><span class="seal">朱</span><span class="eyebrow">Huihui ZHU<br>Words &amp; Worlds</span></a><nav class="nav"><a href="index.html">首页</a><a href="work-detail.html?category=theory">作品</a></nav></header><main><section class="category-hero theatre-hero" aria-labelledby="theatre-category-title"><div class="theatre-hero-copy"><h1 id="theatre-category-title">戏剧分析</h1><div class="translations"><span class="fr">Analyse théâtrale</span><span>Theatre Analysis</span></div></div><div class="theatre-hero-art"><img src="images/thesis/theater.jpg" alt="戏剧分析分类封面" width="1200" height="500" decoding="async" fetchpriority="high"></div></section><div class="toolbar" id="toolbar"><button class="toc-open" id="toc-open" type="button">目录 / Contents / Sommaire</button><button data-mode="triad" class="active" type="button">三语对照</button><button data-mode="fr" type="button">FR</button><button data-mode="zh" type="button">中文</button><button data-mode="en" type="button">EN</button></div><div class="reading" id="reading"></div></main><div class="toc-backdrop" id="toc-backdrop"></div><aside class="toc-drawer" id="toc-drawer" aria-hidden="true"><button class="toc-close" id="toc-close" type="button" aria-label="关闭目录">×</button><h2>目录 / Contents / Sommaire</h2><nav class="toc-list" id="toc-list"></nav></aside><a class="return" href="work-detail.html?category=theory" style="position:fixed;right:24px;bottom:22px;z-index:30;color:var(--green);font-size:11px;text-decoration:none">← 返回作品集 Back</a><script>const THEATRE_DATA={"works":[{"id":"theatre-moman","title":{"fr":"Analyse de *Moman. Pourquoi les méchants sont méchants ?*","zh":"《Moman：坏人为什么是坏人？》分析","en":"An Analysis of *Moman: Why Are Bad People Bad?*"},"meta":["Huihui ZHU"],"sections":[{"id":"moman-01","title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"units":[{"title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"paragraphs":{"fr":["Jean-Claude Grumberg, dramaturge et scénariste français né en 1939, est issu d’une famille juive et a perdu son père, déporté et assassiné pendant la Seconde Guerre mondiale. Cette absence a profondément marqué son écriture, où se mêlent humour noir et mélancolie. *Moman 10 fois* s’inspire de son enfance sans la reproduire littéralement : dans le texte liminaire, Grumberg évoque le souvenir de sa mère, tout en distinguant leurs voix réelles de celles des personnages. À travers une série de dialogues vifs et rythmés entre Louistiti, un petit garçon curieux, et sa mère, Moman, l’auteur aborde avec légèreté des sujets graves.<sup><a href=\"#moman-note-1\" id=\"moman-ref-1\">1</a></sup>\n\nSous son apparente simplicité, la pièce traite de la relation mère-fils, du langage, de la mémoire, de la guerre et du passage du temps. Les neuf premières scènes font se succéder la peur du sommeil, l’absence du père, les souvenirs de guerre, le rêve d’une vie meilleure, la peur des méchants, l’apprentissage de la résilience, les premiers émois amoureux, le chagrin maternel et le recours à l’alcool, puis la désillusion amoureuse et la réflexion sur l’existence. L’épilogue, trente ans plus tard, renverse les rôles : Louistiti, devenu Louis, rend visite à sa mère vieillissante.\n\nLa mise en scène de Noémie Pierre rend ce renversement sensible en jouant sur le genre et l’âge des interprètes. Clotilde Mollet incarne Louistiti dans les neuf premières scènes avant de devenir Moman dans l’épilogue, tandis qu’Hervé Pierre interprète Moman avant de jouer Louis adulte.<sup><a href=\"#moman-note-2\" id=\"moman-ref-2\">2</a></sup> Ce choix souligne l’irréversibilité du temps et la transformation du lien familial.\n\nComment le spectacle fait-il d’un dialogue entre une mère et son enfant un refuge contre la peur, sans effacer la violence du monde extérieur ? J’examinerai d’abord les choix scéniques qui donnent forme à cette relation, puis le travail du langage et de la transmission. Une réflexion personnelle prolongera cette lecture, en précisant ce que mon propre vécu me fait entendre dans la pièce."],"zh":["让-克洛德·格吕姆贝格是1939年出生的法国剧作家、编剧，出身于犹太家庭；他的父亲在第二次世界大战期间被遣送并遭杀害。父亲的缺席深刻影响了他的写作，使黑色幽默与忧郁交织其中。*Moman 10 fois* 从他的童年汲取灵感，却并非对童年的逐字复现：在卷首文字中，格吕姆贝格回忆母亲，同时区分了他们真实的声音与人物的声音。通过好奇的小男孩路易斯蒂蒂（Louistiti）与母亲——妈妈（Moman）——之间一连串鲜活而富有节奏的对话，作者以轻盈的方式触及沉重的主题。<sup><a href=\"#moman-note-1-zh\" id=\"moman-ref-1-zh\">1</a></sup>\n\n在表面的简朴之下，这部戏讨论母子关系、语言、记忆、战争与时间的流逝。前九场依次呈现对睡眠的恐惧、父亲的缺席、战争记忆、对更好生活的向往、对坏人的害怕、学习如何承受困境、最初的恋爱情愫、母亲的悲伤与借酒排解，以及爱情幻灭和对存在的思索。三十年后的尾声使角色发生逆转：路易斯蒂蒂已长大成为路易（Louis），前来探望日渐衰老的母亲。\n\n诺埃米·皮埃尔的导演处理借助演员性别与年龄的错位，使这种逆转变得可感。在前九场中，克洛蒂尔德·莫莱扮演路易斯蒂蒂，至尾声转而出演妈妈；埃尔韦·皮埃尔则先扮演妈妈，随后成为成年的路易。<sup><a href=\"#moman-note-2-zh\" id=\"moman-ref-2-zh\">2</a></sup>这一安排凸显了时间的不可逆性，以及家庭纽带的转变。\n\n演出如何将一位母亲与孩子之间的对话化为抵御恐惧的庇护所，同时又不抹去外部世界的暴力？我将首先考察赋予这一关系以形态的舞台处理，继而分析语言与传承的作用，最后以个人思考延伸这份解读，说明自身经历使我在剧中听见了什么。"],"en":["Jean-Claude Grumberg, a French playwright and screenwriter born in 1939, comes from a Jewish family and lost his father, who was deported and murdered during the Second World War. This absence has profoundly shaped his writing, in which black humour and melancholy are intertwined. *Moman 10 fois* draws on his childhood without reproducing it literally: in the prefatory text, Grumberg recalls his mother while distinguishing their actual voices from those of the characters. Through a series of lively, rhythmic exchanges between Louistiti, a curious little boy, and his mother, Moman, the author approaches grave subjects with a light touch.<sup><a href=\"#moman-note-1-en\" id=\"moman-ref-1-en\">1</a></sup>\n\nBeneath its apparent simplicity, the play explores the mother–son relationship, language, memory, war and the passage of time. The first nine scenes move through fear of sleep, the father’s absence, memories of war, the dream of a better life, fear of bad people, learning resilience, the first stirrings of love, maternal grief and recourse to alcohol, and finally romantic disillusionment and reflection on existence. The epilogue, thirty years later, reverses the roles: Louistiti, now an adult called Louis, visits his ageing mother.\n\nNoémie Pierre’s production makes this reversal tangible by playing with the performers’ gender and age. Clotilde Mollet portrays Louistiti in the first nine scenes before becoming Moman in the epilogue, while Hervé Pierre plays Moman before taking on the role of the adult Louis.<sup><a href=\"#moman-note-2-en\" id=\"moman-ref-2-en\">2</a></sup> This choice emphasises the irreversibility of time and the transformation of the family bond.\n\nHow does the production turn a dialogue between a mother and her child into a refuge from fear without erasing the violence of the outside world? I will first examine the staging choices that give this relationship its form, then consider the work of language and transmission. A personal reflection will extend this reading by clarifying what my own experience allows me to hear in the play."]}}]},{"id":"moman-02","title":{"fr":"I. La mise en scène : un refuge qui se transforme","zh":"I. 舞台呈现：不断转变的庇护所","en":"I. Staging: A Refuge in Transformation"},"units":[{"title":{"fr":"1. Dessins, lumières et ombres : le monde à hauteur d’enfant","zh":"1. 绘画、灯光与影子：从孩子的高度观看世界","en":"1. Drawings, Light and Shadows: The World at a Child’s Height"},"paragraphs":{"fr":["La mise en scène de Noémie Pierre propose un cadre sobre et poétique. Le décor repose sur une petite maison dissimulée derrière cinq grandes toiles ornées de dessins enfantins. Ces rideaux représentent des oiseaux en vol, un grand arbre, des herbes folles, des silhouettes menaçantes, une ligne d’horizon, des traces de guerre et de sang, puis un ciel étoilé. Le refuge et la menace appartiennent ainsi au même univers visuel.\n\nCes éléments ne sont pas simplement décoratifs : leur présence se modifie grâce à la lumière. Les couleurs, disposées de façon irrégulière, évoquent le gribouillage et un monde perçu à travers le regard de Louistiti. Lorsque l’histoire se déroule la nuit, seules certaines zones du rideau sont éclairées, révélant quelques étoiles. En plein jour, une tache jaune irrégulière, dans le coin gauche de la toile, s’illumine progressivement et devient un soleil aux contours flous. Le positionnement des acteurs et les jeux d’ombres transforment ainsi un décor fixe en espace narratif, sans changement matériel important.\n\nL’usage des ombres accentue la frontière incertaine entre rêve et réalité. Cette oscillation est sensible dès la première scène : Louistiti ne dit pas seulement qu’il a peur de dormir, mais *« J’ai poeur de me réveiller. »* Il va jusqu’à reprendre dans son rêve la parole censée le rassurer : *« Oui moman, compris que tout ça c’est dans mon rêve que tu m’le dis. »*<sup><a href=\"#moman-note-3\" id=\"moman-ref-3\">3</a></sup> La lumière tamisée et la musique aux sonorités délicates donnent une forme scénique à cette incertitude. Le spectateur entre dans une bulle de souvenirs où l’enfant et la mère tissent leur relation à travers les mots et l’imaginaire.\n\nUn geste me paraît particulièrement marquant : lorsque Louistiti part seul pour l’école, Clotilde Mollet utilise ses doigts pour imiter deux jambes marchant le long de la ligne d’horizon, en ombre sur la toile. Le déplacement de l’enfant est confié à une minuscule partie du corps de l’actrice. En accord avec la lumière et la musique, ce jeu fait exister tout un trajet sans quitter l’espace resserré de la scène."],"zh":["诺埃米·皮埃尔的舞台呈现简朴而富有诗意。布景由一间藏在五幅大型画布后的小屋构成，画布上布满童稚的图画。这些帘布描绘了飞鸟、大树、野草、带有威胁感的人影、一道地平线、战争与鲜血的痕迹，以及一片星空。庇护与威胁因此共存于同一个视觉世界。\n\n这些元素并不只是装饰：光线使它们的呈现不断改变。不规则分布的颜色令人联想到涂鸦，也让人感到眼前的世界经过了路易斯蒂蒂的目光。当故事发生在夜晚，帘布只有局部被照亮，几颗星星由此浮现。白日场景中，画布左角一块不规则的黄色色斑逐渐亮起，成为轮廓模糊的太阳。演员的位置与影子的变化，就这样将固定的布景转化为叙事空间，而无须大幅变换实体装置。\n\n影子的运用强化了梦与现实之间不确定的边界。这种摇摆在第一场便已显现：路易斯蒂蒂并不只是说自己害怕睡觉，而是说：*“我害怕醒过来。”*他甚至将原本用来安慰自己的话重新纳入梦中：*“是呀，妈妈，我懂啦，你跟我说的这些，也都是在我的梦里说的。”*<sup><a href=\"#moman-note-3-zh\" id=\"moman-ref-3-zh\">3</a></sup>柔暗的灯光与细腻的乐声，为这种不确定性赋予了舞台形态。观众仿佛进入一个由记忆包围的空间，孩子与母亲通过话语和想象编织彼此的关系。\n\n有一个动作令我尤为难忘：当路易斯蒂蒂独自去上学时，克洛蒂尔德·莫莱以手指模仿沿地平线行走的双腿，将影子投在画布上。孩子的移动被交给了女演员身体上极小的一部分。这个动作与灯光、音乐相配合，使一整段路途在舞台有限的空间中得以存在。"],"en":["Noémie Pierre’s production creates a spare, poetic setting. The set consists of a small house concealed behind five large canvases covered in childlike drawings. These curtains depict birds in flight, a large tree, wild grasses, menacing silhouettes, a horizon line, traces of war and blood, and a starry sky. Refuge and threat thus inhabit the same visual world.\n\nThese elements are more than decoration: their presence changes with the light. The irregular arrangement of colours evokes scribbling and a world perceived through Louistiti’s eyes. When the story takes place at night, only certain areas of the curtain are illuminated, revealing a few stars. In daylight scenes, an uneven yellow patch in the left-hand corner gradually lights up, becoming a sun with blurred contours. The positioning of the actors and the play of shadows turn a fixed set into a narrative space without substantial changes to its physical arrangement.\n\nThe use of shadows heightens the uncertain boundary between dream and reality. This oscillation is evident from the first scene: Louistiti does not simply say that he is afraid of sleeping, but declares, *“I’m scared of waking up.”* He even draws the words meant to reassure him back into his dream: *“Yes, Mum, I get it: all this you’re telling me, you’re saying it in my dream.”*<sup><a href=\"#moman-note-3-en\" id=\"moman-ref-3-en\">3</a></sup> The subdued lighting and delicate music give this uncertainty a theatrical form. The spectator enters a bubble of memories in which mother and child weave their relationship through words and imagination.\n\nOne gesture strikes me as particularly memorable: when Louistiti sets off for school alone, Clotilde Mollet uses her fingers to imitate two legs walking along the horizon line, casting their shadow on the canvas. The child’s movement is entrusted to a tiny part of the actress’s body. In harmony with the light and music, this gesture brings an entire journey into being within the confined space of the stage."]}},{"title":{"fr":"2. Une chaise, un tablier, deux rideaux","zh":"2. 一把椅子、一条围裙、两幅帘布","en":"2. A Chair, an Apron, Two Curtains"},"paragraphs":{"fr":["Les objets participent à cette fluidité des espaces et des significations. Une simple chaise, placée au centre de l’avant-scène, se métamorphose en lit grâce au jeu, à l’éclairage et aux ombres. Elle devient un espace de protection, de refuge et de transmission. La sobriété matérielle du spectacle repose ainsi sur la capacité des acteurs à faire voir plusieurs usages dans un même objet.\n\nLe choix des interprètes déplace également les attentes. Hervé Pierre incarne Moman, vêtu d’un large tablier de cuisine et tenant une casserole ; Clotilde Mollet joue Louistiti en salopette de jean. Le décalage entre le corps de l’interprète et le personnage produit une distance et un effet comique, tout en interrogeant la représentation des rôles parentaux. Voir un homme incarner une mère élevant seule un enfant aussi curieux qu’insatiable rend particulièrement sensible la charge mentale et émotionnelle de la maternité.\n\nCette inversion est accentuée par une scène burlesque où Hervé Pierre s’enveloppe de deux rideaux et prend des allures de grande dame aristocratique. Sa démarche gracieuse et ses mouvements dansés introduisent une échappée dans un quotidien marqué par la fatigue et les responsabilités. Les mêmes toiles qui composent le monde de l’enfant offrent à la mère un autre corps, une autre existence, le temps d’une danse."],"zh":["道具也参与了空间与意义的流动。一把置于舞台前部中央的普通椅子，通过表演、灯光与影子化为床，成为保护、庇护与传承的空间。因此，演出在物质层面的简朴，有赖于演员让观众在同一物件中看见多重用途的能力。\n\n演员的选择同样改变了观看预期。埃尔韦·皮埃尔穿着宽大的厨房围裙、手持锅具，扮演妈妈；克洛蒂尔德·莫莱则穿着牛仔背带裤，扮演路易斯蒂蒂。演员身体与角色之间的错位产生了距离感与喜剧效果，同时也追问了父母角色的呈现方式。由一个男人出演独自抚养孩子的母亲，面对一个如此好奇、需求无休无止的孩子，使母职中的精神与情感负担变得格外可感。\n\n一场滑稽的戏进一步突出了这种倒置：埃尔韦·皮埃尔将两幅帘布裹在身上，摆出贵族夫人的姿态。他优雅的步态与舞蹈动作，为疲惫和责任构成的日常打开了一次短暂的逃离。那些组成孩子世界的画布，也让母亲在一支舞的时间里，拥有了另一个身体、另一种人生。"],"en":["Objects contribute to this fluidity of spaces and meanings. A simple chair placed at the centre of the downstage area becomes a bed through performance, lighting and shadows. It becomes a place of protection, refuge and transmission. The production’s material economy thus depends on the actors’ ability to make several uses visible within a single object.\n\nThe casting also shifts expectations. Hervé Pierre plays Moman in a large kitchen apron, holding a saucepan; Clotilde Mollet plays Louistiti in denim dungarees. The discrepancy between the performer’s body and the character creates distance and comic effect while questioning the representation of parental roles. Watching a man embody a mother raising such a curious, endlessly demanding child on her own makes the mental and emotional burden of motherhood particularly palpable.\n\nThis inversion is heightened in a comic scene in which Hervé Pierre wraps himself in two curtains and assumes the air of an aristocratic lady. His graceful gait and dancing movements offer an escape from a daily life shaped by fatigue and responsibility. The same canvases that compose the child’s world give the mother another body, another existence, for the duration of a dance."]}},{"title":{"fr":"3. L’épilogue : le corps maternel après le sacrifice","zh":"3. 尾声：自我牺牲之后的母亲身体","en":"3. The Epilogue: The Maternal Body after Sacrifice"},"paragraphs":{"fr":["La rupture survient dans l’épilogue, lorsque les deux comédiens échangent leurs rôles. Hervé Pierre retire le tablier de Moman et révèle un costume sobre et mature : il devient Louis adulte. Clotilde Mollet enfile à son tour l’envers du tablier, qui prend l’apparence d’une robe plus terne et vieillissante. Le passage du temps s’inscrit dans un accessoire familier et dans le corps qui le porte désormais. L’enfant est devenu l’adulte responsable ; la mère protectrice est devenue celle dont il faut prendre soin.\n\nCe basculement ouvre pour moi une lecture sociale de la scène. Louis apparaît comme un homme intégré dans le monde du travail, vêtu d’un costume sobre et élégant, tandis que Moman semble déconnectée de la réalité et dépendante de son fils. Je lis dans ce contraste l’inégalité d’un ordre social où l’homme peut incarner la force et la stabilité, tandis que la femme, après avoir consacré sa vie à son enfant, se retrouve dans une fragilité presque enfantine, comme ramenée à l’impuissance. La maternité apparaît ici comme un sacrifice de soi, dont les traces restent visibles sur le corps autant que sur l’esprit.\n\nCette interprétation tient à la succession des corps, des vêtements et des positions de dépendance. Le renversement final donne une épaisseur rétrospective à tout ce qui précède : les réponses, les gestes de protection et les échappées comiques de Moman deviennent aussi les moments d’une vie dépensée pour l’enfant. Le minimalisme scénique fait ainsi sentir la transmission, mais également son coût."],"zh":["转折发生在尾声，两位演员交换了角色。埃尔韦·皮埃尔脱去妈妈的围裙，露出一身简洁而成熟的西装，成为成年的路易。克洛蒂尔德·莫莱则反穿围裙，使之呈现为一件更加暗淡、显老的裙装。时间的流逝被写进一件熟悉的道具，也被写进如今穿着它的身体。孩子已经成为承担责任的成年人；曾经保护他的母亲，如今成了需要被照料的人。\n\n这一转变使我从社会层面重新理解这个场景。路易穿着简洁而体面的西装，显得已经融入工作的世界；妈妈却似乎脱离了现实，依赖着儿子。在这组对比中，我读到一种社会秩序的不平等：男人可以成为力量与稳定的体现，女人却在将一生奉献给孩子之后，陷入近乎幼儿般的脆弱，仿佛重新退回无力的状态。母职在此显现为自我牺牲，其痕迹既留在身体上，也留在精神之中。\n\n这一解释来自身体、衣着与依赖位置的接续变化。最终的角色逆转，使之前的一切获得了回溯性的厚度：妈妈的回答、保护孩子的动作，以及那些滑稽的短暂逃离，也成为她为孩子耗费一生的片刻。舞台的极简由此让人感到传承，也感到传承的代价。"],"en":["The rupture occurs in the epilogue, when the two actors exchange roles. Hervé Pierre removes Moman’s apron to reveal a sober, mature suit: he becomes the adult Louis. Clotilde Mollet puts on the apron inside out, giving it the appearance of a duller, ageing dress. The passage of time is inscribed in a familiar prop and in the body that now wears it. The child has become the responsible adult; the protective mother has become the one who needs care.\n\nFor me, this shift opens a social reading of the scene. Louis appears as a man integrated into working life, dressed in a sober, elegant suit, while Moman seems disconnected from reality and dependent on her son. I read in this contrast the inequality of a social order in which the man can embody strength and stability, while the woman, having devoted her life to her child, finds herself in an almost childlike fragility, as though returned to powerlessness. Motherhood appears here as a sacrifice of the self, leaving visible traces on the body as well as the mind.\n\nThis interpretation rests on the succession of bodies, clothes and positions of dependency. The final reversal lends retrospective depth to everything that precedes it: Moman’s answers, gestures of protection and comic moments of escape also become moments of a life expended for her child. The minimal staging makes transmission palpable, together with its cost."]}}]},{"id":"moman-06","title":{"fr":"II. Le langage : apprivoiser la peur, transmettre la mémoire","zh":"II. 语言：安顿恐惧，传递记忆","en":"II. Language: Coming to Terms with Fear, Transmitting Memory"},"units":[{"title":{"fr":"1. Les questions d’un enfant devant l’existence","zh":"1. 孩子面对存在时的追问","en":"1. A Child’s Questions about Existence"},"paragraphs":{"fr":["L’appel *« Moman ! »* rythme la pièce. Derrière les questions de Louistiti se cachent des inquiétudes philosophiques et sociales. Le rapprochement avec *The Uses of Enchantment: The Meaning and Importance of Fairy Tales* de Bruno Bettelheim permet d’éclairer la place de l’imaginaire dans cette confrontation aux peurs : les récits offrent à l’enfant des formes dans lesquelles saisir ce qui le trouble.<sup><a href=\"#moman-note-4\" id=\"moman-ref-4\">4</a></sup> Chez Grumberg, ce travail passe par le dialogue quotidien. Louistiti interroge sa mère sur l’identité, la guerre et le sens de l’existence ; le jeu et l’humour lui permettent d’approcher des questions qui le dépassent.\n\nLorsqu’il demande *« Pourquoi t’es ma moman à moi et pas à un autre ? »*, sa curiosité touche à l’origine de sa propre existence. La réponse de Moman la ramène à une rencontre : *« Pasque j’ai rencontré ton popa à Neuneu. À la fête. »*<sup><a href=\"#moman-note-5\" id=\"moman-ref-5\">5</a></sup> J’y retrouve une inquiétude proche de la contingence chez Sartre : si ma présence au monde tient à un hasard, j’aurais aussi bien pu ne pas exister. La question enfantine donne à ce trouble une forme concrète, affective, immédiatement adressée à quelqu’un.\n\nMoman répond par l’humour, la tendresse et le langage du quotidien. Au lieu d’une explication abstraite, elle évoque une fête et la rencontre du père. Lorsque la conversation touche au refus de manger, elle lance une provocation affectueuse : *« Mais surtout si y mangeait sa bouillie sans rouscailler, peut-être oui, peut-être alors… »*<sup><a href=\"#moman-note-5b\" id=\"moman-ref-5b\">6</a></sup> Elle détourne l’angoisse vers une situation familière. Cette tendresse n’exclut ni l’impatience ni la menace de se fâcher, déjà présentes dans la première scène. Elle appartient à une relation quotidienne, avec ses ruses et ses limites.\n\nLe même travail de transformation apparaît lorsque Louistiti craint les méchants dans le noir : Moman feint de les attraper et de leur administrer une correction. La peur devient une situation que le jeu permet de maîtriser. Lorsqu’il est rejeté par ses camarades et sa maîtresse à cause de son chapeau pointu, elle lui présente cette différence comme une transmission familiale. Lorsque les autres affirment qu’il est en bois, elle répond par une vision poétique et égalitaire de l’existence. Ses récits rendent la vie supportable et offrent à l’enfant les moyens de résister à ce qui le blesse."],"zh":["一声声*“妈妈！”*构成全剧的节奏。路易斯蒂蒂的问题背后，藏着哲学与社会层面的不安。将其与布鲁诺·贝特尔海姆的 *The Uses of Enchantment: The Meaning and Importance of Fairy Tales* 联系起来，有助于理解想象在面对恐惧时所起的作用：故事为孩子提供形式，使他能够把握困扰自己的事物。<sup><a href=\"#moman-note-4-zh\" id=\"moman-ref-4-zh\">4</a></sup>在格吕姆贝格笔下，这一过程通过日常对话展开。路易斯蒂蒂不断向母亲追问身份、战争与存在的意义；游戏和幽默让他能够接近那些超出自身理解范围的问题。\n\n当他问*“为什么你是我的妈妈，不是别人的妈妈？”*时，他的好奇触及了自身存在的起源。妈妈的回答，将这个问题带回一次相遇：*“因为我在讷讷碰见了你爸爸呀。在游乐会上。”*<sup><a href=\"#moman-note-5-zh\" id=\"moman-ref-5-zh\">5</a></sup>我在这里重新遇到一种接近萨特“偶然性”的不安：如果我来到世上只缘于一次偶然，那么我原本也完全可能不曾存在。孩子的发问，为这份困惑赋予了具体而感性的形式，并直接将它交给一个人。\n\n妈妈以幽默、温柔和日常语言作答。她不作抽象解释，而是说起一场游乐会与孩子父亲的相遇。当话题转到孩子不肯吃饭，她又带着亲昵逗他：*“不过最要紧的是，要是他肯乖乖吃糊糊，不闹腾，那也许行呀，也许就……”*<sup><a href=\"#moman-note-5b-zh\" id=\"moman-ref-5b-zh\">6</a></sup>她将焦虑转向熟悉的情境。这种温柔并不排除不耐烦，也不排除威胁要发火——这些在第一场就已出现。它属于一段日常关系，有自己的办法，也有自己的限度。\n\n当路易斯蒂蒂害怕黑暗里的坏人时，同样的转化再次发生：妈妈假装把他们抓住，再好好教训一顿。恐惧变成了可以通过游戏加以掌控的情境。当同学与女老师因他的尖帽子排斥他时，她将这种差异解释为家庭的传承。当别人说他是木头做的，她便以富有诗意而平等的生命图景回应。她讲述的故事使生活变得可以承受，也为孩子提供抵抗伤害自己的事物的办法。"],"en":["The call of *“Mum!”* punctuates the play. Philosophical and social anxieties lie behind Louistiti’s questions. A comparison with Bruno Bettelheim’s *The Uses of Enchantment: The Meaning and Importance of Fairy Tales* helps illuminate the role of imagination in confronting fear: stories offer children forms through which they can grasp what troubles them.<sup><a href=\"#moman-note-4-en\" id=\"moman-ref-4-en\">4</a></sup> In Grumberg’s play, this work takes place through everyday dialogue. Louistiti questions his mother about identity, war and the meaning of existence; play and humour enable him to approach questions beyond his understanding.\n\nWhen he asks, *“Why are you my mum and not someone else’s?”*, his curiosity touches on the origin of his own existence. Moman’s answer brings it back to an encounter: *“’Cause I met your dad at Neuneu. At the fair.”*<sup><a href=\"#moman-note-5-en\" id=\"moman-ref-5-en\">5</a></sup> I recognise here an anxiety close to Sartre’s notion of contingency: if my presence in the world depends on chance, I might just as well never have existed. The child’s question gives this unease a concrete, affective form, addressed directly to another person.\n\nMoman responds with humour, tenderness and everyday language. Instead of an abstract explanation, she recalls a fair and her encounter with the father. When the conversation turns to the child’s refusal to eat, she offers an affectionate provocation: *“But above all, if he’d eat his porridge without making a fuss, maybe yes, maybe then…”*<sup><a href=\"#moman-note-5b-en\" id=\"moman-ref-5b-en\">6</a></sup> She redirects anxiety towards a familiar situation. This tenderness does not exclude impatience or threats to lose her temper, already present in the first scene. It belongs to an everyday relationship, with its tactics and its limits.\n\nThe same work of transformation occurs when Louistiti fears bad people in the dark: Moman pretends to catch them and give them a beating. Fear becomes a situation that play makes manageable. When his classmates and teacher reject him because of his pointed hat, she presents this difference as a family inheritance. When others claim that he is made of wood, she responds with a poetic, egalitarian vision of existence. Her stories make life bearable and give the child ways of resisting what hurts him."]}},{"title":{"fr":"2. De la protection à l’entraide","zh":"2. 从保护到彼此扶持","en":"2. From Protection to Mutual Support"},"paragraphs":{"fr":["La relation est réciproque. Lorsque Moman sombre dans l’angoisse et la mélancolie, Louistiti lui redonne de l’énergie par sa spontanéité. Il l’encourage à exprimer son mal-être sans craindre le jugement des voisins : *« Ça fait rien, Moman, crie un bon coup ! »* Lorsqu’elle se remémore les souffrances de son père pendant la guerre, il s’adresse à ce grand-père à travers le temps :\n\n> *« Salut grand-popa à moi ! C’est toi le popa chéri de ma moman chérie ? Elle t’envoie de gros bisous d’aujourd’hui d’où elle est en train de s’adurcir. »*<sup><a href=\"#moman-note-7\" id=\"moman-ref-7\">7</a></sup>\n\nLes marques de possession *« à moi »* et *« ma moman »* dessinent une continuité familiale. La déclaration de Louistiti relie celui qu’il imagine à celle qu’il voit souffrir. Sa parole fait circuler la tendresse entre un passé douloureux et le présent.\n\nL’épilogue prolonge donc un mouvement déjà perceptible dans l’enfance. Louis devient celui qui veille sur sa mère, mais Louistiti savait déjà lui offrir du réconfort. La protection change de direction ; l’entraide, elle, traverse la pièce. Cette continuité affective rend d’autant plus douloureuse la transformation physique et sociale de Moman."],"zh":["这段关系是相互的。当妈妈陷入焦虑与忧郁，路易斯蒂蒂以孩子的率真重新给予她活力。他鼓励她表达自己的痛苦，不必害怕邻居的评判：*“没关系，妈妈，痛痛快快喊一嗓子吧！”*当她回忆起父亲在战争中遭受的苦难时，他又穿过时间，向这位外祖父说话：\n\n> *“你好呀，我的外公！你就是我亲爱的妈妈最亲爱的爸爸吗？她从今天、从她正在让自己坚强起来的地方，给你送来好多大大的亲亲。”*<sup><a href=\"#moman-note-7-zh\" id=\"moman-ref-7-zh\">7</a></sup>\n\n*“我的”*与*“我的妈妈”*这些领属表达，勾勒出家庭关系的延续。路易斯蒂蒂的话将他想象中的那个人，与眼前正在承受痛苦的人连接起来。他的语言让温柔在痛苦的过去与当下之间流动。\n\n因此，尾声延续了童年时期便已出现的动向。路易成为照料母亲的人，但路易斯蒂蒂早已知道如何安慰她。保护的方向发生了变化，彼此扶持却贯穿全剧。这种情感的连续性，使妈妈身体与社会处境的变化愈发令人痛楚。"],"en":["The relationship is reciprocal. When Moman sinks into anxiety and melancholy, Louistiti restores her energy through his spontaneity. He encourages her to express her distress without fearing the neighbours’ judgement: *“It’s all right, Mum, have a good shout!”* When she recalls her father’s suffering during the war, he addresses this grandfather across time:\n\n> *“Hello, my very own grampa! Are you my darling mum’s darling dad? She’s sending you great big kisses from today, from where she’s busy toughenin’ up.”*<sup><a href=\"#moman-note-7-en\" id=\"moman-ref-7-en\">7</a></sup>\n\nThe possessive expressions *“my very own”* and *“my mum”* trace a continuity within the family. Louistiti’s declaration connects the person he imagines with the person he sees suffering. His words allow tenderness to circulate between a painful past and the present.\n\nThe epilogue therefore extends a movement already perceptible in childhood. Louis becomes the one who looks after his mother, but Louistiti already knew how to comfort her. Protection changes direction; mutual support runs throughout the play. This affective continuity makes Moman’s physical and social transformation all the more painful."]}},{"title":{"fr":"3. Une langue qui garde les voix","zh":"3. 留住声音的语言","en":"3. A Language That Preserves Voices"},"paragraphs":{"fr":["Le texte travaille une langue volontairement déformée. Les écarts grammaticaux et orthographiques participent à l’effet comique, mais aussi à la présence des voix. Grumberg précise dans son texte liminaire qu’il ne faut pas remettre les dialogues en français normatif : les déformations appartiennent à l’écriture même de la pièce.<sup><a href=\"#moman-note-8\" id=\"moman-ref-8\">8</a></sup> Leur familiarité donne aux échanges leur chaleur et leur rythme ; elle fait entendre une relation particulière entre cette mère et cet enfant.\n\nMalgré son apparente simplicité, le texte est rigoureusement structuré par les reprises. *« Au bout de la ligne, tout le monde descend ! »* et *« Pasque c’est comme ça et pas autrement »* circulent entre la mère et l’enfant. *« Gentil n’a qu’un œil, moi j’en ai deux. »* détourne une formule reçue en lui donnant la cohérence absurde d’un raisonnement enfantin. Les expressions *« à c’t’heure »* ou *« Je te quiche »*, comme le désaccord autour du mot *« mamin »*, participent à cette musicalité.<sup><a href=\"#moman-note-9\" id=\"moman-ref-9\">9</a></sup>\n\nCes répétitions établissent un lien entre l’enfance et l’âge adulte. Certaines phrases s’ancrent dans la mémoire avec la voix de la personne qui les prononçait. Reprendre les mots de sa mère, c’est emporter quelque chose d’elle. Le dialogue familial devient ainsi le lieu où se transmettent des manières de parler, de se défendre et d’aimer, au-delà des circonstances qui les ont fait naître."],"zh":["剧本有意对语言进行变形。语法与拼写的偏离既参与制造喜剧效果，也让人物的声音在场。格吕姆贝格在卷首文字中指出，不应把对话改成规范法语：这些变形本就是剧本写作的一部分。<sup><a href=\"#moman-note-8-zh\" id=\"moman-ref-8-zh\">8</a></sup>这种日常口语的亲近感赋予交流以温度和节奏，使人听见这位母亲与这个孩子之间独特的关系。\n\n尽管看似简单，文本却通过重复形成严密的结构。*“到终点啦，大家都下车！”*和*“因为就是这样，不能别样”*在母子之间流转。*“好人只有一只眼，我可有两只。”*则挪用一句现成的说法，赋予它孩子式推理所具有的荒诞自洽。*“à c’t’heure”*、*“Je te quiche”*这样的表达，以及围绕*“mamin”*一词的争执，也参与构成了语言的音乐性。<sup><a href=\"#moman-note-9-zh\" id=\"moman-ref-9-zh\">9</a></sup>\n\n这些重复在童年与成年之间建立联系。某些话语，会连同说出它们的人的声音一道扎根于记忆。重新说出母亲的话，便是将她的一部分带在身边。家庭对话由此成为传递说话、保护自己和爱人的方式的场所，使这些方式超越最初孕育它们的具体情境。"],"en":["The text works with a deliberately altered language. Departures from conventional grammar and spelling contribute to the comic effect, but also to the presence of the characters’ voices. In his prefatory text, Grumberg specifies that the dialogue should not be rewritten in standard French: its distortions belong to the writing of the play itself.<sup><a href=\"#moman-note-8-en\" id=\"moman-ref-8-en\">8</a></sup> Their familiarity gives the exchanges warmth and rhythm, making audible a particular relationship between this mother and this child.\n\nDespite its apparent simplicity, the text is rigorously structured through repetition. *“End of the line, everybody off!”* and *“’Cause that’s how it is and not any other way”* circulate between mother and child. *“A nice person has only one eye. I’ve got two.”* transforms a received expression by giving it the absurd coherence of a child’s reasoning. Phrases such as *“à c’t’heure”* and *“Je te quiche”*, along with the disagreement over the word *“mamin”*, contribute to this musicality.<sup><a href=\"#moman-note-9-en\" id=\"moman-ref-9-en\">9</a></sup>\n\nThese repetitions establish a connection between childhood and adulthood. Certain phrases become lodged in memory together with the voice of the person who spoke them. To repeat one’s mother’s words is to carry something of her with oneself. Family dialogue thus becomes a place where ways of speaking, defending oneself and loving are passed on, outlasting the circumstances in which they first arose."]}}]},{"id":"moman-10","title":{"fr":"III. Réflexion personnelle : reconnaître l’hostilité, retrouver la chaleur","zh":"III. 个人思考：辨认敌意，重遇温暖","en":"III. Personal Reflection: Recognising Hostility, Rediscovering Warmth"},"units":[{"title":{"fr":"III. Réflexion personnelle : reconnaître l’hostilité, retrouver la chaleur","zh":"III. 个人思考：辨认敌意，重遇温暖","en":"III. Personal Reflection: Recognising Hostility, Rediscovering Warmth"},"paragraphs":{"fr":["J’ai grandi dans un environnement similaire à celui de Louistiti. C’est pourquoi je ressens profondément les peurs enfantines de ce personnage, ces angoisses teintées de fantasmes, cette inquiétude face à la mort et à sa propre existence. Ma mère, bien que n’ayant pas eu accès à des études supérieures, a su me protéger et réchauffer mon cœur avec un amour simple, sincère et vibrant.\n\nDans le milieu où j’ai grandi, en Chine, le regard porté sur les mères élevant seules leur enfant était davantage fait de pitié et de préjugés que de reconnaissance. Même lorsqu’une femme travaillait, la croyance dominante voulait qu’un foyer ait nécessairement besoin d’un homme pour assurer les tâches physiques, garantir la sécurité du ménage et subvenir aux besoins économiques. Une famille sans homme était vulnérable aux brimades, qu’elles viennent des collègues de la mère, des voisins ou des camarades de classe de l’enfant. Sans soutien masculin perçu comme une force protectrice, une mère pouvait voir son espace de vie et ses ressources réduits par ceux qui l’entouraient, de manière consciente ou insidieuse.\n\nPour une femme divorcée et élevant seule une fille, ce statut devenait un poids invisible, une entrave à la possibilité de refaire sa vie. Avoir été mariée, avoir donné naissance à *« l’enfant d’un autre homme »*, être en situation de précarité : autant d’obstacles qui rendaient ce renouveau plus difficile. Si les mères pouvaient se soutenir et se réconforter entre elles, il leur était bien plus difficile de s’autoriser à vivre pleinement et sereinement.\n\nC’est pourquoi, à mes yeux, le monde extérieur à la cabane modeste de la pièce est rempli d’hostilité : les voisins impatients et dénués d’empathie, le père qui abandonne son fils et sa compagne, la guerre qui pousse un grand-père à se cacher, les camarades qui harcèlent Louistiti sans raison, l’institutrice qui méprise les enfants portant un chapeau pointu… Tout cet environnement ressemble aux tensions invisibles que je percevais, enfant, sans en comprendre pleinement la nature, mais dont j’absorbais l’inquiétude et la colère. C’est aussi dans cette adversité que le lien entre la mère et son fils trouve toute sa chaleur et sa force.\n\nAlors, pourquoi les méchants sont-ils méchants ? Est-ce la peur qui engendre leur cruauté ? Ou bien vivent-ils simplement leur propre vie, sans jamais prendre conscience du mal qu’ils infligent aux autres ? Je n’ai pas de réponse.\n\nAlors, avec l’innocence d’un enfant, je ne peux que reprendre la formule à ma manière :\n\n*Pasque gentil n’a qu’un œil, et il préfère en avoir deux.*"],"zh":["我在与路易斯蒂蒂相似的环境中长大。因此，我深切地感受到这个人物童年的恐惧，那些混杂着幻想的焦虑，以及面对死亡与自身存在时的不安。我的母亲虽然未曾有机会接受高等教育，却以朴素、真诚而鲜活的爱，保护了我，温暖了我的心。\n\n在我于中国成长的生活环境里，人们看待独自抚养孩子的母亲时，怜悯和偏见往往多于认可。即使一个女人有工作，主流观念仍认为，一个家庭必定需要男人承担体力劳动、保障家庭安全，并负担经济开支。没有男人的家庭容易遭受欺凌，无论这种欺凌来自母亲的同事、邻居，还是孩子的同学。没有被视为保护力量的男性支持，母亲的生活空间与资源便可能被周围的人压缩，有时是有意为之，有时则以隐蔽的方式发生。\n\n对于一个离异、独自抚养女儿的女人来说，这种身份成为无形的重负，阻碍她重新开始生活。曾经结过婚，生下了*“另一个男人的孩子”*，身处困顿：这些都使重新开始更加艰难。母亲们即便可以彼此扶持、互相安慰，也远不那么容易允许自己充实而安稳地生活。\n\n因此，在我看来，剧中简陋小屋之外的世界充满敌意：缺乏耐心与同理心的邻居，抛弃儿子与伴侣的父亲，迫使外祖父躲藏的战争，无缘无故欺负路易斯蒂蒂的同学，轻视戴尖帽子孩子的女老师……这一切都像极了我在童年感知到的那些无形紧张：我尚不能充分理解它们，却已吸收了其中的不安与愤怒。也正是在这种逆境中，母子之间的纽带获得了全部的温暖与力量。\n\n那么，坏人为什么是坏人？是恐惧催生了他们的残酷吗？还是他们只是过着自己的生活，从未意识到自己给别人造成了伤害？我没有答案。\n\n于是，带着孩子的天真，我只能用自己的方式重新说出那句话：\n\n*因为好人只有一只眼，他却更想要两只。*"],"en":["I grew up in an environment similar to Louistiti’s. This is why I feel this character’s childhood fears so deeply: anxieties tinged with fantasy, unease about death and about his own existence. Although my mother had no access to higher education, she knew how to protect me and warm my heart with a love that was simple, sincere and alive.\n\nIn the environment in which I grew up in China, mothers raising a child alone were met more often with pity and prejudice than with recognition. Even when a woman worked, the prevailing belief was that a household necessarily needed a man to undertake physical tasks, ensure its safety and provide for it financially. A family without a man was vulnerable to bullying, whether from the mother’s colleagues, neighbours or the child’s classmates. Without male support perceived as a protective force, a mother could find her living space and resources curtailed by those around her, deliberately or insidiously.\n\nFor a divorced woman raising a daughter alone, this status became an invisible burden, an obstacle to the possibility of rebuilding her life. Having been married, having given birth to *“another man’s child”*, living in precarious circumstances: each made a new beginning more difficult. Although mothers could support and comfort one another, it was much harder for them to allow themselves a full and peaceful life.\n\nThis is why, to my eyes, the world outside the play’s modest hut is filled with hostility: impatient neighbours lacking empathy, the father who abandons his son and partner, the war that forces a grandfather into hiding, classmates who bully Louistiti for no reason, the teacher who despises children wearing pointed hats… This entire environment resembles the invisible tensions I sensed as a child without fully understanding them, yet whose anxiety and anger I absorbed. It is also within this adversity that the bond between mother and son finds all its warmth and strength.\n\nSo why are bad people bad? Does fear engender their cruelty? Or do they simply live their own lives, never becoming aware of the harm they inflict on others? I have no answer.\n\nAnd so, with a child’s innocence, I can only take up the expression in my own way:\n\n*’Cause a nice person has only one eye, and he’d rather have two.*"]}}]},{"id":"moman-11","title":{"fr":"Notes","zh":"注释","en":"Notes"},"units":[{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"paragraphs":{"fr":["<a id=\"moman-note-1\"></a>**1.** Jean-Claude Grumberg, *Moman 10 fois*, Actes Sud-Papiers, 2017, texte liminaire, p. 7–8. [Extrait de l’édition](https://excerpts.numilog.com/books/9782330072759.pdf). Ce texte explicite le lien à la mémoire de sa mère et la transformation de cette mémoire par l’écriture. [Retour](#moman-ref-1)\n\n<a id=\"moman-note-2\"></a>**2.** *Moman – Pourquoi les méchants sont méchants ?*, texte de Jean-Claude Grumberg, mise en scène de Noémie Pierre, avec Clotilde Mollet et Hervé Pierre. La distribution et la mise en scène sont documentées sur la [page du spectacle de La Scala Paris](https://lascala-paris.fr/programmation/moman-pourquoi-les-mechants-sont-mechants/). Les descriptions de gestes, d’accessoires et de lumières dans cette étude proviennent de mes notes de spectacle. [Retour](#moman-ref-2)\n\n<a id=\"moman-note-3\"></a>**3.** Grumberg, *Moman 10 fois*, première scène, « Moman j’ai poeur », p. 11 et 12. L’orthographe des répliques est conservée. [Retour](#moman-ref-3)\n\n<a id=\"moman-note-4\"></a>**4.** Bruno Bettelheim, *The Uses of Enchantment: The Meaning and Importance of Fairy Tales*. Le rapprochement concerne la fonction des récits dans l’élaboration des inquiétudes enfantines ; il ne suppose ni une influence directe sur Grumberg ni une identité entre le conte et le dialogue théâtral. La référence est générale, sans citation littérale. [Retour](#moman-ref-4)\n\n<a id=\"moman-note-5\"></a>**5.** Répliques conservées dans mon compte rendu initial du spectacle. Le rapprochement avec la contingence chez Sartre relève de ma lecture de la question de Louistiti. [Retour](#moman-ref-5)\n\n<a id=\"moman-note-5b\"></a>**6.** Réplique conservée dans mon compte rendu initial du spectacle. [Retour](#moman-ref-5b)\n\n<a id=\"moman-note-7\"></a>**7.** Répliques conservées dans mon compte rendu initial du spectacle. La graphie *« s’adurcir »* est conservée. [Retour](#moman-ref-7)\n\n<a id=\"moman-note-8\"></a>**8.** Grumberg, *Moman 10 fois*, texte liminaire, p. 7–8. [Retour](#moman-ref-8)\n\n<a id=\"moman-note-9\"></a>**9.** Formules relevées dans mes notes sur *Moman*. Pour les expressions *« à c’t’heure »* et le désaccord autour de *« mamin »*, voir aussi la première scène, p. 13–15 de l’édition de 2017. La dernière phrase de cette étude est ma reprise de la formule sur *« gentil »*, et non une nouvelle citation littérale de Grumberg. [Retour](#moman-ref-9)","Note sur les traductions : les citations chinoises et anglaises sont traduites des passages français cités dans cette étude ; elles ne sont pas empruntées à des traductions publiées. Les formes françaises examinées en tant que faits de langue sont conservées lorsque l’analyse l’exige."],"zh":["<a id=\"moman-note-1-zh\"></a>**1.** 让-克洛德·格吕姆贝格，*Moman 10 fois*，Actes Sud-Papiers，2017年，卷首文字，第7–8页。[版本节选](https://excerpts.numilog.com/books/9782330072759.pdf)。该文说明了作品与母亲记忆的联系，以及写作如何转化这份记忆。[返回正文](#moman-ref-1-zh)\n\n<a id=\"moman-note-2-zh\"></a>**2.** *Moman – Pourquoi les méchants sont méchants ?*，让-克洛德·格吕姆贝格编剧，诺埃米·皮埃尔导演，克洛蒂尔德·莫莱、埃尔韦·皮埃尔出演。演员与导演信息见[巴黎La Scala剧院演出页](https://lascala-paris.fr/programmation/moman-pourquoi-les-mechants-sont-mechants/)。本文对动作、道具和灯光的描述来自我的观剧记录。[返回正文](#moman-ref-2-zh)\n\n<a id=\"moman-note-3-zh\"></a>**3.** 格吕姆贝格，*Moman 10 fois*，第一场“Moman j’ai poeur”，第11、12页。法文原文保留台词原有拼写。[返回正文](#moman-ref-3-zh)\n\n<a id=\"moman-note-4-zh\"></a>**4.** 布鲁诺·贝特尔海姆，*The Uses of Enchantment: The Meaning and Importance of Fairy Tales*。这里的联系针对故事在梳理儿童焦虑时所起的作用，并不预设贝特尔海姆对格吕姆贝格的直接影响，也不将童话与戏剧对话等同。此处为概念层面的参照，没有逐字引文。[返回正文](#moman-ref-4-zh)\n\n<a id=\"moman-note-5-zh\"></a>**5.** 台词保存于我最初的观剧文章。与萨特“偶然性”的联系，属于我对路易斯蒂蒂问题的解读。[返回正文](#moman-ref-5-zh)\n\n<a id=\"moman-note-5b-zh\"></a>**6.** 台词保存于我最初的观剧文章。[返回正文](#moman-ref-5b-zh)\n\n<a id=\"moman-note-7-zh\"></a>**7.** 台词保存于我最初的观剧文章。法文原文保留*“s’adurcir”*这一写法。[返回正文](#moman-ref-7-zh)\n\n<a id=\"moman-note-8-zh\"></a>**8.** 格吕姆贝格，*Moman 10 fois*，卷首文字，第7–8页。[返回正文](#moman-ref-8-zh)\n\n<a id=\"moman-note-9-zh\"></a>**9.** 这些表达出自我的*Moman*观剧记录。关于*“à c’t’heure”*以及围绕*“mamin”*的争执，另见2017年版第一场，第13–15页。本文最后一句是我对*“gentil”*这一表达的变奏，并非格吕姆贝格的另一句逐字引文。[返回正文](#moman-ref-9-zh)","译文说明：中英文引文均译自本文所引的法文段落，不援用已出版译本；作为语言分析对象的法语词形，在必要处保留。"],"en":["<a id=\"moman-note-1-en\"></a>**1.** Jean-Claude Grumberg, *Moman 10 fois*, Actes Sud-Papiers, 2017, prefatory text, pp. 7–8. [Excerpt from the edition](https://excerpts.numilog.com/books/9782330072759.pdf). This text explains the connection with the memory of his mother and the transformation of that memory through writing. [Back](#moman-ref-1-en)\n\n<a id=\"moman-note-2-en\"></a>**2.** *Moman – Pourquoi les méchants sont méchants?*, by Jean-Claude Grumberg, directed by Noémie Pierre, with Clotilde Mollet and Hervé Pierre. The cast and director are documented on [La Scala Paris’s production page](https://lascala-paris.fr/programmation/moman-pourquoi-les-mechants-sont-mechants/). The descriptions of gestures, props and lighting in this study come from my notes on the performance. [Back](#moman-ref-2-en)\n\n<a id=\"moman-note-3-en\"></a>**3.** Grumberg, *Moman 10 fois*, first scene, “Moman j’ai poeur”, pp. 11 and 12. The French source preserves the dialogue’s original spelling. [Back](#moman-ref-3-en)\n\n<a id=\"moman-note-4-en\"></a>**4.** Bruno Bettelheim, *The Uses of Enchantment: The Meaning and Importance of Fairy Tales*. The comparison concerns the role of stories in working through childhood anxieties; it presupposes neither a direct influence on Grumberg nor an identity between the fairy tale and theatrical dialogue. The reference is general and includes no direct quotation. [Back](#moman-ref-4-en)\n\n<a id=\"moman-note-5-en\"></a>**5.** Lines preserved in my original account of the performance. The comparison with Sartrean contingency belongs to my reading of Louistiti’s question. [Back](#moman-ref-5-en)\n\n<a id=\"moman-note-5b-en\"></a>**6.** Line preserved in my original account of the performance. [Back](#moman-ref-5b-en)\n\n<a id=\"moman-note-7-en\"></a>**7.** Lines preserved in my original account of the performance. The French source retains the spelling *“s’adurcir”*. [Back](#moman-ref-7-en)\n\n<a id=\"moman-note-8-en\"></a>**8.** Grumberg, *Moman 10 fois*, prefatory text, pp. 7–8. [Back](#moman-ref-8-en)\n\n<a id=\"moman-note-9-en\"></a>**9.** Expressions recorded in my notes on *Moman*. For *“à c’t’heure”* and the disagreement over *“mamin”*, see also the first scene, pp. 13–15 of the 2017 edition. The final sentence of this study is my variation on the expression involving *“gentil”*, rather than another direct quotation from Grumberg. [Back](#moman-ref-9-en)","Translation note: Chinese and English quotations are translated from the French passages cited in this study, rather than taken from published translations. French forms discussed as linguistic evidence are retained where the analysis requires them."]}}]},{"id":"moman-12","title":{"fr":"Références","zh":"参考文献","en":"References"},"units":[{"title":{"fr":"Références","zh":"参考文献","en":"References"},"paragraphs":{"fr":["- Grumberg, Jean-Claude, *Moman 10 fois*, Actes Sud-Papiers, 2017.\n- Pierre, Noémie, mise en scène de *Moman – Pourquoi les méchants sont méchants ?*, de Jean-Claude Grumberg, avec Clotilde Mollet et Hervé Pierre. [Présentation de La Scala Paris](https://lascala-paris.fr/programmation/moman-pourquoi-les-mechants-sont-mechants/).\n- Bettelheim, Bruno, *The Uses of Enchantment: The Meaning and Importance of Fairy Tales*, référence théorique générale mentionnée dans l’étude."],"zh":["- 让-克洛德·格吕姆贝格，*Moman 10 fois*，Actes Sud-Papiers，2017年。\n- 诺埃米·皮埃尔导演，*Moman – Pourquoi les méchants sont méchants ?*，让-克洛德·格吕姆贝格编剧，克洛蒂尔德·莫莱与埃尔韦·皮埃尔出演。[La Scala Paris演出介绍](https://lascala-paris.fr/programmation/moman-pourquoi-les-mechants-sont-mechants/)。\n- 布鲁诺·贝特尔海姆，*The Uses of Enchantment: The Meaning and Importance of Fairy Tales*，本文提及的一般理论参照。"],"en":["- Grumberg, Jean-Claude. *Moman 10 fois*. Actes Sud-Papiers, 2017.\n- Pierre, Noémie, director. *Moman – Pourquoi les méchants sont méchants?*, by Jean-Claude Grumberg, with Clotilde Mollet and Hervé Pierre. [La Scala Paris production information](https://lascala-paris.fr/programmation/moman-pourquoi-les-mechants-sont-mechants/).\n- Bettelheim, Bruno. *The Uses of Enchantment: The Meaning and Importance of Fairy Tales*. General theoretical reference mentioned in the study.\n\n<!-- translation-notice: render after the notes, not as a work or section title -->\n\n<p class=\"translation-notice\" lang=\"fr\">Note sur les traductions : les citations chinoises et anglaises sont traduites des passages français cités dans cette étude ; elles ne sont pas empruntées à des traductions publiées. Les formes françaises examinées en tant que faits de langue sont conservées lorsque l’analyse l’exige.</p>\n\n<p class=\"translation-notice\" lang=\"zh\">译文说明：中英文引文均译自本文所引的法文段落，不援用已出版译本；作为语言分析对象的法语词形，在必要处保留。</p>\n\n<p class=\"translation-notice\" lang=\"en\">Translation note: Chinese and English quotations are translated from the French passages cited in this study, rather than taken from published translations. French forms discussed as linguistic evidence are retained where the analysis requires them.</p>"]}}]}]},{"id":"theatre-mariamne","title":{"fr":"La nature dans *Mariamne* de Voltaire","zh":"伏尔泰《玛丽亚姆娜》中的自然","en":"Nature in Voltaire’s *Mariamne*"},"meta":["Huihui ZHU"],"sections":[{"id":"mariamne-01","title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"units":[{"title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"paragraphs":{"fr":["Dans la création de *Mariamne*, Voltaire oscille entre la fidélité à l’histoire, les attentes du public et l’ambition de renouveler la représentation des personnages. Sa préface revient sur l’échec de la première représentation en 1724 et sur l’accueil favorable de la reprise remaniée de 1725. Il y distingue cependant le succès de la scène de la valeur durable du texte imprimé. La complexité des émotions, la conduite de l’action et la force des vers doivent donner à la tragédie une existence qui dépasse l’effet immédiat de la représentation.<sup><a href=\"#mariamne-note-1\" id=\"mariamne-ref-1\">1</a></sup>\n\nCette étude examine les fonctions des éléments naturels dans cette écriture dramatique. Les fleuves, les champs, les orages et la lumière composent un espace imaginaire, mais ils interviennent aussi dans la représentation du pouvoir et des valeurs morales. Comment ces images rendent-elles sensibles les conflits entre Hérode, Mariamne et Sohême ?\n\nL’analyse s’appuie sur le texte de la pièce, en l’absence de documents permettant de reconstituer une mise en scène précise. Elle distingue donc les lieux et les images nommés par les personnages des possibilités de réalisation scénique qu’ils suggèrent. Les trois dimensions retenues dans cette lecture — religieuse, exotique et métaphorique — permettent d’examiner comment la nature participe à la construction des personnages et à l’intensification des émotions dramatiques.<sup><a href=\"#mariamne-note-2\" id=\"mariamne-ref-2\">2</a></sup>"],"zh":["在创作《玛丽亚姆娜》（*Mariamne*）的过程中，伏尔泰在忠于历史、回应公众期待，以及更新人物呈现方式的艺术追求之间不断调整。其序言回顾了1724年首演的失败，以及1725年修改后复演获得的好评。然而，他也区分了舞台上的成功与印行文本的持久价值。情感的复杂性、情节的组织与诗句的力量，应当赋予悲剧一种超越演出即时效果的生命。<sup><a href=\"#mariamne-note-1-zh\" id=\"mariamne-ref-1-zh\">1</a></sup>\n\n本文考察自然元素在这种戏剧写作中所承担的功能。河流、田野、风暴与光线组成了一个想象空间，也参与了权力与道德价值的呈现。这些意象如何使希律（Hérode）、玛丽亚姆娜与索埃姆（Sohême）之间的冲突变得可感？\n\n由于缺少足以重建某一具体演出形式的资料，本文以剧本文本为依据。因此，分析将区分人物话语中提及的地点与意象，以及它们所启发的舞台实现可能。本文所选取的宗教、异域与隐喻三个维度，将有助于考察自然如何参与人物塑造，并强化戏剧情感。<sup><a href=\"#mariamne-note-2-zh\" id=\"mariamne-ref-2-zh\">2</a></sup>"],"en":["In writing *Mariamne*, Voltaire moves between fidelity to history, the expectations of the public and the ambition to renew the representation of his characters. His preface looks back on the failure of the first performance in 1724 and the favourable reception of the revised revival in 1725. Yet he also distinguishes success on stage from the lasting value of the printed text. The complexity of emotions, the management of the action and the force of the verse must give tragedy an existence beyond the immediate effect of performance.<sup><a href=\"#mariamne-note-1-en\" id=\"mariamne-ref-1-en\">1</a></sup>\n\nThis study examines the functions of natural elements within this dramatic writing. Rivers, fields, storms and light compose an imagined space, but they also participate in the representation of power and moral values. How do these images make the conflicts between Herod, Mariamne and Sohême palpable?\n\nThe analysis is based on the text of the play, in the absence of documents that would allow a particular staging to be reconstructed. It therefore distinguishes the places and images named by the characters from the possibilities of theatrical realisation they suggest. The three dimensions adopted here—religious, exotic and metaphorical—allow us to examine how nature contributes to characterisation and intensifies dramatic emotion.<sup><a href=\"#mariamne-note-2-en\" id=\"mariamne-ref-2-en\">2</a></sup>"]}}]},{"id":"mariamne-02","title":{"fr":"I. La nature dans sa signification religieuse","zh":"I. 自然的宗教意义","en":"I. The Religious Significance of Nature"},"units":[{"title":{"fr":"1. Jérusalem : le sacré et le pouvoir","zh":"1. 耶路撒冷：神圣性与权力","en":"1. Jerusalem: The Sacred and Power"},"paragraphs":{"fr":["L’indication initiale situe l’action *« à Jérusalem, dans le palais d’Hérode »*. Ce cadre engage immédiatement les rapports entre l’autorité politique, l’héritage dynastique et la religion. Dans l’univers historique de l’action, ce sont la Judée, le Dieu des Hébreux et la lignée des grands-prêtres qui donnent au lieu sa signification. La postérité chrétienne et musulmane de Jérusalem appartient à d’autres horizons de lecture ; elle ne doit pas être confondue avec la situation des personnages.\n\nLa ville fait ainsi converger plusieurs formes de légitimité. Dès la première scène, Mazaël évoque ceux qui voudraient rétablir le *« sang de nos grands-prêtres »* sur le trône. Le pouvoir d’Hérode se heurte à un héritage dont Mariamne demeure porteuse. La religion intervient dans les fidélités, les rivalités et les manières de justifier l’autorité ; elle donne aux conflits familiaux une portée qui dépasse les individus.<sup><a href=\"#mariamne-note-3\" id=\"mariamne-ref-3\">3</a></sup>\n\nLe palais concentre ces tensions. Il constitue le lieu de l’exercice du pouvoir et de l’enfermement de Mariamne. Le trône, fréquemment évoqué dans les discours, associe la souveraineté à l’héritage familial. Sa fonction symbolique peut être analysée sans présumer de la disposition matérielle d’un décor : le texte suffit à faire du palais un espace où l’autorité prétend s’affermir tandis que sa légitimité morale se défait."],"zh":["开篇的舞台提示将故事设定在*“耶路撒冷，希律的宫殿内”*。这一背景立即牵动了政治权威、王朝继承与宗教之间的关系。在剧情的历史世界中，犹太地、希伯来人的上帝与大祭司的血统，赋予此地以意义。耶路撒冷后来在基督教与伊斯兰教中的地位，属于其他阅读视野，不能与人物所处的情境混为一谈。\n\n这座城市使多种合法性在此交汇。第一场中，马扎埃尔（Mazaël）便提及那些希望将*“我们大祭司的血脉”*重新送上王位的人。希律的权力遭遇了一份由玛丽亚姆娜继续承载的继承权。宗教介入了忠诚、竞争，以及为权威作出辩护的方式，使家族冲突获得了超出个人的意义。<sup><a href=\"#mariamne-note-3-zh\" id=\"mariamne-ref-3-zh\">3</a></sup>\n\n王宫集中了这些紧张关系。它既是权力施行的场所，也是玛丽亚姆娜受到禁锢的地方。人物话语中屡次出现的王座，将主权与家族继承联系起来。分析其象征功能，并不需要预设某套舞台布景的具体陈设：文本本身已足以将王宫塑造成这样的空间——权威力图在此巩固自身，其道德合法性却同时瓦解。"],"en":["The opening stage direction locates the action *“in Jerusalem, in Herod’s palace”*. This setting immediately brings political authority, dynastic inheritance and religion into relation. Within the historical world of the action, Judaea, the God of the Hebrews and the lineage of the high priests give the place its significance. Jerusalem’s later Christian and Muslim meanings belong to other horizons of interpretation and should not be confused with the characters’ situation.\n\nThe city thus brings together several forms of legitimacy. In the first scene, Mazaël speaks of those who would restore the *“blood of our high priests”* to the throne. Herod’s power confronts an inheritance that Mariamne continues to bear. Religion enters into loyalties, rivalries and the ways authority is justified; it gives family conflicts a significance beyond the individuals involved.<sup><a href=\"#mariamne-note-3-en\" id=\"mariamne-ref-3-en\">3</a></sup>\n\nThe palace concentrates these tensions. It is both the site where power is exercised and the place of Mariamne’s confinement. The throne, frequently evoked in the dialogue, associates sovereignty with family inheritance. Its symbolic function can be analysed without presuming a particular physical arrangement of the set: the text itself makes the palace a space where authority seeks to consolidate itself while its moral legitimacy unravels."]}},{"title":{"fr":"2. Le Jourdain : un lieu sacré traversé par la violence","zh":"2. 约旦河：被暴力穿透的神圣之地","en":"2. The Jordan: A Sacred Place Traversed by Violence"},"paragraphs":{"fr":["Le Jourdain est l’un des éléments naturels qui relient le plus étroitement géographie, mémoire religieuse et histoire familiale. Son nom contribue à inscrire la pièce dans un paysage biblique. Une lecture symbolique peut y chercher la continuité d’un ordre qui excède les ambitions humaines. Cette permanence rencontre toutefois, dans la tragédie, le souvenir d’une violence précise.\n\nMariamne déclare à l’acte V :\n\n> *« Dans les eaux du Jourdain j’ai vu périr mon frère ; »*<sup><a href=\"#mariamne-note-4\" id=\"mariamne-ref-4\">4</a></sup>\n\nLe fleuve porte la mémoire du meurtre. L’image d’une eau purificatrice ou d’une nature sereine ne peut donc épuiser sa signification. La force du symbole tient à cette tension : un lieu chargé de résonances sacrées demeure associé à la destruction d’une famille. L’eau fait entrer le souvenir de la violence dans le paysage même de la pièce.\n\nLe contraste que j’établis entre l’ordre naturel et la corruption du pouvoir doit être lu à partir de cette blessure. La nature offre un horizon auquel rapporter les conduites humaines, mais le crime l’a déjà traversée. La dignité de Mariamne apparaît alors dans sa fidélité à une mémoire et à des exigences morales que le pouvoir cherche à écraser."],"zh":["约旦河是将地理、宗教记忆与家族历史联系得最为紧密的自然元素之一。它的名字将剧作置入具有圣经意蕴的景观。象征性的阅读可以从中寻找一种超越人类野心的秩序的延续。然而在这部悲剧中，这种恒久性同时遭遇了一段具体的暴力记忆。\n\n第五幕中，玛丽亚姆娜说：\n\n> *“我亲眼看见兄弟葬身约旦河水之中。”*<sup><a href=\"#mariamne-note-4-zh\" id=\"mariamne-ref-4-zh\">4</a></sup>\n\n河流承载着谋杀的记忆。净化之水或宁静自然的意象，因此无法穷尽它的意义。象征的力量正来自这种张力：一个充满神圣回响的地方，却始终与一个家族的毁灭相连。水将暴力的记忆带入了剧作的景观本身。\n\n我所建立的自然秩序与权力腐败之间的对比，必须从这一创伤出发理解。自然提供了一个衡量人类行为的视野，但罪行早已从中穿过。玛丽亚姆娜的尊严，则体现于她对记忆和道德要求的忠诚——而权力正试图将它们碾碎。"],"en":["The Jordan is one of the natural elements that most closely connects geography, religious memory and family history. Its name helps situate the play within a biblical landscape. A symbolic reading may find in it the continuity of an order that exceeds human ambition. In the tragedy, however, this permanence encounters the memory of a specific act of violence.\n\nIn Act V, Mariamne declares:\n\n> *“In the waters of the Jordan I saw my brother perish.”*<sup><a href=\"#mariamne-note-4-en\" id=\"mariamne-ref-4-en\">4</a></sup>\n\nThe river carries the memory of murder. An image of purifying water or serene nature cannot therefore exhaust its significance. The symbol derives its force from this tension: a place charged with sacred resonances remains associated with the destruction of a family. Water brings the memory of violence into the very landscape of the play.\n\nThe contrast I draw between natural order and the corruption of power must be read through this wound. Nature offers a horizon against which human conduct can be considered, but crime has already passed through it. Mariamne’s dignity then emerges in her fidelity to a memory and to moral demands that power seeks to crush."]}},{"title":{"fr":"3. Les palmes : la nature intégrée au rituel","zh":"3. 棕榈枝：进入仪式的自然","en":"3. Palm Fronds: Nature Incorporated into Ritual"},"paragraphs":{"fr":["Le lien entre nature et religion devient particulièrement concret lorsque Narbas annonce l’arrivée d’Hérode :\n\n> *« Les palmes dans les mains, nos pontifes l’attendent ; »*<sup><a href=\"#mariamne-note-5\" id=\"mariamne-ref-5\">5</a></sup>\n\nL’élément végétal est pris dans une cérémonie d’accueil. Les palmes donnent au retour du roi une solennité religieuse ; leur présence relie la nature à une manifestation collective de reconnaissance du pouvoir. Ce passage permet d’étudier le rituel à partir d’un objet effectivement nommé, sans supposer les habits somptueux des prêtres ni leur apparition sur scène : la cérémonie est ici rapportée par Narbas.\n\nL’image reste ambivalente. La solennité du rite accueille un souverain dont la violence nourrit l’action tragique. À travers le fleuve et les palmes, la nature entre ainsi dans deux rapports différents au pouvoir : elle garde la trace des victimes et fournit les signes d’une célébration royale. Cette diversité donne sa profondeur au réseau religieux de la pièce."],"zh":["当纳尔巴斯（Narbas）报告希律归来时，自然与宗教之间的联系变得尤为具体：\n\n> *“我们的祭司手执棕榈枝，正等候着他。”*<sup><a href=\"#mariamne-note-5-zh\" id=\"mariamne-ref-5-zh\">5</a></sup>\n\n植物元素进入了一场迎接仪式。棕榈枝为国王的归来赋予宗教性的庄严，使自然与集体承认权力的行为联系在一起。这段文字提供了一个剧中明确命名的物件，使仪式的研究有所依据，而无须推定祭司身着华服，也无须假设他们实际出现在舞台上：此处的仪式由纳尔巴斯转述。\n\n这一意象仍具有两面性。庄严的仪式迎接的君主，其暴力恰恰推动着悲剧行动。通过河流与棕榈枝，自然进入了与权力相关的两种不同关系：它保存受害者的痕迹，也提供颂扬王权的符号。这种差异使剧作的宗教意象网络更具深度。"],"en":["The connection between nature and religion becomes particularly concrete when Narbas announces Herod’s arrival:\n\n> *“With palms in their hands, our priests await him.”*<sup><a href=\"#mariamne-note-5-en\" id=\"mariamne-ref-5-en\">5</a></sup>\n\nThe vegetal element is incorporated into a ceremony of welcome. The palm fronds lend religious solemnity to the king’s return; their presence connects nature with a collective acknowledgement of power. This passage allows ritual to be studied through an object explicitly named in the text, without assuming sumptuous priestly garments or the priests’ appearance on stage: here, the ceremony is reported by Narbas.\n\nThe image remains ambivalent. The solemnity of the ritual welcomes a sovereign whose violence drives the tragic action. Through the river and the palm fronds, nature enters into two different relationships with power: it preserves the trace of victims and supplies the signs of royal celebration. This diversity gives depth to the play’s network of religious imagery."]}}]},{"id":"mariamne-06","title":{"fr":"II. La construction d’une nature exotique","zh":"II. 异域自然的建构","en":"II. The Construction of an Exotic Nature"},"units":[{"title":{"fr":"1. Un espace lointain produit par la parole","zh":"1. 由话语生成的遥远空间","en":"1. A Distant Space Produced by Speech"},"paragraphs":{"fr":["Les noms de Jérusalem, de Samarie et du Jourdain ouvrent, pour un public français, un espace géographiquement et historiquement éloigné. J’emploie ici le terme *exotique* pour désigner cette distance construite par le texte. L’analyse porte sur les lieux qu’il donne à imaginer, sans attribuer une même fascination à l’ensemble des spectateurs.\n\nDès l’ouverture, Mazaël raconte son déplacement :\n\n> *« J’ai volé vers Azor, et repassé soudain*  \n> *Des champs de Samarie aux sources du Jourdain : »*<sup><a href=\"#mariamne-note-6\" id=\"mariamne-ref-6\">6</a></sup>\n\nLes champs et les sources élargissent l’espace au-delà du palais. La parole fait apparaître un territoire que le spectateur n’a pas besoin de voir matériellement. Cependant, cette évocation s’inscrit dans le récit d’une intervention politique : Mazaël rapporte la manière dont il a contenu l’opposition au roi. Le paysage est parcouru par les agents du pouvoir. Les *« champs »* n’établissent donc pas, à eux seuls, une idylle pastorale ; leur étendue appartient aussi à la géographie de la domination.\n\nCette tension nourrit le contraste entre l’ouverture des lieux évoqués et le resserrement de l’action dans le palais. Le dehors contient la possibilité du départ, mais il n’est pas assuré d’échapper à la violence d’Hérode. L’ailleurs désiré par les personnages prend toute sa force parce qu’il reste difficile à atteindre."],"zh":["对于法国观众而言，耶路撒冷、撒马利亚与约旦河这些名字打开了一个地理上与历史上都相距遥远的空间。我在此使用“异域性”（*exotique*）一词，指的是文本所构建的这种距离。分析关注文本使人想象的地方，而不将同一种迷恋归于所有观众。\n\n开场时，马扎埃尔便叙述自己的行程：\n\n> *“我飞赴阿佐尔，又迅速返回，*  \n> *从撒马利亚的田野，直至约旦河的源头。”*<sup><a href=\"#mariamne-note-6-zh\" id=\"mariamne-ref-6-zh\">6</a></sup>\n\n田野与源头将空间拓展到王宫之外。话语使一片领土显现，而观众无须亲眼看见它的实体。然而，这一描写处于政治行动的叙述之中：马扎埃尔正在报告他如何压制对国王的反对。权力的代理人穿行于景观之中。因此，仅凭“田野”一词，并不足以确立田园牧歌式的图景；它的广阔也属于统治的地理范围。\n\n这一张力强化了被提及地点的开阔，与王宫中受限的行动空间之间的对比。外部世界包含离开的可能，却不能保证逃脱希律的暴力。人物渴望的远方，正因仍然难以抵达而获得了全部力量。"],"en":["For a French audience, the names Jerusalem, Samaria and the Jordan open up a geographically and historically distant space. I use the term *exotic* here to designate this distance as constructed by the text. The analysis concerns the places it invites us to imagine, without attributing the same fascination to every spectator.\n\nAt the opening, Mazaël recounts his journey:\n\n> *“I sped to Azor and swiftly passed back*  \n> *From the fields of Samaria to the sources of the Jordan.”*<sup><a href=\"#mariamne-note-6-en\" id=\"mariamne-ref-6-en\">6</a></sup>\n\nThe fields and sources extend the space beyond the palace. Speech brings a territory into view without the spectator needing to see it physically. Yet this evocation forms part of an account of political intervention: Mazaël reports how he has contained opposition to the king. The landscape is traversed by agents of power. The *“fields”* do not, by themselves, establish a pastoral idyll; their expanse also belongs to the geography of domination.\n\nThis tension sustains the contrast between the openness of the places evoked and the confinement of the action within the palace. The outside world holds the possibility of departure, but it offers no assurance of escape from Herod’s violence. The elsewhere desired by the characters derives its full force from remaining difficult to reach."]}},{"title":{"fr":"2. Faste, costumes et lumière : les images suggérées par le texte","zh":"2. 华美、服装与光线：文本启发的视觉形象","en":"2. Splendour, Costume and Light: Images Suggested by the Text"},"paragraphs":{"fr":["Le palais et le vocabulaire royal contribuent à l’imaginaire de la grandeur. La *« pourpre »* associe la couleur, le vêtement et la dignité dynastique. Mariamne évoque ainsi *« La splendeur de mon sang, la pourpre où je suis née »*. Ces mots permettent de penser son apparence comme le prolongement de son héritage, sans inventer un costume prescrit par le dramaturge.<sup><a href=\"#mariamne-note-7\" id=\"mariamne-ref-7\">7</a></sup>\n\nCette splendeur demeure tragique. Dans le même monologue, Mariamne rappelle que ce qui semblait lui promettre le bonheur a empoisonné sa vie. La noblesse de la naissance et l’éclat du pouvoir ne garantissent aucune protection. Un costume qui rendrait visible cette dignité pourrait aussi en faire sentir le poids : il porterait l’héritage d’une famille et la contrainte d’une position.\n\nL’opposition entre la lumière de Mariamne et l’ombre qui accompagne la violence d’Hérode constitue, dans ma lecture, une possibilité de mise en scène. On pourrait entourer Mariamne d’une lumière plus calme et faire peser les ombres sur l’espace du roi. Je conserve cette image comme une traduction scénique des contrastes moraux du texte ; elle ne constitue pas le compte rendu d’un éclairage observé ni une didascalie de Voltaire.\n\nElle trouve un appui dans le vœu de Sohême, qui souhaite que le ciel fasse lever sur Mariamne *« un soleil plus serein »*. Cette lumière est appelée vers un avenir possible. Son absence présente importe autant que sa promesse : Mariamne est encore exposée à l’oppression dont Sohême veut la délivrer.<sup><a href=\"#mariamne-note-8\" id=\"mariamne-ref-8\">8</a></sup>\n\nLa nature enrichit donc l’espace théâtral par la parole et par les images qu’elle suscite. Les paysages lointains, la pourpre et le soleil ouvrent des possibilités visuelles, tout en restant liés à des conflits précis : fuir, protéger, régner, préserver sa dignité."],"zh":["王宫与王权语汇参与构成了宏伟的想象。“紫袍”（*pourpre*）将颜色、服装与王朝尊位联系在一起。玛丽亚姆娜由此说起*“我血统的荣光，我生来便承袭的紫袍”*。这些词使人能够将她的外观视为继承关系的延伸，而不必虚构剧作家规定了某种服装。<sup><a href=\"#mariamne-note-7-zh\" id=\"mariamne-ref-7-zh\">7</a></sup>\n\n这种华美始终带着悲剧性。在同一段独白中，玛丽亚姆娜回忆，那些看似许诺她幸福的事物，如何毒害了她的一生。高贵的出身与权力的光辉并不保证任何庇护。让尊严变得可见的服装，也可以使人感到它的重负：它既承载家族遗产，也承载某种地位的束缚。\n\n在我的解读中，玛丽亚姆娜的光明与伴随希律暴力的阴影之间的对立，构成了一种舞台呈现的可能。可以让更平静的光包围玛丽亚姆娜，让阴影压在国王的空间之上。我将这一形象保留为对文本中道德对照的舞台转译；它既非对亲眼所见灯光的记录，也非伏尔泰写下的舞台提示。\n\n这一构想在索埃姆的祈愿中获得了支持：他希望上天能为玛丽亚姆娜升起*“一轮更晴朗的太阳”*。这道光被召唤向一个可能的未来。它当下的缺席，与它所许诺的事物同样重要：玛丽亚姆娜仍暴露在索埃姆想要使她摆脱的压迫之中。<sup><a href=\"#mariamne-note-8-zh\" id=\"mariamne-ref-8-zh\">8</a></sup>\n\n因此，自然通过话语，以及话语唤起的意象，丰富了戏剧空间。遥远的景观、紫袍与太阳打开了视觉可能，同时又始终联系着具体的冲突：逃离、保护、统治、维护尊严。"],"en":["The palace and the vocabulary of royalty contribute to an imaginative world of grandeur. *“Purple”* connects colour, clothing and dynastic dignity. Mariamne evokes *“The splendour of my blood, the purple into which I was born”*. These words allow her appearance to be considered as an extension of her inheritance without inventing a costume prescribed by the playwright.<sup><a href=\"#mariamne-note-7-en\" id=\"mariamne-ref-7-en\">7</a></sup>\n\nThis splendour remains tragic. In the same monologue, Mariamne recalls that what seemed to promise happiness has poisoned her life. Noble birth and the brilliance of power guarantee no protection. A costume that made this dignity visible could also convey its weight: it would bear both a family inheritance and the constraints of a position.\n\nIn my reading, the opposition between Mariamne’s light and the shadow accompanying Herod’s violence offers a possibility for staging. Mariamne could be surrounded by calmer light, while shadows weigh upon the king’s space. I retain this image as a theatrical translation of the text’s moral contrasts; it is neither an account of lighting I have observed nor a stage direction by Voltaire.\n\nIt finds support in Sohême’s wish that heaven might raise *“a more serene sun”* over Mariamne. This light is invoked towards a possible future. Its present absence matters as much as its promise: Mariamne remains exposed to the oppression from which Sohême wishes to release her.<sup><a href=\"#mariamne-note-8-en\" id=\"mariamne-ref-8-en\">8</a></sup>\n\nNature thus enriches theatrical space through speech and the images it evokes. Distant landscapes, purple and the sun open up visual possibilities while remaining connected to specific conflicts: escaping, protecting, ruling and preserving one’s dignity."]}}]},{"id":"mariamne-09","title":{"fr":"III. La nature comme métaphore de l’humanité","zh":"III. 自然作为人性隐喻","en":"III. Nature as a Metaphor for Humanity"},"units":[{"title":{"fr":"1. Les orages : la violence éprouvée par les autres","zh":"1. 风暴：他人所承受的暴力","en":"1. Storms: Violence as Experienced by Others"},"paragraphs":{"fr":["Les tempêtes et les orages donnent une forme sensible à l’instabilité politique et à la violence qui entourent Hérode. L’image traduit la peur d’un danger imminent et la difficulté de s’y soustraire. Lorsque Idamas s’écrie *« Quels orages nouveaux ! quel trouble je prévoi ! »*, il poursuit par une prière : *« Puissant Dieu des Hébreux, changez le cœur du roi ! »*<sup><a href=\"#mariamne-note-9\" id=\"mariamne-ref-9\">9</a></sup>\n\nLa succession des deux vers relie explicitement le péril au cœur d’Hérode. La métaphore naturelle devient une manière de dire l’effet de ses passions sur son entourage. Le roi impose aux autres un climat de menace : ils doivent anticiper ses mouvements et chercher un abri contre sa fureur.\n\nCette image permet de lire ensemble les dimensions psychologique et politique du personnage. Une passion privée devient une force qui menace des existences. L’orage rend sensible ce passage de l’émotion d’un homme à la catastrophe collective qu’autorise son pouvoir."],"zh":["狂风与雷雨为希律周围的政治动荡和暴力赋予了可感的形态。这一意象传达出对迫近危险的恐惧，以及摆脱危险的困难。伊达马斯（Idamas）惊呼*“又将有怎样的风暴！我预感到怎样的动乱！”*，随后便祈求：*“希伯来人强大的上帝啊，请改变国王的心！”*<sup><a href=\"#mariamne-note-9-zh\" id=\"mariamne-ref-9-zh\">9</a></sup>\n\n这两行诗的接续，明确地将危难与希律的内心联系起来。自然隐喻成为一种表达方式，道出他的激情如何作用于身边的人。国王向他人施加一种充满威胁的处境：他们必须预判他的动向，寻找躲避其暴怒的庇护。\n\n这一意象使人物的心理维度与政治维度能够被一并理解。个人的激情成为威胁他人生命的力量。风暴让人感受到，一个人的情绪如何经由其权力所提供的条件，转化为集体的灾难。"],"en":["Storms and tempests give perceptible form to the political instability and violence surrounding Herod. The image conveys fear of imminent danger and the difficulty of escaping it. When Idamas exclaims, *“What new storms! What turmoil I foresee!”*, he follows this with a prayer: *“Mighty God of the Hebrews, change the king’s heart!”*<sup><a href=\"#mariamne-note-9-en\" id=\"mariamne-ref-9-en\">9</a></sup>\n\nThe succession of the two lines explicitly connects the danger with Herod’s heart. The natural metaphor becomes a way of expressing the effect of his passions on those around him. The king imposes a climate of threat upon others: they must anticipate his movements and seek shelter from his fury.\n\nThis image allows the character’s psychological and political dimensions to be read together. A private passion becomes a force that threatens lives. The storm makes palpable the passage from one man’s emotion to the collective catastrophe made possible by his power."]}},{"title":{"fr":"2. Le soleil et les eaux : souhaiter un autre ordre","zh":"2. 太阳与水：向另一种秩序祈愿","en":"2. Sun and Water: Wishing for Another Order"},"paragraphs":{"fr":["Face à ces orages, le vœu de Sohême associe l’eau, le ciel et le soleil à la protection de Mariamne :\n\n> *« Qu’un dépôt si sacré soit respecté des ondes !*  \n> *Que le ciel, attendri par ses douleurs profondes,*  \n> *Fasse lever sur elle un soleil plus serein ! »*<sup><a href=\"#mariamne-note-10\" id=\"mariamne-ref-10\">10</a></sup>\n\nLes eaux sont priées de respecter celle que les hommes persécutent. Le ciel, décrit comme susceptible d’être attendri, devient le destinataire d’une demande de justice. La personnification se trouve précisément dans cette sensibilité prêtée au ciel ; le soleil serein prolonge, quant à lui, l’espoir d’une existence délivrée de la peur.\n\nJ’y vois le désir d’un ordre naturel et moral supérieur à la brutalité du pouvoir. Cet ordre est invoqué par un personnage : les verbes au subjonctif disent le souhait, la prière et l’incertitude. Ils donnent toute son intensité à la dignité de Mariamne, parce que la protection qu’elle mérite n’est pas encore acquise. Le rapprochement avec le Jourdain reste alors douloureux : l’eau que Sohême voudrait protectrice appartient aussi au paysage dans lequel Mariamne a perdu son frère."],"zh":["面对这些风暴，索埃姆的祈愿将水、天空与太阳同对玛丽亚姆娜的保护联系在一起：\n\n> *“愿波涛敬重这一神圣的托付！*  \n> *愿上天被她深重的痛苦打动，*  \n> *为她升起一轮更晴朗的太阳！”*<sup><a href=\"#mariamne-note-10-zh\" id=\"mariamne-ref-10-zh\">10</a></sup>\n\n人们祈求水尊重这位遭人迫害的女子。天空被描述为可能受到触动的存在，成为诉求正义的对象。拟人恰恰体现在这种被赋予天空的感受能力之中；晴朗的太阳则延续着摆脱恐惧、重新生活的希望。\n\n我在其中看到对一种超越权力残暴的自然与道德秩序的渴望。这种秩序由剧中人物祈求而来：虚拟式动词表达着愿望、祈祷与不确定性。玛丽亚姆娜应得的保护尚未获得，这使她的尊严更显强烈。而与约旦河的联系仍令人痛楚：索埃姆希望能够庇护她的水，也属于她失去兄弟的那片景观。"],"en":["In the face of these storms, Sohême’s wish connects water, sky and sun with Mariamne’s protection:\n\n> *“May the waves respect so sacred a charge!*  \n> *May heaven, moved by her profound suffering,*  \n> *Raise over her a more serene sun!”*<sup><a href=\"#mariamne-note-10-en\" id=\"mariamne-ref-10-en\">10</a></sup>\n\nThe waters are asked to respect the woman whom human beings persecute. Heaven, described as capable of being moved, becomes the addressee of an appeal for justice. Personification lies precisely in this capacity for feeling attributed to heaven; the serene sun, for its part, extends the hope of an existence freed from fear.\n\nI see here the desire for a natural and moral order above the brutality of power. This order is invoked by a character: the subjunctive verbs express a wish, a prayer and uncertainty. They give Mariamne’s dignity its full intensity because the protection she deserves has not yet been secured. The connection with the Jordan therefore remains painful: the water Sohême wishes to be protective also belongs to the landscape in which Mariamne lost her brother."]}},{"title":{"fr":"3. Sohême : la force protectrice et les limites de la vengeance","zh":"3. 索埃姆：保护的力量与复仇的界限","en":"3. Sohême: Protective Force and the Limits of Vengeance"},"paragraphs":{"fr":["Sohême incarne la volonté d’opposer une force à l’oppression. Il se décrit comme *« Toujours armé, toujours prompt à la protéger »*. L’anaphore de *« toujours »* donne à sa vigilance une continuité qui répond à la permanence du danger.<sup><a href=\"#mariamne-note-11\" id=\"mariamne-ref-11\">11</a></sup> Là où les passions d’Hérode mettent Mariamne en péril, son dévouement cherche à préserver sa vie.\n\nLorsqu’il a tué Mazaël, Sohême proclame :\n\n> *« Dans son perfide sang Mazaël est plongé,*  \n> *Et du moins à demi mon bras vous a vengé. »*<sup><a href=\"#mariamne-note-12\" id=\"mariamne-ref-12\">12</a></sup>\n\nIl entend rétablir par l’action un ordre moral détruit par le crime. En ce sens, je lis dans sa conduite la revendication d’une justice naturelle, capable de s’opposer à un pouvoir injuste. Cependant, la formule *« à demi »* maintient la vengeance ouverte : le bras protecteur peut encore poursuivre la violence.\n\nMariamne refuse précisément de faire du meurtre d’Hérode la condition de son salut : *« Je déteste un triomphe à mes yeux si coupable »*. Elle affirme connaître les crimes du roi tout en refusant d’en prendre l’exemple.<sup><a href=\"#mariamne-note-13\" id=\"mariamne-ref-13\">13</a></sup> Le désir de justice de Sohême et la constance morale de Mariamne se rencontrent dans la résistance à l’oppression, mais divergent dans les moyens de la combattre.\n\nCette divergence donne plus de force au contraste avec Hérode. La défense de l’innocence oblige à interroger l’acte accompli en son nom. La nature, appelée à fournir des images de protection et d’équilibre, accompagne ainsi une question que l’action laisse ouverte : comment restaurer la justice sans reproduire la violence que l’on condamne ?"],"zh":["索埃姆体现了以力量抵抗压迫的意愿。他形容自己*“始终手执武器，始终准备保护她”*。“始终”的首语重复，赋予他的警觉以持续性，回应了危险的长期存在。<sup><a href=\"#mariamne-note-11-zh\" id=\"mariamne-ref-11-zh\">11</a></sup>希律的激情将玛丽亚姆娜置于险境，索埃姆的忠诚则力图保全她的生命。\n\n杀死马扎埃尔之后，索埃姆宣告：\n\n> *“马扎埃尔已浸在自己背信弃义的血中，*  \n> *我的手臂至少已为您报了一半的仇。”*<sup><a href=\"#mariamne-note-12-zh\" id=\"mariamne-ref-12-zh\">12</a></sup>\n\n他试图通过行动重建被罪行摧毁的道德秩序。在这个意义上，我在他的行为中读到一种自然正义的主张，它能够对抗不义的权力。然而，“一半”这一措辞使复仇仍未结束：保护者的手臂还可能继续施行暴力。\n\n玛丽亚姆娜所拒绝的，恰恰是将杀死希律作为自己获救的条件：*“我憎恶这种在我眼中如此有罪的胜利。”*她承认自己知道国王犯下的罪行，却拒绝以他为榜样。<sup><a href=\"#mariamne-note-13-zh\" id=\"mariamne-ref-13-zh\">13</a></sup>索埃姆对正义的渴望与玛丽亚姆娜在道德上的坚守，在抵抗压迫这一点上相遇，却在反抗的手段上分歧。\n\n这一分歧使他们与希律之间的对照更有力量。捍卫无辜，要求人们审视那些以无辜之名实行的行为。因此，被召唤来提供保护与平衡意象的自然，也伴随着一个戏剧行动并未封闭的问题：如何恢复正义，而不再生产自己所谴责的暴力？"],"en":["Sohême embodies the determination to oppose oppression with force. He describes himself as *“Always armed, always ready to protect her”*. The anaphoric repetition of *“always”* gives his vigilance a continuity that answers the persistence of danger.<sup><a href=\"#mariamne-note-11-en\" id=\"mariamne-ref-11-en\">11</a></sup> Where Herod’s passions endanger Mariamne, Sohême’s devotion seeks to preserve her life.\n\nAfter killing Mazaël, Sohême declares:\n\n> *“Mazaël lies steeped in his own treacherous blood,*  \n> *And my arm has at least half avenged you.”*<sup><a href=\"#mariamne-note-12-en\" id=\"mariamne-ref-12-en\">12</a></sup>\n\nHe intends to restore through action a moral order destroyed by crime. In this sense, I read his conduct as asserting a natural justice capable of opposing an unjust power. Yet the phrase *“half”* leaves vengeance unfinished: the protective arm may still pursue further violence.\n\nMariamne specifically refuses to make Herod’s murder the condition of her salvation: *“I abhor a triumph so guilty in my eyes.”* She declares that she knows the king’s crimes while refusing to follow his example.<sup><a href=\"#mariamne-note-13-en\" id=\"mariamne-ref-13-en\">13</a></sup> Sohême’s desire for justice and Mariamne’s moral constancy meet in their resistance to oppression, but diverge in the means of fighting it.\n\nThis divergence gives greater force to the contrast with Herod. Defending innocence requires scrutiny of the act committed in its name. Nature, called upon to supply images of protection and equilibrium, thus accompanies a question that the action leaves open: how can justice be restored without reproducing the violence one condemns?"]}}]},{"id":"mariamne-13","title":{"fr":"Conclusion","zh":"结论","en":"Conclusion"},"units":[{"title":{"fr":"Conclusion","zh":"结论","en":"Conclusion"},"paragraphs":{"fr":["La notion de *mimèsis* invite à examiner ce que le théâtre donne à représenter. Dans la *Poétique*, Aristote définit la tragédie à partir de l’imitation d’une action ; cette perspective permet d’envisager les images naturelles dans leur rapport aux conduites, aux passions et aux conflits dramatiques.<sup><a href=\"#mariamne-note-14\" id=\"mariamne-ref-14\">14</a></sup> Pour comprendre leur rôle chez Voltaire, il faut donc suivre ce qu’en font les personnages, à chaque moment de l’action.\n\nDans *Mariamne*, la nature devient un langage dramatique. Les lieux sacrés conservent une mémoire familiale et politique ; les paysages évoqués élargissent l’espace du palais ; les orages rendent sensible la menace ; le soleil et les eaux accueillent un désir de protection. Ces images intensifient les émotions et proposent à l’imagination du spectateur des formes visuelles pour saisir les conflits moraux.\n\nL’ordre naturel auquel les personnages aspirent demeure traversé par le crime, la peur et la vengeance. C’est dans cette tension que la nature prend sa force : elle donne à sentir ce que le pouvoir détruit et ce que Mariamne s’efforce encore de préserver."],"zh":["“模仿”（*mimèsis*）这一概念，使人思考戏剧究竟将什么交付于再现。在《诗学》中，亚里士多德从对行动的模仿出发定义悲剧；这一视角使我们得以在自然意象与行为、激情、戏剧冲突之间的关系中理解它们。<sup><a href=\"#mariamne-note-14-zh\" id=\"mariamne-ref-14-zh\">14</a></sup>因此，要理解自然意象在伏尔泰剧中的作用，便需要追踪人物在行动
