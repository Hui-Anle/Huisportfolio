的每一时刻如何使用它们。\n\n在《玛丽亚姆娜》中，自然成为一种戏剧语言。神圣之地保存家族与政治记忆；被唤起的景观拓展王宫的空间；风暴使威胁变得可感；太阳与水承接了寻求庇护的渴望。这些意象强化情感，并向观众的想象提供可供把握道德冲突的视觉形式。\n\n人物所向往的自然秩序，始终被罪行、恐惧与复仇穿透。自然正是在这种张力中获得力量：它让人感受到权力正在摧毁什么，也让人感受到玛丽亚姆娜仍在努力守护什么。"],"en":["The notion of *mimesis* invites us to examine what theatre offers for representation. In the *Poetics*, Aristotle defines tragedy through the imitation of an action; this perspective allows natural images to be considered in relation to conduct, passions and dramatic conflicts.<sup><a href=\"#mariamne-note-14-en\" id=\"mariamne-ref-14-en\">14</a></sup> To understand their role in Voltaire, we must therefore follow what the characters do with them at each moment of the action.\n\nIn *Mariamne*, nature becomes a dramatic language. Sacred places preserve familial and political memory; evoked landscapes extend the space of the palace; storms make threat tangible; sun and water receive a desire for protection. These images intensify emotion and offer the spectator’s imagination visual forms through which to grasp moral conflicts.\n\nThe natural order to which the characters aspire remains traversed by crime, fear and vengeance. Nature gains its force within this tension: it makes palpable what power destroys and what Mariamne still strives to preserve."]}}]},{"id":"mariamne-14","title":{"fr":"Notes","zh":"注释","en":"Notes"},"units":[{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"paragraphs":{"fr":["<a id=\"mariamne-note-1\"></a>**1.** Voltaire, *Mariamne*, « Préface de l’auteur », dans l’édition électronique de Théâtre Classique, PDF publié par Gwénola, Ernest et Paul Fièvre, septembre 2015, p. 8–10. La préface revient sur les représentations de 1724 et 1725 et exprime l’inquiétude de l’auteur devant l’épreuve de l’impression. [Texte utilisé](https://www.theatre-classique.fr/pages/pdf/VOLTAIRE_MARIAMNE.pdf). [Retour](#mariamne-ref-1)\n\n<a id=\"mariamne-note-2\"></a>**2.** Les citations renvoient au texte de *Mariamne* reproduit par Théâtre Classique, dans la version où intervient Sohême. Les renvois par acte, scène et vers suivent cette édition. La date de 1724 portée sur sa couverture ne signifie pas que le texte reproduise sans remaniement la première version représentée. La ponctuation et les apostrophes sont harmonisées typographiquement ; les mots cités sont conservés. [Retour](#mariamne-ref-2)\n\n<a id=\"mariamne-note-3\"></a>**3.** Voltaire, *Mariamne*, indication de lieu après la liste des personnages ; I, 1, v. 14 et ensemble du dialogue entre Salome et Mazaël. [Retour](#mariamne-ref-3)\n\n<a id=\"mariamne-note-4\"></a>**4.** Ibid., V, 1, v. 1163. [Retour](#mariamne-ref-4)\n\n<a id=\"mariamne-note-5\"></a>**5.** Ibid., III, 1, v. 590. [Retour](#mariamne-ref-5)\n\n<a id=\"mariamne-note-6\"></a>**6.** Ibid., I, 1, v. 3–4 ; voir la suite du récit de Mazaël, notamment v. 24–28. [Retour](#mariamne-ref-6)\n\n<a id=\"mariamne-note-7\"></a>**7.** Ibid., V, 1, v. 1152–1156. [Retour](#mariamne-ref-7)\n\n<a id=\"mariamne-note-8\"></a>**8.** Ibid., III, 1, v. 619. [Retour](#mariamne-ref-8)\n\n<a id=\"mariamne-note-9\"></a>**9.** Ibid., III, 3, v. 675–676. La graphie *« prévoi »* suit le texte de l’édition utilisée. [Retour](#mariamne-ref-9)\n\n<a id=\"mariamne-note-10\"></a>**10.** Ibid., III, 1, v. 617–619. [Retour](#mariamne-ref-10)\n\n<a id=\"mariamne-note-11\"></a>**11.** Ibid., I, 3, v. 227 ; voir v. 225–234. [Retour](#mariamne-ref-11)\n\n<a id=\"mariamne-note-12\"></a>**12.** Ibid., V, 2, v. 1185–1186. [Retour](#mariamne-ref-12)\n\n<a id=\"mariamne-note-13\"></a>**13.** Ibid., V, 2, v. 1207–1208 et 1215–1218. [Retour](#mariamne-ref-13)\n\n<a id=\"mariamne-note-14\"></a>**14.** Aristote, *Poétique*, chap. VI, notamment § II, VII et XI, traduction de Charles-Émile Ruelle, [texte en ligne](https://fr.wikisource.org/wiki/Po%C3%A9tique_(trad._Ruelle)/Chapitre_6). Ce renvoi porte sur la définition de la tragédie et la composition de l’action. [Retour](#mariamne-ref-14)","Note sur les traductions : les citations chinoises et anglaises sont traduites des passages français cités dans cette étude ; elles ne sont pas empruntées à des traductions publiées. Les formes françaises examinées en tant que faits de langue sont conservées lorsque l’analyse l’exige."],"zh":["<a id=\"mariamne-note-1-zh\"></a>**1.** 伏尔泰，*Mariamne*，“作者序言”，Théâtre Classique电子版，Gwénola、Ernest与Paul Fièvre于2015年9月发布的PDF，第8–10页。序言回顾了1724年和1725年的演出，并表达了作者对作品能否经受印行后阅读检验的担忧。[本文所用文本](https://www.theatre-classique.fr/pages/pdf/VOLTAIRE_MARIAMNE.pdf)。[返回正文](#mariamne-ref-1-zh)\n\n<a id=\"mariamne-note-2-zh\"></a>**2.** 引文依据Théâtre Classique所提供的*Mariamne*文本，即索埃姆出场的版本。幕、场及诗行编号均遵循该版。封面的1724年，并不意味着其中收录的是未经修订的初演文本。法文引文的标点与撇号作了排版统一，文字保持不变。[返回正文](#mariamne-ref-2-zh)\n\n<a id=\"mariamne-note-3-zh\"></a>**3.** 伏尔泰，*Mariamne*，人物表之后的地点说明；第一幕第一场，第14行，以及莎乐美与马扎埃尔的整段对话。[返回正文](#mariamne-ref-3-zh)\n\n<a id=\"mariamne-note-4-zh\"></a>**4.** 同上，第五幕第一场，第1163行。[返回正文](#mariamne-ref-4-zh)\n\n<a id=\"mariamne-note-5-zh\"></a>**5.** 同上，第三幕第一场，第590行。[返回正文](#mariamne-ref-5-zh)\n\n<a id=\"mariamne-note-6-zh\"></a>**6.** 同上，第一幕第一场，第3–4行；另见马扎埃尔随后叙述，尤其第24–28行。[返回正文](#mariamne-ref-6-zh)\n\n<a id=\"mariamne-note-7-zh\"></a>**7.** 同上，第五幕第一场，第1152–1156行。[返回正文](#mariamne-ref-7-zh)\n\n<a id=\"mariamne-note-8-zh\"></a>**8.** 同上，第三幕第一场，第619行。[返回正文](#mariamne-ref-8-zh)\n\n<a id=\"mariamne-note-9-zh\"></a>**9.** 同上，第三幕第三场，第675–676行。法文*“prévoi”*的拼写遵循所用版本。[返回正文](#mariamne-ref-9-zh)\n\n<a id=\"mariamne-note-10-zh\"></a>**10.** 同上，第三幕第一场，第617–619行。[返回正文](#mariamne-ref-10-zh)\n\n<a id=\"mariamne-note-11-zh\"></a>**11.** 同上，第一幕第三场，第227行；另见第225–234行。[返回正文](#mariamne-ref-11-zh)\n\n<a id=\"mariamne-note-12-zh\"></a>**12.** 同上，第五幕第二场，第1185–1186行。[返回正文](#mariamne-ref-12-zh)\n\n<a id=\"mariamne-note-13-zh\"></a>**13.** 同上，第五幕第二场，第1207–1208行及第1215–1218行。[返回正文](#mariamne-ref-13-zh)\n\n<a id=\"mariamne-note-14-zh\"></a>**14.** 亚里士多德，*Poétique*（《诗学》），第六章，尤其第二、七、十一节，Charles-Émile Ruelle法译本，[在线文本](https://fr.wikisource.org/wiki/Po%C3%A9tique_(trad._Ruelle)/Chapitre_6)。此处参照的是对悲剧的定义及对行动组织的讨论。[返回正文](#mariamne-ref-14-zh)","译文说明：中英文引文均译自本文所引的法文段落，不援用已出版译本；作为语言分析对象的法语词形，在必要处保留。"],"en":["<a id=\"mariamne-note-1-en\"></a>**1.** Voltaire, *Mariamne*, “Author’s Preface”, in the Théâtre Classique electronic edition, PDF published by Gwénola, Ernest and Paul Fièvre, September 2015, pp. 8–10. The preface revisits the performances of 1724 and 1725 and expresses the author’s concern about the test of publication in print. [Text used](https://www.theatre-classique.fr/pages/pdf/VOLTAIRE_MARIAMNE.pdf). [Back](#mariamne-ref-1-en)\n\n<a id=\"mariamne-note-2-en\"></a>**2.** Quotations refer to the text of *Mariamne* reproduced by Théâtre Classique, in the version featuring Sohême. References by act, scene and verse line follow this edition. The date 1724 on the cover does not mean that the text reproduces the first performed version without revision. Punctuation and apostrophes in the French quotations have been harmonised typographically; the quoted words are retained. [Back](#mariamne-ref-2-en)\n\n<a id=\"mariamne-note-3-en\"></a>**3.** Voltaire, *Mariamne*, setting specified after the list of characters; I.1, line 14, and the dialogue between Salome and Mazaël as a whole. [Back](#mariamne-ref-3-en)\n\n<a id=\"mariamne-note-4-en\"></a>**4.** Ibid., V.1, line 1163. [Back](#mariamne-ref-4-en)\n\n<a id=\"mariamne-note-5-en\"></a>**5.** Ibid., III.1, line 590. [Back](#mariamne-ref-5-en)\n\n<a id=\"mariamne-note-6-en\"></a>**6.** Ibid., I.1, lines 3–4; see the continuation of Mazaël’s account, particularly lines 24–28. [Back](#mariamne-ref-6-en)\n\n<a id=\"mariamne-note-7-en\"></a>**7.** Ibid., V.1, lines 1152–1156. [Back](#mariamne-ref-7-en)\n\n<a id=\"mariamne-note-8-en\"></a>**8.** Ibid., III.1, line 619. [Back](#mariamne-ref-8-en)\n\n<a id=\"mariamne-note-9-en\"></a>**9.** Ibid., III.3, lines 675–676. The French spelling *“prévoi”* follows the text of the edition used. [Back](#mariamne-ref-9-en)\n\n<a id=\"mariamne-note-10-en\"></a>**10.** Ibid., III.1, lines 617–619. [Back](#mariamne-ref-10-en)\n\n<a id=\"mariamne-note-11-en\"></a>**11.** Ibid., I.3, line 227; see lines 225–234. [Back](#mariamne-ref-11-en)\n\n<a id=\"mariamne-note-12-en\"></a>**12.** Ibid., V.2, lines 1185–1186. [Back](#mariamne-ref-12-en)\n\n<a id=\"mariamne-note-13-en\"></a>**13.** Ibid., V.2, lines 1207–1208 and 1215–1218. [Back](#mariamne-ref-13-en)\n\n<a id=\"mariamne-note-14-en\"></a>**14.** Aristotle, *Poetics*, Chapter VI, particularly §§ II, VII and XI, French translation by Charles-Émile Ruelle, [online text](https://fr.wikisource.org/wiki/Po%C3%A9tique_(trad._Ruelle)/Chapitre_6). This reference concerns the definition of tragedy and the composition of the action. [Back](#mariamne-ref-14-en)","Translation note: Chinese and English quotations are translated from the French passages cited in this study, rather than taken from published translations. French forms discussed as linguistic evidence are retained where the analysis requires them."]}}]},{"id":"mariamne-15","title":{"fr":"Références mobilisées","zh":"本文援引文献","en":"Works Cited"},"units":[{"title":{"fr":"Références mobilisées","zh":"本文援引文献","en":"Works Cited"},"paragraphs":{"fr":["- Voltaire, *Mariamne, tragédie en cinq actes*, avec la « Préface de l’auteur », édition électronique de Théâtre Classique, PDF publié par Gwénola, Ernest et Paul Fièvre, septembre 2015. [Consulter le texte](https://www.theatre-classique.fr/pages/pdf/VOLTAIRE_MARIAMNE.pdf).\n- Aristote, *Poétique*, traduction de Charles-Émile Ruelle, chap. VI. [Consulter le chapitre](https://fr.wikisource.org/wiki/Po%C3%A9tique_(trad._Ruelle)/Chapitre_6)."],"zh":["- 伏尔泰，*Mariamne, tragédie en cinq actes*（《玛丽亚姆娜：五幕悲剧》），附“作者序言”，Théâtre Classique电子版，PDF由Gwénola、Ernest与Paul Fièvre于2015年9月发布。[阅读文本](https://www.theatre-classique.fr/pages/pdf/VOLTAIRE_MARIAMNE.pdf)。\n- 亚里士多德，*Poétique*（《诗学》），Charles-Émile Ruelle法译本，第六章。[阅读该章](https://fr.wikisource.org/wiki/Po%C3%A9tique_(trad._Ruelle)/Chapitre_6)。"],"en":["- Voltaire. *Mariamne, tragédie en cinq actes*, with the “Author’s Preface”. Théâtre Classique electronic edition, PDF published by Gwénola, Ernest and Paul Fièvre, September 2015. [Read the text](https://www.theatre-classique.fr/pages/pdf/VOLTAIRE_MARIAMNE.pdf).\n- Aristotle. *Poetics*. French translation by Charles-Émile Ruelle, Chapter VI. [Read the chapter](https://fr.wikisource.org/wiki/Po%C3%A9tique_(trad._Ruelle)/Chapitre_6).\n\n<!-- translation-notice: render after the notes, not as a work or section title -->\n\n<p class=\"translation-notice\" lang=\"fr\">Note sur les traductions : les citations chinoises et anglaises sont traduites des passages français cités dans cette étude ; elles ne sont pas empruntées à des traductions publiées. Les formes françaises examinées en tant que faits de langue sont conservées lorsque l’analyse l’exige.</p>\n\n<p class=\"translation-notice\" lang=\"zh\">译文说明：中英文引文均译自本文所引的法文段落，不援用已出版译本；作为语言分析对象的法语词形，在必要处保留。</p>\n\n<p class=\"translation-notice\" lang=\"en\">Translation note: Chinese and English quotations are translated from the French passages cited in this study, rather than taken from published translations. French forms discussed as linguistic evidence are retained where the analysis requires them.</p>"]}}]}]}]};const state={mode:(()=>{const q=window.SiteLanguage?.requested?.();if(q)return q;const rm=window.SiteLanguage?.savedMode?.();if(rm==='triad'||rm==='parallel')return 'triad';return window.SiteLanguage?.saved?.()||'en';})()};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s,work,lang){let x=String(s||'');x=x.replace(/href="#note-(\d+)"/g,`href="#note-${work}-${lang}-$1"`).replace(/id="note-(\d+)"/g,`id="note-${work}-${lang}-$1"`);x=x.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return x;}
function md(raw,work,lang){let t=String(raw||'').trim();if(!t)return '';t=t.replace(/\r/g,'');const lines=t.split('\n');let out='',i=0;while(i<lines.length){if(!lines[i].trim()){i++;continue}if(/^---+$/.test(lines[i].trim())){i++;continue}if(lines[i].trim().startsWith('|')){let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){let l=lines[i].trim();if(!/^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(l))rows.push(l);i++}if(rows.length){const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>inline(x.trim(),work,lang));out+='<table><thead><tr>'+cells(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue}if(lines[i].trim().startsWith('>')){let q=[];while(i<lines.length&&lines[i].trim().startsWith('>')){q.push(lines[i].replace(/^\s*>\s?/,'').trim());i++}out+='<blockquote>'+q.map(x=>inline(x,work,lang)).join('<br>')+'</blockquote>';continue}let p=[];while(i<lines.length&&lines[i].trim()&&!lines[i].trim().startsWith('|')&&!lines[i].trim().startsWith('>')&&!/^---+$/.test(lines[i].trim())){p.push(lines[i]);i++}out+='<p>'+inline(p.join('<br>'),work,lang)+'</p>'}return out;}
function titleSpans(t,cls='paper-lang'){return `<span class="${cls} fr" data-lang="fr">${esc(t.fr)}</span><span class="${cls} zh" data-lang="zh">${esc(t.zh)}</span><span class="${cls} en" data-lang="en">${esc(t.en)}</span>`}
function heading(t){return `<div class="heading-lang fr" data-lang="fr">${esc(t.fr)}</div><div class="heading-lang zh" data-lang="zh">${esc(t.zh)}</div><div class="heading-lang en" data-lang="en">${esc(t.en)}</div>`}
function hasTable(unit){return Object.values(unit.paragraphs||{}).some(a=>a.some(x=>x.includes('|---')||x.includes('| ---')))}
function renderUnit(unit,wid,ui,showHeading){let h=showHeading&&unit.title?`<h3 class="unit-heading">${heading(unit.title)}</h3>`:'';if(hasTable(unit)){return h+'<div class="table-stack">'+['fr','zh','en'].map(l=>`<div class="table-language" data-lang="${l}"><span class="table-label">${l==='fr'?'Français':l==='zh'?'中文':'English'}</span>${(unit.paragraphs[l]||[]).map(x=>md(x,wid,l)).join('')}</div>`).join('')+'</div>'}return h+`<div class="triad"><div class="lang-column zh" data-lang="zh">${(unit.paragraphs.zh||[]).map(x=>md(x,wid,'zh')).join('')}</div><div class="lang-column fr" data-lang="fr">${(unit.paragraphs.fr||[]).map(x=>md(x,wid,'fr')).join('')}</div><div class="lang-column en" data-lang="en">${(unit.paragraphs.en||[]).map(x=>md(x,wid,'en')).join('')}</div></div>`}
function render(){const root=$('#reading');root.innerHTML='';const toc=$('#toc-list');toc.innerHTML='';THEATRE_DATA.works.forEach((w,wi)=>{const wb=document.createElement('article');wb.className='work-block';wb.id='work-'+w.id;wb.innerHTML=`<header class="work-title"><div class="paper-kicker">0${wi+1}</div>${titleSpans(w.title)}<div class="work-meta">${(w.meta||[]).filter(x=>String(x).trim()!=='---').map(x=>md(x,w.id,'fr')).join('')}</div></header>`;const nav=document.createElement('div');nav.className='toc-work';nav.innerHTML=`<a href="#work-${w.id}">${titleSpans(w.title,'toc-lang')}</a>`;const sections=document.createElement('div');sections.className='toc-sections';if(wi===0){const t=document.createElement('button');t.className='toc-toggle';t.type='button';t.textContent='章节 / Sections / Sections';t.addEventListener('click',()=>{sections.classList.toggle('open')});nav.append(t)}w.sections.forEach((sec,si)=>{const se=document.createElement('section');se.className='section';se.id=`${w.id}-section-${si+1}`;se.innerHTML=`<h2 class="section-heading">${heading(sec.title)}</h2>`;sec.units.forEach((u,ui)=>{const a=document.createElement('a');a.className='toc-main';a.href='#'+(sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id);a.innerHTML=titleSpans(u.title,'toc-lang');sections.append(a);const article=document.createElement('article');article.className='unit';article.id=sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id;article.innerHTML=renderUnit(u,w.id,`${si}-${ui}`,sec.units.length>1);se.append(article)});wb.append(se)});root.append(wb);if(wi===0){nav.append(sections)}toc.append(nav)});applyMode()}
function applyMode(){document.body.classList.toggle('single-mode',state.mode!=='triad');$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$$('[data-lang]').forEach(el=>{const inDrawer=el.closest('.toc-drawer');el.classList.toggle('active',state.mode==='triad'||el.dataset.lang===state.mode);if(inDrawer&&!el.classList.contains('toc-lang'))el.classList.add('active')});localStorage.setItem('theatre-mode',state.mode)}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>{const y=scrollY;state.mode=b.dataset.mode; if(window.SiteLanguage){if(state.mode==='triad')SiteLanguage.setMode('triad');else SiteLanguage.set(state.mode);} applyMode();requestAnimationFrame(()=>scrollTo({top:y,behavior:'instant'}))}));
const drawer=$('#toc-drawer'),backdrop=$('#toc-backdrop');function closeToc(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}function openToc(){drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false')}$('#toc-open').addEventListener('click',openToc);$('#toc-close').addEventListener('click',closeToc);backdrop.addEventListener('click',closeToc);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeToc()});$('#toc-list').addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();closeToc();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})}});
render();
</script><script src="js/article-end-nav.js"></script>
