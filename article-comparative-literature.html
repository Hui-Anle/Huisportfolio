const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s,work,lang){let x=String(s||'');x=x.replace(/href="#note-(\d+)"/g,`href="#note-${work}-${lang}-$1"`).replace(/id="note-(\d+)"/g,`id="note-${work}-${lang}-$1"`);x=x.replace(/\*\*(.+?)\*\*/gs,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return x;}
function md(raw,work,lang){let t=String(raw||'').trim();if(!t)return '';t=t.replace(/\r/g,'');const lines=t.split('\n');let out='',i=0;while(i<lines.length){if(!lines[i].trim()){i++;continue}if(/^---+$/.test(lines[i].trim())){i++;continue}if(lines[i].trim().startsWith('|')){let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|')){let l=lines[i].trim();if(!/^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(l))rows.push(l);i++}if(rows.length){const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>inline(x.trim(),work,lang));out+='<table><thead><tr>'+cells(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue}if(lines[i].trim().startsWith('>')){let q=[];while(i<lines.length&&lines[i].trim().startsWith('>')){q.push(lines[i].replace(/^\s*>\s?/,'').trim());i++}out+='<blockquote>'+q.map(x=>inline(x,work,lang)).join('<br>')+'</blockquote>';continue}let p=[];while(i<lines.length&&lines[i].trim()&&!lines[i].trim().startsWith('|')&&!lines[i].trim().startsWith('>')&&!/^---+$/.test(lines[i].trim())){p.push(lines[i]);i++}out+='<p>'+inline(p.join('<br>'),work,lang)+'</p>'}return out;}
function titleSpans(t,cls='paper-lang'){return `<span class="${cls} fr" data-lang="fr">${esc(t.fr)}</span><span class="${cls} zh" data-lang="zh">${esc(t.zh)}</span><span class="${cls} en" data-lang="en">${esc(t.en)}</span>`}
function heading(t){return `<div class="heading-lang fr" data-lang="fr">${esc(t.fr)}</div><div class="heading-lang zh" data-lang="zh">${esc(t.zh)}</div><div class="heading-lang en" data-lang="en">${esc(t.en)}</div>`}
function hasTable(unit){return Object.values(unit.paragraphs||{}).some(a=>a.some(x=>x.includes('|---')||x.includes('| ---')))}
function renderUnit(unit,wid,ui,showHeading){let h=showHeading&&unit.title?`<h3 class="unit-heading">${heading(unit.title)}</h3>`:'';if(hasTable(unit)){return h+'<div class="table-stack">'+['fr','zh','en'].map(l=>`<div class="table-language" data-lang="${l}"><span class="table-label">${l==='fr'?'Français':l==='zh'?'中文':'English'}</span>${(unit.paragraphs[l]||[]).map(x=>md(x,wid,l)).join('')}</div>`).join('')+'</div>'}return h+`<div class="triad"><div class="lang-column zh" data-lang="zh">${(unit.paragraphs.zh||[]).map(x=>md(x,wid,'zh')).join('')}</div><div class="lang-column fr" data-lang="fr">${(unit.paragraphs.fr||[]).map(x=>md(x,wid,'fr')).join('')}</div><div class="lang-column en" data-lang="en">${(unit.paragraphs.en||[]).map(x=>md(x,wid,'en')).join('')}</div></div>`}
function render(){const root=$('#reading');root.innerHTML='';const toc=$('#toc-list');toc.innerHTML='';COMPARATIVE_DATA.works.forEach((w,wi)=>{const wb=document.createElement('article');wb.className='work-block';wb.id='work-'+w.id;wb.innerHTML=`<header class="work-title"><div class="paper-kicker"><span data-lang="zh">第一篇</span><span data-lang="fr">Étude 1</span><span data-lang="en">Study 1</span></div>${titleSpans(w.title)}<div class="work-meta">${(w.meta||[]).filter(x=>String(x).trim()!=='---').map(x=>md(x,w.id,'fr')).join('')}</div></header>`;const nav=document.createElement('div');nav.className='toc-work';nav.innerHTML=`<a href="#work-${w.id}">${titleSpans(w.title,'toc-lang')}</a>`;w.sections.forEach((sec,si)=>{const se=document.createElement('section');se.className='section';se.id=`${w.id}-section-${si+1}`;se.innerHTML=`<h2 class="section-heading">${heading(sec.title)}</h2>`;sec.units.forEach((u,ui)=>{const article=document.createElement('article');article.className='unit';article.id=sec.units.length>1?`${w.id}-section-${si+1}-unit-${ui+1}`:se.id;article.innerHTML=renderUnit(u,w.id,`${si}-${ui}`,sec.units.length>1&&ui>0);se.append(article)});wb.append(se)});root.append(wb);toc.append(nav)});applyMode()}
function applyMode(){document.body.classList.toggle('single-mode',state.mode!=='triad');$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$$('[data-lang]').forEach(el=>{const isTocTitle=el.classList.contains('toc-lang');el.classList.toggle('active',isTocTitle||state.mode==='triad'||el.dataset.lang===state.mode)});localStorage.setItem('comparative-mode',state.mode)}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>{const y=scrollY;state.mode=b.dataset.mode; if(window.SiteLanguage){if(state.mode==='triad')SiteLanguage.setMode('triad');else SiteLanguage.set(state.mode);} applyMode();requestAnimationFrame(()=>scrollTo({top:y,behavior:'instant'}))}));
const drawer=$('#toc-drawer'),backdrop=$('#toc-backdrop');function closeToc(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}function openToc(){drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false')}$('#toc-open').addEventListener('click',openToc);$('#toc-close').addEventListener('click',closeToc);backdrop.addEventListener('click',closeToc);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeToc()});$('#toc-list').addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();closeToc();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'})}});

const coverVideo=document.getElementById('cover-video');const coverToggle=document.getElementById('cover-video-toggle');let coverUserPaused=false;function updateCoverButton(){const paused=coverVideo.paused;coverToggle.textContent=paused?'▶':'Ⅱ';const label=paused?'播放封面视频':'暂停封面视频';coverToggle.setAttribute('aria-label',label);coverToggle.title=label;coverToggle.setAttribute('aria-pressed',String(!paused))}coverToggle.addEventListener('click',()=>{if(coverVideo.paused){coverUserPaused=false;coverVideo.play().catch(()=>{});}else{coverUserPaused=true;coverVideo.pause();}updateCoverButton()});coverVideo.addEventListener('play',updateCoverButton);coverVideo.addEventListener('pause',updateCoverButton);if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const coverObserver=new IntersectionObserver(entries=>{const e=entries[0];if(!e.isIntersecting){coverVideo.pause();}else if(!coverUserPaused){coverVideo.play().catch(()=>{});}}, {threshold:.08});coverObserver.observe(document.querySelector('.comparative-hero'));coverVideo.play().catch(()=>{});}else{coverVideo.pause()}updateCoverButton();
render();
</script><script src="js/article-end-nav.js"></script>
</body></html>
