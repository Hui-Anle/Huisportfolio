"Between Intertextuality and Erasure: Variations on Donkeyskin in Perrault and the Brothers Grimm"},"meta":["Huihui ZHU","Master 2 · 2024–2025 · Le conte, intertextualité et réécritures · Véronique Gély"],"sections":[{"id":"conte-introduction","title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"units":[{"title":{"fr":"Introduction","zh":"引言","en":"Introduction"},"paragraphs":{"fr":["Avant même sa mise en vers par Charles Perrault en 1694, l’histoire communément appelée Peau d’Âne existait déjà sous différentes formes dans l’Europe médiévale et moderne. Comme le souligne Natacha Rimasson-Fertin dans son édition critique des contes des frères Grimm (2017), ce récit est attesté à travers des traditions orales, des variantes régionales allemandes, des récits enchâssés — tels que La Manekine — ou encore des œuvres littéraires comme Die Nymphe des Brunnens de Musäus<sup><a href=\"#conte-note-1-fr\" id=\"conte-ref-1-fr\">1</a></sup>. Il s’agit donc d’un conte profondément enraciné dans une culture de transmission orale, souvent féminine et portée par des conteuses, bien avant sa fixation écrite.\n\nParmi les nombreuses réécritures de ce récit dans la tradition européenne, trois versions se distinguent : celle de Charles Perrault (1694), <em>Allerleirauh</em> (KHM 65, 1857) des frères Grimm, et <em>Peau-de-souris</em>, une version présente dans leur première édition de 1812, mais supprimée par la suite. Ces trois variantes reposent sur un noyau narratif commun : une princesse, confrontée au désir de son père ou à une incompréhension paternelle, quitte le palais familial. Elle dissimule sa beauté et son identité sous une peau animale souillée, puis accepte volontairement les tâches les plus humbles dans un royaume étranger (travaux de cuisine, service domestique, fonctions subalternes). La reconnaissance progressive de son identité — provoquée ou fortuite — conduit à une réintégration sociale scellée par un mariage royal, conformément au dénouement heureux attendu dans le conte merveilleux.\n\nSi la trame de base demeure stable, les modalités narratives, la symbolique des objets, le traitement du déguisement ou encore les visées morales varient considérablement d’un texte à l’autre. De telles différences invitent à une réflexion sur les dynamiques de réécriture, les effets de contexte culturel, ainsi que sur les stratégies d’effacement, d’adaptation ou de recomposition que l’on observe dans le passage d’une version à l’autre.\n\nDans cette perspective, l’analyse proposée ici s’organise autour de trois axes : d’abord, l’étude des phénomènes d’intertextualité, en identifiant les sources et circulations culturelles qui relient ces récits ; ensuite, l’examen des stratégies de réécriture, à travers les choix de structure, de motifs et de scènes-clés ; enfin, une mise en regard des intentions morales et conceptions culturelles propres à chaque version, afin de mieux comprendre comment une même histoire peut porter des visions du monde divergentes."],"zh":["早在夏尔·佩罗于1694年将其写成韵文之前，通常被称为《驴皮》的故事便已以不同形态存在于中世纪及近代欧洲。正如娜塔莎·里马松-费尔坦在其格林童话评注版（2017）中所指出的，这一叙事见于口头传统、德国地方变体、诸如《玛内金》（<em>La Manekine</em>）一类嵌入式叙事，以及穆塞乌斯的《泉中仙女》（<em>Die Nymphe des Brunnens</em>）等文学作品。<sup><a href=\"#conte-note-1-zh\" id=\"conte-ref-1-zh\">1</a></sup> 因而，远在被文字固定之前，这个故事就已深深扎根于口耳相传的文化之中，而这种传承往往具有女性色彩，由女性讲述者承载。\n\n在欧洲传统中这一故事的众多改写版本里，有三个版本尤为突出：夏尔·佩罗的版本（1694）、格林兄弟的《千皮兽》（<em>Allerleirauh</em>，KHM 65，1857），以及收入格林兄弟1812年初版、后来被删去的《鼠皮公主》（<em>Peau-de-souris</em>）。这三个变体建立在共同的叙事核心之上：一位公主面对父亲的欲望或父亲的不理解，离开自己的王宫。她将美貌与身份藏在污秽的兽皮之下，继而在异国主动承担最卑微的劳作，包括厨房杂务、家务服务及其他低等差事。无论出于主动安排还是偶然，她的身份逐步得到辨认，最终以王室婚姻为标志，重新融入社会，符合神奇故事所预期的幸福结局。\n\n尽管基本情节保持稳定，叙事方式、物件的象征意义、对伪装的处理乃至道德旨趣，却在各个文本之间存在显著差异。这些差异引导我们思考改写的运作方式、文化语境的作用，以及不同版本之间所体现的抹除、调整和重组策略。\n\n基于这一视角，本文围绕三个方向展开：首先，研究互文现象，辨识这些叙事之间的来源关联与文化流通；其次，通过结构、母题及关键场景的选择，考察改写策略；最后，将各个版本的道德意图与文化观念相互对照，以理解同一个故事如何承载彼此分歧的世界观。"],"en":["Even before Charles Perrault rendered it in verse in 1694, the story commonly known as <em>Donkeyskin</em> already existed in various forms in medieval and early modern Europe. As Natacha Rimasson-Fertin notes in her critical edition of the Brothers Grimm’s tales (2017), the narrative is attested in oral traditions, regional German variants, embedded narratives such as <em>La Manekine</em>, and literary works such as Musäus’s <em>Die Nymphe des Brunnens</em>.<sup><a href=\"#conte-note-1-en\" id=\"conte-ref-1-en\">1</a></sup> It is therefore a tale deeply rooted in a culture of oral transmission, often female in character and sustained by women storytellers, long before it was fixed in writing.\n\nAmong the many rewritings of this story in the European tradition, three versions stand out: Charles Perrault’s tale (1694), the Brothers Grimm’s <em>Allerleirauh</em> (KHM 65, 1857), and <em>Mouse-Skin</em>, a version included in their first edition of 1812 but subsequently removed. These three variants share a narrative core: confronted with her father’s desire or his failure to understand her, a princess leaves the family palace. She conceals her beauty and identity beneath a soiled animal skin, then voluntarily undertakes the humblest tasks in a foreign kingdom, including kitchen work, domestic service, and other menial duties. The gradual recognition of her identity, whether deliberately prompted or accidental, leads to social reintegration sealed by a royal marriage, in keeping with the happy ending expected of the wonder tale.\n\nAlthough the basic plot remains stable, narrative procedures, the symbolism of objects, the treatment of disguise, and even moral aims vary considerably from one text to another. These differences invite reflection on the dynamics of rewriting, the effects of cultural context, and the strategies of erasure, adaptation, and recomposition apparent in the passage from one version to another.\n\nFrom this perspective, the analysis proceeds along three lines: first, an examination of intertextuality, identifying the sources and cultural exchanges that connect these narratives; second, an investigation of rewriting strategies through choices of structure, motifs, and key scenes; and finally, a comparison of the moral intentions and cultural conceptions specific to each version, in order to understand how the same story can convey divergent visions of the world."]}}]},{"id":"conte-i","title":{"fr":"I. Intertextualité et réécritures : genèses et motifs persistants","zh":"I. 互文与改写：源流及持续存在的母题","en":"I. Intertextuality and Rewriting: Origins and Persistent Motifs"},"units":[{"title":{"fr":"I. Intertextualité et réécritures : genèses et motifs persistants","zh":"I. 互文与改写：源流及持续存在的母题","en":"I. Intertextuality and Rewriting: Origins and Persistent Motifs"},"paragraphs":{"fr":["Avant d’entrer dans l’analyse fine des trois contes principaux, il importe de replacer <em>Peau d’Âne</em> dans une tradition narrative plus vaste, marquée par des transmissions orales anciennes, des réécritures littéraires successives et une circulation intertextuelle particulièrement riche. Cette première partie ne vise pas à une étude textuelle détaillée, mais propose un survol historique et typologique du motif à travers ses principales occurrences, afin de mieux comprendre la logique de transformation à l’œuvre dans les versions retenues.\n\nVoir tableau : Généalogie du conte de Peau d’Âne, établi à partir des travaux de Natacha Rimasson-Fertin (2017) et de Heinz Rölleke (1998).<sup><a href=\"#conte-note-2-fr\" id=\"conte-ref-2-fr\">2</a></sup>\n\n<!-- table: conte-genealogy -->\n\n| Période / Source | Titre / Version | Auteur / Collecteur | Motifs / Éléments caractéristiques |\n| --- | --- | --- | --- |\n| XIIe siècle | Lai des Deux Amants | Marie de France | Amour tragique, fuite |\n| XIIIe siècle | La Manekine | Philippe de Rémy | Main coupée, fuite, déguisement |\n| 1547 | Cuir d'asnette | Noël du Fail | Fuite et peau d’âne |\n| 1694 | Peau d’Âne (Perrault) | Charles Perrault | Peau d’âne, robes magiques, fuite, souillon |\n| XVIIIe siècle | Die Nymphe des Brunnens | Musäus | Fée marraine, boîte magique, fuite poétique |\n| XVIIIe siècle | La jeune fille dans le coffret | Straparola | Coffret, transformation |\n| XVIIIe siècle | L’ourse | Basile | Déguisement animal (ourse) |\n| XIXe siècle | Peau de cochon | Afanasiev | Peau de cochon |\n| 1810 | Toutes fumées (Allerlei Rauch) | Wilhelm Grimm | Titre original dans manuscrit Grimm |\n| 1812 | Peau-de-souris (KHM 71) | Jeannette Hassenpflug | Amour-sel, peau de souris, révélation par plat sans sel |\n| 1812 | Allerleirauh (par Dortchen Wild) | Dortchen Wild | Version orale source d’Allerleirauh |\n| 1819 | Allerleirauh (KHM 65) | Grimm (version canonique) | Version canonique Grimm |\n| Régional (Paderborn) | Variante Paderborn | Tradition orale régionale | Peau + mousse + robe, arbre creux, épouillage |\n| Vernaleken | Jette-Balai / Vernaleken | Vernaleken | Bottes jetées, identité déguisée |\n| Grimm KHM 179 | La gardeuse d’oies à la fontaine | Grimm | Motif de l’amour exprimé par le sel |\n\nUn second schéma propose une visualisation transversale des motifs récurrents — tels que le désir incestueux, la peau animale, les trois robes magiques, le sel comme métaphore affective, et l’objet de reconnaissance — à travers un corpus élargi. Il met en évidence les liens d’intertextualité entre les récits, révélant une tradition de transmission et de recomposition continue. Ce réseau démontre que ni Perrault ni les Grimm ne sont à l’origine du conte, mais qu’ils en constituent des fixations tardives, issues d’un fonds oral et symbolique bien antérieur.\n\n<!-- table: conte-motifs -->\n\nCarte des motifs du conte de Peau d’Âne et de leurs sources — transcription tabulaire du schéma original.\n\n| Motif | Récits ou sources reliés dans le schéma original |\n| --- | --- |\n| Amour interdit / Inceste royal | La Manekine ; Peau d’Âne (Perrault) ; Allerleirauh ; Peau-de-souris |\n| Reconnaissance par un objet | Vernaleken ; Cendrillon ; Peau d’Âne (Perrault) ; Allerleirauh ; Peau-de-souris |\n| Trois robes (or, argent, étoiles) | Peau d’Âne (Perrault) ; Allerleirauh |\n| Peau animale comme déguisement | Peau d’Âne (Perrault) ; Allerleirauh ; Peau-de-souris ; L’ourse ; Cuir d’asnette |\n| Motif du sel / amour incompris | Peau-de-souris ; KHM 179 |\n\nLe conte de <em>Peau d’Âne</em> s’inscrit dans un vaste réseau de récits transmis, réécrits et adaptés depuis le Moyen Âge. Comme le montre la généalogie établie à partir des travaux de Rimasson-Fertin (2017) et Rölleke (1998), on observe dès le XIIᵉ siècle des récits fondés sur des structures similaires : désir interdit, déguisement, fuite, dissimulation de l’identité et reconnaissance finale. Ces éléments se retrouvent dans des textes aussi divers que <em>La Manekine</em>, <em>Cuir d’asnette</em>, ou encore les contes italiens de Basile et Straparola.\n\nLes tableaux synthétiques joints à ce travail révèlent que ni Perrault ni les Grimm ne sont les inventeurs du conte, mais des fixateurs tardifs d’un matériau narratif mouvant. On y constate la permanence de certains motifs, mais aussi leur reconfiguration selon des logiques culturelles différentes — sacrée, burlesque, poétique ou morale. Ce cadre permet d’aborder les contes choisis non comme des textes isolés, mais comme des nœuds intertextuels dynamiques, porteurs d’une mémoire collective."],"zh":["在细读三个主要故事之前，有必要将《驴皮》置于更广阔的叙事传统中。这一传统以古老的口头传承、相继发生的文学改写及格外丰富的互文流通为特征。第一部分无意展开详尽的文本分析，而是通过这一母题的主要表现，对其历史与类型作一概览，从而更好地理解所选版本中的变形逻辑。\n\n参见下表：《驴皮》故事谱系，依据娜塔莎·里马松-费尔坦（2017）及海因茨·勒勒克（1998）的研究编制。<sup><a href=\"#conte-note-2-zh\" id=\"conte-ref-2-zh\">2</a></sup>\n\n<!-- table: conte-genealogy -->\n\n| 时期／来源 | 题名／版本 | 作者／采集者 | 母题／特征 |\n| --- | --- | --- | --- |\n| 12世纪 | 《两位恋人之歌》（Lai des Deux Amants） | Marie de France | 悲剧爱情、逃离 |\n| 13世纪 | 《玛内金》（La Manekine） | Philippe de Rémy | 断手、逃离、伪装 |\n| 1547年 | 《小母驴皮》（Cuir d’asnette） | Noël du Fail | 逃离与驴皮 |\n| 1694年 | 《驴皮》（佩罗） | Charles Perrault | 驴皮、魔法礼服、逃离、邋遢女仆 |\n| 18世纪 | 《泉中仙女》（Die Nymphe des Brunnens） | Musäus | 仙女教母、魔法盒、诗性逃离 |\n| 18世纪 | 《箱中少女》（La jeune fille dans le coffret） | Straparola | 箱子、变形 |\n| 18世纪 | 《母熊》（L’ourse） | Basile | 动物伪装（母熊） |\n| 19世纪 | 《猪皮》（Peau de cochon） | Afanasiev | 猪皮 |\n| 1810年 | 《满身烟灰》（Toutes fumées / Allerlei Rauch） | Wilhelm Grimm | 格林手稿中的原题 |\n| 1812年 | 《鼠皮公主》（Peau-de-souris，KHM 71） | Jeannette Hassenpflug | 以盐喻爱、鼠皮、通过无盐菜肴揭示 |\n| 1812年 | 《千皮兽》（Allerleirauh，Dortchen Wild讲述） | Dortchen Wild | 《千皮兽》的口述来源版本 |\n| 1819年 | 《千皮兽》（Allerleirauh，KHM 65） | 格林兄弟（经典版本） | 格林经典版本 |\n| 地方版本（帕德博恩） | 帕德博恩变体 | 地方口头传统 | 兽皮＋苔藓＋礼服、树洞、捉虱 |\n| Vernaleken | Jette-Balai / Vernaleken | Vernaleken | 投掷靴子、身份伪装 |\n| 格林KHM 179 | 《井边的牧鹅女》（La gardeuse d’oies à la fontaine） | 格林兄弟 | 以盐表达爱的母题 |\n\n第二幅图以横向方式呈现扩展语料中反复出现的母题，例如乱伦欲望、兽皮、三件魔法礼服、作为情感隐喻的盐，以及用于身份辨认的物件。它揭示各叙事之间的互文联系，展现出持续传承与重组的传统。这一网络表明，佩罗与格林兄弟都并非故事的起点，而是更早的口头与象征资源在较晚时期的文字定型者。\n\n<!-- table: conte-motifs -->\n\n《驴皮》故事的母题及其来源关系——原稿关系图的表格转录。\n\n| 母题 | 原图中相连的故事或来源 |\n| --- | --- |\n| 禁忌之爱／王室乱伦 | 《玛内金》；《驴皮》（佩罗）；《千皮兽》；《鼠皮公主》 |\n| 通过物件辨认身份 | Vernaleken；《灰姑娘》；《驴皮》（佩罗）；《千皮兽》；《鼠皮公主》 |\n| 三件礼服（金、银、星辰） | 《驴皮》（佩罗）；《千皮兽》 |\n| 以兽皮伪装 | 《驴皮》（佩罗）；《千皮兽》；《鼠皮公主》；《母熊》；《小母驴皮》 |\n| 盐的母题／被误解的爱 | 《鼠皮公主》；KHM 179 |\n\n《驴皮》故事属于自中世纪以来不断被传承、改写与改编的庞大叙事网络。依据里马松-费尔坦（2017）与勒勒克（1998）的研究建立的谱系显示，早在12世纪，便已出现以相似结构为基础的叙事：被禁止的欲望、伪装、逃离、身份隐藏以及最终的辨认。这些要素见于《玛内金》《小母驴皮》（<em>Cuir d’asnette</em>），也见于巴西莱与斯特拉帕罗拉的意大利故事等各不相同的文本。\n\n本文所附的综合图表表明，佩罗与格林兄弟不是这一故事的发明者，而是流动叙事材料在较晚时期的定型者。图表既显示某些母题的持续存在，也显示它们如何依据不同的文化逻辑——神圣的、滑稽的、诗性的或道德的——被重新组织。这一框架使我们能够将所选故事理解为承载集体记忆的动态互文节点，而非相互孤立的文本。"],"en":["Before undertaking a close analysis of the three principal tales, it is necessary to situate <em>Donkeyskin</em> within a broader narrative tradition shaped by longstanding oral transmission, successive literary rewritings, and a particularly rich circulation of intertexts. This first part does not aim at detailed textual analysis. Instead, it offers a historical and typological overview of the motif’s principal occurrences, so as to clarify the logic of transformation at work in the selected versions.\n\nSee the following table: a genealogy of the tale of <em>Donkeyskin</em>, compiled from the work of Natacha Rimasson-Fertin (2017) and Heinz Rölleke (1998).<sup><a href=\"#conte-note-2-en\" id=\"conte-ref-2-en\">2</a></sup>\n\n<!-- table: conte-genealogy -->\n\n| Period / Source | Title / Version | Author / Collector | Motifs / Distinctive elements |\n| --- | --- | --- | --- |\n| Twelfth century | Lai des Deux Amants | Marie de France | Tragic love, flight |\n| Thirteenth century | La Manekine | Philippe de Rémy | Severed hand, flight, disguise |\n| 1547 | Cuir d’asnette | Noël du Fail | Flight and donkey skin |\n| 1694 | Donkeyskin (Perrault) | Charles Perrault | Donkey skin, magical dresses, flight, scullery maid |\n| Eighteenth century | Die Nymphe des Brunnens | Musäus | Fairy godmother, magical box, poetic flight |\n| Eighteenth century | The Girl in the Casket (La jeune fille dans le coffret) | Straparola | Casket, transformation |\n| Eighteenth century | The She-Bear (L’ourse) | Basile | Animal disguise (she-bear) |\n| Nineteenth century | Pigskin (Peau de cochon) | Afanasiev | Pig skin |\n| 1810 | All Smoke (Toutes fumées / Allerlei Rauch) | Wilhelm Grimm | Original title in the Grimm manuscript |\n| 1812 | Mouse-Skin (KHM 71) | Jeannette Hassenpflug | Love as salt, mouse skin, revelation through an unsalted dish |\n| 1812 | Allerleirauh (told by Dortchen Wild) | Dortchen Wild | Oral source version of Allerleirauh |\n| 1819 | Allerleirauh (KHM 65) | Grimm (canonical version) | Canonical Grimm version |\n| Regional (Paderborn) | Paderborn variant | Regional oral tradition | Skin + moss + dress, hollow tree, delousing |\n| Vernaleken | Jette-Balai / Vernaleken | Vernaleken | Thrown boots, disguised identity |\n| Grimm KHM 179 | The Goose-Girl at the Well | Grimm | Motif of love expressed through salt |\n\nA second diagram offers a cross-cutting view of recurring motifs across an expanded corpus: incestuous desire, animal skin, the three magical dresses, salt as an affective metaphor, and the object of recognition. It brings out the intertextual connections between narratives, revealing a tradition of continuous transmission and recomposition. This network demonstrates that neither Perrault nor the Grimms originated the tale; rather, their versions are late textual fixations of a much earlier oral and symbolic repertoire.\n\n<!-- table: conte-motifs -->\n\nMap of the motifs of Donkeyskin and their sources—a tabular transcription of the original diagram.\n\n| Motif | Tales or sources connected in the original diagram |\n| --- | --- |\n| Forbidden love / Royal incest | La Manekine; Donkeyskin (Perrault); Allerleirauh; Mouse-Skin |\n| Recognition through an object | Vernaleken; Cinderella; Donkeyskin (Perrault); Allerleirauh; Mouse-Skin |\n| Three dresses (gold, silver, stars) | Donkeyskin (Perrault); Allerleirauh |\n| Animal skin as disguise | Donkeyskin (Perrault); Allerleirauh; Mouse-Skin; The She-Bear; Cuir d’asnette |\n| Salt motif / Misunderstood love | Mouse-Skin; KHM 179 |\n\nThe tale of <em>Donkeyskin</em> belongs to an extensive network of narratives transmitted, rewritten, and adapted since the Middle Ages. The genealogy drawn from Rimasson-Fertin (2017) and Rölleke (1998) reveals narratives based on similar structures as early as the twelfth century: forbidden desire, disguise, flight, concealment of identity, and final recognition. These elements recur in texts as varied as <em>La Manekine</em>, <em>Cuir d’asnette</em>, and the Italian tales of Basile and Straparola.\n\nThe synoptic materials accompanying this study show that neither Perrault nor the Grimms invented the tale: they gave relatively late form to a shifting body of narrative material. They reveal both the persistence of certain motifs and their reconfiguration according to different cultural logics—sacred, burlesque, poetic, or moral. This framework allows the selected tales to be approached not as isolated texts but as dynamic intertextual nodes carrying a collective memory."]}}]},{"id":"conte-ii","title":{"fr":"II. Dissimuler, dire, se révéler : stratégies narratives et corporelles","zh":"II. 隐藏、言说与自我揭示：叙事和身体策略","en":"II. Concealing, Speaking, Revealing Oneself: Narrative and Bodily Strategies"},"units":[{"title":{"fr":"II. Dissimuler, dire, se révéler : stratégies narratives et corporelles","zh":"II. 隐藏、言说与自我揭示：叙事和身体策略","en":"II. Concealing, Speaking, Revealing Oneself: Narrative and Bodily Strategies"},"paragraphs":{"fr":["Le déguisement, qu’il prenne la forme d’une peau d’âne, de souris ou d’un manteau fait de toutes les fourrures du royaume, constitue le cœur symbolique du conte. Cette deuxième partie vise à comparer les modalités de dissimulation et de révélation dans les deux versions principales — Peau d’Âne de Perrault et Allerleirauh (KHM 65) — ainsi que dans les éléments partagés avec Peau-de-souris."],"zh":["无论采取驴皮、鼠皮，还是由王国中所有动物的毛皮拼成的斗篷，伪装都构成这一故事的象征核心。第二部分将比较两个主要版本——佩罗的《驴皮》与《千皮兽》（KHM 65）——中隐藏与揭示身份的方式，并考察它们与《鼠皮公主》共有的要素。"],"en":["Whether it takes the form of a donkey skin, a mouse skin, or a cloak made from the pelts of every animal in the kingdom, disguise constitutes the tale’s symbolic core. This second part compares the procedures of concealment and revelation in the two principal versions—Perrault’s <em>Donkeyskin</em> and <em>Allerleirauh</em> (KHM 65)—as well as the elements they share with <em>Mouse-Skin</em>."]}},{"title":{"fr":"1. Stratégies de déguisement et scènes de révélation","zh":"1. 伪装策略与身份揭示场景","en":"1. Strategies of Disguise and Scenes of Revelation"},"paragraphs":{"fr":["Dans les trois versions étudiées — <em>Peau d’Âne</em> de Perrault, <em>Allerleirauh</em> des frères Grimm et <em>Peau-de-souris</em>, le déguisement par la peau animale constitue un pivot narratif : il permet à la jeune fille de fuir l’espace incestueux du palais et de se dissoudre dans un anonymat social. Toutefois, cette stratégie de dissimulation ne relève pas d’un simple déplacement ou camouflage : elle est associée à un dispositif complexe d’objets et de vêtements, dont la valeur symbolique diffère selon les contextes culturels et les visées poétiques des auteurs.\n\nChez Perrault, les trois robes demandées par la princesse — la robe couleur du Temps, la robe couleur de la Lune, la robe couleur du Soleil — sont désignées par des noms proprement typographiés, avec majuscules, ce qui signale, une montée en <em>abstraction et en généralisation archétypale</em>. Ces vêtements ne sont pas de simples attributs matériels : ils deviennent<em> des figures cosmiques</em>, des instruments de transfiguration, voire des <em>agents d’une métamorphose rituelle</em><sup><a href=\"#conte-note-3-fr\" id=\"conte-ref-3-fr\">3</a></sup>. Dans cette optique, la boue dans laquelle se cache la princesse ne fait que préparer un surgissement lumineux, la résurrection d’un soi sublimé par l’épreuve.\n\nCe geste poétique ne se limite pas à la sphère symbolique : il s’inscrit dans une tradition intertextuelle que Perrault exploite avec subtilité. <em>Peau d’Âne</em> engage un <em>dialogue structurant avec la fabella de Psyché d’Apulée</em><sup><a href=\"#conte-note-4-fr\" id=\"conte-ref-4-fr\">4</a></sup>, où l’on retrouve également le motif d’une femme cachant son identité dans des objets scellés. Cette intertextualité profonde donne au conte une cohérence générique qui dépasse la seule trame narrative : elle inscrit <em>Peau d’Âne</em> dans une généalogie littéraire qui va de l’Antiquité latine à La Fontaine, en passant par Basile et la tradition italienne<sup><a href=\"#conte-note-5-fr\" id=\"conte-ref-5-fr\">5</a></sup>. Le conte devient ainsi un palimpseste narratif, où la robe et la peau sont autant d’écrans à soulever.\n\nEn contraste, les Grimm adoptent une démarche plus descriptive et moins allégorique : les trois robes sont nommées sans majuscule — <em>dorée comme le soleil, argentée comme la lune, brillante comme les étoiles</em> —, ce qui réduit leur portée symbolique au profit d’une fonction illustrative. Le déguisement central, un manteau formé de toutes les peaux des animaux du royaume, s’ancre dans une matérialité brute, dénuée de référence cosmique ou sacrée. Certaines variantes manuscrites anciennes y ajoutent même de la mousse ou des feuilles, insistant davantage sur l’hétérogénéité organique que sur l’unité stylisée. Cette esthétique du concret, souvent rythmée par des structures répétitives ou additives<sup><a href=\"#conte-note-6-fr\" id=\"conte-ref-6-fr\">6</a></sup>, reflète une appartenance à l’oralité populaire, où l’impact émotionnel et la logique cumulative priment sur la stylisation.\n\nCette divergence de style se prolonge dans la scène de révélation progressive, structurée autour d’objets marqués. Chez Perrault, l’objet déclencheur est une bague cachée dans un gâteau — préparé dans la solitude et la pureté, par une princesse ayant soigneusement lavé son visage et ses mains, et revêtu un corsage d’argent :<em> d’abord elle se décrassa<br>les mains, les bras et le visage,<br>et prit un corps d’argent que vite elle laça<sup><a href=\"#conte-note-7-fr\" id=\"conte-ref-7-fr\">7</a></sup></em>. Ce rituel intime dans un cadre d’humilité forcée donne à l’objet une portée morale, comme manifestation de la vertu préservée malgré l’abaissement social.\n\nChez les Grimm, la reconnaissance est plus séquentielle et rituelle : elle passe par trois bals successifs, trois changements de robe, et l’apparition d’objets symboliques (rouet, dévidoir, bague) dans la soupe royale. La robe cachée dans une coquille de noix devient le signe d’un secret sacralisé, dévoilé par étapes, tel un rite d’émergence.\n\nEnfin, dans la version supprimée de 1812, <em>Peau-de-souris</em>, c’est la perte d’une bague précieuse qui mène à la révélation. La reconnaissance repose moins sur une enquête rigoureuse que sur une intuition sensible du roi et une auto-révélation volontaire, ce qui confère à cette version une tonalité intimiste et émotionnelle, plus ambiguë que les rituels codifiés de Perrault ou des Grimm.\n\nCe parcours de disparition et de réapparition mobilise des logiques symboliques distinctes : cosmologique et allégorique chez Perrault, séquentielle et folklorique chez les Grimm, ambiguë et psychologique dans Peau-de-souris. En conférant à chaque objet une valeur à la fois narrative et poétique, ces contes façonnent une esthétique du secret et de la vérité différée."],"zh":["在本文研究的三个版本——佩罗的《驴皮》、格林兄弟的《千皮兽》及《鼠皮公主》——中，兽皮伪装都是叙事的枢纽：它使少女得以逃离王宫这一乱伦空间，并隐没于社会的匿名状态之中。然而，这种隐藏策略并非单纯的位移或遮掩，而是与一套复杂的物件及服饰系统相联系；其象征价值随着文化语境与作者诗学旨趣的不同而变化。\n\n在佩罗笔下，公主索求的三件礼服——“天色”（<em>Temps</em>）之裙、“月亮”（<em>Lune</em>）之裙与“太阳”（<em>Soleil</em>）之裙——以带有大写字母的特定名称呈现，标示出向<em>抽象化与原型性概括</em>的提升。这些衣服并非单纯的物质属性，而成为<em>宇宙意象</em>、使形象升华的工具，乃至<em>仪式性变形的施动者</em>。<sup><a href=\"#conte-note-3-zh\" id=\"conte-ref-3-zh\">3</a></sup> 从这一角度看，公主藏身的泥污，不过是在为光辉的迸发作准备：一个经受考验而升华的自我将由此复生。\n\n这种诗性处理并不局限于象征层面，而是置身于佩罗巧妙运用的互文传统之中。《驴皮》与阿普列尤斯的普绪克故事形成一种具有结构作用的对话；<sup><a href=\"#conte-note-4-zh\" id=\"conte-ref-4-zh\">4</a></sup> 在后者中，同样可以看到女性将身份藏于封闭物件之中的母题。这种深层互文性赋予故事一种超越情节本身的文类连贯性，将《驴皮》纳入一条从拉丁古代延伸至拉封丹、途经巴西莱及意大利传统的文学谱系。<sup><a href=\"#conte-note-5-zh\" id=\"conte-ref-5-zh\">5</a></sup> 故事因此成为叙事的重写羊皮卷，而礼服与兽皮则是等待被揭开的层层屏障。\n\n相比之下，格林兄弟采取了更具描述性、较少寓意化的方式：三件礼服的名称没有大写字母——<em>如太阳般金黄、如月亮般银白、如星辰般闪耀</em>——这使其象征幅度有所收缩，转而服务于具象描绘。作为核心伪装的斗篷由王国中所有动物的毛皮拼成，扎根于粗粝的物质性，不带宇宙性或神圣性的指涉。某些早期手稿变体甚至添加苔藓或树叶，更强调有机材料的异质混合，而非风格化的统一。这种具体事物的美学往往以重复或累加结构形成节奏，<sup><a href=\"#conte-note-6-zh\" id=\"conte-ref-6-zh\">6</a></sup> 体现出它与民间口头传统的关联；在这一传统中，情感冲击与累积逻辑优先于风格化处理。\n\n这种风格差异延续到围绕特定物件展开的逐步揭示场景之中。在佩罗笔下，触发辨认的是藏在蛋糕里的一枚戒指。公主独自制作蛋糕，先仔细洗净面庞和双手，穿上银色紧身衣，以洁净的姿态准备它：<em>她先洗去污垢，<br>洗净双手、双臂与面庞，<br>再穿上银色紧身衣，迅速将系带束紧</em>。<sup><a href=\"#conte-note-7-zh\" id=\"conte-ref-7-zh\">7</a></sup> 在被迫屈居卑微的处境中，这一私密仪式赋予物件道德意义，使它成为德性未因社会地位的降低而受损的体现。\n\n在格林兄弟的版本中，辨认则更具序列性与仪式性：它经过三次连续的舞会、三次换装，以及象征性物件——纺车、绕线架、戒指——在国王汤碗中的出现而完成。藏在核桃壳里的礼服成为一个被神圣化的秘密的标记，分阶段得到揭示，犹如逐步显现的仪式。\n\n最后，在后来被删去的1812年版本《鼠皮公主》中，一枚贵重戒指的遗失促成了身份揭示。辨认所依靠的，与其说是严密追查，不如说是国王感性的直觉与少女主动的自我揭露。这赋予该版本一种私密而富于情感的色调，其暧昧性也强于佩罗或格林兄弟其他版本中程式化的仪式。\n\n这一消失与重现的过程调动了不同的象征逻辑：佩罗的逻辑具有宇宙性与寓意性，格林兄弟的逻辑具有序列性与民俗性，而《鼠皮公主》的逻辑则具有暧昧性与心理性。这些故事赋予每件物品以叙事及诗学的双重价值，由此塑造出一种关于秘密与延宕真相的美学。"],"en":["In the three versions examined here—Perrault’s <em>Donkeyskin</em>, the Brothers Grimm’s <em>Allerleirauh</em>, and <em>Mouse-Skin</em>—disguise in animal skin forms a narrative pivot: it allows the girl to escape the incestuous space of the palace and dissolve into social anonymity. Yet this strategy of concealment involves more than relocation or camouflage. It is bound to a complex system of objects and clothing whose symbolic value varies according to cultural context and the authors’ poetic aims.\n\nIn Perrault, the three dresses requested by the princess—the dress the colour of the Weather (<em>Temps</em>), the Moon (<em>Lune</em>), and the Sun (<em>Soleil</em>)—are designated by typographically distinctive, capitalised names, signalling a movement towards <em>abstraction and archetypal generalisation</em>. These garments are more than material attributes: they become <em>cosmic figures</em>, instruments of transfiguration, even <em>agents of a ritual metamorphosis</em>.<sup><a href=\"#conte-note-3-en\" id=\"conte-ref-3-en\">3</a></sup> From this perspective, the mud in which the princess hides merely prepares a luminous emergence, the resurrection of a self sublimated through ordeal.\n\nThis poetic gesture extends beyond symbolism into an intertextual tradition that Perrault exploits with subtlety. <em>Donkeyskin</em> enters into a structuring dialogue with Apuleius’s <em>fabella</em> of Psyche,<sup><a href=\"#conte-note-4-en\" id=\"conte-ref-4-en\">4</a></sup> where the motif of a woman concealing her identity within sealed objects also appears. This deep intertextuality gives the tale a generic coherence that exceeds its plot alone: it places <em>Donkeyskin</em> within a literary genealogy extending from Latin antiquity to La Fontaine, through Basile and the Italian tradition.<sup><a href=\"#conte-note-5-en\" id=\"conte-ref-5-en\">5</a></sup> The tale thus becomes a narrative palimpsest in which dress and skin alike are screens to be lifted.\n\nBy contrast, the Grimms adopt a more descriptive and less allegorical approach: the three dresses are named without capitals—<em>golden as the sun, silvery as the moon, shining as the stars</em>—reducing their symbolic reach in favour of an illustrative function. The central disguise, a cloak assembled from the skins of every animal in the kingdom, is grounded in raw materiality, without cosmic or sacred reference. Some early manuscript variants even add moss or leaves, placing greater emphasis on organic heterogeneity than on stylised unity. This aesthetic of the concrete, often patterned through repetitive or additive structures,<sup><a href=\"#conte-note-6-en\" id=\"conte-ref-6-en\">6</a></sup> reflects an affiliation with popular oral culture, in which emotional impact and cumulative logic take precedence over stylisation.\n\nThis stylistic divergence continues in the scene of gradual revelation, structured around distinctive objects. In Perrault, recognition is triggered by a ring hidden in a cake, prepared in solitude and purity by a princess who has carefully washed her face and hands and put on a silver bodice: <em>first she washed the grime away<br>from hands and arms and face,<br>and put on a silver bodice, quickly lacing it</em>.<sup><a href=\"#conte-note-7-en\" id=\"conte-ref-7-en\">7</a></sup> Within a setting of enforced humility, this intimate ritual gives the object a moral significance, manifesting virtue preserved despite social abasement.\n\nIn the Grimms’ version, recognition is more sequential and ritualised: it proceeds through three successive balls, three changes of dress, and the appearance of symbolic objects—a spinning wheel, a reel, and a ring—in the royal soup. The dress concealed within a nutshell becomes the sign of a sacralised secret, disclosed in stages like a rite of emergence.\n\nFinally, in <em>Mouse-Skin</em>, the subsequently omitted version of 1812, the loss of a precious ring leads to revelation. Recognition depends less on systematic investigation than on the king’s sensitive intuition and a voluntary act of self-disclosure. This lends the version an intimate, emotional tone, more ambiguous than the codified rituals of Perrault or the Grimms.\n\nThis trajectory of disappearance and reappearance mobilises distinct symbolic logics: cosmological and allegorical in Perrault, sequential and folkloric in the Grimms, and ambiguous and psychological in <em>Mouse-Skin</em>. By granting each object both narrative and poetic value, these tales fashion an aesthetic of secrecy and deferred truth."]}},{"title":{"fr":"2. La voix narrative et la mise en scène de l’énonciation","zh":"2. 叙述声音与言说的展演","en":"2. Narrative Voice and the Staging of Enunciation"},"paragraphs":{"fr":["L’une des premières différences stylistiques frappantes entre Peau d’Âne de Perrault et Allerleirauh des frères Grimm réside dans la voix narrative. Alors que le texte de Perrault revendique une énonciation double, combinant le récit et une présence explicite de l’auteur-narrateur, les contes des Grimm adoptent une posture d’effacement du narrateur, laissant place à une narration neutre, impersonnelle, fidèle à la tradition orale.\n\nChez Perrault, le conte s’ouvre sur une adresse directe au lecteur, pleine d’ironie, d’élégance et de complicité :<em>Il est des gens de qui l’esprit guindé... Je vais, pour contenter votre juste désir, Vous conter tout au long l’histoire de Peau-d’Âne<sup><a href=\"#conte-note-8-fr\" id=\"conte-ref-8-fr\">8</a></sup></em>.\n\nCe prologue construit un pacte narratif qui relève à la fois du divertissement mondain et de la tradition des conteuses. L’auteur revendique le plaisir d’écrire et d’instruire à travers la fiction. Plus loin dans le conte, il intervient encore, notamment lorsqu’il évoque la marraine de l’héroïne : <em>Il n’est pas besoin qu’on vous die; Ce qu’était une Fée en ces bienheureux temps ;Car je suis sûr que votre Mie; Vous l’aura dit dès vos plus jeunes ans<sup><a href=\"#conte-note-9-fr\" id=\"conte-ref-9-fr\">9</a></sup></em>. Ou lorsqu’il commente, sur un ton complice, la possible stratégie de la jeune fille ayant glissé une bague dans le gâteau :<em>Et pour moi franchement je l’oserais bien croire... Je suis bien sûr encor et j’en ferais serment</em>…<sup><a href=\"#conte-note-10-fr\" id=\"conte-ref-10-fr\">10</a></sup>\n\nCette posture rappelle les jeux d’énonciation chez Giambattista Basile, dont les contes sont également encadrés par une voix auctoriale forte. Dans le prologue de Fleur-de-persil, tiré du Conte des contes, le narrateur évoque avec humour la mémoire de sa grand-mère conteuse :<em>Mon désir de divertir la princesse est si grand que durant toute cette nuit... j’ai choisi parmi les récits qu’aimait conter cette bonne dame</em>...\n\nLe conte se présente alors comme hérité d’un savoir oral transmis, tout en étant mis en scène par une voix savante, construite et malicieuse.\n\nIl convient toutefois de souligner que cette différence de posture narrative n’exclut pas une mise en scène complexe de l’énonciation chez les deux auteurs<sup><a href=\"#conte-note-11-fr\" id=\"conte-ref-11-fr\">11</a></sup>. Chez Perrault, la voix s’inscrit dans une logique de recueil, où chaque conte participe à une stratégie littéraire cohérente, renforçant la présence de l’auteur dès la préface de 1694. L’adresse au lecteur, les glissements entre fiction et commentaire, ainsi que les marqueurs de connivence créent une scénographie discursive propre à l’esthétique courtisane.\n\nChez les Grimm, à l’inverse, l’effacement apparent du narrateur est aussi une construction : ils organisent les contes dans un dispositif énonciatif particulier, destiné à faire croire à la fidélité orale tout en sélectionnant, agençant et réécrivant les récits pour en faire un corpus homogène<sup><a href=\"#conte-note-12-fr\" id=\"conte-ref-12-fr\">12</a></sup>. Le récit s’ouvre abruptement sur l’action — <em>Un roi avait trois filles … </em>;<em> Il était une fois un roi...</em>  — sans prologue, sans justification, sans insertion de commentaire. Ce choix reflète une volonté de restitution authentique du conte tel qu’il aurait été entendu, sans médiation visible. On y retrouve la marque d’une narration orale transcrite, fidèle à la forme brève, directe et objective du Märchen.\n\nCe contraste de voix narrative révèle deux logiques culturelles de la fiction : Perrault insère le conte dans une esthétique littéraire et morale propre à la cour française, où l’ironie et l’adresse au lecteur sont constitutives de la stratégie de séduction narrative ; les Grimm, eux, s’inscrivent dans une dynamique de collecte patrimoniale, visant à donner à entendre la voix collective et anonyme du peuple. L’un raconte, l’autre transmet."],"zh":["佩罗的《驴皮》与格林兄弟的《千皮兽》之间，最先引人注意的风格差异之一在于叙述声音。佩罗的文本明确采取双重言说，将故事叙述与作者—叙述者的显身结合起来；格林童话则采取叙述者隐退的姿态，让位于中立、非个人化、忠于口头传统的叙述。\n\n佩罗的故事以直接面向读者的言说开篇，充满反讽、优雅与默契：<em>有些人的心智拘谨……为了满足您这正当的愿望，我将把《驴皮》的故事从头到尾讲给您听</em>。<sup><a href=\"#conte-note-8-zh\" id=\"conte-ref-8-zh\">8</a></sup>\n\n这一开场建立起一种叙事契约，既属于上流社会的消遣，也属于女性讲述者的传统。作者借此申明通过虚构获得写作愉悦并施行教益的意愿。在后文中，他仍继续介入，例如提及女主人公的教母时：<em>不必再向您解释，在那些幸福的年代，仙女是什么模样；因为我确信，您儿时的保姆早已将这些讲给您听</em>。<sup><a href=\"#conte-note-9-zh\" id=\"conte-ref-9-zh\">9</a></sup> 又如，他以与读者心照不宣的语气评论少女可能有意把戒指放进蛋糕的策略：<em>至于我，坦白说，我倒真愿意相信……我还十分确信，甚至愿意为此起誓……</em><sup><a href=\"#conte-note-10-zh\" id=\"conte-ref-10-zh\">10</a></sup>\n\n这种姿态令人想到詹巴蒂斯塔·巴西莱笔下的言说游戏：他的故事也由鲜明的作者声音构成框架。在《故事中的故事》所收《欧芹姑娘》的开场中，叙述者幽默地唤起自己那位善于讲故事的祖母：<em>我想逗公主开心的愿望如此强烈，以至于这一整夜……我从那位好老太太爱讲的故事里选出了一个……</em>\n\n故事由此一方面被呈现为传承而来的口头知识，另一方面又经由一个博学、精心建构且带有狡黠意味的声音而得到表演。\n\n不过，需要强调的是，两者叙述姿态的差异，并不意味着其中任何一方缺少复杂的言说安排。<sup><a href=\"#conte-note-11-zh\" id=\"conte-ref-11-zh\">11</a></sup> 在佩罗笔下，叙述声音服从于故事集的整体逻辑：每则故事都参与一套连贯的文学策略，而作者的在场从1694年序言起就已得到强化。对读者的呼告、虚构与评论之间的滑移，以及标示默契的措辞，共同建构出属于宫廷美学的话语场景。\n\n相比之下，格林兄弟笔下叙述者表面上的隐退，也是一种建构。他们将故事组织在特定的言说机制中，让读者相信文本忠实于口头传统，同时又对叙事进行选择、编排与改写，使之成为一个统一的语料整体。<sup><a href=\"#conte-note-12-zh\" id=\"conte-ref-12-zh\">12</a></sup> 故事直接从行动切入——<em>一个国王有三个女儿……</em>；<em>从前有一位国王……</em>——既无序言，也不作辩解，更不插入评论。这一选择体现出一种愿望：如实再现仿佛曾被亲耳听到的故事，不显露中介的痕迹。其中可以看到被转写的口头叙事的印记，它忠于德国神奇故事（<em>Märchen</em>）简短、直接而客观的形式。\n\n这种叙述声音的对照揭示出虚构的两种文化逻辑：佩罗将故事纳入法国宫廷特有的文学与道德美学之中，反讽与对读者的呼告构成其叙事吸引力的一部分；格林兄弟则投身于文化遗产的采集，旨在让民众集体而匿名的声音得到聆听。一个讲述，另一个传递。"],"en":["One of the first striking stylistic differences between Perrault’s <em>Donkeyskin</em> and the Brothers Grimm’s <em>Allerleirauh</em> lies in narrative voice. Whereas Perrault’s text asserts a dual mode of enunciation, combining storytelling with the explicit presence of an author-narrator, the Grimms’ tales adopt a stance of narratorial effacement, giving way to neutral, impersonal narration faithful to the oral tradition.\n\nPerrault’s tale opens with a direct address to the reader, full of irony, elegance, and complicity: <em>There are those whose minds are stiff and formal … To satisfy your rightful wish, I shall tell you the story of Donkeyskin in full</em>.<sup><a href=\"#conte-note-8-en\" id=\"conte-ref-8-en\">8</a></sup>\n\nThis prologue establishes a narrative pact belonging both to cultivated social entertainment and to the tradition of women storytellers. The author asserts the pleasure of writing and of instructing through fiction. He intervenes again later, notably when referring to the heroine’s godmother: <em>There is no need to tell you what a Fairy was in those happy times; for I am sure your nurse will have told you in your earliest years</em>.<sup><a href=\"#conte-note-9-en\" id=\"conte-ref-9-en\">9</a></sup> He also comments, in a tone of shared understanding, on the possibility that the girl deliberately slipped a ring into the cake: <em>For my part, frankly, I would readily believe it … Of this too I am quite certain, and would swear to it …</em><sup><a href=\"#conte-note-10-en\" id=\"conte-ref-10-en\">10</a></sup>\n\nThis stance recalls Giambattista Basile’s games of enunciation, in which tales are likewise framed by a strong authorial voice. In the prologue to <em>Parsley</em>, from <em>The Tale of Tales</em>, the narrator humorously evokes the memory of his storytelling grandmother: <em>So great is my desire to entertain the princess that throughout this whole night … I have chosen from among the stories that good woman loved to tell …</em>\n\nThe tale is thus presented as inherited oral knowledge while also being staged through a learned, carefully constructed, and mischievous voice.\n\nIt should nevertheless be emphasised that this difference in narrative stance does not preclude a complex staging of enunciation in either case.<sup><a href=\"#conte-note-11-en\" id=\"conte-ref-11-en\">11</a></sup> In Perrault, the voice operates within the logic of a collection: each tale participates in a coherent literary strategy that reinforces the author’s presence from the preface of 1694 onwards. Direct addresses to the reader, shifts between fiction and commentary, and signals of shared understanding establish a discursive scenography characteristic of courtly aesthetics.\n\nIn the Grimms, by contrast, the narrator’s apparent effacement is itself a construction. They organise the tales within a particular enunciative framework designed to create an impression of fidelity to oral tradition, while selecting, arranging, and rewriting narratives into a homogeneous corpus.<sup><a href=\"#conte-note-12-en\" id=\"conte-ref-12-en\">12</a></sup> The narrative begins abruptly with the action—<em>A king had three daughters …</em>; <em>Once upon a time there was a king …</em>—without a prologue, justification, or inserted commentary. This choice reflects a desire to restore the tale authentically as it might have been heard, without visible mediation. It bears the marks of oral narration transcribed, faithful to the brief, direct, and objective form of the <em>Märchen</em>.\n\nThis contrast in narrative voice reveals two cultural logics of fiction. Perrault places the tale within the literary and moral aesthetics of the French court, where irony and direct address form part of a strategy of narrative seduction. The Grimms, meanwhile, engage in the collection of cultural heritage, seeking to make heard the collective, anonymous voice of the people. One tells; the other transmits."]}},{"title":{"fr":"3. Le cadre royal et la médiation féminine","zh":"3. 王室背景与女性中介","en":"3. The Royal Setting and Female Mediation"},"paragraphs":{"fr":["Le début de <em>Peau d’Âne</em> chez Perrault s’inscrit dans une temporalité longue et descriptive. Le royaume y est présenté comme un espace d’harmonie et d’abondance, dirigé par un roi sage, une reine admirable, et une filiation désirée<sup><a href=\"#conte-note-13-fr\" id=\"conte-ref-13-fr\">13</a></sup>. Ce cadre monarchique, idéalisé presque à l’excès, fonctionne comme une élévation préalable à la chute : la perfection du monde initial fait d’autant plus saillir la transgression morale qui surgit avec le désir incestueux du roi. La transition est douce : la mort de la reine, sa promesse ambiguë, puis l’hésitation du roi avant sa décision. Cette lenteur participe d’un rythme génésique, dans lequel le conte se construit par densification symbolique<sup><a href=\"#conte-note-14-fr\" id=\"conte-ref-14-fr\">14</a></sup>.\n\nChez les frères Grimm, notamment dans <em>Allerleirauh</em>, la narration commence in medias res. La mère meurt, le père promet de ne se remarier qu’avec une femme aussi belle qu’elle, puis, sans détour, se tourne vers sa propre fille. Cette économie narrative abrupte inscrit le récit dans un rythme événementiel rapide, où le cadre moral n’est pas construit en amont, mais se déduit de l’action. Le récit épouse ici l’esthétique du <em>Märchen</em>, fondée sur la brièveté, l’efficacité dramatique et la lisibilité morale immédiate : la faute paternelle n’est pas préparée, elle surgit comme un scandale brut<sup><a href=\"#conte-note-15-fr\" id=\"conte-ref-15-fr\">15</a></sup>.\n\nCette différence structurelle s’accompagne d’une divergence symbolique notable : <em>Peau d’Âne</em> introduit une figure tutélaire féminine, la marraine-fée, qui joue un rôle central dans la mise en action de la fuite. C’est elle qui impose au roi les épreuves des robes impossibles, puis qui dote la princesse d’un nécessaire magique pour s’enfuir (coffret, miroir, toilette, bijoux, baguette, etc.). Elle incarne à la fois l’autorité morale, la protection surnaturelle et la médiation narrative. À l’inverse, dans <em>Allerleirauh</em>, cette figure est absente : la princesse agit seule, formule elle-même ses exigences, prépare sa fuite avec les moyens du bord (robes dans une coquille de noix, manteau de fourrures, suie sur le visage). L’absence de marraine transfère l’initiative entière à la protagoniste et inscrit l’histoire dans une logique de résistance individuelle, plus dure, moins codifiée<sup><a href=\"#conte-note-16-fr\" id=\"conte-ref-16-fr\">16</a></sup>.\n\nAinsi, la construction du cadre initial et la présence — ou l’effacement — d’un tiers féminin révèlent deux visions distinctes du conte : chez Perrault, une mise en scène galante fondée sur la ritualisation et la restauration morale ; chez les Grimm, une dramatisation directe de la crise, où la jeune fille doit agir seule dans un monde sans médiation.\n\nCette opposition est notamment éclairée par l’analyse de Jack Zipes, qui voit dans les contes de Perrault des instruments de régulation sociale, destinés à civiliser par la narration les jeunes lectrices aristocratiques à travers des figures d’autorité<sup><a href=\"#conte-note-17-fr\" id=\"conte-ref-17-fr\">17</a></sup>."],"zh":["佩罗《驴皮》的开端处于一种舒缓而重描写的时间进程之中。王国被呈现为和谐、丰饶的空间，由贤明的国王与令人钦佩的王后统治，子嗣的延续也承载着期待。<sup><a href=\"#conte-note-13-zh\" id=\"conte-ref-13-zh\">13</a></sup> 这一近乎被过度理想化的君主制框架，发挥着坠落之前预先抬升的作用：初始世界愈完美，国王乱伦欲望所带来的道德越界便愈鲜明。过渡是渐进的：王后的死亡、她那含混的约定，再到国王作出决定之前的迟疑。这种缓慢参与了一种生成性的节奏，故事在象征意义的逐层积聚中形成。<sup><a href=\"#conte-note-14-zh\" id=\"conte-ref-14-zh\">14</a></sup>\n\n在格林兄弟笔下，尤其是在《千皮兽》中，叙事从事件之中骤然切入。母亲去世，父亲承诺只迎娶与她同样美丽的女人，随后便毫不迂回地将目光转向自己的女儿。这种突兀而简省的叙事使故事进入快速的事件节奏，道德框架不是事先建立，而是从行动中显现。它体现出<em>Märchen</em>的美学：简练、戏剧效率，以及道德判断的即时可辨性。父亲的过错未经铺垫，便作为赤裸的丑行突然出现。<sup><a href=\"#conte-note-15-zh\" id=\"conte-ref-15-zh\">15</a></sup>\n\n这一结构差异伴随着显著的象征分歧：《驴皮》引入了女性守护者——仙女教母，她在推动逃离行动方面发挥核心作用。是她让公主向国王提出无法完成的礼服要求，又为公主配备逃离所需的魔法物件，包括箱子、镜子、梳妆用品、首饰、魔杖等。她同时体现道德权威、超自然保护与叙事中介。相反，《千皮兽》中没有这一人物：公主独自行动，亲自提出要求，利用手头的资源准备逃离，将礼服藏进核桃壳，披上毛皮斗篷，并把烟灰涂在脸上。教母的缺席将全部主动权转移给女主人公，使故事进入一种个人抵抗的逻辑，处境更严酷，也更少程式化。<sup><a href=\"#conte-note-16-zh\" id=\"conte-ref-16-zh\">16</a></sup>\n\n因此，初始背景的建构，以及女性第三者的在场或隐退，揭示出两种不同的故事观：佩罗呈现出一种以仪式化和道德秩序恢复为基础的雅致叙事；格林兄弟则直接将危机戏剧化，使少女必须在一个没有中介的世界中独自行动。\n\n杰克·齐普斯的分析尤其有助于理解这一对照。他将佩罗的故事视为社会规训的工具，通过权威人物，以叙事教化贵族少女读者。<sup><a href=\"#conte-note-17-zh\" id=\"conte-ref-17-zh\">17</a></sup>"],"en":["The opening of Perrault’s <em>Donkeyskin</em> unfolds within an extended, descriptive temporality. The kingdom is presented as a space of harmony and abundance, governed by a wise king and an admirable queen, with the continuation of their line eagerly desired.<sup><a href=\"#conte-note-13-en\" id=\"conte-ref-13-en\">13</a></sup> This almost excessively idealised monarchical setting provides an elevation before the fall: the perfection of the initial world makes the moral transgression arising from the king’s incestuous desire all the more conspicuous. The transition is gradual: the queen’s death, her ambiguous stipulation, and then the king’s hesitation before reaching his decision. This slowness participates in a generative rhythm in which the tale develops through the accumulation of symbolic density.<sup><a href=\"#conte-note-14-en\" id=\"conte-ref-14-en\">14</a></sup>\n\nIn the Brothers Grimm, particularly in <em>Allerleirauh</em>, the narrative begins <em>in medias res</em>. The mother dies; the father promises to remarry only a woman as beautiful as she was; then, without circumlocution, he turns to his own daughter. This abrupt narrative economy establishes a rapid rhythm of events in which the moral framework is not constructed beforehand but emerges from the action. The story follows the aesthetics of the <em>Märchen</em>, grounded in brevity, dramatic efficiency, and immediate moral legibility: the father’s wrongdoing is not prepared for but erupts as an unmediated scandal.<sup><a href=\"#conte-note-15-en\" id=\"conte-ref-15-en\">15</a></sup>\n\nThis structural difference is accompanied by a significant symbolic divergence. <em>Donkeyskin</em> introduces a female guardian, the fairy godmother, who plays a central role in setting the escape in motion. She devises the ordeals of the impossible dresses imposed on the king and equips the princess with the magical necessities for flight: a casket, mirror, toilette, jewellery, wand, and so forth. She embodies moral authority, supernatural protection, and narrative mediation at once. In <em>Allerleirauh</em>, by contrast, this figure is absent: the princess acts alone, formulates her own demands, and prepares her escape with the resources available to her—dresses in a nutshell, a fur cloak, soot on her face. The godmother’s absence transfers all initiative to the protagonist and places the story within a logic of individual resistance that is harsher and less codified.<sup><a href=\"#conte-note-16-en\" id=\"conte-ref-16-en\">16</a></sup>\n\nThe construction of the initial setting and the presence—or effacement—of a female intermediary thus reveal two distinct conceptions of the tale: in Perrault, a gallant staging grounded in ritualisation and moral restoration; in the Grimms, a direct dramatisation of crisis in which the girl must act alone in a world without mediation.\n\nThis opposition is illuminated in particular by Jack Zipes’s analysis, which regards Perrault’s tales as instruments of social regulation intended to civilise young aristocratic female readers through narrative figures of authority.<sup><a href=\"#conte-note-17-en\" id=\"conte-ref-17-en\">17</a></sup>"]}}]},{"id":"conte-iii","title":{"fr":"III. Inceste, morale et réécriture culturelle","zh":"III. 乱伦、道德与文化改写","en":"III. Incest, Morality, and Cultural Rewriting"},"units":[{"title":{"fr":"III. Inceste, morale et réécriture culturelle","zh":"III. 乱伦、道德与文化改写","en":"III. Incest, Morality, and Cultural Rewriting"},"paragraphs":{"fr":["L’inceste, motif central mais souvent occulté des contes dits « pour enfants », se présente dans Peau d’Âne, Allerleirauh et Peau-de-souris sous des formes narratives diverses, oscillant entre euphémisation poétique et exposition brutale. Cette troisième partie s’attache à analyser la manière dont l’interdit est formulé, détourné ou condamné, ainsi que la façon dont le féminin — à travers la vertu, la beauté ou la souffrance — est configuré en réponse à cette menace.\n\nEn croisant une lecture textuelle et symbolique avec les apports critiques de Jack Zipes, l’analyse portera une attention particulière à la fonction morale et culturelle du conte dans sa capacité à dissimuler ou à reproduire les normes patriarcales."],"zh":["乱伦是所谓“儿童故事”中一个核心却常被遮蔽的母题；在《驴皮》《千皮兽》及《鼠皮公主》中，它以不同叙事形式出现，游移于诗性的委婉处理与赤裸的暴露之间。第三部分将分析禁忌如何被表述、转移或谴责，以及女性形象如何经由德性、美貌或苦难，被塑造成对这一威胁的回应。\n\n本文将文本与象征层面的阅读同杰克·齐普斯的批评相结合，尤其关注故事的道德与文化功能，以及它遮蔽或再生产父权规范的能力。"],"en":["Incest, a central yet frequently obscured motif in tales said to be “for children”, appears in <em>Donkeyskin</em>, <em>Allerleirauh</em>, and <em>Mouse-Skin</em> in diverse narrative forms, oscillating between poetic euphemism and brutal exposure. This third part examines how the prohibition is articulated, deflected, or condemned, and how the feminine is configured through virtue, beauty, or suffering in response to this threat.\n\nBringing textual and symbolic readings into dialogue with Jack Zipes’s critical work, the analysis pays particular attention to the tale’s moral and cultural function and its capacity to conceal or reproduce patriarchal norms."]}},{"title":{"fr":"1. La formulation du tabou : entre euphémisation, condamnation et rachat","zh":"1. 禁忌的表述：委婉、谴责与救赎","en":"1. Formulating the Taboo: Euphemism, Condemnation, and Redemption"},"paragraphs":{"fr":["Dans <em>Peau d’Âne</em>, Perrault transforme un motif transgressif — le désir incestueux du père — en un conte moralement acceptable, en le travestissant sous une forme poétique et euphémisée. Le langage raffiné, les métaphores célestes et l’intervention de la marraine servent à détourner la violence symbolique en épreuve morale. Cette stratégie n’implique pas une remise en cause du pouvoir patriarcal, mais bien une tentative de le reconfigurer dans un cadre symboliquement admissible aux yeux de la noblesse française.\n\nJack Zipes interprète cette narration comme une modalité du <em>civilizing process</em><sup><a href=\"#conte-note-18-fr\" id=\"conte-ref-18-fr\">18</a></sup> : le conte sert à inculquer aux jeunes filles de la bourgeoisie et de l’aristocratie des comportements de patience, de soumission et de vertu, même face à l’abus. La fuite de la princesse n’est pas une révolte, mais une épreuve à traverser. Sa vertu est testée, puis récompensée par une réintégration dans l’ordre symbolique du mariage. La figure du roi n’est pas abolie, elle est déplacée et réincarnée dans celle du prince, garant d’une autorité patriarcale « purifiée ».\n\nZipes souligne que le conte ne dénonce pas, mais régule le patriarcat : « le roi est remplacé par un autre roi, plus jeune et désiré, mais toujours détenteur de l’autorité légitime ». Ainsi, le tabou est déplacé, non dissous : il est transformé en structure initiatique au service de la reconduction de l’ordre social.\n\nLe traitement du père à la fin du récit accentue encore cette divergence : chez Perrault, le roi transgresseur réapparaît dans toute sa majesté. Le texte loue explicitement sa capacité de rédemption morale — il aurait « purifié les feux » de son âme et transformé le désir en amour paternel —, et le prince est ravi de devenir le gendre d’un roi aussi puissant. Cette réhabilitation finale, soutenue par des vers emphatiques et solennels, tend à restaurer l’ordre monarchique par la magnanimité paternelle.\n\nEn revanche, les Grimm évitent toute refiguration du père : <em>Allerleirauh</em> se clôt sur le mariage sans que le roi ne soit plus jamais mentionné. L’histoire semble ainsi refuser d’achever la trajectoire du père transgresseur, comme si le récit s’interrompait volontairement pour éviter la question de sa légitimité future.\n\nCes deux modèles narratifs révèlent des conceptions opposées du cadre familial et royal : chez Perrault, l’autorité paternelle est d’abord magnifiée avant d’être présentée comme vacillante ou dangereuse — non pas nécessairement corrompue, mais exposée à une dérive passionnelle qui, dans le contexte du deuil, devient source de trouble —, puis réhabilitée ; chez les Grimm, elle est directement problématisée puis exclue de la résolution. L’un met en scène une chute suivie d’un rachat, l’autre un danger initial suivi d’un silence. Ces différences rejoignent aussi les logiques de construction du recueil : Perrault organise ses contes selon une stratégie littéraire et morale réfléchie, tandis que les Grimm cherchent à restituer une mémoire populaire, fragmentaire mais vive."],"zh":["在《驴皮》中，佩罗把一个越界的母题——父亲的乱伦欲望——转换为在道德上可以被接受的故事，将其装扮为诗性而委婉的形式。精致的语言、天体隐喻及教母的介入，把象征暴力转化为道德考验。这一策略并不意味着质疑父权权力，而是试图将它重新配置到法国贵族在象征层面能够接受的框架中。\n\n杰克·齐普斯将这种叙事解释为“文明化进程”（<em>civilizing process</em>）的一种方式：<sup><a href=\"#conte-note-18-zh\" id=\"conte-ref-18-zh\">18</a></sup> 故事向资产阶级与贵族少女灌输耐心、服从与德性的行为规范，即使面对侵害，也要求她们如此。公主的逃离不是反叛，而是必须经历的考验。她的德性受到检验，随后通过重新进入婚姻的象征秩序而得到奖赏。国王这一权力形象没有被废除，而是在王子身上被转移、重新体现，成为一种“净化”后的父权权威的保证。\n\n齐普斯强调，故事并不揭露父权制，而是对它加以调节：“国王被另一位国王替代，后者更年轻，也为人所爱，却依然掌握着合法权威。”因此，禁忌被转移，而非消解：它被转换为一种成长试炼的结构，服务于社会秩序的延续。\n\n结尾对父亲的处理进一步凸显了这种差异。在佩罗笔下，越界的国王再度出现，依然威仪完整。文本明确颂扬他实现道德救赎的能力：他据说已“净化心灵的火焰”，将欲望转化为父爱；王子则欣喜于能够成为如此强大的一位国王的女婿。这种由庄严、夸饰的诗句支撑的最终平反，倾向于通过父亲的宽宏形象来恢复君主制秩序。\n\n格林兄弟则回避了父亲的再次显现：《千皮兽》以婚姻作结，此后不再提及那位国王。故事似乎拒绝完成越界父亲的生命轨迹，仿佛有意在此中断，以避开他此后是否仍具合法性的问题。\n\n这两种叙事模式揭示出相互对立的家庭与王权观念。在佩罗笔下，父权首先被颂扬，随后被呈现为动摇或危险的力量——它未必本质腐败，却可能陷入激情的偏离，并在丧偶的语境下成为失序的根源——最后又得到恢复；格林兄弟则直接将父权问题化，继而将它排除在结局之外。一个呈现堕落与救赎，另一个呈现最初的危险与随后的沉默。这些差异也呼应了故事集的建构逻辑：佩罗依据经过构思的文学与道德策略组织故事，而格林兄弟则试图恢复一种虽零散却鲜活的民间记忆。"],"en":["In <em>Donkeyskin</em>, Perrault transforms a transgressive motif—the father’s incestuous desire—into a morally acceptable tale by dressing it in poetic and euphemistic form. Refined language, celestial metaphors, and the godmother’s intervention deflect symbolic violence into a moral ordeal. This strategy does not challenge patriarchal power; rather, it attempts to reconfigure that power within a framework symbolically admissible to the French nobility.\n\nJack Zipes interprets this narration as a modality of the <em>civilizing process</em>:<sup><a href=\"#conte-note-18-en\" id=\"conte-ref-18-en\">18</a></sup> the tale inculcates patience, submission, and virtue in bourgeois and aristocratic girls, even in the face of abuse. The princess’s flight is not a revolt but an ordeal to be endured. Her virtue is tested, then rewarded through reintegration into the symbolic order of marriage. The figure of the king is not abolished but displaced and reincarnated in the prince, who guarantees a “purified” patriarchal authority.\n\nZipes stresses that the tale does not denounce patriarchy but regulates it: “the king is replaced by another king, younger and desired, yet still the holder of legitimate authority.” The taboo is thus displaced rather than dissolved: it is transformed into an initiatory structure that serves to perpetuate the social order.\n\nThe treatment of the father at the end of the tale further accentuates this divergence. In Perrault, the transgressive king reappears in all his majesty. The text explicitly praises his capacity for moral redemption: he is said to have “purified the fires” of his soul and transformed desire into paternal love, while the prince rejoices at becoming the son-in-law of so powerful a king. Supported by emphatic, solemn verse, this final rehabilitation tends to restore monarchical order through paternal magnanimity.\n\nThe Grimms, by contrast, avoid bringing the father back into view: <em>Allerleirauh</em> closes with the marriage, and the king is never mentioned again. The story seems to refuse to complete the transgressive father’s trajectory, as though deliberately breaking off to avoid the question of his future legitimacy.\n\nThese two narrative models reveal opposing conceptions of the familial and royal framework. In Perrault, paternal authority is first magnified, then presented as unstable or dangerous—not necessarily corrupt, but vulnerable to a deviation of passion that becomes a source of disturbance in the context of bereavement—and finally rehabilitated. In the Grimms, it is directly problematised and then excluded from the resolution. One stages a fall followed by redemption; the other, an initial danger followed by silence. These differences also correspond to the logic of constructing a collection: Perrault organises his tales according to a considered literary and moral strategy, while the Grimms seek to restore a popular memory that is fragmentary yet vivid."]}},{"title":{"fr":"2. Beauté, vertu, lumière : les visages féminins du conte","zh":"2. 美、德性与光：故事中的女性面貌","en":"2. Beauty, Virtue, and Light: The Feminine Faces of the Tale"},"paragraphs":{"fr":["Dans les trois versions étudiées, la figure de la jeune fille incarne un modèle féminin distinct, reflétant les idéaux sociaux et esthétiques propres à chaque culture d’origine. Chez Perrault, la princesse est décrite comme douce, sage, d’une beauté éthérée. Elle incarne la perfection morale et physique : non seulement belle, mais aussi mesurée, humble et obéissante. Ce profil correspond parfaitement à l’idéal féminin promu à la cour de Louis XIV, où la vertu se conjugue au silence et à la retenue.\n\nLoin d’encourager une quelconque émancipation, le conte trace un parcours de conformité : la fuite n’est pas rébellion, mais purification ; le silence n’est pas effacement, mais mérite moral ; la récompense n’est pas l’autonomie, mais le mariage. Le passage de la fille du roi à l’épouse du roi ne rompt pas avec l’autorité masculine, mais en change simplement le détenteur. Comme le résume Jack Zipes dans sa lecture socio-historique, ces récits servent à codifier les comportements attendus des jeunes filles dans une société patriarcale, en leur enseignant moins ce qu’elles doivent faire que ce qu’elles doivent être.\n\nChez les Grimm, le modèle féminin se nuance sans pour autant se libérer. La princesse d’Allerleirauh, bien qu’active dans sa fuite et créative dans son déguisement, reste valorisée pour sa pudeur, sa patience et son éclat physique. La chevelure d’or, les robes de lumière, le silence appliqué dans la cuisine réactivent les traits d’une féminité idéalisée, désormais privée de médiation surnaturelle mais toujours enchâssée dans un cadre moral conservateur.\n\nDans Peau-de-souris, cette tension est portée à son comble : travestie en valet, la jeune fille est reconnue non par ses actes ou ses mots, mais par les signes visibles de sa féminité — la finesse d’une bague, la beauté de ses cheveux. La révélation n’est pas une affirmation, mais un retour à l’ordre établi.\n\nCes figures convergent ainsi vers un même archétype : celui de l’héroïne silencieuse et lumineuse, valorisée pour sa discrétion autant que pour son éclat. Sous des formes variées, les trois contes participent d’un même projet narratif : inscrire la vertu féminine dans un cadre de légitimation patriarcale, où la reconnaissance sociale et affective passe par la conformité à des normes de genre intériorisées<sup><a href=\"#conte-note-19-fr\" id=\"conte-ref-19-fr\">19</a></sup>."],"zh":["在本文研究的三个版本中，少女形象分别体现不同的女性典范，映照出各自文化的社会与审美理想。在佩罗笔下，公主温柔、聪慧，具有超凡脱俗的美。她体现道德与身体的双重完美：不仅美丽，而且有分寸、谦逊、顺从。这一形象完全符合路易十四宫廷所提倡的女性理想，在其中，德性与沉默、克制相结合。\n\n故事远非鼓励任何形式的解放，而是勾勒出一条遵从规范的道路：逃离不是反叛，而是净化；沉默不是自我消失，而是道德功绩；奖赏不是自主，而是婚姻。从国王之女到国王之妻，并没有切断与男性权威的关系，只是更换了这一权威的持有者。正如杰克·齐普斯的社会历史解读所概括的，这些叙事将父权社会对少女的行为期待加以编码，教导她们的，与其说是应当做什么，不如说是应当成为什么。\n\n格林兄弟笔下的女性典范有所变化，却并未因此获得解放。《千皮兽》的公主虽在逃离中积极主动，在伪装中富有创造力，但她仍因羞怯、耐心与身体的光彩而受到褒扬。金色长发、光辉礼服，以及在厨房中恪守的沉默，再次激活了理想化女性气质的特征。这种女性气质虽然失去了超自然中介，却始终被嵌入保守的道德框架。\n\n在《鼠皮公主》中，这种张力达到顶点：少女装扮成男仆，她的身份得到辨认，所凭借的不是她的行动或言语，而是女性气质的可见标记——戒指的精巧、头发的美丽。揭示并非自我确立，而是回归既有秩序。\n\n这些形象由此汇聚为同一原型：沉默而光芒四射的女主人公，她既因低调克制而受到赞许，也因耀眼的美而得到认可。三个故事虽形式各异，却参与同一个叙事计划：将女性德性纳入父权合法化的框架，使社会与情感上的承认，都以顺应内化的性别规范为前提。<sup><a href=\"#conte-note-19-zh\" id=\"conte-ref-19-zh\">19</a></sup>"],"en":["In the three versions examined here, the young woman embodies a distinct feminine model, reflecting the social and aesthetic ideals of each culture of origin. In Perrault, the princess is gentle, wise, and ethereally beautiful. She represents moral and physical perfection: not only beautiful, but also measured, humble, and obedient. This profile corresponds precisely to the feminine ideal promoted at the court of Louis XIV, where virtue is joined to silence and restraint.\n\nFar from encouraging emancipation of any kind, the tale traces a trajectory of conformity: flight is not rebellion but purification; silence is not effacement but moral merit; the reward is not autonomy but marriage. The passage from a king’s daughter to a king’s wife does not break with male authority but merely changes its holder. As Jack Zipes’s sociohistorical reading summarises, these narratives codify the behaviour expected of girls in a patriarchal society, teaching them less what they should do than what they should be.\n\nIn the Grimms, the feminine model becomes more nuanced without becoming liberated. Although the princess of <em>Allerleirauh</em> is active in her escape and inventive in her disguise, she remains valued for modesty, patience, and physical radiance. Golden hair, luminous dresses, and diligent silence in the kitchen reactivate the traits of an idealised femininity, now deprived of supernatural mediation yet still embedded in a conservative moral framework.\n\nIn <em>Mouse-Skin</em>, this tension reaches its height: disguised as a male servant, the girl is recognised not through her actions or words but through visible signs of femininity—the delicacy of a ring and the beauty of her hair. Revelation is not an act of self-assertion but a return to the established order.\n\nThese figures thus converge on a single archetype: the silent, luminous heroine, valued as much for her discretion as for her radiance. In varying forms, the three tales participate in the same narrative project: to inscribe feminine virtue within a framework of patriarchal legitimation, in which social and emotional recognition depend on conformity to internalised gender norms.<sup><a href=\"#conte-note-19-en\" id=\"conte-ref-19-en\">19</a></sup>"]}}]},{"id":"conte-conclusion","title":{"fr":"Conclusion","zh":"结论","en":"Conclusion"},"units":[{"title":{"fr":"Conclusion","zh":"结论","en":"Conclusion"},"paragraphs":{"fr":["À travers l’étude comparée de Peau d’Âne, Allerleirauh et Peau-de-souris, ce travail a mis en évidence la richesse intertextuelle et la plasticité narrative d’un conte qui traverse les siècles en s’adaptant aux cadres culturels, esthétiques et moraux de ses relecteurs. D’un récit poétique et codifié chez Perrault à une narration brute et symboliquement plus directe chez les Grimm, chaque version réécrit non seulement une histoire, mais une vision du monde — de la place du père à celle de la fille, de la faute à la vertu, du silence à la reconnaissance.\n\nLe déguisement, les objets, la voix narrative ou la figure paternelle n’y sont jamais neutres : ils agencent une esthétique du secret et de la vérité différée, souvent au service d’une réintégration dans un ordre social réaffirmé. Comme le souligne Jack Zipes, ces contes, loin d’être de simples divertissements, participent à une régulation des rôles sociaux genrés, où la souffrance discrète, la beauté codifiée et la soumission deviennent les voies obligées de l’héroïsme féminin. En cela, Peau d’Âne et ses réécritures illustrent toute la complexité des contes dits « pour enfants » : à la fois instruments de rêve et de norme, récits d’émancipation et d’assignation."],"zh":["通过对《驴皮》《千皮兽》及《鼠皮公主》的比较研究，本文呈现出一种跨越数百年的故事所具有的丰富互文性与叙事可塑性：它不断适应重新阅读它的人所处的文化、审美与道德框架。从佩罗笔下诗性而程式化的叙事，到格林兄弟笔下粗粝、在象征表达上更为直接的叙述，每个版本改写的不仅是故事，也是世界观——从父亲的位置到女儿的位置，从过错到德性，从沉默到承认。\n\n其中的伪装、物件、叙述声音与父亲形象从来都不是中性的：它们组织起关于秘密与延宕真相的美学，并且往往服务于主人公重新进入一个得到再次确认的社会秩序。正如杰克·齐普斯所强调的，这些故事远非单纯的消遣，而参与了对性别化社会角色的规训；隐忍的苦难、被规范的美与服从，由此成为女性英雄主义的必经之路。在这一意义上，《驴皮》及其改写体现出所谓“儿童故事”的全部复杂性：它们既生产梦，也生产规范；既讲述解放，也规定位置。"],"en":["Through a comparative study of <em>Donkeyskin</em>, <em>Allerleirauh</em>, and <em>Mouse-Skin</em>, this work has brought out the intertextual richness and narrative plasticity of a tale that crosses the centuries by adapting to the cultural, aesthetic, and moral frameworks of those who reread it. From Perrault’s poetic, codified narrative to the Grimms’ rawer and symbolically more direct narration, each version rewrites not only a story but a vision of the world—from the place of the father to that of the daughter, from wrongdoing to virtue, from silence to recognition.\n\nDisguise, objects, narrative voice, and the paternal figure are never neutral: they organise an aesthetic of secrecy and deferred truth, often in the service of reintegration into a reaffirmed social order. As Jack Zipes stresses, these tales are far more than simple entertainment. They participate in regulating gendered social roles, making discreet suffering, codified beauty, and submission the obligatory paths of female heroism. In this respect, <em>Donkeyskin</em> and its rewritings illustrate the full complexity of tales said to be “for children”: instruments of both dreaming and norm-making, narratives of both emancipation and prescribed roles."]}}]},{"id":"conte-notes","title":{"fr":"Notes","zh":"注释","en":"Notes"},"units":[{"title":{"fr":"Notes","zh":"注释","en":"Notes"},"paragraphs":{"fr":["<p id=\"conte-note-1-fr\"><strong>1.</strong> Grimm, Jacob (1785–1863) et Wilhelm Grimm (1786–1859). Contes pour les enfants et la maison. Éd. et trad. Natacha Rimasson-Fertin. Paris : Éditions Corti, coll. « Merveilleux », 2017. Les illustrations insérées dans le corps du texte proviennent du Musée des Frères Grimm à Kassel (Brüder Grimm-Museum Kassel). pp. 384-391(khm 65). <a href=\"#conte-ref-1-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-2-fr\"><strong>2.</strong> Fait d’après les sources suivantes: Rimasson-Fertin, éd. 2017, pp. 984-986. Rölleke 1, p. 471, p. 529, pp. 45-46. <a href=\"#conte-ref-2-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-3-fr\"><strong>3.</strong> Heidmann, Ute (1957– ) et Jean-Michel Adam (1947– ). Textualité et intertextualité des contes Perrault, Apulée, la Fontaine, Lhéritier…sous la dir. Delphine Denis et Christian Biet. Paris : Éditions Classiques Garnier, 2010. p.177, p.211. <a href=\"#conte-ref-3-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-4-fr\"><strong>4.</strong> Ibid. p.42, p.52. <a href=\"#conte-ref-4-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-5-fr\"><strong>5.</strong> Ibid. p. 42. <a href=\"#conte-ref-5-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-6-fr\"><strong>6.</strong> Ibid. p.252 et p.266 sur les connecteurs. <a href=\"#conte-ref-6-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-7-fr\"><strong>7.</strong> Perrault, Charles (1628-1703). « Peau d’asne Conte à Madame la marquise de l…», in: Grisélidis, nouvelle. Avec le conte de Peau d’Âne et celui des Souhaits ridicules. Seconde édition. Paris : Veuve de Jean-Baptiste Coignard et Jean-Baptiste Coignard fils, Imprimeurs du Roi, 1694.p.110 (marqué comme p.26.) <a href=\"#conte-ref-7-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-8-fr\"><strong>8.</strong> Ibid. pp. 87-88. (marqué comme pp. 3 A ij-4). <a href=\"#conte-ref-8-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-9-fr\"><strong>9.</strong> Ibid. pp. 94-95. (marqué comme pp. 10-11). <a href=\"#conte-ref-9-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-10-fr\"><strong>10.</strong> Ibid. pp. 110-111. (marqué comme pp. 26-27). <a href=\"#conte-ref-10-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-11-fr\"><strong>11.</strong> Heidmann, Ute (1957– ) et Jean-Michel Adam (1947– ). Textualité et intertextualité des contes Perrault, Apulée, la Fontaine, Lhéritier…sous la dir. Delphine Denis et Christian Biet. Paris : Éditions Classiques Garnier, 2010. p. 52. <a href=\"#conte-ref-11-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-12-fr\"><strong>12.</strong> Ibid. p. 52. <a href=\"#conte-ref-12-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-13-fr\"><strong>13.</strong> Charles Perrault, <em>Peau d’Âne</em>, dans <em>Histoires ou contes du temps passé</em>, 1694. Voir aussi : <em>Textualité et intertextualité des contes</em>, Paris, Champion, 2007, p. 42. <a href=\"#conte-ref-13-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-14-fr\"><strong>14.</strong> <em>Textualité et intertextualité des contes</em>, op. cit., p. 42 : « un rythme génésique structurant l’ancrage symbolique du récit ». <a href=\"#conte-ref-14-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-15-fr\"><strong>15.</strong> Ibid., p. 43 ; Zipes, <em>Subversion</em>, p. 45 : sur la narration populaire courte et la lisibilité immédiate du bien et du mal dans les <em>Kinder- und Hausmärchen</em>. <a href=\"#conte-ref-15-fr\" aria-label=\"Retour au texte\">↩</a></p>\n\n<p id=\"conte-note-16-fr\"><strong>16.</strong> Heinz Rölleke, cité dans <em>Textualité</em>, p. 46, sur l’absence de médiation surnaturelle dans les versions populaires du conte. <a href=\"#conte-ref-16-fr\" aria-label=\ ittérature pour la jeunesse</em>. Paris : Petite Bibliothèque Payot, 1986.\n\nHeidmann, Ute (1957– ) et Jean-Michel Adam (1947– ). <em>Textualité et intertextualité des contes Perrault, Apulée, la Fontaine, Lhéritier…</em>sous la dir. Delphine Denis et Christian Biet. Paris : Éditions Classiques Garnier, 2010. pp. 41-79, 107-108, 107-272, 317, 337, 367."],"zh":["Perrault, Charles（1628—1703）。〈Peau d’asne Conte à Madame la marquise de l…〉，载 <em>Grisélidis, nouvelle. Avec le conte de Peau d’Âne et celui des Souhaits ridicules</em>。第2版。巴黎：Veuve de Jean-Baptiste Coignard et Jean-Baptiste Coignard fils，王室印刷商，1694年，第71—106页（书内标页为第1—36页）。\n\nGrimm, Jacob（1785—1863）与 Wilhelm Grimm（1786—1859）。<em>Contes pour les enfants et la maison</em>。Natacha Rimasson-Fertin 编译。巴黎：Éditions Corti，“Merveilleux”丛书，2017年。正文插图来源：卡塞尔格林兄弟博物馆（Brüder Grimm-Museum Kassel）。第9—11页（译者说明）、第384—391页（KHM 65）、第836—847页（KHM 179）、第186—193页（KHM 31）、第944—946页（KL 4）、第984—985页（KL 12，《鼠皮公主》）。\n\nRölleke, Heinz（1936—2023）。<em>Grimms Märchen und ihre Quellen: die literarischen Vorlagen der Grimmschen Märchen synoptisch vorgestellt und kommentiert</em>。“Schriftenreihe Literaturwissenschaft”丛书第35卷，Wissenschaftlicher Verlag Trier，1998年，第170—183页、第354—389页、第471页、第551—586页。（原稿附法文题名：<em>Les contes des Grimm et leurs sources : les modèles littéraires des contes des Grimm présentés de manière synoptique et commentés</em>，“Collection d’études littéraires”第35卷，Wissenschaftlicher Verlag Trier，1998年；该法文表述之后另列第45—48页、第170—183页、第354—389页、第471页、第529页、第551—586页。）\n\nZipes, Jack（1937—）。<em>Fairy Tales and the Art of Subversion</em>。伦敦：Wildman Press，1983年，第13—70页。François Ruy-Vidal（1931—）法译本：<em>Les contes de fées et l’art de la subversion. Étude de la civilisation des mœurs à travers un genre classique : la littérature pour la jeunesse</em>。巴黎：Petite Bibliothèque Payot，1986年。\n\nHeidmann, Ute（1957—）与 Jean-Michel Adam（1947—）。<em>Textualité et intertextualité des contes Perrault, Apulée, la Fontaine, Lhéritier…</em>。原稿注明由 Delphine Denis 与 Christian Biet 主持。巴黎：Éditions Classiques Garnier，2010年，第41—79页、第107—108页、第107—272页、第317页、第337页、第367页。"],"en":["Perrault, Charles (1628–1703). “Peau d’asne Conte à Madame la marquise de l…”, in <em>Grisélidis, nouvelle. Avec le conte de Peau d’Âne et celui des Souhaits ridicules</em>. 2nd ed. Paris: Veuve de Jean-Baptiste Coignard et Jean-Baptiste Coignard fils, royal printers, 1694, pp. 71–106 (numbered pp. 1–36 in the book).\n\nGrimm, Jacob (1785–1863), and Wilhelm Grimm (1786–1859). <em>Contes pour les enfants et la maison</em>. Edited and translated by Natacha Rimasson-Fertin. Paris: Éditions Corti, “Merveilleux” series, 2017. Illustrations in the text are from the Brothers Grimm Museum in Kassel (Brüder Grimm-Museum Kassel). Pp. 9–11 (translator’s note), 384–391 (KHM 65), 836–847 (KHM 179), 186–193 (KHM 31), 944–946 (KL 4), and 984–985 (KL 12, <em>Princess Mouse-Skin</em>).\n\nRölleke, Heinz (1936–2023). <em>Grimms Märchen und ihre Quellen: die literarischen Vorlagen der Grimmschen Märchen synoptisch vorgestellt und kommentiert</em>. Schriftenreihe Literaturwissenschaft, vol. 35. Wissenschaftlicher Verlag Trier, 1998, pp. 170–183, 354–389, 471, and 551–586. (The manuscript also supplies a French rendering: <em>Les contes des Grimm et leurs sources : les modèles littéraires des contes des Grimm présentés de manière synoptique et commentés</em>, Collection d’études littéraires, vol. 35, Wissenschaftlicher Verlag Trier, 1998, followed by pp. 45–48, 170–183, 354–389, 471, 529, and 551–586.)\n\nZipes, Jack (1937–). <em>Fairy Tales and the Art of Subversion</em>. London: Wildman Press, 1983, pp. 13–70. French translation by François Ruy-Vidal (1931–): <em>Les contes de fées et l’art de la subversion. Étude de la civilisation des mœurs à travers un genre classique : la littérature pour la jeunesse</em>. Paris: Petite Bibliothèque Payot, 1986.\n\nHeidmann, Ute (1957–), and Jean-Michel Adam (1947–). <em>Textualité et intertextualité des contes Perrault, Apulée, la
