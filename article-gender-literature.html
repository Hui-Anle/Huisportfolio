rfect.”</em><sup id=\"fnref-en-25-1\"><a href=\"#fn-25\" role=\"doc-noteref\" aria-label=\"Note 25\">25</a></sup>","> <em>“And sing at morning and at night</em>  \n> <em>Scratch yourself if you feel the itch</em>  \n> <em>Love white or love black</em>  \n> <em>It is much more fun when things change</em>  \n> <em>You only have to notice.”</em><sup id=\"fnref-en-26-1\"><a href=\"#fn-26\" role=\"doc-noteref\" aria-label=\"Note 26\">26</a></sup>"]},"media":[{"src":"videos/wannabelovedbyu.mp4","original":true,"credit":null}],"mediaKey":"conclusion"}],"id":"sec-6"},{"title":{"zh":"注释","fr":"Notes","en":"Notes"},"units":[{"title":{"zh":"注释","fr":"Notes","en":"Notes"},"paragraphs":{"fr":["<a id=\"fn-1\"></a>","**1.** Apollinaire, <em>Les Mamelles de Tirésias</em>, préface ; Bibliothèque nationale de France, notice FRBNF12516728. Rédaction : 1903 ; prologue et dernière scène de l’acte II : 1916. Création : 24 juin 1917 ; publication : Paris, Éditions SIC, 1918.","<a href=\"#fnref-fr-1-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR\">↩ FR</a> · <a href=\"#fnref-zh-1-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文\">↩ 中文</a> · <a href=\"#fnref-en-1-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN\">↩ EN</a>","<a id=\"fn-2\"></a>","**2.** Apollinaire, <em>Les Mamelles de Tirésias</em>, Paris, Éditions SIC, 1918, préface, p. 14.","<a href=\"#fnref-fr-2-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR\">↩ FR</a> · <a href=\"#fnref-zh-2-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文\">↩ 中文</a> · <a href=\"#fnref-en-2-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN\">↩ EN</a>","<a id=\"fn-3\"></a>","**3.** Apollinaire, chronique dans <em>Le Droit des femmes</em>, mai 1905.","<a href=\"#fnref-fr-3-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR\">↩ FR</a> · <a href=\"#fnref-zh-3-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文\">↩ 中文</a> · <a href=\"#fnref-en-3-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN\">↩ EN</a>","<a id=\"fn-4\"></a>","**4.** Apollinaire, <em>Le Mercure de France</em>, 1917. « La femme et la guerre », publié dans <em>Le Matin</em> en 1916.","<a href=\"#fnref-fr-4-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR\">↩ FR</a> · <a href=\"#fnref-zh-4-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文\">↩ 中文</a> · <a href=\"#fnref-en-4-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN\">↩ EN</a>","<a id=\"fn-5\"></a>","**5.** Billy Wilder, <em>Some Like It Hot</em>, 1959. Voir aussi l’<a href=\"https://catalog.afi.com/Film/53017-SOME-LIKEITHOT\">American Film Institute, notice du film</a>, rubriques Synopsis, History et Credits.","<a href=\"#fnref-fr-5-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR 1\">↩ FR 1</a> · <a href=\"#fnref-zh-5-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文 1\">↩ 中文 1</a> · <a href=\"#fnref-en-5-1\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN 1\">↩ EN 1</a> · <a href=\"#fnref-fr-5-2\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR 2\">↩ FR 2</a> · <a href=\"#fnref-zh-5-2\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文 2\">↩ 中文 2</a> · <a href=\"#fnref-en-5-2\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN 2\">↩ EN 2</a> · <a href=\"#fnref-fr-5-3\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR 3\">↩ FR 3</a> · <a href=\"#fnref-zh-5-3\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文 3\">↩ 中文 3</a> · <a href=\"#fnref-en-5-3\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN 3\">↩ EN 3</a> · <a href=\"#fnref-fr-5-4\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: FR 4\">↩ FR 4</a> · <a href=\"#fnref-zh-5-4\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: 中文 4\">↩ 中文 4</a> · <a href=\"#fnref-en-5-4\" role=\"doc-backlink\" aria-label=\"Retour / 返回 / Return: EN 4\">↩ EN 4</a>","< iversity of Chicago Press, 1987.","Les traductions chinoise et anglaise suivent le texte français. Les traductions des citations dramatiques et des articles d’Apollinaire sont préparées pour cette étude ; elles ne sont pas empruntées à une édition publiée. Les citations anglaises du film sont conservées dans leur langue lorsque l’analyse porte sur leur formulation."],"zh":["**主要研究对象**","- Apollinaire, Guillaume. Les Mamelles de Tirésias : drame surréaliste en deux actes et un prologue. Germaine Albert-Birot配乐，Serge Férat绘图。巴黎：SIC出版社，1918年。[法国国家图书馆作品记录](https://catalogue.bnf.fr/ark:/12148/cb125167288)。[本轮修订核对使用的原文转录](https://fr.wikisource.org/wiki/Les_Mamelles_de_Tir%C3%A9sias)。 [SIC版扫描本](https://monoskop.org/images/a/a0/Apollinaire_Guillaume_Les_mamelles_de_Tiresias_1918.pdf).\n- Wilder, Billy，导演。Some Like It Hot（《热情似火》）。Billy Wilder与I. A. L. Diamond编剧。美国，1959年。电影。[美国电影学会的影片记录、剧情梗概与相关档案](https://catalog.afi.com/Film/53017-SOME-LIKEITHOT)。 [电影剧本](https://www.public.asu.edu/~srbeatty/394/SomeLikeItHot.pdf).","**研究与理论文献**","- Butler, Judith. Gender Trouble: Feminism and the Subversion of Identity. New York: Routledge, 1990.\n- Garber, Marjorie. Vested Interests: Cross-Dressing and Cultural Anxiety. New York: Routledge, 1992.\n- Haskell, Molly. From Reverence to Rape: The Treatment of Women in the Movies. Chicago: University of Chicago Press, 1987.","中文与英文译稿以法文为准。戏剧引文及阿波利奈尔文章引文的中英文译文为本稿所译，并非取自已出版译本。分析涉及电影台词措辞时，保留英文原句。"],"en":["**Primary corpus**","- Apollinaire, Guillaume. Les Mamelles de Tirésias: drame surréaliste en deux actes et un prologue. Music by Germaine Albert-Birot; drawings by Serge Férat. Paris: Éditions SIC, 1918. [BnF catalogue record](https://catalogue.bnf.fr/ark:/12148/cb125167288). [Textual transcription consulted during revision](https://fr.wikisource.org/wiki/Les_Mamelles_de_Tir%C3%A9sias). [Facsimile of the SIC edition](https://monoskop.org/images/a/a0/Apollinaire_Guillaume_Les_mamelles_de_Tiresias_1918.pdf).\n- Wilder, Billy, director. Some Like It Hot. Screenplay by Billy Wilder and I. A. L. Diamond. United States, 1959. Film. [American Film Institute record, synopsis and historical documentation](https://catalog.afi.com/Film/53017-SOME-LIKEITHOT). [Screenplay](https://www.public.asu.edu/~srbeatty/394/SomeLikeItHot.pdf).","**Critical and Theoretical Studies**","- Butler, Judith. Gender Trouble: Feminism and the Subversion of Identity. New York: Routledge, 1990.\n- Garber, Marjorie. Vested Interests: Cross-Dressing and Cultural Anxiety. New York: Routledge, 1992.\n- Haskell, Molly. From Reverence to Rape: The Treatment of Women in the Movies. Chicago: University of Chicago Press, 1987.","The Chinese and English translations follow the French text. Translations of quotations from the play and Apollinaire’s articles have been prepared for this study rather than taken from a published translation. The film’s English dialogue is retained where its wording is the object of analysis."]},"media":[]}],"id":"sec-8"}],"cover":"images/thesis/wenxue.jpg"};

how the shifts between leading and following. Retain the details of the flower placed on the head and the cloth wrapped around the waist."},"items":[{"src":"images/thesis/joejerry.jpg","original":true,"credit":null},{"src":"images/thesis/danseend.jpg","original":true,"credit":null}],"has_replacement":false},"III.1":{"selection_note":{"fr":"Deux photogrammes correspondants montrant l’évolution de l’interaction entre Joe et Jerry dans la scène de la baignoire ; la légende doit décrire leurs positions, leurs postures et leurs vêtements, sans affirmer directement que « les hommes sont plus forts ».","zh":"浴缸场景中Joe与Jerry互动前后的对应画面；图注应描述站位、姿态与衣着，不直接写“男性更强”。","en":"Two corresponding stills showing changes in Joe and Jerry’s interaction in the bathtub scene; the caption should describe their positions, postures and clothing rather than directly state that “men are stronger”."},"items":[{"src":"images/thesis/opera.jpg","original":true,"credit":null},{"src":"images/thesis/les_mamelles_de_tiresias_6751web.jpg","original":true,"credit":null}],"has_replacement":false},"III.2":{"selection_note":{"fr":"Deux possibilités : 1. un photogramme réunissant Sugar et Daphné sur la plage ; 2. des images mettant en regard l’ukulélé et la contrebasse. Pour la seconde possibilité, conserver dans la légende le statut d’hypothèse interprétative de cette comparaison visuelle, sans la présenter comme une intention avérée du réalisateur.","zh":"可选其一：①Sugar与Daphné在海滩的同框画面；②尤克里里与低音提琴的对照画面。第二组图注保留“视觉比较的解释性假说”，不标为已证实的导演意图。","en":"Two options: 1. a still showing Sugar and Daphne together on the beach; 2. images comparing the ukulele and the double bass. For the second option, retain the visual comparison’s status as an interpretative hypothesis in the caption, rather than presenting it as the director’s established intention."},"items":[{"src":"images/thesis/trainspectacle.jpg","original":true,"credit":null},{"src":"images/thesis/instruments.jpg","original":true,"credit":null}],"has_replacement":false}, function mdBlock(raw){const lines=raw.trim().split(/\n/);if(lines.every(x=>/^\s*>/.test(x))){return '<blockquote>'+lines.map(x=>inline(x.replace(/^\s*>\s?/,''))).join('<br>')+'</blockquote>';}if(lines.every(x=>/^\s*-\s+/.test(x))){return '<ul>'+lines.map(x=>'<li>'+inline(x.replace(/^\s*-\s+/,''))+'</li>').join('')+'</ul>';}if(/^---+$/.test(raw.trim()))return '';return '<p>'+inline(lines.join('<br>'))+'</p>';}

</script></body></html>
