<script>
const ARTICLE_DATA={"hero":{"title":{"fr":"Travestissement, identité et identification de genre dans Les Mamelles de Tirésias et Some Like It Hot","zh":"《蒂蕾茜亚的乳房》与《热情似火》中的异装、性别认同与性别识别","en":"Cross-Dressing, Gender Identity and Gender Attribution in Les Mamelles de Tirésias and Some Like It Hot"},"subtitle":{"fr":"Travestissement, identités de genre et expérimentations artistiques","zh":"异装、性别认同与艺术实验","en":"Cross-Dressing, Gender Identities and Artistic Experimentation"},"media":[{"src":"images/thesis/Tiresias.jpg","original":true,"credit":null},{"src":"images/thesis/somethinglikeithot.jpg","original":true,"credit":null}]},"sections":[{"title":{"zh":"引言","fr":"Introduction","en":"Introduction"},"units":[{"title":{"zh":"引言","fr":"Introduction","en":"Introduction"},"paragraphs":{"fr":["Le vêtement constitue une forme d’expression et de communication culturelle non verbale. Il contribue à la manière dont les individus sont perçus : statut social, profession et genre peuvent être interprétés à partir de signes vestimentaires. Ces signes reflètent des conventions, mais participent aussi à leur maintien. En ce sens, s’habiller « comme il convient » revient à répondre à des attentes sociales.","Le travestissement trouble cette lisibilité. J’entendrai ici par travestissement vestimentaire, ou *cross-dressing*, le fait de porter des vêtements associés, dans l’univers social représenté, à un autre genre. Les gestes, la voix et les conduites peuvent prolonger cette présentation, sans se confondre avec le seul changement de vêtements. Il convient également de distinguer l’identification par autrui — la manière dont un personnage est perçu et catégorisé — de son identité de genre, c’est-à-dire de son rapport à sa propre appartenance de genre. Une apparence nouvelle peut modifier la première sans déterminer à elle seule la seconde.","Dans Les Mamelles de Tirésias, créée en 1917, Guillaume Apollinaire met en scène la transformation de Thérèse en Tirésias et le déplacement des fonctions conjugales et reproductives vers son mari. Dans Some Like It Hot, réalisé par Billy Wilder en 1959, deux musiciens adoptent une présentation féminine et rejoignent un orchestre de femmes afin d’échapper à des gangsters. Les moyens scéniques et cinématographiques diffèrent, mais les deux œuvres confrontent les personnages à des expériences auxquelles leur position initiale ne leur donnait pas le même accès.","Comment le travestissement transforme-t-il la manière dont un personnage est reconnu, traité ou désiré ? Dans quelle mesure cette expérience modifie-t-elle son rapport à lui-même ? La comparaison portera d’abord sur les mécanismes du travestissement, puis sur ses effets dans le regard d’autrui et dans les paroles et les conduites des personnages. Il s’agira de suivre les écarts entre corps, vêtements, rôle social et identification, sans supposer que ces éléments changent nécessairement ensemble."],"zh":["服装是一种非语言的文化表达与交流方式。它参与塑造人们被理解的方式：社会地位、职业和性别，都可能通过衣着符号被推断出来。这些符号既反映社会惯例，也参与维持它们。在这个意义上，穿得“合乎规矩”，就是回应社会对个体的期待。","异装扰动了这种可辨识性。本文所说的异装，即 cross-dressing，指人物穿着在作品所呈现的社会环境中被归属于另一性别的服饰。动作、声音和行为可以延续这种性别呈现，但不能与换装本身混为一谈。同时，需要区分他人对人物的性别识别——人物如何被感知和归类——与人物的性别认同，即其如何理解自身的性别归属。外观的变化可以改变前者，却不会单凭这一点决定后者。","在1917年首演的《蒂蕾茜亚的乳房》中，纪尧姆·阿波利奈尔呈现了泰蕾兹向蒂蕾茜亚的转变，以及婚姻和生育职能向丈夫的转移。比利·怀尔德1959年执导的《热情似火》，则让两名乐手以女性形象加入女子乐队，以躲避黑帮的追杀。两部作品采用不同的舞台与电影手段，却都使人物进入了原有处境无法以同样方式向他们开放的经验之中。","异装如何改变人物被辨认、被对待、被欲求的方式？这种经历又在多大程度上改变他们与自我的关系？本文首先比较异装的运作机制，继而考察它在他人目光以及人物自身言行中的作用。分析将追踪身体、服装、社会角色与身份识别之间的错位，而不预设这些因素必然同步改变。"],"en":["Clothing is a form of non-verbal cultural expression and communication. It contributes to how individuals are perceived: social status, occupation and gender may all be inferred from sartorial signs. These signs reflect conventions while also helping to sustain them. In this sense, dressing “as one should” means responding to social expectations.","Cross-dressing unsettles this legibility. In this study, the term refers to wearing clothes associated with another gender within the social world represented by the work. Gestures, voice and conduct may extend this presentation, but they are not identical to a change of clothes. It is also necessary to distinguish gender attribution by others—the way a character is perceived and categorised—from gender identity, understood here as the character’s relation to their own gender belonging. A new appearance can alter the former without, by itself, determining the latter.","In Les Mamelles de Tirésias, first performed in 1917, Guillaume Apollinaire stages Thérèse’s transformation into Tirésias and the transfer of marital and reproductive functions to her husband. In Billy Wilder’s Some Like It Hot (1959), two musicians adopt a feminine presentation and join an all-female orchestra to escape pursuing gangsters. Although their theatrical and cinematic means differ, both works expose their characters to experiences that were not accessible to them in the same way from their initial positions.","How does cross-dressing change the way a character is recognised, treated or desired? To what extent does this experience alter the character’s relation to the self? The comparison first examines the mechanisms of cross-dressing, then its effects on other characters’ perceptions and on the cross-dressed characters’ own speech and conduct. It follows the discrepancies between body, clothing, social role and gender attribution without assuming that these elements necessarily change together."]},"media":[{"src":"images/thesis/2011_photo_les_mamelles_de_tiresias.jpg","original":true,"credit":null},{"src":"images/thesis/plottrain0.jpg","original":true,"credit":null}],"mediaKey":"introduction"}],"id":"sec-1"},{"title":{"zh":"I．作品概述","fr":"Présentation générale","en":"Overview of the Works"},"units":[{"title":{"zh":"I.1．《蒂蕾茜亚的乳房》","fr":"Les Mamelles de Tirésias","en":"Les Mamelles de Tirésias"},"paragraphs":{"fr":["Selon sa préface, Apollinaire a écrit la pièce en 1903, à l’exception du prologue et de la dernière scène du deuxième acte, composés en 1916. L’œuvre est créée le 24 juin 1917 et publiée en volume aux Éditions SIC en 1918.<sup id=\"fnref-fr-1-1\"><a href=\"#fn-1\" role=\"doc-noteref\" aria-label=\"Note 1\">1</a></sup> Son appellation de « drame surréaliste » désigne une expérimentation qui refuse de réduire le théâtre à l’imitation vraisemblable du réel. La transformation corporelle et l’invraisemblance de la procréation masculine constituent ainsi des possibilités de la scène, et non des accidents à corriger au nom du réalisme.","La question de la repopulation est alors une préoccupation nationale majeure en France. Dans la préface, Apollinaire écrit : <em>« je leur ai signalé le grave danger reconnu de tous qu’il y a pour une nation qui veut être prospère et puissante à ne pas faire d’enfant »</em>.<sup id=\"fnref-fr-2-1\"><a href=\"#fn-2\" role=\"doc-noteref\" aria-label=\"Note 2\">2</a></sup> D’un côté, il tient des propos sexistes et misogynes : <em>« comme les femmes allemandes ne sont pas souvent jolies, je crois que leur seule et réelle qualité, c’est cette admirable fécondité[...] »</em>.<sup id=\"fnref-fr-3-1\"><a href=\"#fn-3\" role=\"doc-noteref\" aria-label=\"Note 3\">3</a></sup> De l’autre, il se prononce en faveur de l’égalité des droits entre les sexes : <em>« ce siècle ne se terminera pas sans que les droits de la femme aient été mis partout sur le même plan que les droits de l’homme, et ce seront tout simplement les droits de l’Humanité »</em>.<sup id=\"fnref-fr-4-1\"><a href=\"#fn-4\" role=\"doc-noteref\" aria-label=\"Note 4\">4</a></sup> Malgré cette ambivalence sur la question féministe, il crée une œuvre d’avant-garde qui refuse à la fois le réalisme et le symbolisme, tout en explorant l’identité de genre, la libération sexuelle et la révolution féminine.","Thérèse rejette la place qui lui est faite, perd ses mamelles et devient Tirésias. Le mari, revêtu de vêtements féminins, entreprend à son tour de produire des enfants en nombre prodigieux. Tirésias accède aux fonctions de général et de député, puis revient sous l’apparence d’une cartomancienne qui promet la prospérité aux personnages féconds. Le couple se réconcilie, mais la réconciliation ne restaure pas intégralement les corps et les rôles du début.","Le mari offre un cas de travestissement vestimentaire particulièrement net, puisqu’il est contraint de porter les vêtements de Thérèse. La trajectoire de Thérèse/Tirésias articule, quant à elle, métamorphose corporelle, échange des vêtements et changement de position sociale. La comparaison exige de ne pas confondre ces opérations, mais aussi de considérer les moments où elles se croisent."],"zh":["据阿波利奈尔的序言，剧本写于1903年，序幕与第二幕的最后一场则写于1916年。作品于1917年6月24日首演，1918年由SIC出版社出版单行本。<sup id=\"fnref-zh-1-1\"><a href=\"#fn-1\" role=\"doc-noteref\" aria-label=\"Note 1\">1</a></sup>“超现实主义戏剧”这一命名指向一种艺术实验：戏剧不应被缩减为对现实的逼真模仿。因此，身体变形与男性生育的荒诞，并非需要按现实主义标准纠正的失误，而是舞台得以展开的可能性。","在当时的法国，增加人口是一项重要的全国性议题。阿波利奈尔在序言中写道：<em>“我向他们指出了一个众所周知的严重危险：一个想要繁荣强盛的国家，却不生育孩子。”</em><sup id=\"fnref-zh-2-1\"><a href=\"#fn-2\" role=\"doc-noteref\" aria-label=\"Note 2\">2</a></sup>一方面，他发表带有性别歧视与厌女倾向的言论：<em>“由于德国女性往往并不漂亮，我认为她们唯一真正的优点，就是这种令人赞叹的生育能力……”</em><sup id=\"fnref-zh-3-1\"><a href=\"#fn-3\" role=\"doc-noteref\" aria-label=\"Note 3\">3</a></sup>另一方面，他又支持两性权利平等：<em>“在这个世纪结束之前，妇女的权利将在各地与男子的权利置于同等地位，而那将仅仅是人类的权利。”</em><sup id=\"fnref-zh-4-1\"><a href=\"#fn-4\" role=\"doc-noteref\" aria-label=\"Note 4\">4</a></sup>尽管他在女性主义问题上呈现出这种矛盾，仍创作出一部既拒绝现实主义、也拒绝象征主义的先锋作品，探索性别认同、性解放与女性革命。","泰蕾兹拒绝自己的既定位置，失去乳房，成为蒂蕾茜亚。穿上女性服装的丈夫则开始以惊人的数量生产孩子。蒂蕾茜亚获得将军和议员的职位，随后以占卜师的形象归来，向生育者许诺繁荣。夫妻最终和解，但这一和解并没有使身体与角色完全回到开场时的状态。","丈夫被迫穿上泰蕾兹的衣服，因此构成了一个尤其明确的服饰异装案例。泰蕾兹／蒂蕾茜亚的轨迹，则交织着身体变形、服装交换和社会位置的改变。比较既需要区分这些过程，也需要关注它们彼此交会的时刻。"],"en":["According to his preface, Apollinaire wrote the play in 1903, except for the prologue and the final scene of Act II, which date from 1916. It was first performed on 24 June 1917 and published in book form by Éditions SIC in 1918.<sup id=\"fnref-en-1-1\"><a href=\"#fn-1\" role=\"doc-noteref\" aria-label=\"Note 1\">1</a></sup> Its designation as a “surrealist drama” names an experiment that refuses to reduce theatre to the plausible imitation of reality. Bodily transformation and the improbability of male procreation are therefore possibilities of the stage, rather than mistakes to be corrected in the name of realism.","Repopulation was then a major national concern in France. In the preface, Apollinaire writes: <em>“I pointed out to them the grave danger, acknowledged by all, that a nation wishing to be prosperous and powerful faces when it does not have children.”</em><sup id=\"fnref-en-2-1\"><a href=\"#fn-2\" role=\"doc-noteref\" aria-label=\"Note 2\">2</a></sup> On the one hand, he makes sexist and misogynistic remarks: <em>“as German women are not often pretty, I believe their only real quality is this admirable fertility [...]”</em>.<sup id=\"fnref-en-3-1\"><a href=\"#fn-3\" role=\"doc-noteref\" aria-label=\"Note 3\">3</a></sup> On the other, he speaks in favour of equal rights between the sexes: <em>“this century will not end before women’s rights have everywhere been placed on the same level as men’s rights, and these will quite simply be the rights of Humanity.”</em><sup id=\"fnref-en-4-1\"><a href=\"#fn-4\" role=\"doc-noteref\" aria-label=\"Note 4\">4</a></sup> Despite this ambivalence on the feminist question, he creates an avant-garde work that rejects both realism and symbolism while exploring gender identity, sexual liberation and women’s revolution.","Thérèse rejects her allotted position, loses her breasts and becomes Tirésias. Her husband, dressed in women’s clothing, in turn undertakes to produce a prodigious number of children. Tirésias gains access to the offices of general and parliamentary deputy, then returns as a fortune-teller who promises prosperity to the fertile. The couple is reconciled, but this reconciliation does not wholly restore the bodies and roles with which the play began.","The husband provides a particularly clear instance of sartorial cross-dressing, since he is compelled to wear Thérèse’s clothes. The trajectory of Thérèse/Tirésias, by contrast, combines bodily metamorphosis, the exchange of clothing and a change in social position. A comparison must distinguish these operations while attending to the moments at which they intersect."]},"media":[{"src":"images/thesis/Les-mamelles-de-Tiresias-6150WEB-1294x600.jpg","original":true,"credit":null},{"src":"images/thesis/les_mamelles_de_tiresias_14733_poster_19112hd_1web.jpg","original":true,"credit":null}],"mediaKey":"I.1"},{"title":{"zh":"I.2．《热情似火》","fr":"Some Like It Hot","en":"Some Like It Hot"},"paragraphs":{"fr":["Some Like It Hot, réalisé en 1959 sur un scénario de Billy Wilder et I. A. L. Diamond, situe son action en 1929, pendant la Prohibition. Le saxophoniste Joe et le contrebassiste Jerry sont témoins d’un massacre commis par des gangsters. Pour leur échapper, ils deviennent Joséphine et Daphné et rejoignent un orchestre féminin en route pour la Floride. Joe se rapproche de la chanteuse et joueuse d’ukulélé Sugar Kane ; Jerry attire l’attention du millionnaire Osgood Fielding III.","La poursuite criminelle donne au déguisement son urgence, mais ses effets dépassent la seule protection des fugitifs. Joe et Jerry entrent dans les espaces de sociabilité des musiciennes, deviennent les destinataires de confidences, puis les objets de sollicitations masculines. Le film articule ainsi dissimulation, séduction et expérience des attentes adressées aux femmes.","Il faut distinguer le temps de l’intrigue de celui de la réalisation. Les archives de la réception mentionnent des objections morales au travestissement et aux suggestions d’homosexualité, signe que la comédie mettait à l’épreuve les limites du représentable en 1959.<sup id=\"fnref-fr-5-1\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> Son humour ne neutralise donc pas les enjeux de genre. Il fournit la forme dans laquelle ceux-ci peuvent être exposés, déplacés et laissés partiellement irrésolus."],"zh":["《热情似火》于1959年上映，由比利·怀尔德执导、怀尔德与I. A. L. 戴蒙德共同编剧，故事发生在禁酒时期的1929年。萨克斯管乐手乔与低音提琴手杰里目睹了黑帮实施的一场屠杀。为了逃脱追杀，他们化身为约瑟芬和达芙妮，加入一支前往佛罗里达的女子乐队。乔逐渐接近兼任尤克里里演奏者的歌手舒格·凯恩；杰里则吸引了百万富翁奥斯古德·菲尔丁三世的注意。","黑帮追杀赋予了伪装以紧迫性，但换装的作用超出了保护逃亡者这一目的。乔和杰里进入女乐手们的交往空间，成为秘密的倾听者，又成为男性追求的对象。影片由此将隐匿、诱惑，以及对女性所承受期待的切身体验联系起来。","需要区分故事发生的年代与影片制作的年代。接受史档案记载了针对异装及同性欲望暗示的道德异议，表明这部喜剧触及了1959年可被公开呈现的边界。<sup id=\"fnref-zh-5-1\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup>幽默因而并未消解性别问题，而是为这些问题提供了一种形式，使其得以显现、位移，并在一定程度上保持未决。"],"en":["Released in 1959 and directed by Billy Wilder from a screenplay co-written with I. A. L. Diamond, Some Like It Hot is set in 1929, during Prohibition. Joe, a saxophonist, and Jerry, a double bassist, witness a gangland massacre. To escape the killers, they become Josephine and Daphne and join an all-female orchestra travelling to Florida. Joe grows close to Sugar Kane, the singer and ukulele player, while Jerry attracts the attention of millionaire Osgood Fielding III.","The criminal pursuit makes disguise urgent, but its effects extend beyond the fugitives’ protection. Joe and Jerry enter the musicians’ spaces of sociability, receive their confidences and become the objects of male advances. The film thus connects concealment and seduction with an experience of the expectations directed at women.","The time of the narrative must be distinguished from that of the film’s production. Archival records of its reception document moral objections to cross-dressing and suggestions of homosexuality, indicating that the comedy tested the limits of what could be represented in 1959.<sup id=\"fnref-en-5-1\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> Humour does not, then, neutralise its gender implications. It provides the form through which these implications can be exposed, displaced and left partly unresolved."]},"media":[{"src":"images/thesis/joeandjerry0.jpg","original":true,"credit":null},{"src":"images/thesis/travestissement2.jpg","original":true,"credit":null}],"mediaKey":"I.2"}],"id":"sec-2"},{"title":{"zh":"II．异装的运作机制","fr":"Les mécanismes du travestissement","en":"The Mechanisms of Cross-Dressing"},"units":[{"title":{"zh":"II.1．衣服未变，异装效果已经发生","fr":"Le vêtement demeure, l’effet de travestissement apparaît","en":"Unchanged Clothes, an Emerging Effect of Cross-Dressing"},"paragraphs":{"fr":["Dans les premières scènes des Mamelles de Tirésias, Thérèse refuse les tâches attribuées aux femmes : <em>« Faire des enfants faire la cuisine non c’est trop »</em>.<sup id=\"fnref-fr-6-1\"><a href=\"#fn-6\" role=\"doc-noteref\" aria-label=\"Note 6\">6</a></sup> Sa transformation passe par la disparition des mamelles et l’apparition d’une barbe et d’une moustache. La déclaration <em>« Je me sens viril en diable »</em> et l’image du taureau accentuent cette virilisation. J’y vois aussi la possibilité d’une allusion à une transformation sexuelle plus étendue, voire à l’apparition d’organes génitaux masculins ; cette lecture reste toutefois une hypothèse, car la réplique ne décrit pas une anatomie complète.","Or le vêtement ne change pas immédiatement. Thérèse conserve la robe bleue ornée de singes et de fruits ainsi que le corsage. Ce décalage est décisif : pour le mari, le corps désormais perçu comme masculin paraît avoir revêtu les habits de sa femme. Un effet de travestissement naît donc sans changement préalable de vêtements. C’est la transformation du corps et du regard porté sur lui qui rend étrange une tenue jusqu’alors tenue pour conforme.","L’échange matériel intervient ensuite. Dans la quatrième scène du premier acte, Tirésias maîtrise le mari, lui enlève son pantalon, lui passe sa jupe, le ligote, puis revêt le pantalon et un haut-de-forme après s’être coupé les cheveux.<sup id=\"fnref-fr-7-1\"><a href=\"#fn-7\" role=\"doc-noteref\" aria-label=\"Note 7\">7</a></sup> Les deux opérations ne sont pas symétriques : Tirésias choisit une présentation masculine, tandis que le mari subit la féminisation de son apparence. Le déplacement des signes de genre s’accompagne ainsi d’un rapport de contrainte. La possibilité de changer de rôle ne suffit pas à garantir une égale liberté de le faire."],"zh":["在《蒂蕾茜亚的乳房》开场的几场戏中，泰蕾兹拒绝被分配给女性的劳动：<em>“生孩子，做饭，不，这实在太多了。”</em><sup id=\"fnref-zh-6-1\"><a href=\"#fn-6\" role=\"doc-noteref\" aria-label=\"Note 6\">6</a></sup>她的变形表现为乳房的消失，以及胡须和髭须的出现。<em>“我感到自己男子气十足”</em>的宣告与公牛的意象，进一步强化了这种男性化。我也从中读到一种可能：它或许暗示着范围更广的性变化，甚至男性生殖器的出现。不过，这仍是一种解释性假说，因为台词并未描述一副完整的身体构造。","然而，衣服并未立即改变。泰蕾兹仍穿着绘有猴子与水果的蓝色裙装，以及原来的上衣。这一错位至关重要：在丈夫看来，一个如今被识别为男性的身体，仿佛穿上了自己妻子的衣服。因此，换衣之前，异装的效果就已经出现。使原本被视为合宜的服饰变得陌生的，是身体的变化，以及投向身体的目光。","服装的实际交换随后才发生。在第一幕第四场，蒂蕾茜亚制伏丈夫，脱掉他的裤子，给他穿上自己的裙子并将他捆住，随后自己穿上裤子、剪去头发、戴上高顶礼帽。<sup id=\"fnref-zh-7-1\"><a href=\"#fn-7\" role=\"doc-noteref\" aria-label=\"Note 7\">7</a></sup>这两个过程并不对称：蒂蕾茜亚主动选择男性形象，丈夫则被迫承受外观的女性化。性别符号的转移由此伴随着强制关系。角色可以改变，并不意味着每个人都同样自由地决定是否改变。"],"en":["In the opening scenes of Les Mamelles de Tirésias, Thérèse rejects the tasks assigned to women: <em>“Having children, doing the cooking—no, it is too much.”</em><sup id=\"fnref-en-6-1\"><a href=\"#fn-6\" role=\"doc-noteref\" aria-label=\"Note 6\">6</a></sup> Her transformation proceeds through the disappearance of her breasts and the emergence of a beard and moustache. The declaration <em>“I feel devilishly virile”</em> and the image of the bull intensify this masculinisation. I also see the possibility of an allusion to a more extensive sexual transformation, perhaps even the emergence of male genitalia. This remains an interpretative hypothesis, however, since the speech does not describe a complete anatomy.","The clothes do not change immediately. Thérèse retains the blue dress decorated with monkeys and fruit, along with the bodice. This discrepancy is decisive: to the husband, a body now perceived as masculine appears to be wearing his wife’s clothes. An effect of cross-dressing therefore arises before any change of clothing. The transformation of the body, and of the gaze directed at it, makes a previously appropriate outfit appear strange.","The material exchange follows. In Act I, scene four, Tirésias overpowers the husband, removes his trousers, puts her skirt on him and ties him up, then puts on the trousers and a top hat after cutting her hair.<sup id=\"fnref-en-7-1\"><a href=\"#fn-7\" role=\"doc-noteref\" aria-label=\"Note 7\">7</a></sup> These operations are not symmetrical: Tirésias chooses a masculine presentation, whereas the husband is subjected to a feminisation of his appearance. The displacement of gendered signs is thus accompanied by coercion. The possibility of changing roles does not guarantee an equal freedom to do so."]},"media":[{"src":"images/thesis/Mamelle_2.jpg","original":true,"credit":{"fr":"Glenn dans le rôle du Garçon et Gabriel Preisser dans celui du Mari, dans Les Mamelles de Tirésias. Photographie : Steve DiBartolomeo, Westside Studio Image.","zh":"《蒂蕾茜亚的乳房》中，Glenn饰演男孩，Gabriel Preisser饰演丈夫。摄影：Steve DiBartolomeo，Westside Studio Image。","en":"Glenn as the Boy and Gabriel Preisser as the Husband in Les Mamelles de Tirésias. Photograph by Steve DiBartolomeo, Westside Studio Image."}},{"src":"images/thesis/Les-mamelles-de-Tiresias-6233WEB-1294x600.jpg","original":true,"credit":{"fr":"Poulenc, Les Mamelles de Tirésias — Mulhouse.","zh":"普朗克《蒂蕾茜亚的乳房》——米卢斯。","en":"Poulenc, Les Mamelles de Tirésias — Mulhouse."}}],"mediaKey":"II.1"},{"title":{"zh":"II.2．重新成为Thérèse，是否意味着恢复原状？","fr":"Redevenir Thérèse : un retour à l’état initial ?","en":"Becoming Thérèse Again: a Return to the Beginning?"},"paragraphs":{"fr":["La dernière scène introduit une troisième configuration. La cartomancienne abandonne son déguisement et demande à son mari de la reconnaître. Le nom de Thérèse revient, mais les mamelles ne sont pas réintégrées. Le mari propose des ballons et des balles pour restituer une poitrine ; Thérèse refuse cette restauration, et les objets sont finalement dispersés vers les spectateurs.<sup id=\"fnref-fr-8-1\"><a href=\"#fn-8\" role=\"doc-noteref\" aria-label=\"Note 8\">8</a></sup>","Cette scène résiste à une classification simple. Si l’on définit le travestissement comme l’écart entre un corps tenu pour masculin ou féminin et les vêtements qui lui seraient normalement associés, il faudrait pouvoir déterminer sans ambiguïté chacun de ces termes. Or le retour au nom féminin ne constitue pas, à lui seul, la preuve d’un retour anatomique. De même, l’abandon du costume de cartomancienne ne précise pas tous les éléments de la tenue qui lui succède.","L’intérêt de cette fin réside précisément dans la dissociation des indices : le nom, les signes corporels et la reconnaissance conjugale ne reviennent pas ensemble à leur état initial. Les mamelles, désignées comme les <em>« oiseaux de ma faiblesse »</em>, peuvent être abandonnées sans empêcher la réunion du couple. Thérèse est reconnue sans être rendue à l’identique. Le dénouement permet ainsi de penser une continuité du personnage à travers une apparence qui demeure transformée."],"zh":["最后一场引入了第三种情形。占卜师卸去伪装，请丈夫认出自己。泰蕾兹这个名字回来了，乳房却没有重新回到身体上。丈夫拿出气球和小球，想为她恢复胸部；泰蕾兹拒绝了这种复原，最终将这些物件放飞、抛向观众。<sup id=\"fnref-zh-8-1\"><a href=\"#fn-8\" role=\"doc-noteref\" aria-label=\"Note 8\">8</a></sup>","这一场景难以被简单归类。如果把异装定义为被认作男性或女性的身体与通常归属于它的服装之间的差异，那么，首先就得能够明确判断这两个方面。然而，女性名字的回归本身并不能证明身体构造已经恢复。同样，卸下占卜师的服装，也没有交代之后衣着的全部细节。","这一结尾的意义，恰恰在于不同标志的分离：名字、身体符号与夫妻间的相认，并没有一同回到初始状态。被称作<em>“我软弱的鸟儿”</em>的乳房可以被舍弃，却不妨碍夫妻重聚。泰蕾兹被认出来了，却没有被还原为完全相同的模样。这个结局由此使我们得以思考：人物如何在持续改变的外观之中，仍保持自身的连续性。"],"en":["The final scene introduces a third configuration. The fortune-teller discards her disguise and asks her husband to recognise her. The name Thérèse returns, but the breasts are not restored. The husband offers balloons and balls to reconstitute a bust; Thérèse rejects this restoration, and the objects are finally released or thrown towards the audience.<sup id=\"fnref-en-8-1\"><a href=\"#fn-8\" role=\"doc-noteref\" aria-label=\"Note 8\">8</a></sup>","The scene resists straightforward classification. If cross-dressing is defined as a discrepancy between a body understood as male or female and the clothes normally associated with it, both terms would first have to be determined unambiguously. Yet the return of the feminine name is not, in itself, evidence of an anatomical return. Nor does the removal of the fortune-teller’s costume specify every element of the clothing that follows it.","The significance of this ending lies precisely in the separation of its signs: the name, bodily attributes and marital recognition do not return together to their initial state. The breasts, called the <em>“birds of my weakness,”</em> can be relinquished without preventing the couple’s reunion. Thérèse is recognised without being restored to an identical form. The ending thus allows us to consider the character’s continuity through an appearance that remains transformed."]},"media":[{"src":"images/thesis/Les-mamelles-de-Tiresias-6150WEB-2-1294x600.jpg","original":true,"credit":null},{"src":"images/thesis/Les-mamelles-de-Tiresias-6266WEB-1294x600.jpg","original":true,"credit":null}],"mediaKey":"II.2"},{"title":{"zh":"II.3．服装、表演与舞伴位置","fr":"Costume, jeu et positions dans la danse","en":"Costume, Performance and Positions in the Dance"},"paragraphs":{"fr":["Dans Some Like It Hot, le travestissement passe par les vêtements, le maquillage, les accessoires et le jeu corporel. Perruques, robes et talons ne suffisent pas : Joe et Jerry doivent aussi ajuster leur voix, leur démarche et leurs interactions. La féminité qu’ils présentent est une conduite à soutenir dans la durée, sous le regard des autres personnages. Le public, qui connaît leur situation, voit simultanément l’apparence et le travail nécessaire à son maintien.","Les déguisements se succèdent au cours de la fuite. Lorsque la dissimulation féminine est compromise, les deux musiciens adoptent les figures d’un vieux millionnaire en fauteuil roulant et de son accompagnateur en tenue d’employé d’hôtel. Les talons que Jerry a conservés rendent cette nouvelle présentation incohérente aux yeux des poursuivants. Les musiciens retrouvent ensuite leurs vêtements féminins avant l’évasion finale. Les identités présentées sont donc des moyens de circuler dans l’espace, mais chacune peut laisser des traces dans la suivante.<sup id=\"fnref-fr-9-1\"><a href=\"#fn-9\" role=\"doc-noteref\" aria-label=\"Note 9\">9</a></sup>","Osgood entre également dans cette étude du travestissement. Lorsqu’il danse avec Daphné, il place une fleur sur sa tête et enroule un drap autour de sa taille, créant ainsi l’apparence d’une robe. Leur danse brouille les rôles traditionnels de l’homme et de la femme : les positions de meneur et de partenaire s’échangent, tandis que les mouvements mêlent les stéréotypes de genre.<sup id=\"fnref-fr-10-1\"><a href=\"#fn-10\" role=\"doc-noteref\" aria-label=\"Note 10\">10</a></sup> L’interaction entre Osgood et Daphné ajoute ainsi une autre dimension au travestissement : les rôles et les attentes liés au genre sont remis en question et modifiés au sein même de leur relation.","La distinction entre les œuvres porte ainsi sur leurs moyens de représentation. La pièce fait coexister transformation corporelle, accessoires détachables et circulation des noms ; le film travaille davantage la voix, la démarche, le costume et la méprise. Dans les deux cas, le comique rend visibles les opérations par lesquelles un personnage devient lisible comme homme ou comme femme."],"zh":["在《热情似火》中，异装通过衣服、化妆、配饰与身体表演共同完成。假发、裙装和高跟鞋并不足够：乔和杰里还必须调整声音、步态以及与他人交往的方式。他们呈现的女性气质，是一种需要在他人目光下持续维系的行为表现。知道他们处境的观众，则同时看到了外观及维持外观所需的努力。","逃亡过程中，伪装不断更换。女性形象的掩护受到威胁后，两名乐手改以坐轮椅的年老富翁及身穿酒店员工服装的随行者形象出现。杰里仍然穿着的高跟鞋，使这一次呈现在追踪者眼中露出破绽。最终出逃之前，他们又换回女性服装。因此，不同身份形象都是穿行于空间之中的手段，但每一种都可能在下一种形象中留下痕迹。<sup id=\"fnref-zh-9-1\"><a href=\"#fn-9\" role=\"doc-noteref\" aria-label=\"Note 9\">9</a></sup>","奥斯古德同样构成这一异装研究的一部分。他与达芙妮跳舞时，把一朵花戴在头上，又将一块布裹在腰间，形成裙装的外观。两人的舞蹈扰乱了传统的男女角色：领舞与舞伴的位置相互交换，动作也交织着不同的性别刻板印象。<sup id=\"fnref-zh-10-1\"><a href=\"#fn-10\" role=\"doc-noteref\" aria-label=\"Note 10\">10</a></sup>奥斯古德与达芙妮的互动由此为异装增加了另一重维度：与性别相联系的角色与期待，就在他们的关系内部受到质疑，并发生改变。","因此，两部作品的区别也在于表现手段。戏剧让身体变形、可拆卸的道具和名字的流转同时发生；电影则更多地处理声音、步态、服装与误认。在两者之中，喜剧都使一个人物如何变得可被识别为男人或女人的过程显现出来。"],"en":["In Some Like It Hot, cross-dressing operates through clothing, make-up, accessories and physical performance. Wigs, dresses and heels are not enough: Joe and Jerry must also adjust their voices, their gait and their interactions. Their feminine presentation is a form of conduct that has to be sustained over time under other characters’ scrutiny. The audience, aware of their predicament, sees both the appearance and the work required to maintain it.","Disguises succeed one another during the escape. When their feminine concealment is compromised, the musicians assume the figures of an elderly millionaire in a wheelchair and an attendant dressed as a hotel employee. The heels Jerry has retained make this new presentation appear inconsistent to their pursuers. The musicians later resume their women’s clothing before the final escape. Their presented identities are thus means of moving through space, but each can leave traces in the next.<sup id=\"fnref-en-9-1\"><a href=\"#fn-9\" role=\"doc-noteref\" aria-label=\"Note 9\">9</a></sup>","Osgood also belongs in this study of cross-dressing. As he dances with Daphne, he places a flower on his head and wraps a cloth around his waist, creating the appearance of a dress. Their dance blurs traditional male and female roles: the positions of leader and partner are exchanged, while their movements mingle gender stereotypes.<sup id=\"fnref-en-10-1\"><a href=\"#fn-10\" role=\"doc-noteref\" aria-label=\"Note 10\">10</a></sup> The interaction between Osgood and Daphne thus adds another dimension to cross-dressing: gender roles and expectations are questioned and altered within their relationship itself.","The difference between the works therefore also concerns their means of representation. The play brings together bodily transformation, detachable props and shifting names; the film works more extensively with voice, gait, costume and misrecognition. In both, comedy makes visible the operations through which a character becomes legible as a man or a woman."]},"media":[{"src":"images/thesis/joejerry.jpg","original":true,"credit":null},{"src":"images/thesis/danseend.jpg","original":true,"credit":null}],"mediaKey":"II.3"}],"id":"sec-3"},{"title":{"zh":"III．异装如何影响他人的性别识别","fr":"L’impact du travestissement sur l’identification par autrui","en":"How Cross-Dressing Affects Gender Attribution by Others"},"units":[{"title":{"zh":"III.1．衣着与被感知的力量","fr":"Vêtements et force perçue","en":"Clothing and Perceived Strength"},"paragraphs":{"fr":["Le travestissement peut perturber les attentes relatives à la force physique. Dans les scènes étudiées, les vêtements masculins ou féminins orientent la lecture de la puissance, de la vulnérabilité et de l’autorité. Il ne s’agit pas de mesurer les capacités réelles des corps, mais d’examiner ce que les personnages croient reconnaître en eux.","Face à Thérèse transformée, le mari imagine qu’un homme a pris les vêtements de sa femme : <em>« Quel malotru a mis ses vêtements »</em>. Il menace ensuite celui qu’il tient pour un usurpateur.<sup id=\"fnref-fr-11-1\"><a href=\"#fn-11\" role=\"doc-noteref\" aria-label=\"Note 11\">11</a></sup> L’apparence masculine fait surgir la figure d’un intrus potentiellement violent, tandis que Thérèse demeure, dans son raisonnement, la femme absente qu’il faudrait retrouver ou défendre. J’y lis une distribution de la force et de la vulnérabilité suivant les catégories de genre dont dispose le mari. Ce n’est pas le corps seul qu’il voit : il lui attribue déjà une histoire et un rôle.","La scène de l’échange des vêtements matérialise autrement ce rapport. Tirésias maîtrise et ligote le mari avant de le revêtir de sa jupe. La virilisation s’accompagne ici de la prise d’une position dominante ; l’homme qui détenait l’autorité conjugale se trouve lui-même contraint. La transformation déplace la domination sans nécessairement l’abolir.","Un écho peut être proposé avec la scène de la baignoire dans Some Like It Hot. Devant Sugar, Daphné conteste l’existence du millionnaire Junior et les mensonges de Joe. Lorsque Joe, jusque-là présenté comme Joséphine prenant un bain, se retrouve face à Jerry dans ses vêtements masculins, le rapport entre les deux amis change de tonalité. Je propose de lire ce passage comme une réaffirmation d’autorité associée au retour de la présentation masculine.<sup id=\"fnref-fr-12-1\"><a href=\"#fn-12\" role=\"doc-noteref\" aria-label=\"Note 12\">12</a></sup> Le costume rend ce renversement perceptible, mais il agit au sein d’une relation déjà marquée par l’ascendant de Joe sur Jerry : il n’en constitue pas l’unique cause."],"zh":["异装能够扰乱对身体力量的预期。在这些场景中，男性或女性服装引导人物对强大、脆弱和权威作出判断。这里要考察的并非身体实际能力的大小，而是人物相信自己从身体中认出了什么。","面对变形后的泰蕾兹，丈夫想象有个男人穿上了妻子的衣服：<em>“哪个粗鲁的家伙穿了她的衣服？”</em>随后，他威胁这个被他当作冒名者的人。<sup id=\"fnref-zh-11-1\"><a href=\"#fn-11\" role=\"doc-noteref\" aria-label=\"Note 11\">11</a></sup>男性外观唤起了一个可能施暴的闯入者形象；而在他的推断中，泰蕾兹仍是那个不在场、需要被寻找或保护的女人。我从中读到一种按丈夫所掌握的性别类别分配力量与脆弱性的方式。他看到的不只是身体：他已经为这个身体赋予了故事和角色。","换装场景则以另一种方式将这种关系具体化。蒂蕾茜亚制伏并捆住丈夫，然后为他穿上自己的裙子。在这里，男性化与占据支配位置同时发生；原本拥有婚姻权威的男人，如今自己成了被强制的一方。变形改变了支配关系的分布，却未必将它消除。","《热情似火》的浴缸场景可以与之形成呼应。在舒格面前，达芙妮质疑百万富翁小开这一身份的真实性，揭穿乔的谎言。当先前以正在洗澡的约瑟芬形象出现的乔，穿着男性衣服面对杰里时，两位朋友之间的关系发生了语气上的转变。我倾向于将这一段读作权威的重新确立，而它与男性形象的恢复联系在一起。<sup id=\"fnref-zh-12-1\"><a href=\"#fn-12\" role=\"doc-noteref\" aria-label=\"Note 12\">12</a></sup>服装使这一逆转变得可见，但它发挥作用的前提，是乔原本就对杰里具有影响力；服装并非这种关系的唯一原因。"],"en":["Cross-dressing can disturb expectations of physical strength. In the scenes under discussion, masculine or feminine clothing directs interpretations of power, vulnerability and authority. The issue is not the measurement of bodies’ actual capacities, but what the characters believe they recognise in them.","Confronted with the transformed Thérèse, the husband imagines that a man has put on his wife’s clothes: <em>“What lout has put on her clothes?”</em> He then threatens the person he takes to be an impostor.<sup id=\"fnref-en-11-1\"><a href=\"#fn-11\" role=\"doc-noteref\" aria-label=\"Note 11\">11</a></sup> The masculine appearance conjures a potentially violent intruder, while Thérèse remains, within his reasoning, an absent woman to be found or defended. I read this as a distribution of strength and vulnerability according to the husband’s available gender categories. He does not see a body alone: he has already assigned it a story and a role.","The exchange of clothes gives this relation another material form. Tirésias overpowers and binds the husband before dressing him in her skirt. Masculinisation is accompanied here by the occupation of a dominant position; the man who held marital authority is himself subjected to force. Transformation redistributes domination without necessarily abolishing it.","A parallel can be drawn with the bathtub scene in Some Like It Hot. In front of Sugar, Daphne challenges the existence of the millionaire Junior and Joe’s lies. When Joe, previously presented as Josephine taking a bath, confronts Jerry in masculine clothing, the tone of the relationship between the friends changes. I propose reading this moment as a reassertion of authority associated with the return of masculine presentation.<sup id=\"fnref-en-12-1\"><a href=\"#fn-12\" role=\"doc-noteref\" aria-label=\"Note 12\">12</a></sup> Costume makes the reversal perceptible, but it operates within a relationship already marked by Joe’s influence over Jerry; it is not the sole cause of that relationship."]},"media":[{"src":"images/thesis/opera.jpg","original":true,"credit":null},{"src":"images/thesis/les_mamelles_de_tiresias_6751web.jpg","original":true,"credit":null}],"mediaKey":"III.1"},{"title":{"zh":"III.2．身体特征、乐器与性别识别","fr":"Caractéristiques corporelles, instruments et identification de genre","en":"Bodily Features, Instruments and Gender Attribution"},"paragraphs":{"fr":["Le rapprochement entre Sugar et Daphné permet de prolonger l’analyse. Sugar est associée à l’ukulélé, Jerry à la contrebasse. Je propose de considérer le contraste entre le petit instrument tenu par Sugar et le volume de celui de Jerry comme un possible écho visuel de leur différence corporelle. Les deux instruments à cordes ne sont ni équivalents musicalement ni les preuves d’une intention symbolique du réalisateur ; leur comparaison constitue ici une hypothèse de lecture de l’image, qui rejoint le parallèle entre les personnages.","Les idées préconçues selon lesquelles les femmes seraient plus petites, plus délicates et moins robustes que les hommes se retrouvent également dans les différences corporelles mises en relief par le film. Sugar considère Joséphine et Daphné comme des filles avec lesquelles elle partage ses secrets. Pourtant, lorsqu’elle s’amuse avec Daphné sur la plage, elle remarque sa carrure : <em>« Daphne, I had no idea you were such a big girl [...] I mean, your shoulders -- and your arms. [...] You're so flat-chested. Clothes hang so much better on you than they do on me »</em>.<sup id=\"fnref-fr-13-1\"><a href=\"#fn-13\" role=\"doc-noteref\" aria-label=\"Note 13\">13</a></sup> Les épaules, les bras et la poitrine entrent ainsi dans le parallèle entre Sugar et Daphné, comme le font les dimensions contrastées de leurs instruments.","La conduite des gangsters rend le mécanisme encore plus visible. Dans l’ascenseur, ils saluent poliment les deux personnes qu’ils prennent pour des femmes. Leur savoir antérieur sur les musiciens recherchés ne suffit pas à les reconnaître sous cette apparence. Plus tard, l’identification des fugitifs repose sur les impacts de balles de la contrebasse abandonnée.<sup id=\"fnref-fr-5-2\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> L’objet relie les déguisements à une histoire connue. Ce démasquage ne peut donc pas être attribué simplement à une force prétendument masculine révélée par les mouvements des corps : c’est un indice matériel qui fait céder la première lecture."],"zh":["舒格与达芙妮的对照使这一分析得以继续。舒格与尤克里里相联系，杰里则与低音提琴相联系。我提出一种可能的视觉读法：舒格手中小巧的乐器与杰里的大体积乐器之间的对比，或许呼应了二人的身体差异。这两种弦乐器既不是音乐意义上的等价物，也不能证明导演具有某种象征意图；在这里，它们的比较是一种图像阐释的假说，与人物之间的平行关系相衔接。","女性通常比男性更娇小、更纤细、也更不强壮的既有观念，同样体现在影片突出表现的身体差异之中。舒格把约瑟芬与达芙妮当作可以分享秘密的女孩。然而，当她与达芙妮在海滩嬉戏时，她注意到了对方的体格：<em>“达芙妮，我没想到你竟然是这么高大的一个女孩……我是说，你的肩膀——还有你的手臂……你的胸部这么平。衣服穿在你身上，比穿在我身上好看多了。”</em><sup id=\"fnref-zh-13-1\"><a href=\"#fn-13\" role=\"doc-noteref\" aria-label=\"Note 13\">13</a></sup>肩膀、手臂与胸部，由此同体积悬殊的乐器一样，进入了舒格与达芙妮的对照关系。","黑帮的行为使这一机制更加鲜明。在电梯里，他们礼貌地向两位被自己认作女性的人致意。关于在逃乐手的已有知识，并不足以使他们认出这副外观之下的人。后来，对逃亡者身份的确认依赖于被遗弃的低音提琴上的弹孔。<sup id=\"fnref-zh-5-2\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup>这个物件把伪装与一段已知的经历连接起来。因此，这次识破不能简单归因于人物动作显露了所谓的男性力量：打破最初判断的，是一项物证。"],"en":["The comparison between Sugar and Daphne extends the analysis. Sugar is associated with the ukulele, Jerry with the double bass. I propose considering the contrast between Sugar’s small instrument and Jerry’s much larger one as a possible visual echo of their bodily difference. The two stringed instruments are neither musical equivalents nor proof of a symbolic intention on the director’s part. Their comparison is offered here as a hypothesis about the image, connected to the parallel between the characters.","The preconception that women are generally smaller, more delicate and less robust than men also appears in the bodily differences the film brings into relief. Sugar regards Josephine and Daphne as girls with whom she can share her secrets. Yet, as she plays with Daphne on the beach, she notices her build: <em>“Daphne, I had no idea you were such a big girl [...] I mean, your shoulders -- and your arms. [...] You're so flat-chested. Clothes hang so much better on you than they do on me”</em>.<sup id=\"fnref-en-13-1\"><a href=\"#fn-13\" role=\"doc-noteref\" aria-label=\"Note 13\">13</a></sup> Shoulders, arms and chest thus enter the parallel between Sugar and Daphne, just as the contrasting dimensions of their instruments do.","The gangsters’ conduct makes this mechanism still more visible. In the lift, they politely greet the two people they take to be women. Their prior knowledge of the wanted musicians is insufficient to recognise them beneath this appearance. Later, the fugitives are identified through the bullet holes in the abandoned double bass.<sup id=\"fnref-en-5-2\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> The object connects the disguises to a known history. This exposure cannot, therefore, simply be attributed to supposedly masculine strength revealed by bodily movement: material evidence overturns the initial reading."]},"media":[{"src":"images/thesis/trainspectacle.jpg","original":true,"credit":null},{"src":"images/thesis/instruments.jpg","original":true,"credit":null}],"mediaKey":"III.2"},{"title":{"zh":"III.3．从误认到欲望的持续","fr":"De la méprise à la persistance du désir","en":"From Misrecognition to the Persistence of Desire"},"paragraphs":{"fr":["Dans Les Mamelles de Tirésias, le gendarme prend d’abord le mari habillé en femme pour une <em>« belle fille »</em>. Les signes discordants deviennent des prétextes à poursuivre la séduction : le rhume lui paraît exquis, et les gestes du mari sont relus à travers le désir.<sup id=\"fnref-fr-14-1\"><a href=\"#fn-14\" role=\"doc-noteref\" aria-label=\"Note 14\">14</a></sup> Le représentant de l’autorité ne se contente pas de reconnaître une apparence ; il l’interprète de manière à maintenir l’objet qu’il désire.","La proposition de mariage conduit toutefois au-delà de la seule méprise. Lorsque le mari déclare n’être qu’un homme, le gendarme répond qu’il pourrait néanmoins l’épouser, <em>« par procuration »</em>. L’annonce n’interrompt donc pas la proposition. La scène ne permet pas de fixer une identité sexuelle au gendarme, mais elle empêche d’expliquer tout son comportement par une simple ignorance.","Osgood offre un parallèle particulièrement fécond. Sa rencontre avec Daphné peut se lire comme une variation comique sur Cendrillon : une Cendrillon musclée, dont la cheville attire l’attention du prétendant. Cette comparaison joue de l’écart entre le modèle attendu de la jeune femme délicate et le corps qui l’occupe. Le badinage autour de la pêche se prolonge dans la formule de Daphné, <em>« You’re barking up the wrong fish »</em>, détournement comique d’une expression anglaise.<sup id=\"fnref-fr-15-1\"><a href=\"#fn-15\" role=\"doc-noteref\" aria-label=\"Note 15\">15</a></sup> Le refus n’empêche pourtant pas Osgood de poursuivre ses avances. À la fin, les objections au mariage sont écartées une à une, jusqu’à l’annonce <em>« I’m a man »</em>, à laquelle répond <em>« Nobody’s perfect »</em>.","Le rapprochement ne se limite donc pas à deux hommes trompés par une robe. Dans les deux œuvres, la déclaration masculine échoue à mettre fin à la demande amoureuse. La reconnaissance et le désir ne se superposent pas complètement : modifier ce que l’autre sait ne suffit pas toujours à modifier ce qu’il veut.","L’insistance du jeune employé de l’hôtel envers Joséphine doit néanmoins être distinguée de ces dénouements. Il transforme son refus en invitation et l’appellation <em>« doll »</em> contribue, dans cette interaction, à la traiter comme un objet disponible. Même lorsqu’elle le repousse, il réinterprète sa résistance comme un charme supplémentaire.<sup id=\"fnref-fr-16-1\"><a href=\"#fn-16\" role=\"doc-noteref\" aria-label=\"Note 16\">16</a></sup> Le comique montre ici une violence de l’interprétation : le refus de la personne sollicitée ne parvient pas à être entendu comme un refus. Ces scènes exposent à la fois la fragilité des classements de genre et la persistance des rapports de pouvoir qui les accompagnent."],"zh":["在《蒂蕾茜亚的乳房》中，警察起初把身穿女装的丈夫当作一个<em>“漂亮姑娘”</em>。不协调的迹象成为继续调情的理由：连感冒在他看来都是迷人的，丈夫的动作也被欲望重新解释。<sup id=\"fnref-zh-14-1\"><a href=\"#fn-14\" role=\"doc-noteref\" aria-label=\"Note 14\">14</a></sup>这个权威的代表并不只是识别外表；他以一种能够维持欲望对象的方式去解释外表。","然而，求婚将场景带到了单纯误认之外。当丈夫声明自己只是个男人，警察回答，他仍可以通过<em>“代理”</em>的方式与之结婚。这个声明没有打断求婚。场景不足以据此为警察确定一种性身份，却也使我们无法再用单纯的不知情解释他的全部行为。","奥斯古德构成了一组尤其有启发性的对应。他与达芙妮的相遇，可以被读作灰姑娘故事的喜剧变奏：这是一位肌肉发达的灰姑娘，她的脚踝吸引了追求者的目光。这个比较利用了人们所期待的纤弱少女形象，与占据这一位置的身体之间的距离。围绕钓鱼展开的调笑，延续在达芙妮的回答<em>“You’re barking up the wrong fish”</em>之中；这句话戏仿了英语中表示“找错对象”的习语。<sup id=\"fnref-zh-15-1\"><a href=\"#fn-15\" role=\"doc-noteref\" aria-label=\"Note 15\">15</a></sup>然而，拒绝并未阻止奥斯古德继续追求。到了结尾，各种不能结婚的理由被逐一排除，直到<em>“我是男人”</em>的声明，得到<em>“没人是完美的”</em>这一回应。","因此，这组比较并不限于两个被裙装蒙骗的男人。在两部作品中，男性身份的声明都未能终止求爱。认知与欲望并不完全重合：改变对方知道的事，并不总能改变他想要的东西。","不过，酒店年轻员工对约瑟芬的纠缠，仍需要与上述结局区分。他把拒绝理解成邀请；在这段互动中，<em>“doll”</em>这一称呼也参与将约瑟芬当作一个可供支配的对象。即使她将他推开，他仍把她的抵抗解释成另一种魅力。<sup id=\"fnref-zh-16-1\"><a href=\"#fn-16\" role=\"doc-noteref\" aria-label=\"Note 16\">16</a></sup>喜剧在这里呈现了一种解释的暴力：被追求者的拒绝，无法作为拒绝被听见。这些场景同时揭示了性别分类的脆弱，以及与它相伴的权力关系的延续。"],"en":["In Les Mamelles de Tirésias, the gendarme initially takes the husband in women’s clothing for a <em>“beautiful girl.”</em> Discordant signs become reasons to continue flirting: he finds the cold exquisite, and the husband’s gestures are reread through desire.<sup id=\"fnref-en-14-1\"><a href=\"#fn-14\" role=\"doc-noteref\" aria-label=\"Note 14\">14</a></sup> This representative of authority does not merely recognise an appearance; he interprets it in a way that sustains his desired object.","The marriage proposal nevertheless takes the scene beyond misrecognition alone. When the husband declares that he is only a man, the gendarme replies that he could still marry him <em>“by proxy.”</em> The declaration does not interrupt the proposal. The scene does not establish a fixed sexual identity for the gendarme, but it prevents all his behaviour from being explained as simple ignorance.","Osgood offers a particularly productive parallel. His encounter with Daphne can be read as a comic variation on Cinderella: a muscular Cinderella whose ankle attracts her suitor’s attention. This comparison plays on the distance between the expected model of a delicate young woman and the body occupying that position. The fishing banter continues in Daphne’s <em>“You’re barking up the wrong fish,”</em> a comic distortion of an English idiom.<sup id=\"fnref-en-15-1\"><a href=\"#fn-15\" role=\"doc-noteref\" aria-label=\"Note 15\">15</a></sup> Yet refusal does not stop Osgood’s advances. At the end, objections to marriage are dismissed one by one, until <em>“I’m a man”</em> receives the answer <em>“Nobody’s perfect.”</em>","The comparison therefore extends beyond two men deceived by a dress. In both works, the declaration of a masculine identity fails to end the romantic proposal. Recognition and desire do not fully coincide: changing what another person knows does not always change what he wants.","The young hotel employee’s pursuit of Josephine must nevertheless be distinguished from these endings. He interprets refusal as invitation, while <em>“doll,”</em> within this interaction, helps to treat her as an available object. Even when she pushes him away, he recasts her resistance as an additional attraction.<sup id=\"fnref-en-16-1\"><a href=\"#fn-16\" role=\"doc-noteref\" aria-label=\"Note 16\">16</a></sup> Comedy exposes a violence of interpretation here: the person being pursued cannot make a refusal heard as a refusal. These scenes reveal both the fragility of gender classifications and the persistence of the power relations accompanying them."]},"media":[{"src":"images/thesis/2011_photo_les_mamelles_de_tiresias (7).jpg","original":true,"credit":null},{"src":"images/thesis/2011_photo_les_mamelles_de_tiresias (11).jpg","original":true,"credit":null}],"mediaKey":"III.3"},{"title":{"zh":"III.4．谁更符合“真正淑女”的标准？","fr":"Qui répond le mieux à l’idéal des « vraies dames » ?","en":"Who Best Meets the Ideal of “Real Ladies”?"},"paragraphs":{"fr":["Un autre paradoxe rapproche les œuvres : les personnages masculins travestis peuvent être jugés plus conformes à certaines attentes de féminité que les femmes elles-mêmes. Ce jugement appartient aux personnages et aux normes qu’ils mobilisent ; il ne constitue pas un constat de supériorité de la part de l’analyse.","Dans Les Mamelles de Tirésias, la fécondité extraordinaire du mari lui vaut les félicitations du gendarme et les promesses de la cartomancienne. À la sixième scène du deuxième acte, le nombre de ses enfants atteint 40 050.<sup id=\"fnref-fr-17-1\"><a href=\"#fn-17\" role=\"doc-noteref\" aria-label=\"Note 17\">17</a></sup> Celui qui occupe la fonction reproductive la pousse à une échelle impossible. Le renversement déplace la maternité vers un homme, tout en exagérant l’idéal productif qui mesure la valeur d’un individu à sa fécondité.","Dans Some Like It Hot, Joséphine et Daphné sont accueillies comme de <em>« vraies dames »</em> par les responsables de l’orchestre. Leur présentation policée paraît satisfaire une attente de respectabilité que les autres musiciennes sont invitées à mieux respecter.<sup id=\"fnref-fr-18-1\"><a href=\"#fn-18\" role=\"doc-noteref\" aria-label=\"Note 18\">18</a></sup> Cette féminité est reconnue et validée aussi bien par une femme que par un homme. La réussite du déguisement révèle alors un fonctionnement ironique de la norme : les signes appris de la féminité peuvent devenir un modèle proposé aux femmes. L’enjeu n’est pas de savoir qui serait une femme plus authentique, mais comment une autorité décide de ce qu’une femme doit donner à voir."],"zh":["另一种悖论将两部作品联系起来：异装的男性人物，有时会被认为比女性本身更符合某些关于女性的期待。这一判断属于作品中的人物及其所运用的规范，并不是本文对谁更优越作出的评价。","在《蒂蕾茜亚的乳房》中，丈夫惊人的生育能力为他赢得警察的赞许与占卜师的许诺。到第二幕第六场，他的孩子数量达到40,050个。<sup id=\"fnref-zh-17-1\"><a href=\"#fn-17\" role=\"doc-noteref\" aria-label=\"Note 17\">17</a></sup>占据生育职能的人将这一职能推进到不可能的规模。倒置把母职转移给男人，同时夸张地呈现了一种生产性理想：个体的价值被其生育能力衡量。","在《热情似火》中，约瑟芬和达芙妮被乐队管理者接纳为<em>“真正的淑女”</em>。她们彬彬有礼的呈现似乎满足了某种端庄得体的期待，而其他女乐手则被要求更好地遵守这一标准。<sup id=\"fnref-zh-18-1\"><a href=\"#fn-18\" role=\"doc-noteref\" aria-label=\"Note 18\">18</a></sup>这种女性形象同时获得了一名女性与一名男性的认可。因此，伪装的成功揭示了规范运作中的反讽：学来的女性气质符号，竟可以成为向女性提出的榜样。问题不在于谁才是更真实的女人，而在于权威如何决定一个女人应当让别人看到什么。"],"en":["Another paradox connects the works: cross-dressed male characters may be judged more closely aligned with certain expectations of femininity than women themselves. This judgement belongs to the characters and the norms they invoke; it is not a claim of superiority made by the analysis.","In Les Mamelles de Tirésias, the husband’s extraordinary fertility earns the gendarme’s praise and the fortune-teller’s promises. By Act II, scene six, his children number 40,050.<sup id=\"fnref-en-17-1\"><a href=\"#fn-17\" role=\"doc-noteref\" aria-label=\"Note 17\">17</a></sup> The person occupying the reproductive function pushes it to an impossible scale. The reversal transfers maternity to a man while exaggerating the productive ideal that measures an individual’s value through fertility.","In Some Like It Hot, Josephine and Daphne are welcomed as <em>“real ladies”</em> by the orchestra’s management. Their polished presentation appears to satisfy an expectation of respectability that the other musicians are urged to observe more closely.<sup id=\"fnref-en-18-1\"><a href=\"#fn-18\" role=\"doc-noteref\" aria-label=\"Note 18\">18</a></sup> This femininity is recognised and validated by both a woman and a man. The success of the disguise exposes an irony in the operation of the norm: learned signs of femininity can become a model prescribed to women. The question is not who is a more authentic woman, but how authority decides what a woman ought to display."]},"media":[{"src":"images/thesis/joeandjerry1.jpg","original":true,"credit":null},{"src":"images/thesis/spectacle.jpg","original":true,"credit":null}],"mediaKey":"III.4"}],"id":"sec-4"},{"title":{"zh":"IV．异装如何影响人物与自我的关系","fr":"L’influence du travestissement sur le rapport à soi","en":"How Cross-Dressing Affects the Relation to the Self"},"units":[{"title":{"zh":"IV.1．Thérèse／Tirésias与Sugar／Daphné的两组比较","fr":"Deux comparaisons : Thérèse–Tirésias et Sugar–Daphné","en":"Two Comparisons: Thérèse–Tirésias and Sugar–Daphne"},"paragraphs":{"fr":["L’expérience du travestissement ne modifie pas seulement le regard d’autrui. Elle peut également donner accès à d’autres relations, d’autres possibilités et d’autres contraintes. Pour étudier ces effets, je retiendrai deux rapprochements : Thérèse et Tirésias, états successifs d’un même personnage ; Sugar et Daphné, personnages distincts dont certaines dispositions et positions relationnelles se répondent. Ces comparaisons n’ont pas le même statut, mais elles permettent toutes deux d’interroger la répartition des qualités tenues pour masculines ou féminines.","Thérèse rejette la cuisine et la maternité imposées, tandis que Tirésias accède aux fonctions de général et de député. La métamorphose fait ainsi varier ensemble la présentation de genre et les possibilités sociales. Le retour sous les traits de la cartomancienne, qui valorise la fécondité, complique cependant le mouvement d’émancipation : la trajectoire va du refus de faire des enfants à une parole qui les réclame ou les récompense. Le contraste entre <em>« plus d’enfants »</em> entendu comme cessation et comme augmentation condense cette tension, sans autoriser à traiter toutes ses occurrences, prononcées par des voix différentes, comme une déclaration unique de Tirésias.<sup id=\"fnref-fr-19-1\"><a href=\"#fn-19\" role=\"doc-noteref\" aria-label=\"Note 19\">19</a></sup>","Sugar et Jerry offrent une autre forme de parallélisme. Sugar se présente à plusieurs reprises comme peu avisée en amour ; Jerry se laisse entraîner par Joe dans des projets qu’il n’avait pas choisis. Les deux personnages peuvent être trompés, persuadés ou déplacés par les récits de Joe. Ce rapprochement conserve la naïveté et la confiance comme objets d’analyse, mais les rapporte à des situations plutôt qu’à une nature féminine. Jerry occupe, dans sa relation avec Joe, une position qui peut répondre à celle de Sugar. La comparaison rend visibles des ressemblances que la différence de sexe ne suffit pas à effacer."],"zh":["异装经历改变的不只是他人的目光。它也可能打开其他关系、可能性与限制。为了考察这些作用，我保留两组比较：泰蕾兹与蒂蕾茜亚，是同一人物前后相继的状态；舒格与达芙妮，则是性情与关系位置具有某些呼应的不同人物。这两组比较的性质并不相同，但都可以用来追问那些被视为男性或女性的品质如何被分配。","泰蕾兹拒绝被强加的烹饪劳动与母职，蒂蕾茜亚则进入将军和议员的职位。身体变形由此使性别呈现与社会可能性一同发生变化。然而，以赞美生育的占卜师形象归来，又使这一解放过程复杂起来：人物的轨迹从拒绝生育，走向要求或奖赏生育的言说。<em>“plus d’enfants”</em>既可以被理解为<em>“不再有孩子”</em>，也可以被理解为<em>“更多孩子”</em>，两种含义的对照浓缩了这种张力；但不能因此把不同声音说出的每一次<em>“plus d’enfants”</em>，都当作蒂蕾茜亚的一次统一宣告。<sup id=\"fnref-zh-19-1\"><a href=\"#fn-19\" role=\"doc-noteref\" aria-label=\"Note 19\">19</a></sup>","舒格与杰里构成了另一种平行关系。舒格多次将自己描述为在爱情中不够明智的人；杰里则不断被乔带入并非自己选择的计划。二人都可能被乔的讲述欺骗、说服或推动。这一比较仍把天真和信任作为分析对象，但将它们放回具体处境，而不归结为女性天性。杰里在与乔的关系中所占据的位置，可能呼应舒格的位置。比较由此显露出一些相似性，而性别差异并不足以将它们抹去。"],"en":["The experience of cross-dressing does not change only how others look at a character. It may also provide access to different relationships, possibilities and constraints. To examine these effects, I retain two comparisons: Thérèse and Tirésias, successive states of a single character; and Sugar and Daphne, distinct characters whose dispositions and relational positions partly echo one another. These comparisons have different statuses, but both allow us to question the distribution of qualities deemed masculine or feminine.","Thérèse rejects imposed cooking and maternity, whereas Tirésias gains access to the offices of general and parliamentary deputy. The metamorphosis thus changes gender presentation and social possibilities together. The return as a fortune-teller who values fertility nevertheless complicates this movement of emancipation: the trajectory runs from refusing to bear children to speech that demands or rewards them. The contrast between <em>“plus d’enfants”</em> understood as cessation and as increase condenses this tension, without allowing every occurrence, spoken by different voices, to be treated as a single declaration by Tirésias.<sup id=\"fnref-en-19-1\"><a href=\"#fn-19\" role=\"doc-noteref\" aria-label=\"Note 19\">19</a></sup>","Sugar and Jerry offer another kind of parallel. Sugar repeatedly describes herself as unwise in love, while Jerry lets Joe draw him into plans he did not choose. Both characters can be deceived, persuaded or redirected by Joe’s stories. This comparison retains naivety and trust as objects of analysis, but relates them to situations rather than to a feminine nature. Jerry’s position in his relationship with Joe can echo Sugar’s position. The comparison makes visible similarities that sexual difference does not suffice to erase."]},"media":[{"src":"images/thesis/travestissement.jpg","original":true,"credit":null}],"mediaKey":"IV.1"},{"title":{"zh":"IV.2．进入女性的交往空间","fr":"Entrer dans les espaces de sociabilité féminine","en":"Entering Women’s Spaces of Sociability"},"paragraphs":{"fr":["Le travestissement ouvre à Daphné un espace de proximité avec les musiciennes. Dans le train, les conversations sur les vêtements, les plaisanteries et le relâchement des contraintes vestimentaires rendent possible une familiarité nouvelle. Jerry s’y montre bavard, curieux et disponible à la complicité. Lorsque Sugar risque d’être renvoyée pour avoir apporté de l’alcool, il prend la responsabilité de la flasque à sa place.<sup id=\"fnref-fr-20-1\"><a href=\"#fn-20\" role=\"doc-noteref\" aria-label=\"Note 20\">20</a></sup> Ces moments donnent à voir la sensibilité et la solidarité que j’associe à sa position au sein du groupe, sans qu’il soit nécessaire d’en faire des qualités exclusivement féminines.","Son enthousiasme transforme l’orchestre en une sorte de paradis. Le souvenir ou fantasme de la pâtisserie, où les plaisirs seraient à portée de main, donne une forme comique à cette abondance. Ce paradis reste équivoque : l’aisance éprouvée parmi les femmes coexiste avec l’attirance qu’elles exercent sur lui. La possibilité d’une relation de confidence et le désir de séduction ne s’annulent pas. C’est précisément leur coexistence qui rend son expérience difficile à réduire au simple maintien d’une imposture ou à une conversion identitaire complète.","Le détail des talons hauts prolonge cette réflexion. Au début, Jerry s’étonne de la démarche de Sugar, comme si une mécanique inaccessible à son propre corps la rendait possible. Plus tard, après avoir repris une présentation masculine, il conserve ses talons. Cet oubli peut être lu comme la persistance d’une trace du rôle précédent. Il ouvre une piste sur l’apprentissage et la continuité des gestes, mais ne suffit pas, isolément, à démontrer la construction sociale du genre.<sup id=\"fnref-fr-21-1\"><a href=\"#fn-21\" role=\"doc-noteref\" aria-label=\"Note 21\">21</a></sup> Le personnage ne passe pas toujours d’une présentation à l’autre sans reste."],"zh":["异装为达芙妮打开了与女乐手们亲密交往的空间。在火车上，关于衣着的聊天、玩笑以及对束身服饰的松解，使一种新的亲近成为可能。杰里在其中显得健谈、好奇，也愿意参与彼此之间的默契。当舒格因携带酒而可能被乐队开除时，他替她承认酒壶是自己的。<sup id=\"fnref-zh-20-1\"><a href=\"#fn-20\" role=\"doc-noteref\" aria-label=\"Note 20\">20</a></sup>这些时刻让我们看到了敏感与互助；我将它们同他在群体中所处的位置联系起来，却无须把它们规定为女性独有的品质。","他的热情把这支乐队变成了某种天堂。关于糕点店的记忆或幻想——仿佛各种快乐都伸手可及——为这种丰盛赋予了喜剧形式。但这个天堂仍然暧昧：置身女性之中的自在，与她们对他的吸引力并存。倾诉关系的可能性与追求诱惑的欲望，并不会相互取消。正是这种共存，使他的经历难以被简化为持续冒充，也难以被理解为完整的身份转换。","高跟鞋的细节延续了这一思考。起初，杰里惊讶于舒格的步态，仿佛是某种自己的身体无法企及的机械结构，使那种行走成为可能。后来，他已经恢复男性形象，却仍穿着高跟鞋。这一遗忘可以被读作前一个角色留下的痕迹。它为动作的学习与延续提供了一条分析线索，但单凭这个细节，还不足以证明性别的社会建构。<sup id=\"fnref-zh-21-1\"><a href=\"#fn-21\" role=\"doc-noteref\" aria-label=\"Note 21\">21</a></sup>人物并不总能毫无残留地从一种呈现转入另一种呈现。"],"en":["Cross-dressing gives Daphne access to intimacy with the musicians. On the train, talk about clothing, jokes and the loosening of restrictive garments make a new familiarity possible. Jerry is talkative, curious and receptive to companionship. When Sugar risks dismissal for bringing alcohol, he claims responsibility for the flask.<sup id=\"fnref-en-20-1\"><a href=\"#fn-20\" role=\"doc-noteref\" aria-label=\"Note 20\">20</a></sup> These moments reveal the sensitivity and solidarity that I associate with his position within the group, without requiring such qualities to be exclusively feminine.","His enthusiasm turns the orchestra into a kind of paradise. The recollection or fantasy of a pastry shop, where pleasures would lie within reach, gives comic form to this abundance. Yet this paradise remains equivocal: his ease among women coexists with his attraction to them. The possibility of a relationship of confidence and the desire to seduce do not cancel one another. Their coexistence is precisely what makes his experience difficult to reduce either to the simple maintenance of an imposture or to a complete conversion of identity.","The detail of the high heels extends this reflection. Initially, Jerry marvels at Sugar’s gait, as though a mechanism unavailable to his own body made it possible. Later, after resuming a masculine presentation, he retains his heels. This oversight can be read as the persistence of a trace of the previous role. It opens a line of inquiry into the learning and continuity of gestures, but cannot, on its own, demonstrate the social construction of gender.<sup id=\"fnref-en-21-1\"><a href=\"#fn-21\" role=\"doc-noteref\" aria-label=\"Note 21\">21</a></sup> The character does not always pass from one presentation to another without a remainder."]},"media":[{"src":"images/thesis/plottrain.jpg","original":true,"credit":null},{"src":"images/thesis/SomeLikeItHot-1959-TonyCurtis-JackLemmon-coats1-heels-bw.jpg","original":true,"credit":null}],"mediaKey":"IV.2"},{"title":{"zh":"IV.3．父亲、母亲与词语的变形","fr":"Père, mère et métamorphoses des mots","en":"Father, Mother and the Metamorphosis of Words"},"paragraphs":{"fr":["Dans Les Mamelles de Tirésias, le mari explore des fonctions généralement assignées aux femmes sans maintenir une identification féminine uniforme. Il peut se dire femme parce que sa femme est devenue homme, puis rappeler au gendarme qu’il est un homme. La production d’enfants ne fixe donc pas à elle seule son appartenance. Ses paroles varient avec les situations et les relations dans lesquelles il est engagé.","Le langage lui-même accompagne ces déplacements. Dans le dialogue sur les professions de Tirésias, <em>« merdecin »</em> appelle la réponse <em>« mère des seins »</em>, puis <em>« merdecine »</em> devient <em>« mère des cygnes »</em>.<sup id=\"fnref-fr-22-1\"><a href=\"#fn-22\" role=\"doc-noteref\" aria-label=\"Note 22\">22</a></sup> Les mots du soin, de la maternité et du corps se désassemblent et se recomposent. Je conserve ici une association supplémentaire : l’homophonie entre <em>« cygnes »</em> et <em>« signes »</em> peut faire entendre une circulation des signes à même les mots. Cette dernière proposition relève de ma lecture, et non d’une équivalence explicitement donnée par le texte.","Le dialogue avec le journaliste déplace encore le problème. Interrogé sur un éventuel instinct paternel devenu maternel, le mari répond que son entreprise est intéressée.<sup id=\"fnref-fr-23-1\"><a href=\"#fn-23\" role=\"doc-noteref\" aria-label=\"Note 23\">23</a></sup> La fécondité est aussi un projet de profit. Ce passage empêche de réduire la maternisation du personnage à la découverte d’une essence féminine ou d’un instinct jusque-là caché. Il assume une fonction, la transforme et l’exploite ; ce processus reconfigure sa place sans fournir une définition unique de son identité."],"zh":["在《蒂蕾茜亚的乳房》中，丈夫探索着通常被分配给女性的职能，却没有始终维持一种统一的女性认同。他可以因为妻子成了男人而称自己为女人，随后又提醒警察，自己是个男人。因此，生产孩子这一行为本身并未固定他的性别归属。他的言说随着具体情境及所进入的关系而变化。","语言本身也伴随这些位移发生变化。在讨论蒂蕾茜亚职业的对话中，<em>“merdecin”</em>引出了<em>“mère des seins”</em>（乳房之母）的回应，接着<em>“merdecine”</em>又变成<em>“mère des cygnes”</em>（天鹅之母）。<sup id=\"fnref-zh-22-1\"><a href=\"#fn-22\" role=\"doc-noteref\" aria-label=\"Note 22\">22</a></sup>关于医治、母职与身体的词语被拆散、重新组合。我在这里还保留一项进一步的联想：<em>“cygnes”</em>（天鹅）与<em>“signes”</em>（符号）的同音，或许能让我们在词语内部听到符号的流转。后一个判断属于我的阅读，而不是剧本明确给出的等式。","与记者的对话又一次移动了问题。当记者追问这是否是父性本能变成了母性本能时，丈夫回答，他的事业是有所图的。<sup id=\"fnref-zh-23-1\"><a href=\"#fn-23\" role=\"doc-noteref\" aria-label=\"Note 23\">23</a></sup>生育同时也是一个谋利计划。这个段落使我们无法把人物的母职化简化为发现了女性本质，或唤醒了原先隐藏的本能。他承担一种职能，改造它，并利用它；这一过程重组了他的位置，却没有提供一种唯一的身份定义。"],"en":["In Les Mamelles de Tirésias, the husband explores functions generally assigned to women without maintaining a uniform feminine identification. He can call himself a woman because his wife has become a man, then remind the gendarme that he is a man. Producing children does not, by itself, fix his gender belonging. His statements vary with the situations and relationships in which he is involved.","Language itself accompanies these displacements. In the exchange about Tirésias’s professions, <em>“merdecin”</em> prompts the reply <em>“mère des seins”</em> (<em>“mother of breasts”</em>), before <em>“merdecine”</em> becomes <em>“mère des cygnes”</em> (<em>“mother of swans”</em>).<sup id=\"fnref-en-22-1\"><a href=\"#fn-22\" role=\"doc-noteref\" aria-label=\"Note 22\">22</a></sup> Words concerning healing, maternity and the body are disassembled and recomposed. I retain an additional association here: the French homophony between <em>“cygnes”</em> (<em>“swans”</em>) and <em>“signes”</em> (<em>“signs”</em>) can suggest a circulation of signs within the words themselves. This last proposal belongs to my reading, rather than to an equivalence explicitly supplied by the text.","The conversation with the journalist shifts the problem again. Asked about a paternal instinct that might have become maternal, the husband replies that his enterprise is self-interested.<sup id=\"fnref-en-23-1\"><a href=\"#fn-23\" role=\"doc-noteref\" aria-label=\"Note 23\">23</a></sup> Fertility is also a project of profit. This passage prevents the character’s assumption of maternity from being reduced to the discovery of a feminine essence or a previously hidden instinct. He takes on a function, transforms it and exploits it; this process reconfigures his position without providing a single definition of his identity."]},"media":[{"src":"images/thesis/La-Mamelle-De-Tiresias.jpg","original":true,"credit":null},{"src":"images/thesis/Mamelles1.jpg","original":true,"credit":null}],"mediaKey":"IV.3"},{"title":{"zh":"IV.4．Joe：理解、反思与给予","fr":"Joe : compréhension, remise en question et don","en":"Joe: Understanding, Self-Reflection and Giving"},"paragraphs":{"fr":["Joe connaît une autre forme de déplacement. Sugar confie à Joséphine ses déceptions amoureuses auprès de saxophonistes qui empruntaient son argent et le dépensaient en jeux ou auprès d’autres femmes. Il écoute ainsi, depuis la place d’une confidente, le récit de conduites qui ressemblent aux siennes. Le travestissement rend possible cette confrontation indirecte à soi : Sugar ne s’adresse pas à lui comme à l’un de ces hommes, alors que le public peut reconnaître le rapprochement.","Bien que Joe trompe Sugar en se présentant comme un millionnaire, il choisit de lui laisser le luxueux bracelet de diamants qu’Osgood a offert à Jerry.<sup id=\"fnref-fr-5-3\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> La provenance du cadeau n’annule pas le renoncement matériel que représente ce geste : Joe pouvait lui-même en tirer profit, mais, malgré sa situation financière difficile, il choisit que Sugar en bénéficie. Ce don prolonge la réflexion suscitée par les confidences de Sugar. Tout en continuant à s’identifier comme homme, Joe accède, grâce au travestissement, à une meilleure compréhension de l’expérience des femmes et remet en question ses propres comportements."],"zh":["乔经历的是另一种位移。舒格向约瑟芬倾诉与萨克斯管乐手交往的失望：那些男人借走她的钱，再把钱花在赌博或别的女人身上。于是，乔从一位女性知己的位置上，听到了与自己的行为相似的经历。异装使这种间接面对自我的情形成为可能：舒格没有把他当作那些男人中的一个来讲话，观众却能够辨认出其中的对应。","尽管乔谎称自己是百万富翁来欺骗舒格，他仍选择将奥斯古德赠给杰里的名贵钻石手镯留给她。<sup id=\"fnref-zh-5-3\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup>礼物的来源并不取消这一举动所包含的物质让渡：乔本可以从中获利，却在自身经济困难的情况下，选择让舒格受益。这份赠予延续了舒格的倾诉在他身上引发的反思。乔仍然认同自己是男性，但异装使他得以更深入地理解女性的经历，并反省自己的行为。"],"en":["Joe undergoes a different displacement. Sugar confides in Josephine about disappointing affairs with saxophonists who borrowed her money and spent it on gambling or other women. From the position of a female confidante, he therefore hears an account of behaviour resembling his own. Cross-dressing makes this indirect confrontation with himself possible: Sugar does not address him as one of those men, whereas the audience can recognise the parallel.","Although Joe deceives Sugar by presenting himself as a millionaire, he chooses to leave her the luxurious diamond bracelet that Osgood gave Jerry.<sup id=\"fnref-en-5-3\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> The gift’s provenance does not cancel the material sacrifice involved: Joe could have profited from it himself, yet, despite his financial difficulties, he chooses to let Sugar benefit. This gift continues the self-reflection prompted by Sugar’s confidences. While still identifying as a man, Joe gains through cross-dressing a deeper understanding of women’s experiences and questions his own behaviour."]},"media":[{"src":"images/thesis/review-the-unicorn-scale-the-unicorn-scale-some-like-it-hot-3.jpg","original":true,"credit":null},{"src":"images/thesis/joeandsugar.jpeg","original":true,"credit":null}],"mediaKey":"IV.4"},{"title":{"zh":"IV.5．“我是女孩”与“我是男孩”","fr":"« I’m a girl » et « I’m a boy »","en":"“I’m a Girl” and “I’m a Boy”"},"paragraphs":{"fr":["La répétition des formules de Jerry constitue un dernier point de comparaison. Dans le train, <em>« I’m a girl »</em> doit l’aider à contenir son désir et à préserver le rôle de Daphné. Après la soirée avec Osgood, le rappel <em>« I’m a boy »</em> intervient au contraire pour interrompre sa projection dans le mariage.<sup id=\"fnref-fr-24-1\"><a href=\"#fn-24\" role=\"doc-noteref\" aria-label=\"Note 24\">24</a></sup> Les deux formules ont une fonction pratique : elles rappellent ce qu’il faut être, ou se rappeler d’être, pour rester dans les limites de la situation.","L’enthousiasme matrimonial ne permet pas de conclure que Jerry aurait simplement oublié son identité. Il envisage aussi les avantages économiques d’un mariage suivi d’une séparation.<sup id=\"fnref-fr-5-4\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> Ce calcul n’épuise pas nécessairement la joie éprouvée pendant la danse ou à l’annonce des fiançailles, mais il interdit de réduire la scène à une adhésion identitaire transparente. Désir, plaisir du rôle, perspective de richesse et contraintes sociales demeurent mêlés.","Le mari de Thérèse fournit un parallèle : <em>« Puisque ma femme est homme / Il est juste que je sois femme »</em>.<sup id=\"fnref-fr-22-2\"><a href=\"#fn-22\" role=\"doc-noteref\" aria-label=\"Note 22\">22</a></sup> Sa déclaration se formule à partir d’une relation et d’un raisonnement sur la place à occuper. Dans les deux œuvres, dire « je suis » peut servir à maintenir un rôle, à répondre à autrui ou à négocier une contradiction. Ces paroles ne sont pas pour autant dépourvues d’effet sur le personnage ; elles montrent que son rapport à lui-même se travaille dans l’expérience, plutôt qu’il ne se livre toujours sous la forme d’une vérité stable."],"zh":["杰里反复说出的两组句子，构成最后一个比较点。在火车上，<em>“我是女孩”</em>被用来帮助他克制欲望，并维持达芙妮的角色。与奥斯古德共度夜晚之后，<em>“我是男孩”</em>的提醒则反过来打断他对婚姻的想象。<sup id=\"fnref-zh-24-1\"><a href=\"#fn-24\" role=\"doc-noteref\" aria-label=\"Note 24\">24</a></sup>这两种说法都具有实际功能：为了留在当下处境允许的范围内，它们提醒人物必须是什么，或者必须记得自己是什么。","对结婚的兴奋，不能直接说明杰里只是忘记了自己的身份。他也设想过结婚后再分开所能带来的经济利益。<sup id=\"fnref-zh-5-4\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup>这种算计未必穷尽了舞蹈中或订婚时的快乐，却使我们不能把这一场景简化为清楚明白的身份认同。欲望、扮演角色的愉悦、财富前景与社会限制仍然交织在一起。","泰蕾兹的丈夫提供了一个对应：<em>“既然我的妻子是男人／那么我成为女人就是合理的。”</em><sup id=\"fnref-zh-22-2\"><a href=\"#fn-22\" role=\"doc-noteref\" aria-label=\"Note 22\">22</a></sup>他的声明是从一种关系，以及对自己应当占据何种位置的推理中产生的。在两部作品中，说出“我是”，可以是为了维持角色、回应他人，或处理一种矛盾。这些话并非因此就不会影响人物；它们表明，人物与自我的关系是在经历中被不断塑造的，而不总是以稳定真理的形式直接呈现。"],"en":["Jerry’s repeated formulas provide a final point of comparison. On the train, <em>“I’m a girl”</em> is meant to help him contain his desire and preserve the role of Daphne. After the evening with Osgood, the reminder <em>“I’m a boy”</em> instead interrupts his projection of himself into marriage.<sup id=\"fnref-en-24-1\"><a href=\"#fn-24\" role=\"doc-noteref\" aria-label=\"Note 24\">24</a></sup> Both formulas have a practical function: they recall what he must be, or remember himself to be, in order to remain within the limits of the situation.","His enthusiasm for marriage does not establish that Jerry has simply forgotten his identity. He also imagines the economic benefits of a marriage followed by separation.<sup id=\"fnref-en-5-4\"><a href=\"#fn-5\" role=\"doc-noteref\" aria-label=\"Note 5\">5</a></sup> This calculation does not necessarily exhaust the pleasure of the dance or the engagement, but it prevents the scene from being reduced to a transparent identification. Desire, the pleasure of the role, the prospect of wealth and social constraints remain intertwined.","Thérèse’s husband provides a parallel: <em>“Since my wife is a man / It is only right that I should be a woman.”</em><sup id=\"fnref-en-22-2\"><a href=\"#fn-22\" role=\"doc-noteref\" aria-label=\"Note 22\">22</a></sup> His declaration emerges from a relationship and a reasoning about the position he ought to occupy. In both works, saying “I am” may serve to maintain a role, answer another person or negotiate a contradiction. These statements are not therefore without effects on the character; they show a relation to the self being worked out through experience, rather than invariably disclosed as a stable truth."]},"media":[{"src":"images/thesis/f5a23-slihlemmonandmillionaire.jpg","original":true,"credit":null},{"src":"videos/endofsthlikeithot.mp4","original":true,"credit":null}],"mediaKey":"IV.5"}],"id":"sec-5"},{"title":{"zh":"结论","fr":"Conclusion","en":"Conclusion"},"units":[{"title":{"zh":"结论","fr":"Conclusion","en":"Conclusion"},"paragraphs":{"fr":["La comparaison des Mamelles de Tirésias et de Some Like It Hot montre que le travestissement engage davantage qu’un changement d’apparence. Il transforme les conditions dans lesquelles un personnage est reconnu, traité ou désiré, et lui donne accès à des relations susceptibles de modifier son rapport à lui-même. Ces effets ne sont toutefois ni uniformes ni simultanés : le corps, le nom, les vêtements, la fonction sociale et l’identité ne se déplacent pas toujours ensemble.","Les rapprochements examinés permettent de préciser cette discordance. Un vêtement inchangé peut devenir l’indice d’un travestissement ; la comparaison des instruments peut prolonger celle des corps ; une déclaration masculine peut ne pas interrompre une proposition de mariage. De même, l’accès à la maternité, à la confidence ou à un autre rôle amoureux n’aboutit pas nécessairement à une identification nouvelle et définitive. Il rend cependant visibles des possibilités que l’ordre initial tenait à distance.","Le comique laisse coexister ces ouvertures avec des normes persistantes : injonction à procréer, idéal de respectabilité, harcèlement ou calcul économique. C’est dans cette coexistence que les deux œuvres déplacent les frontières du masculin et du féminin. Je conserve, pour les faire résonner sans les confondre, la réponse d’Osgood et le refrain d’Apollinaire :","> <em>« Nobody’s perfect. »</em><sup id=\"fnref-fr-25-1\"><a href=\"#fn-25\" role=\"doc-noteref\" aria-label=\"Note 25\">25</a></sup>","> <em>« Et puis chantez matin et soir</em>  \n> <em>Grattez-vous si ça vous démange</em>  \n> <em>Aimez le blanc ou bien le noir</em>  \n> <em>C’est bien plus drôle quand ça change</em>  \n> <em>Suffit de s’en apercevoir »</em><sup id=\"fnref-fr-26-1\"><a href=\"#fn-26\" role=\"doc-noteref\" aria-label=\"Note 26\">26</a></sup>"],"zh":["《蒂蕾茜亚的乳房》与《热情似火》的比较表明，异装所牵涉的不止是外观变化。它改变人物被辨认、被对待、被欲求的条件，也使其进入可能改变自我关系的交往之中。然而，这些作用既不一致，也不同步：身体、名字、服装、社会职能与身份认同，并不总是一同移动。","本文考察的比较使这种不一致更加具体。未曾改变的服装可以成为异装的标志；乐器的对照可以延伸身体之间的比较；男性身份的声明可以不打断求婚。同样，进入母职、倾诉关系或另一种爱情角色，并不必然通向一种全新而最终确定的认同。然而，它确实使原有秩序拒之于外的可能性变得可见。","喜剧让这些开放性与持续存在的规范共存：生育的要求、端庄的理想、骚扰或经济算计。两部作品正是在这种共存之中移动男性与女性的边界。在结尾，我保留奥斯古德的回答与阿波利奈尔的叠句，让它们相互呼应，同时保有各自的声音：","> <em>“没人是完美的。”</em><sup id=\"fnref-zh-25-1\"><a href=\"#fn-25\" role=\"doc-noteref\" aria-label=\"Note 25\">25</a></sup>","> <em>“那就早晚歌唱吧</em>  \n> <em>若是痒了，就挠一挠</em>  \n> <em>爱白也好，爱黑也好</em>  \n> <em>换一换，才更加好玩</em>  \n> <em>只要察觉到就好。”</em><sup id=\"fnref-zh-26-1\"><a href=\"#fn-26\" role=\"doc-noteref\" aria-label=\"Note 26\">26</a></sup>"],"en":["The comparison of Les Mamelles de Tirésias and Some Like It Hot shows that cross-dressing involves more than a change of appearance. It alters the conditions under which a character is recognised, treated or desired, and provides access to relationships capable of changing the character’s relation to the self. These effects are neither uniform nor simultaneous: body, name, clothing, social function and identity do not always move together.","The comparisons examined here clarify this discrepancy. Unchanged clothing can become a sign of cross-dressing; the comparison of instruments can extend the comparison of bodies; a declaration of masculine identity need not interrupt a marriage proposal. Similarly, access to maternity, confidential intimacy or another romantic role does not necessarily produce a new and definitive identification. It nevertheless makes visible possibilities that the initial order had kept at a distance.","Comedy allows these openings to coexist with persistent norms: the injunction to procreate, the ideal of respectability, harassment or economic calculation. It is through this coexistence that the works displace the boundaries of masculinity and femininity. I retain Osgood’s answer and Apollinaire’s refrain, allowing them to resonate without merging their voices:","> <em>“Nobody’s pe
