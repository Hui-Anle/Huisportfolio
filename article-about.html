    heroToggle.addEventListener('click',()=>{if(heroVideo.paused){heroUserPaused=false;playHero();}else{heroUserPaused=true;heroVideo.pause();}updateHeroControl();});
    if(!reduced.matches)playHero();updateHeroControl();
    const requestedLanguage=window.SiteLanguage&&SiteLanguage.requested?SiteLanguage.requested():''; if(requestedLanguage&&UI[requestedLanguage]) language=requestedLanguage;
    const scene=$('#scene'), traveller=$('#traveller'), panel=$('#station-panel');

    // Keep route spacing data-driven as stations are added or removed.
    ABOUT_CONFIG.stations.forEach((station,index)=>{station.position=(index+1)/(ABOUT_CONFIG.stations.length+1);});
    // One semantic button per station, including its icon and label.
    ABOUT_CONFIG.stations.forEach(station=>{
      const button=document.createElement('button');button.type='button';button.className='route-station';button.dataset.station=station.id;button.style.setProperty('--position',(station.position*100)+'%');button.setAttribute('aria-controls','station-panel');
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('object');svg.setAttribute('aria-hidden','true');
      const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#icon-'+station.icon);svg.append(use);
      const label=document.createElement('span');label.className='station-name';label.dataset.name=station.id;
      const dot=document.createElement('span');dot.className='station-dot';dot.setAttribute('aria-hidden','true');button.append(svg,label,dot);scene.append(button);
    });
    function localText(value){return typeof value==='string'?value:value?.[language]??value?.fr??'';}
    function clearAlbumTimer(){if(album.timer){clearTimeout(album.timer);album.timer=0;}}
    function albumItems(station){return Array.isArray(station.media)?station.media:(station.media?[station.media]:[]);}
    function currentVideo(){return $('#media-box video');}
    function updateAlbumControls(){
      const controls=$('#album-controls'),items=album.items;
      controls.hidden=items.length<2;
      if(!items.length)return;
      const atEnd=album.index>=items.length-1&&!album.playing;
      $('#album-play').textContent=album.playing?UI[language].albumPause:(atEnd?UI[language].albumReplay:UI[language].albumPlay);
      $('#album-prev').disabled=album.index<=0;
      $('#album-next').disabled=album.index>=items.length-1;
      $('#album-count').textContent=`${album.index+1} / ${items.length}`;
    }
    function pauseAlbum(){
      album.playing=false;clearAlbumTimer();const video=currentVideo();if(video)video.pause();updateAlbumControls();
    }
    function schedulePhotoAdvance(station,token){
      clearAlbumTimer();if(!album.playing||album.token!==token)return;
      album.timer=setTimeout(()=>{album.timer=0;nextAlbum(true);},3000);
    }
    function startVideoPlayback(station,el,token){
      if(album.stationId!==station.id||album.token!==token||album.video!==el)return;
      clearAlbumTimer();album.playing=true;el.muted=true;
      const result=el.play();
      if(result&&typeof result.catch==='function')result.catch(()=>{album.playing=false;updateAlbumControls();});
      updateAlbumControls();
    }
    function renderAlbumItem(station,index,{autoplay=false}={}){
      const items=album.items,box=$('#media-box');
      clearAlbumTimer();const oldVideo=currentVideo();if(oldVideo)oldVideo.pause();
      album.index=Math.max(0,Math.min(index,items.length-1));album.token+=1;album.video=null;
      const token=album.token,media=items[album.index];box.replaceChildren();box.classList.remove('is-fading');if(!reduced.matches){void box.offsetWidth;box.classList.add('is-fading');}
      $('#media-caption').textContent=localText(media.caption);
      let el;
      if(media.type==='video'){
        el=document.createElement('video');el.controls=true;el.preload='metadata';el.playsInline=true;el.muted=true;el.defaultMuted=true;el.setAttribute('playsinline','');el.setAttribute('aria-label',localText(media.alt)||localText(station.title));
        if(media.poster)el.poster=media.poster;
        album.video=el;
        el.addEventListener('play',()=>{if(album.stationId===station.id&&album.token===token){album.playing=true;updateAlbumControls();}});
        el.addEventListener('pause',()=>{if(album.stationId===station.id&&album.token===token&&!el.ended){album.playing=false;clearAlbumTimer();updateAlbumControls();}});
        el.addEventListener('ended',()=>{if(album.stationId===station.id&&album.token===token){if(album.playing)nextAlbum(true);else updateAlbumControls();}});
      }else{
        el=document.createElement('img');el.alt=localText(media.alt)||localText(station.title);el.decoding='async';
      }
      el.addEventListener('error',()=>{if(album.stationId===station.id&&album.token===token){mediaPlaceholder(station,true);}}, {once:true});
      el.src=media.src;box.append(el);box.dataset.state=media.type;
      updateAlbumControls();
      if(autoplay&&media.type==='video')startVideoPlayback(station,el,token);else if(album.playing&&media.type==='image')schedulePhotoAdvance(station,token);
    }
    function renderMedia(station){
      const items=albumItems(station),sameStation=album.stationId===station.id;
      if(!items.length){album.stationId=station.id;album.items=[];album.index=0;pauseAlbum();mediaPlaceholder(station);return;}
      const keepIndex=sameStation?Math.min(album.index,items.length-1):0,wasPlaying=sameStation&&album.playing;
      album.stationId=station.id;album.items=items;album.playing=wasPlaying;
      renderAlbumItem(station,keepIndex,{autoplay:wasPlaying&&items[keepIndex].type==='video'});
      if(wasPlaying&&items[keepIndex].type==='image')schedulePhotoAdvance(station,album.token);
      updateAlbumControls();
    }
    function mediaPlaceholder(station,error=false){
      clearAlbumTimer();album.playing=false;album.video=null;album.items=[];$('#album-controls').hidden=true;
      const box=$('#media-box');box.replaceChildren();
      const wrap=document.createElement('div');wrap.className='media-placeholder';
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('aria-hidden','true');
      const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#icon-'+station.icon);svg.append(use);
      const title=document.createElement('span');title.className='placeholder-title';title.textContent=error?UI[language].mediaError:UI[language].photo;
      const note=document.createElement('span');note.className='placeholder-note';note.textContent=error?'':UI[language].placeholder;
      wrap.append(svg,title,note);box.append(wrap);box.dataset.state=error?'error':'placeholder';
    }
    function nextAlbum(auto=false){
      if(!album.items.length)return;
      const station=ABOUT_CONFIG.stations.find(item=>item.id===album.stationId);if(!station)return;
      clearAlbumTimer();if(album.index>=album.items.length-1){album.playing=false;const video=currentVideo();if(video)video.pause();updateAlbumControls();return;}
      const continuePlaying=album.playing,targetItem=album.items[album.index+1];if(!auto&&targetItem.type==='video')album.playing=false;renderAlbumItem(station,album.index+1,{autoplay:auto&&continuePlaying});
      if(album.playing&&album.items[album.index].type==='image')schedulePhotoAdvance(station,album.token);
    }
    function previousAlbum(){
      if(!album.items.length||album.index<=0)return;
      const station=ABOUT_CONFIG.stations.find(item=>item.id===album.stationId);if(!station)return;
      const continuePlaying=album.playing,targetItem=album.items[album.index-1];if(targetItem.type==='video')album.playing=false;renderAlbumItem(station,album.index-1);if(album.playing&&album.items[album.index].type==='image')schedulePhotoAdvance(station,album.token);
    }
    function startAlbum(){
      if(!album.items.length)return;
      const station=ABOUT_CONFIG.stations.find(item=>item.id===album.stationId);if(!station)return;
      if(album.index>=album.items.length-1){album.playing=false;renderAlbumItem(station,0);}
      album.playing=true;const media=album.items[album.index];if(media.type==='video')startVideoPlayback(station,currentVideo(),album.token);else schedulePhotoAdvance(station,album.token);updateAlbumControls();
    }
    function updateCV(){
      const cvLang=$('#cv-language').value,path=ABOUT_CONFIG.cvs[cvType]?.[cvLang]||'',link=$('#download-cv'),labels=CV_LABELS[language];
      $$('[data-cv-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cvType===cvType)));
      link.hidden=!path;$('#download-pending').hidden=!!path;
      const label=labels.download(labels.types[cvType],labels.langs[cvLang]);
      $('#download-cv .download-text').textContent=label;$('#download-pending .download-text').textContent=label;
      if(path){link.href=path;link.setAttribute('download','');$('#cv-status').textContent=UI[language].cvReady;}else{link.removeAttribute('href');$('#cv-status').textContent=labels.missing(`downloads/cv/cv-${cvType}-${cvLang}.pdf`);}
    }
    function renderPanel(){
      const station=ABOUT_CONFIG.stations[selected],contact=station.id==='contact';
      $('#interest-panel').hidden=contact;$('#contact-panel').hidden=!contact;panel.setAttribute('aria-labelledby',contact?'contact-title':'panel-title');
      if(!contact){$('#panel-kicker').textContent=UI[language].station+' / '+String(selected+1).padStart(2,'0');$('#panel-title').textContent=localText(station.title);$('#panel-description').textContent=localText(station.description);$('#panel-note').textContent=UI[language].draftNote;$('#panel-note').hidden=!ABOUT_CONFIG.preview;renderMedia(station);}
      $('#previous').disabled=selected===0;$('#next').disabled=selected===ABOUT_CONFIG.stations.length-1;$('#route-count').textContent=String(selected+1).padStart(2,'0')+' / '+String(ABOUT_CONFIG.stations.length).padStart(2,'0');
      $$('[data-station]').forEach(b=>{if(b.dataset.station===station.id)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
      updateCV();
    }
    function targetX(index){const width=scene.clientWidth,girl=traveller.getBoundingClientRect().width;return Math.max(0,Math.min(width-girl,ABOUT_CONFIG.stations[index].position*width-girl/2));}
    function place(value){x=value;traveller.style.transform='translateX('+x+'px)';}
    function go(index,{instant=false,scroll=false}={}){
      if(index<0||index>=ABOUT_CONFIG.stations.length)return;
      cancelAnimationFrame(animation);animation=0;traveller.classList.remove('is-walking');selected=index;
      const target=targetX(index),start=x,distance=Math.abs(target-start);
      traveller.classList.toggle('facing-left',target<start);pauseAlbum();
      function arrive(){place(target);traveller.classList.remove('is-walking');traveller.classList.remove('facing-left');renderPanel();$('#arrival-status').textContent=UI[language].arrived+UI[language].names[ABOUT_CONFIG.stations[index].id];if(scroll)panel.scrollIntoView({behavior:reduced.matches?'auto':'smooth',block:'start'});}
      if(instant||reduced.matches||distance<2){arrive();return;}
      const duration=Math.max(250,Math.min(1100,distance*2)),begin=performance.now();traveller.classList.add('is-walking');
      function step(now){const t=Math.min(1,(now-begin)/duration),ease=t*t*(3-2*t);place(start+(target-start)*ease);if(t<1)animation=requestAnimationFrame(step);else{animation=0;arrive();}}
      animation=requestAnimationFrame(step);
    }
    function setLanguage(lang){
      language=lang;document.documentElement.lang=lang==='zh'?'zh-Hans':lang;document.title=UI[lang].title+' · Huihui ZHU';
      const homeLink=$('#about-home-link'); if(homeLink){const labels={zh:'返回首页',fr:'Retour à l’accueil',en:'Back to home'};homeLink.href='index.html?lang='+encodeURIComponent(lang);homeLink.setAttribute('aria-label',labels[lang]);}
      $$('[data-ui]').forEach(el=>el.textContent=UI[lang][el.dataset.ui]);$$('[data-name]').forEach(el=>el.textContent=UI[lang].names[el.dataset.name]);$$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
      $('#route').setAttribute('aria-label',UI[lang].routeLabel);$('#cv-type-group').setAttribute('aria-label',UI[lang].cvGroup);if(!cvLanguageTouched)$('#cv-language').value=lang;$$('.contact-status').forEach(el=>el.textContent='');renderPanel();
    }
    $$('[data-station]').forEach(b=>b.addEventListener('click',()=>go(ABOUT_CONFIG.stations.findIndex(s=>s.id===b.dataset.station))));
    $('#previous').addEventListener('click',()=>go(selected-1));$('#next').addEventListener('click',()=>go(selected+1));
    $$('[data-lang]').forEach(b=>b.addEventListener('click',()=>{setLanguage(b.dataset.lang);if(window.SiteLanguage)SiteLanguage.set(b.dataset.lang);}));
    $('#contact-shortcut').addEventListener('click',()=>go(ABOUT_CONFIG.stations.findIndex(s=>s.id==='contact'),{instant:true,scroll:true}));
    $('#cv-shortcut').addEventListener('click',()=>{go(ABOUT_CONFIG.stations.findIndex(s=>s.id==='contact'),{instant:true,scroll:true});$('[data-cv-type="academic"]').focus({preventScroll:true});});
    $$('[data-cv-type]').forEach(b=>b.addEventListener('click',()=>{cvType=b.dataset.cvType;updateCV();}));$('#cv-language').addEventListener('change',()=>{cvLanguageTouched=true;updateCV();});
    $('#album-play').addEventListener('click',()=>{if(album.playing)pauseAlbum();else startAlbum();});$('#album-prev').addEventListener('click',previousAlbum);$('#album-next').addEventListener('click',()=>nextAlbum(false));
    const contacts=ABOUT_CONFIG.contacts;[['primaryEmail','primary-email-link'],['alternativeEmail','alternative-email-link']].forEach(([key,id])=>{const link=$('#'+id),value=contacts[key];link.textContent=value;link.href='mailto:'+value;});$('#wechat-value').textContent=contacts.wechat;
    $$('.copy-contact').forEach(button=>button.addEventListener('click',async()=>{const value=contacts[button.dataset.copyKey],status=button.parentElement.querySelector('.contact-status');try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(value);status.textContent=UI[language].copied;}catch{status.textContent=UI[language].copyFailed;}}));
    new ResizeObserver(()=>{cancelAnimationFrame(animation);animation=0;traveller.classList.remove('is-walking');place(targetX(selected));}).observe(scene);
    document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseAlbum();heroWasPlaying=!heroVideo.paused;heroVideo.pause();}else if(heroWasPlaying&&!heroUserPaused&&!reduced.matches)playHero();});
    $('#preview-label').hidden=!ABOUT_CONFIG.preview;setLanguage(language);place(targetX(0));
  })();
  </script>
</body>
